<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社會適應能力 - 左右分欄互動測驗系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
        }
        @keyframes correct-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .correct-animate {
            animation: correct-pop 0.3s ease-in-out;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            top: 0;
            opacity: 0;
            animation: fall 2.5s infinite ease-out;
        }
        @keyframes fall {
            0% { top: -10px; transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { top: 100%; transform: translateX(80px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden bg-slate-900 text-slate-800 flex flex-col justify-center items-center p-0 md:p-3">

    <!-- 主容器：精確填滿全螢幕，防止垂直滑動 -->
    <div id="app-container" class="w-full h-full max-w-7xl bg-white md:rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- 1. 頂部導覽列：精簡乾淨，只保留標題、模式切換與大顆設定選單按鈕 -->
        <header class="flex-none bg-gradient-to-r from-blue-600 to-indigo-700 text-white px-3 py-2 sm:px-6 sm:py-3 flex items-center justify-between shadow-md z-20">
            <div class="flex items-center gap-2">
                <span class="bg-blue-500/40 border border-blue-300/30 text-white text-xs px-2 py-0.5 rounded-full font-bold hidden sm:inline">能力評估</span>
                <h1 class="text-base sm:text-lg md:text-xl font-black tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-yellow-300"></i> 社會適應能力
                </h1>
            </div>

            <!-- 右側功能切換：學習/測驗 + 大顆選單開關按鈕 -->
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="flex bg-blue-900/50 p-1 rounded-xl border border-blue-400/30 text-xs sm:text-sm">
                    <button id="mode-study-btn" onclick="switchMode('study')" class="px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all bg-white text-blue-700 shadow-sm">
                        學習
                    </button>
                    <button id="mode-test-btn" onclick="switchMode('test')" class="px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all text-blue-100 hover:text-white">
                        測驗
                    </button>
                </div>

                <!-- 大顆明顯的收折選單按鈕 (齒輪+設定提示) -->
                <button onclick="toggleTopMenu()" class="h-9 sm:h-10 px-2.5 sm:px-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold text-xs sm:text-sm shadow-md flex items-center gap-1.5 transition-all active:scale-95" title="點擊展開/收折設定選單">
                    <i class="fa-solid fa-sliders text-sm"></i>
                    <span>選單</span>
                    <i id="menu-chevron" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
                </button>
            </div>
        </header>

        <!-- 頂部可收折下拉選單面板 (抽屜式展開，避免擋住手機與畫面) -->
        <div id="top-dropdown-menu" class="hidden absolute top-[52px] sm:top-[60px] left-0 right-0 bg-slate-800/95 backdrop-blur-md text-white border-b border-slate-700 p-4 shadow-2xl z-30 transition-all">
            <div class="max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                <!-- 語音角色 -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1"><i class="fa-solid fa-microphone mr-1"></i>朗讀聲音:</label>
                    <select id="voice-select" onchange="updateVoice()" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs font-bold text-white focus:outline-none"></select>
                </div>
                <!-- 語速調整 -->
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-300 mb-1">
                        <span><i class="fa-solid fa-gauge-high mr-1"></i>朗讀語速:</span>
                        <span id="speed-value" class="text-amber-400">0.9x</span>
                    </div>
                    <input id="speed-control" type="range" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateSpeed(this.value)" class="w-full accent-amber-400">
                </div>
                <!-- 切換下一題是否自動朗讀 (預設關閉/靜音) -->
                <div class="flex items-center justify-between sm:justify-center gap-3 pt-2 sm:pt-4 border-t sm:border-t-0 border-slate-700">
                    <span class="text-xs font-bold text-slate-300">自動報讀題目:</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="auto-read-toggle" class="sr-only peer">
                        <div class="w-10 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- 2. 主作答區：左側資訊+題幹+解析，右側選項清單 -->
        <main class="flex-1 overflow-hidden p-3 sm:p-5 md:p-6 lg:p-8 flex flex-col lg:flex-row gap-3 sm:gap-4 lg:gap-8">
            
            <!-- 【左半部】：單元下拉選單、第幾題、得分、題幹與報讀、解析 -->
            <section class="flex-none lg:flex-1 lg:max-w-[46%] flex flex-col justify-between bg-slate-50/70 p-3 sm:p-4 rounded-2xl border border-slate-200">
                
                <div>
                    <!-- 單元選擇 + 進度 + 得分整合欄 -->
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-200">
                        <!-- 單元 1~10 下拉選單 -->
                        <div class="flex items-center gap-1.5">
                            <label for="unit-select" class="text-xs sm:text-sm font-black text-slate-600 hidden sm:inline">單元:</label>
                            <select id="unit-select" onchange="changeUnit(this.value)" class="bg-white border-2 border-indigo-200 text-indigo-900 rounded-xl px-2.5 py-1 text-xs sm:text-sm font-black focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                                <!-- JS 動態生成 -->
                            </select>
                        </div>

                        <!-- 題號進度與得分 -->
                        <div class="flex items-center gap-2">
                            <span id="progress-text" class="text-xs sm:text-sm font-bold bg-slate-200/80 text-slate-700 px-2.5 py-1 rounded-lg">
                                第 1 / 10 題
                            </span>
                            <div class="flex items-center gap-1 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg">
                                <span class="text-xs font-bold text-emerald-700">得分:</span>
                                <span id="current-score-display" class="text-xs sm:text-sm font-black text-emerald-700">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- 進度小圓點指標 -->
                    <div class="flex items-center justify-center gap-1 sm:gap-1.5 mb-3" id="progress-dots-container"></div>

                    <!-- 前言 (若有) -->
                    <div id="preamble-text" class="hidden mb-2 p-2 bg-amber-50 border-l-4 border-amber-400 text-amber-900 rounded-r text-xs sm:text-sm font-bold"></div>

                    <!-- 題幹與報讀按鈕 (預設安靜，點擊才朗讀) -->
                    <div class="flex items-start gap-2.5 sm:gap-3.5">
                        <button id="replay-btn" onclick="speakCurrentQuestion()" class="flex-none bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 rounded-2xl shadow-md flex items-center justify-center transition-all mt-0.5" title="點擊朗讀題目與選項">
                            <i class="fa-solid fa-volume-high text-lg sm:text-xl md:text-2xl"></i>
                        </button>
                        <!-- 字體放大清晰，電視與手機皆易讀 -->
                        <h2 id="question-text" class="text-base sm:text-lg md:text-xl 2xl:text-2xl font-black text-slate-800 leading-snug tracking-normal">
                            載入中...
                        </h2>
                    </div>
                </div>

                <!-- 回饋解析區 (學習模式下回答後顯示，大螢幕常駐左側下方) -->
                <div id="feedback-alert" class="mt-3 p-3 rounded-xl border flex items-center gap-2.5 hidden">
                    <div id="feedback-icon-container" class="text-lg sm:text-xl flex-none"></div>
                    <div class="flex-1 text-xs sm:text-sm font-extrabold leading-tight" id="feedback-desc"></div>
                </div>
            </section>

            <!-- 【右半部】：選項 1~4，垂直單列排列，觸控區域大 -->
            <section class="flex-1 flex flex-col justify-center">
                <div id="options-list" class="grid grid-cols-1 gap-2 sm:gap-2.5 md:gap-3 2xl:gap-4 w-full">
                    <!-- JS 生成選項 -->
                </div>
            </section>
        </main>

        <!-- 3. 底部控制按鈕 -->
        <nav class="flex-none bg-slate-50 border-t border-slate-200 px-3 py-2 sm:px-6 sm:py-3 flex justify-between items-center gap-3">
            <button id="prev-btn" onclick="prevQuestion()" class="px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl font-black text-xs sm:text-sm md:text-base text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 disabled:opacity-30 disabled:pointer-events-none transition-all">
                <i class="fa-solid fa-arrow-left mr-1"></i> 上一題
            </button>

            <!-- 大螢幕專用全螢幕切換按鈕 -->
            <button onclick="toggleFullScreen()" class="hidden md:flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 px-3 py-1.5 rounded-lg bg-slate-200/70">
                <i class="fa-solid fa-expand"></i> 全螢幕
            </button>

            <!-- 測驗提交按鈕 -->
            <button id="submit-quiz-btn" onclick="calculateAndShowReport(true)" class="hidden px-5 py-2 sm:px-7 sm:py-2.5 rounded-xl font-black text-xs sm:text-sm md:text-base text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-all animate-pulse">
                <i class="fa-solid fa-paper-plane mr-1"></i> 提交測驗
            </button>

            <!-- 下一題按鈕 -->
            <button id="next-btn" onclick="nextQuestion()" class="px-5 py-2 sm:px-7 sm:py-2.5 rounded-xl font-black text-xs sm:text-sm md:text-base text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-30 disabled:pointer-events-none transition-all">
                下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </nav>
    </div>

    <!-- 學習成果報告 Modal -->
    <div id="report-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden relative">
            <div id="modal-confetti" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            <div class="p-5 text-center">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl shadow-inner animate-bounce">
                    <i class="fa-solid fa-award"></i>
                </div>
                
                <h3 class="text-xl font-black text-slate-800" id="report-title">學習成果報告</h3>
                
                <div class="my-3 bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col items-center">
                    <span class="text-xs font-bold text-slate-400">總得分</span>
                    <span class="text-5xl font-black text-indigo-600 my-1" id="report-score">0 <span class="text-xl font-bold text-slate-400">分</span></span>
                    
                    <div class="grid grid-cols-2 gap-3 w-full mt-3 pt-3 border-t border-slate-200 text-xs">
                        <div class="bg-emerald-50 p-2 rounded-lg text-emerald-800 font-bold">
                            答對: <span id="report-correct-count" class="text-base font-black">0</span>
                        </div>
                        <div class="bg-rose-50 p-2 rounded-lg text-rose-800 font-bold">
                            答錯: <span id="report-wrong-count" class="text-base font-black">0</span>
                        </div>
                    </div>
                </div>

                <p id="report-comment" class="text-sm font-bold text-indigo-900 mb-4 px-3 py-1.5 bg-indigo-50 rounded-lg inline-block"></p>

                <div class="flex flex-col gap-2">
                    <button id="next-unit-btn" onclick="goToNextUnit()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2.5 px-3 rounded-xl text-sm shadow">
                        進入下一單元 <i class="fa-solid fa-circle-arrow-right ml-1"></i>
                    </button>
                    <button onclick="retryCurrentUnit()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl text-xs">
                        重新挑戰本單元
                    </button>
                    <button onclick="closeReportModal()" class="w-full text-slate-400 hover:text-slate-600 font-bold text-xs py-1">
                        關閉
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { section: "社會適應選擇題", displayId: "1", question: "1. 小新收到簡訊要求點擊連結「驗證」銀行帳戶,最恰當的做法是?", options: ["(1)立刻點擊連結並輸入帳號密碼", "(2)不予理會,並打電話給官方客服確認", "(3)截圖分享到社群媒體請朋友判斷", "(4)回覆簡訊告知對方自己的個資"], answer: 1 },
            { section: "社會適應選擇題", displayId: "2", question: "2. 求職廣告寫「日薪3000元」,但要求先交 5000元保證金,這極可能是?", options: ["(1)體貼員工的好公司", "(2)高薪但專業的要求", "(3)合理的行政費用", "(4)典型的求職陷阱"], answer: 3 },
            { section: "社會適應選擇題", displayId: "3", question: "3. ATM 領錢卡片被機器「吃掉」了,螢幕顯示「請洽服務人員」,應如何處理?", options: ["(1)馬上離開,去別台試試看", "(2)打電話報案說提款機壞了", "(3)記住機台編號,立即聯絡銀行客服協助", "(4)等明天銀行開門再說"], answer: 2 },
            { section: "社會適應選擇題", displayId: "4", question: "4. 在圖書館使用公用電腦後準備離開,為了保護隱私應做什麼?", options: ["(1)把滑鼠藏起來", "(2)將電腦螢幕關掉就好", "(3)執行登出並刪除個人瀏覽紀錄", "(4)把主機電源直接拔掉"], answer: 2 },
            { section: "社會適應選擇題", displayId: "5", question: "5. 接到自稱客服電話要求操作ATM「解除重複扣款」,這通常是?", options: ["(1)購物網站的優惠活動", "(2)詐騙集團的常用手段", "(3)銀行員的貼心提醒", "(4)電腦系統自動升級"], answer: 1 },
            { section: "社會適應選擇題", displayId: "6", question: "6. 關於設定網路帳號密碼,下列哪種做法最安全?", options: ["(1)使用身分證字號或生日當密碼", "(2)所有的網站都用同一組密碼", "(3)設定包含大小寫英文字母與數字的組合", "(4)把密碼寫在貼紙上並黏在螢幕邊框"], answer: 2 },
            { section: "社會適應選擇題", displayId: "7", question: "7. 陌生網友突然傳訊息說要送點數,要求你提供「手機驗證碼」,應該?", options: ["(1)趕快提供以免錯過機會", "(2)詢問對方需不需要身分證字號", "(3)拒絕提供並封鎖該帳號", "(4)轉傳給所有好朋友一起領取"], answer: 2 },
            { section: "社會適應選擇題", displayId: "8", question: "8. 使用網路銀行或金融App時,下列哪項習慣是錯誤的?", options: ["(1)隨時檢查帳戶餘額是否異常", "(2)使用公共免費Wi-Fi 進行大額轉帳", "(3)離開 App 前確認已經登出", "(4)開啟兩步驟驗證功能"], answer: 1 },
            { section: "社會適應選擇題", displayId: "9", question: "9. 辦理手機門號時,將「雙證件正本」交給陌生人獨自處理,可能導致?", options: ["(1)獲得更多贈品", "(2)身分被冒用而成為詐騙共犯", "(3)信用額度自動提升", "(4)辦事速度變快"], answer: 1 },
            { section: "社會適應選擇題", displayId: "10", question: "10. 到銀行櫃檯存款後,離開前應該先確認什麼?", options: ["(1)櫃檯人員的名字", "(2)存摺 or 收據上的金額是否正確", "(3)銀行今天有沒有開冷氣", "(4)後面還有多少人在排隊"], answer: 1 },
            { section: "社會適應選擇題", displayId: "11", question: "11. 網購時賣家要求「私下匯款」不透過平台交易,這可能是?", options: ["(1)誠信交易", "(2)省下手續費的好辦法", "(3)網路購物詐騙", "(4)賣家是好心人"], answer: 2 },
            { section: "社會適應選擇題", displayId: "12", question: "12. 遺失金融卡(提款卡)時,第一時間該怎麼辦?", options: ["(1)去警察局報案後就回家睡覺", "(2)打電話給銀行辦理「掛失」停卡", "(3)找找看有沒有同學撿到", "(4)重新辦一張卡,舊的不管它"], answer: 1 },
            { section: "社會適應選擇題", displayId: "13", question: "13. 下列哪一項資料屬於「個人隱私」,不應隨意告知網友?", options: ["(1)喜歡吃的食物", "(2)身分證字號與住家地址", "(3)喜歡的電影", "(4)偶像歌手的名字"], answer: 1 },
            { section: "社會適應選擇題", displayId: "14", question: "14. 接到電話說「帳戶涉及洗錢,請把錢匯到安全帳戶備查」。這是?", options: ["(1)司法程序", "(2)假冒公務機關詐騙", "(3)警察在幫你保護錢", "(4)銀行系統故障"], answer: 1 },
            { section: "社會適應選擇題", displayId: "15", question: "15. 下列哪種方式最能幫助控制預算,避免錢不夠花?", options: ["(1)隨便刷卡下個月再說", "(2)養成記帳習慣,了解開支", "(3)看到喜歡的東西就買", "(4)把錢放在口袋隨手拿"], answer: 1 },
            { section: "社會適應選擇題", displayId: "16", question: "16. 面試時老闆要求「存摺正本與提款卡密碼」,你該怎麼辦?", options: ["(1)乖乖交出", "(2)堅定拒絕,這是不合理的要求", "(3)密碼給錯的就好", "(4)先回家問朋友要不要一起交"], answer: 1 },
            { section: "社會適應選擇題", displayId: "17", question: "17. 收到中獎通知要求先繳納「稅金」才能領獎,這可能是?", options: ["(1)幸運降臨", "(2)中獎詐騙", "(3)政府規定", "(4)銀行手續"], answer: 1 },
            { section: "社會適應選擇題", displayId: "18", question: "18. 在LINE 收到朋友借錢的訊息,最安全的做法是?", options: ["(1)既然是朋友馬上匯款", "(2)親自打電話或見面確認本人身分", "(3)直接回傳信用卡號碼", "(4)假裝沒看到"], answer: 1 },

            { section: "社會適應選擇題", displayId: "94", question: "94. 哪一項法律是專門為了保護身心障礙者的權益而制定的?", options: ["(1)公平交易", "(2)身心障礙者權益保障法", "(3)土地法", "(4)著作權"], answer: 1 },
            { section: "社會適應選擇題", displayId: "95", question: "95. 在路邊撿到錢 or 皮夾時,我應該怎麼做比較恰當?", options: ["(1)帶回家", "(2)請朋友吃", "(3)送交警局", "(4)丟掉"], answer: 2 },
            { section: "社會適應選擇題", displayId: "96", question: "96. 如果在深夜大聲吵鬧影響鄰居,可能會違反哪一項法律?", options: ["(1)海關緝私", "(2)社會秩序維護法", "(3)商業登記", "(4)專利"], answer: 1 },
            { section: "社會適應選擇題", displayId: "97", question: "97. 下列哪一種做法,才是正確的「節能減碳」環保行動?", options: ["(1)冷氣最強蓋厚被", "(2)隨手關燈", "(3)多取塑膠袋", "(4)水不關"], answer: 1 },
            { section: "社會適應選擇題", displayId: "98", question: "98. 在馬路上聽到救護車鳴笛開過來,行人與車輛應該怎麼做?", options: ["(1)擋車", "(2)賽跑", "(3)靠邊禮讓優先通行", "(4)不理"], answer: 2 },
            { section: "社會適應選擇題", displayId: "99", question: "99. 法律規定「著作權」的主要目的是為了保護什麼?", options: ["(1)寫作業", "(2)創作者作品不被盜用", "(3)隨便畫", "(4)盜版"], answer: 1 },
            { section: "社會適應選擇題", displayId: "100", question: "100. 身為公民,我們享有的基本人權中不包括哪一項自由?", options: ["(1)言論自由", "(2)受教育", "(3)傷害他人自由", "(4)安全保障"], answer: 2 }
        ];

        let currentUnitIndex = 0;
        let currentQuestionInUnit = 0;
        let quizMode = 'study';
        let userAnswers = Array(10).fill(null);
        let hasCheckedAnswer = Array(10).fill(false);

        const synth = window.speechSynthesis;
        let utterance = new SpeechSynthesisUtterance();
        utterance.lang = 'zh-TW';
        utterance.rate = 0.9;
        let voices = [];

        const preambleEl = document.getElementById('preamble-text');
        const questionEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options-list');
        const unitSelectEl = document.getElementById('unit-select');
        const voiceSelectEl = document.getElementById('voice-select');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitQuizBtn = document.getElementById('submit-quiz-btn');
        const speedControl = document.getElementById('speed-control');
        const speedValue = document.getElementById('speed-value');
        const autoReadToggle = document.getElementById('auto-read-toggle');
        const feedbackAlertEl = document.getElementById('feedback-alert');
        const feedbackDescEl = document.getElementById('feedback-desc');
        const feedbackIconContainer = document.getElementById('feedback-icon-container');
        const currentScoreDisplay = document.getElementById('current-score-display');
        const progressTextEl = document.getElementById('progress-text');
        const progressDotsContainer = document.getElementById('progress-dots-container');

        // 展開/收合頂部選單
        function toggleTopMenu() {
            const menu = document.getElementById('top-dropdown-menu');
            const chevron = document.getElementById('menu-chevron');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function populateVoiceList() {
            voices = synth.getVoices().filter(v => v.lang.startsWith('zh'));
            voiceSelectEl.innerHTML = '';
            if (!voices.length) {
                voiceSelectEl.appendChild(new Option('預設中文語音', ''));
                return;
            }
            voices.forEach((v, i) => {
                const opt = new Option(v.name, i);
                voiceSelectEl.appendChild(opt);
            });
            let defaultVoiceIdx = voices.findIndex(v => v.name.includes('Yating') && v.lang === 'zh-TW');
            if (defaultVoiceIdx === -1) defaultVoiceIdx = voices.findIndex(v => v.name.includes('Google') && v.name.includes('國語'));
            if (defaultVoiceIdx === -1) defaultVoiceIdx = voices.findIndex(v => v.lang === 'zh-TW' || v.lang === 'zh_TW');
            if (defaultVoiceIdx === -1) defaultVoiceIdx = 0;

            if (voices[defaultVoiceIdx]) {
                utterance.voice = voices[defaultVoiceIdx];
                voiceSelectEl.selectedIndex = defaultVoiceIdx;
            }
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoiceList;
        }

        function updateSpeed(val) {
            const s = parseFloat(val);
            utterance.rate = s;
            speedValue.textContent = `${s.toFixed(1)}x`;
        }

        function updateVoice() {
            const idx = voiceSelectEl.value;
            if (voices[idx]) {
                utterance.voice = voices[idx];
            }
        }

        function initUnits() {
            unitSelectEl.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const opt = new Option(`單元 ${i + 1} (${i * 10 + 1}~${(i + 1) * 10}題)`, i);
                unitSelectEl.appendChild(opt);
            }
            populateVoiceList();
            loadUnit(0);
        }

        function loadUnit(unitIdx) {
            synth.cancel();
            currentUnitIndex = parseInt(unitIdx, 10);
            currentQuestionInUnit = 0;
            userAnswers = Array(10).fill(null);
            hasCheckedAnswer = Array(10).fill(false);
            
            unitSelectEl.value = currentUnitIndex;
            renderQuestion();
            updateScoreBoard();
        }

        function changeUnit(val) {
            loadUnit(val);
        }

        function switchMode(mode) {
            quizMode = mode;
            synth.cancel();
            
            const studyBtn = document.getElementById('mode-study-btn');
            const testBtn = document.getElementById('mode-test-btn');
            
            if (mode === 'study') {
                studyBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all bg-white text-blue-700 shadow-sm";
                testBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all text-blue-100 hover:text-white";
            } else {
                testBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all bg-white text-indigo-700 shadow-sm";
                studyBtn.className = "px-2.5 sm:px-3 py-1 rounded-lg font-black transition-all text-blue-100 hover:text-white";
            }
            loadUnit(currentUnitIndex);
        }

        function getGlobalIndex() {
            return currentUnitIndex * 10 + currentQuestionInUnit;
        }

        function renderQuestion() {
            const globalIdx = getGlobalIndex();
            const q = questions[globalIdx];
            
            if (q.preamble) {
                preambleEl.textContent = q.preamble;
                preambleEl.style.display = 'block';
            } else {
                preambleEl.style.display = 'none';
            }

            questionEl.textContent = q.question;
            
            optionsEl.innerHTML = '';
            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border-2 border-slate-200 bg-white hover:bg-blue-50/70 hover:border-blue-400 font-bold text-base sm:text-lg md:text-xl 2xl:text-2xl transition-all flex items-center justify-between shadow-sm active:scale-[0.99]";
                
                const textSpan = document.createElement('span');
                textSpan.textContent = optText;
                textSpan.className = "flex-grow pr-2 leading-snug";
                btn.appendChild(textSpan);

                const iconContainer = document.createElement('span');
                iconContainer.className = "flex-shrink-0 text-lg md:text-2xl w-7 h-7 flex items-center justify-center rounded-full ml-1";
                btn.appendChild(iconContainer);

                btn.onclick = () => selectOption(optIdx);
                applyStyleToOption(btn, optIdx, iconContainer);

                optionsEl.appendChild(btn);
            });

            prevBtn.disabled = currentQuestionInUnit === 0;
            
            if (quizMode === 'test' && currentQuestionInUnit === 9) {
                nextBtn.classList.add('hidden');
                submitQuizBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitQuizBtn.classList.add('hidden');
                nextBtn.disabled = (currentQuestionInUnit === 9 && quizMode === 'study');
            }

            updateProgressIndicators();
            renderFeedbackPanel();

            // 預設關閉自動報讀，只有勾選時切換才會朗讀
            if (autoReadToggle.checked) {
                speakCurrentQuestion();
            }
        }

        function applyStyleToOption(btn, optIdx, iconContainer) {
            const globalIdx = getGlobalIndex();
            const q = questions[globalIdx];
            const chosen = userAnswers[currentQuestionInUnit];
            const checked = hasCheckedAnswer[currentQuestionInUnit];
            const correctIdx = q.answer;

            if (quizMode === 'study') {
                if (checked) {
                    btn.disabled = true;
                    if (optIdx === correctIdx) {
                        btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-950 font-black text-base sm:text-lg md:text-xl 2xl:text-2xl flex items-center justify-between shadow-sm correct-animate";
                        iconContainer.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                    } else if (optIdx === chosen) {
                        btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border-2 border-rose-500 bg-rose-50 text-rose-950 font-black text-base sm:text-lg md:text-xl 2xl:text-2xl flex items-center justify-between shadow-sm";
                        iconContainer.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-500"></i>`;
                    } else {
                        btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border border-slate-200 bg-white font-medium text-base sm:text-lg md:text-xl 2xl:text-2xl opacity-40 flex items-center justify-between";
                    }
                } else if (chosen === optIdx) {
                    btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border-2 border-blue-500 bg-blue-50/60 font-black text-base sm:text-lg md:text-xl 2xl:text-2xl flex items-center justify-between shadow-inner";
                }
            } else {
                if (chosen === optIdx) {
                    btn.className = "w-full text-left p-3 sm:p-3.5 md:p-4 lg:p-4.5 2xl:p-6 rounded-2xl border-2 border-indigo-600 bg-indigo-50/60 text-indigo-950 font-black text-base sm:text-lg md:text-xl 2xl:text-2xl flex items-center justify-between shadow-inner";
                    iconContainer.innerHTML = `<i class="fa-solid fa-circle text-indigo-600 text-xs"></i>`;
                }
            }
        }

        function selectOption(optIdx) {
            synth.cancel();
            const globalIdx = getGlobalIndex();
            const q = questions[globalIdx];
            
            userAnswers[currentQuestionInUnit] = optIdx;

            if (quizMode === 'study') {
                if (!hasCheckedAnswer[currentQuestionInUnit]) {
                    hasCheckedAnswer[currentQuestionInUnit] = true;
                    const isCorrect = (optIdx === q.answer);
                    
                    renderQuestion();
                    updateScoreBoard();
                    
                    // 點選答案時即時給予對錯語音回饋
                    let feedbackSpeech = isCorrect ? "答對了！" : `答錯囉，正確是：${q.options[q.answer].replace(/^\(\d+\)/, '')}`;
                    speakText(feedbackSpeech);
                }
            } else {
                renderQuestion();
            }
        }

        function updateProgressIndicators() {
            progressTextEl.textContent = `第 ${currentQuestionInUnit + 1} / 10 題`;
            progressDotsContainer.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full border transition-all cursor-pointer ";
                
                if (i === currentQuestionInUnit) {
                    dot.className += "bg-blue-500 border-blue-700 scale-125 shadow-sm";
                } else if (userAnswers[i] === null) {
                    dot.className += "bg-slate-200 border-slate-300";
                } else {
                    if (quizMode === 'study') {
                        const isCorrect = (userAnswers[i] === questions[currentUnitIndex * 10 + i].answer);
                        dot.className += isCorrect ? "bg-emerald-500 border-emerald-600" : "bg-rose-500 border-rose-600";
                    } else {
                        dot.className += "bg-indigo-500 border-indigo-600";
                    }
                }
                
                dot.onclick = () => {
                    synth.cancel();
                    currentQuestionInUnit = i;
                    renderQuestion();
                };
                progressDotsContainer.appendChild(dot);
            }
        }

        function updateScoreBoard() {
            let score = 0;
            for (let i = 0; i < 10; i++) {
                if (userAnswers[i] !== null) {
                    if (userAnswers[i] === questions[currentUnitIndex * 10 + i].answer) {
                        score += 10;
                    }
                }
            }
            currentScoreDisplay.textContent = score;
        }

        function renderFeedbackPanel() {
            const checked = hasCheckedAnswer[currentQuestionInUnit];
            const chosen = userAnswers[currentQuestionInUnit];
            
            if (quizMode === 'study' && checked) {
                const globalIdx = getGlobalIndex();
                const q = questions[globalIdx];
                const isCorrect = (chosen === q.answer);

                feedbackAlertEl.classList.remove('hidden');
                if (isCorrect) {
                    feedbackAlertEl.className = "mt-3 p-2.5 sm:p-3 rounded-xl border border-emerald-200 bg-emerald-50 flex items-center gap-2.5 text-emerald-900";
                    feedbackIconContainer.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                    feedbackDescEl.textContent = "答對了！非常有生活安全觀念！";
                } else {
                    feedbackAlertEl.className = "mt-3 p-2.5 sm:p-3 rounded-xl border border-rose-200 bg-rose-50 flex items-center gap-2.5 text-rose-900";
                    feedbackIconContainer.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600"></i>`;
                    feedbackDescEl.textContent = `正解：${q.options[q.answer]}`;
                }
            } else {
                feedbackAlertEl.classList.add('hidden');
            }
        }

        function prevQuestion() {
            synth.cancel();
            if (currentQuestionInUnit > 0) {
                currentQuestionInUnit--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            synth.cancel();
            if (currentQuestionInUnit < 9) {
                currentQuestionInUnit++;
                renderQuestion();
            } else if (currentQuestionInUnit === 9 && quizMode === 'study') {
                calculateAndShowReport(false);
            }
        }

        function speakText(text) {
            synth.cancel();
            utterance.text = text;
            utterance.rate = parseFloat(speedControl.value);
            const selectedVoiceIdx = voiceSelectEl.value;
            if (voices[selectedVoiceIdx]) {
                utterance.voice = voices[selectedVoiceIdx];
            }
            synth.speak(utterance);
        }

        function speakCurrentQuestion() {
            const globalIdx = getGlobalIndex();
            const q = questions[globalIdx];
            let textToSpeak = "";
            if (q.preamble) textToSpeak += `${q.preamble}。`;
            textToSpeak += `${q.question}。選項有：`;
            q.options.forEach(opt => { textToSpeak += `${opt}。`; });
            speakText(textToSpeak);
        }

        function calculateAndShowReport(isManualSubmit = false) {
            synth.cancel();
            if (quizMode === 'test') {
                const unansweredCount = userAnswers.filter(ans => ans === null).length;
                if (unansweredCount > 0 && isManualSubmit) {
                    if (!confirm(`尚有 ${unansweredCount} 題未作答，確定要交卷嗎？`)) return;
                }
            }

            let correctCount = 0;
            let wrongCount = 0;
            for (let i = 0; i < 10; i++) {
                if (userAnswers[i] === questions[currentUnitIndex * 10 + i].answer) {
                    correctCount++;
                } else {
                    wrongCount++;
                }
            }

            const finalScore = correctCount * 10;
            document.getElementById('report-score').innerHTML = `${finalScore} <span class="text-xl font-bold text-slate-400">分</span>`;
            document.getElementById('report-correct-count').textContent = `${correctCount} 題`;
            document.getElementById('report-wrong-count').textContent = `${wrongCount} 題`;
            document.getElementById('report-title').textContent = `單元 ${currentUnitIndex + 1} 學習成果`;

            let comment = "";
            let speechAward = "";
            if (finalScore === 100) {
                comment = "🎉 太神了！滿分 100 分！完全掌握生活適應技能！";
                speechAward = "恭喜你！獲得滿分一百分！太厲害了！";
                startConfettiEffect();
            } else if (finalScore >= 80) {
                comment = "🌟 超級優秀！觀念非常清楚！";
                speechAward = `恭喜你得到 ${finalScore} 分！做得好棒！`;
                startConfettiEffect();
            } else if (finalScore >= 60) {
                comment = "👍 及格了！基本觀念很棒，繼續加油！";
                speechAward = `得到 ${finalScore} 分，及格囉！`;
            } else {
                comment = "💪 沒關係！多看幾次一定會更進步！";
                speechAward = `得到 ${finalScore} 分，再挑戰一次吧！`;
            }

            document.getElementById('report-comment').textContent = comment;
            const nextUnitBtn = document.getElementById('next-unit-btn');
            if (currentUnitIndex === 9) nextUnitBtn.classList.add('hidden');
            else nextUnitBtn.classList.remove('hidden');

            document.getElementById('report-modal').classList.remove('hidden');
            setTimeout(() => { speakText(speechAward); }, 300);
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
            stopConfettiEffect();
        }

        function retryCurrentUnit() {
            closeReportModal();
            loadUnit(currentUnitIndex);
        }

        function goToNextUnit() {
            closeReportModal();
            if (currentUnitIndex < 9) loadUnit(currentUnitIndex + 1);
        }

        function startConfettiEffect() {
            const container = document.getElementById('modal-confetti');
            container.innerHTML = '';
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = `${Math.random() * 2}s`;
                piece.style.animationDuration = `${1.5 + Math.random() * 1.5}s`;
                container.appendChild(piece);
            }
        }

        function stopConfettiEffect() {
            document.getElementById('modal-confetti').innerHTML = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initUnits();
        });
    </script>
</body>
</html>
