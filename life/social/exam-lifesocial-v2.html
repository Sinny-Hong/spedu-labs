  <style>
    :root{--blue:#1d4ed8;--blue-dark:#1e3a8a;--green:#047857;--red:#be123c;--ink:#1e293b;--muted:#64748b;--line:#dbe4ef;--paper:#fff;--bg:#eef3f8}*{box-sizing:border-box}body{margin:0;padding:18px;color:var(--ink);background:var(--bg);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{width:min(980px,100%);margin:auto;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:0 18px 45px #183b6518}header{padding:25px 22px;color:#fff;text-align:center;background:linear-gradient(130deg,#2563eb,var(--blue-dark))}header h1{margin:0;font-size:clamp(24px,5vw,36px)}header p{margin:8px 0 0;color:#dbeafe}.controls{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#f8fafc}.controls label{font-weight:800}.controls select,.controls button{min-height:44px;padding:9px 13px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font:inherit;font-weight:800}.voice{color:#fff!important;background:var(--green)!important;border-color:var(--green)!important;cursor:pointer}.status{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eff6ff;font-weight:800}.score{padding:5px 12px;border-radius:10px;color:var(--green);background:#d1fae5;font-size:20px}.quiz{padding:clamp(20px,5vw,40px)}.source{display:inline-block;margin-bottom:10px;padding:5px 9px;border-radius:8px;color:#1e40af;background:#dbeafe;font-size:13px;font-weight:900}.question{margin:0 0 22px;font-size:clamp(20px,4vw,28px);line-height:1.55}.options{display:grid;gap:12px}.option{width:100%;padding:15px 17px;border:2px solid var(--line);border-radius:14px;color:var(--ink);background:#fff;text-align:left;font:inherit;font-size:17px;font-weight:800;line-height:1.5;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option.correct{border-color:#10b981;color:#065f46;background:#ecfdf5}.option.wrong{border-color:#fb7185;color:#9f1239;background:#fff1f2}.option:disabled{cursor:default}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;line-height:1.65;font-weight:800}.feedback.show{display:block}.feedback.good{color:#065f46;background:#d1fae5}.feedback.bad{color:#9f1239;background:#ffe4e6}.nav{padding:16px 18px;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);background:#f8fafc}.nav button{min-height:46px;padding:10px 20px;border:0;border-radius:12px;color:#fff;background:var(--blue);font:inherit;font-weight:900;cursor:pointer}.nav button:first-child{color:var(--ink);background:#e2e8f0}.nav button:disabled{opacity:.4;cursor:not-allowed}.back{padding:0 18px 20px;text-align:center}.back a{color:var(--blue-dark);font-weight:800;text-decoration:none}@media(max-width:560px){body{padding:0}.app{border:0;border-radius:0;box-shadow:none}.controls{align-items:stretch}.controls label{display:grid;gap:6px;flex:1}.voice{align-self:end}.status{font-size:14px}.quiz{padding:22px 16px}.option{font-size:16px}.nav{position:sticky;bottom:0}}

<body>
  <main class="app">
    <header><h1>高中職能力評估－社會常識練習二</h1><p>社會適應補充題庫 S101～S200．每 10 題為一個單元</p></header>
    <section class="controls"><label>選擇單元<select id="unit"></select></label><button class="voice" id="voice" type="button">🔊 報讀題目</button></section>
    <section class="status"><span id="progress">第 1／10 題</span><span class="score" id="score">0 分</span></section>
    <section class="quiz"><span class="source" id="source"></span><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section>
    <nav class="nav"><button id="prev" type="button">上一題</button><button id="next" type="button">下一題</button></nav>
    <div class="back"><a href="../index.html">← 回到生活教育目錄</a></div>
  </main>
  <script>
    const questions = [
      {"sourceId":"S101","question":"1. 到便利商店使用電子票證（如悠遊卡）結帳，扣款前應該先確認什麼？","options":["(1)卡片顏色是否好看","(2)卡片內餘額是否足夠","(3)店員的名字","(4)後面排隊人數"],"answer":1,"explanation":"扣款前應先確認卡片餘額是否足夠付費。"},
      {"sourceId":"S102","question":"2. 買東西結帳後，店家給的「統一發票」或「消費明細」應該如何處理比較好？","options":["(1)當場撕毀丟掉","(2)妥善保留以利對獎或退換貨","(3)送給隔壁陌生人","(4)隨意丟在路上"],"answer":1,"explanation":"保留發票可對獎，亦可作為商品的退換貨憑證。"},
      {"sourceId":"S103","question":"3. 在超市買東西時，發現「大包裝」與「小包裝」商品，應該如何選擇最省錢？","options":["(1)一律買大包裝","(2)看清楚「單位售價」進行比價","(3)挑包裝漂亮的","(4)挑名字長的"],"answer":1,"explanation":"比較商品的「單位售價」能判斷哪種包裝最划算。"},
      {"sourceId":"S104","question":"4. 拿著水費、電費單到便利商店繳費，繳完錢後店員蓋章的「收據」該怎麼辦？","options":["(1)當場丟進垃圾桶","(2)攜回妥善保存證明已繳費","(3)丟給朋友","(4)撕成碎片"],"answer":1,"explanation":"蓋章收據是已繳費的憑證，應妥善保存備查。"},
      {"sourceId":"S105","question":"5. 當我們手頭資金有限時，買東西應該優先考慮什麼？","options":["(1)自己「想要的」玩具或零食","(2)生活「需要的」食物與用品","(3)廣告打最大的商品","(4)朋友推薦的昂貴奢侈品"],"answer":1,"explanation":"理財時應優先滿足生活「需要」，再考慮「想要」。"},
      {"sourceId":"S106","question":"6. 使用行動支付（如 LINE Pay、街口）時，出示的付款條碼應該注意什麼？","options":["(1)拍給網友看","(2)防止他人偷拍或側錄以防刷錯帳","(3)隨便傳到群組","(4)列印出來貼在背後"],"answer":1,"explanation":"付款條碼涉及扣款權限，切勿讓陌生人偷拍。"},
      {"sourceId":"S107","question":"7. 買到的衣服尺寸不合想要辦理退貨，通常需要帶什麼回店家？","options":["(1)只要衣服即可","(2)商品原包裝、標籤及發票/明細","(3)身分證正本","(4)朋友陪同即可"],"answer":1,"explanation":"辦理退換貨通常須攜帶完整商品、標籤及發票憑證。"},
      {"sourceId":"S108","question":"8. 到超商進行「取貨付款」時，下列哪一項做法是正確的？","options":["(1)先把包裹拆開再付錢","(2)確認收件人姓名與金額無誤後再付款取貨","(3)不用核對金額直接給錢","(4)幫陌生人付錢領包裹"],"answer":1,"explanation":"取貨付款前應確認收件人姓名與金額，避免詐騙。"},
      {"sourceId":"S109","question":"9. 收到銀行寄來的信用卡或提款卡對帳單，應該怎麼做？","options":["(1)不看直接丟掉","(2)核對每筆消費金額是否符合實際紀錄","(3)借給朋友看","(4)拍照上傳 FB"],"answer":1,"explanation":"定期核對對帳單能及時發現異常扣款或盜刷。"},
      {"sourceId":"S110","question":"10. 如果看到商品標價「買一送一」，意思是？","options":["(1)付兩件的錢拿一件","(2)付一件的錢可以獲得兩件商品","(3)免費贈送兩件","(4)打五折但只給一件"],"answer":1,"explanation":"買一送一指支付一件商品的費用即可獲得兩件。"},
      {"sourceId":"S111","question":"11. 到郵局匯款給賣家，填寫「匯款單」時最需要反覆核對的是什麼？","options":["(1)郵局冷氣溫度","(2)帳號、戶名與金額","(3)郵局抽號機號碼","(4)今天的天氣"],"answer":1,"explanation":"匯款時必須仔細核對帳號、戶名與金額，避免匯錯。"},
      {"sourceId":"S112","question":"12. 在網路上看到便宜得離譜的名牌球鞋，最可能的風險是？","options":["(1)賣家大方送禮","(2)買到假貨或遇到網路購物詐騙","(3)賺到大便宜","(4)一定是正品"],"answer":1,"explanation":"價格遠低於市價的商品極可能是假貨或購物詐騙。"},
      {"sourceId":"S113","question":"13. 申辦手機載具索取「雲端發票」，主要的優點不包含下列哪一項？","options":["(1)環保少紙化","(2)自動幫忙對獎","(3)保證每期發票都中獎","(4)避免發票遺失"],"answer":2,"explanation":"雲端發票有自動對獎與環保好處，但無法保證中獎。"},
      {"sourceId":"S114","question":"14. 到餐廳用餐發現菜單註明「加收一成服務費」，若餐點為300元，總共要付多少？","options":["(1)300元","(2)330元","(3)360元","(4)400元"],"answer":1,"explanation":"一成服務費為 300×10%=30元，總共須付 330元。"},
      {"sourceId":"S115","question":"15. 如果身上的現金不夠支付剛才吃的餐點，最適當的處理方式是？","options":["(1)偷偷從後門溜走","(2)誠實告知店家並尋求補救方式（如家人協助）","(3)在店裡大聲喧嘩","(4)留假電話後離開"],"answer":1,"explanation":"現金不足應誠實說明並主動尋求聯繫家人付清。"},
      {"sourceId":"S116","question":"16. 關於悠遊卡或一卡通的「自動加值」功能，下列觀念何者正確？","options":["(1)裡面的錢會無限制扣不完","(2)綁定後仍需注意消費與卡片保管","(3)掉了也不用掛失","(4)可以借給任何人使用"],"answer":1,"explanation":"開啟自動加值功能仍應妥善保管卡片，避免遺失造成損失。"},
      {"sourceId":"S117","question":"17. 當朋友向你借錢，但你手頭也很緊時，你該怎麼做？","options":["(1)借高利貸來借給朋友","(2)禮貌且堅定地說明困難並拒絕","(3)拿家人的錢借他","(4)不理不睬直接打人"],"answer":1,"explanation":"自身能力有限時，應禮貌且堅定地向對方說明拒絕。"},
      {"sourceId":"S118","question":"18. 購買預售票（如演唱會、電影票）時，下列哪種管道最安全？","options":["(1)臉書不具名社團的黃牛","(2)官方指定的售票系統或平台","(3)陌生網友的私訊","(4)路邊隨機兜售的陌生人"],"answer":1,"explanation":"購買票券應透過官方指定的合法售票管道最安全。"},
      {"sourceId":"S119","question":"19. 下列何者是「養成良好儲蓄習慣」的做法？","options":["(1)拿到零用錢先花完，剩下的再存","(2)設定固定金額，領到錢後先存起來","(3)全部花光再向別人借","(4)買一堆不需要的特價品"],"answer":1,"explanation":"先儲蓄再消費（先存下預定金額）是良好的理財習慣。"},
      {"sourceId":"S120","question":"20. 遇到店家找零錢時，什麼時候確認金額最恰當？","options":["(1)回到家後再數","(2)當場在櫃檯當面清點","(3)隔天再回店家找麻煩","(4)隨便塞口袋不用數"],"answer":1,"explanation":"找零時應當場在櫃檯當面清點，以免後續產生爭議。"},
      {"sourceId":"S121","question":"21. 當你收到瑕疵商品想要求店家處理，溝通時應保持什麼態度？","options":["(1)大吵大鬧砸店","(2)理性出示憑證並說明商品問題","(3)默默吞下不敢說","(4)網路上匿名謾罵"],"answer":1,"explanation":"處理消費爭議應理性出示購物憑證，據實說明問題。"},
      {"sourceId":"S122","question":"22. 辦理信用卡或分期付款時，什麼是「循環利息」？","options":["(1)銀行送的紅利點數","(2)未繳清欠款所產生的額外高額利息","(3)免費的試用優惠","(4)刷卡獲得的折扣"],"answer":1,"explanation":"信用卡未全額繳清會產生高額循環利息，增加負擔。"},
      {"sourceId":"S123","question":"23. 逛夜市或傳統市場買菜時，若商品沒有標價，應該怎麼做？","options":["(1)直接拿了就走","(2)先詢問價格與計價方式再決定購買","(3)隨便給店員50元","(4)結帳後嫌貴跟老闆吵架"],"answer":1,"explanation":"購買無標價商品應先問清價格與計算方式再決定。"},
      {"sourceId":"S124","question":"24. 當便利商店推出「點數貼紙集點」活動，最適當的態度是？","options":["(1)為了集點買一堆不需要的東西","(2)順其自然，有需要消費時再收集","(3)偷拿別人的貼紙","(4)為了點數跟店員吵架"],"answer":1,"explanation":"集點應以理性消費為主，不應為了贈品過度開支。"},
      {"sourceId":"S125","question":"25. 為何不應該將自己的銀行存摺或提款卡「租借」給他人？","options":["(1)會被沒收紅利","(2)會變成詐騙人頭帳戶而負擔刑事責任","(3)只會被扣50元","(4)沒什麼大不了"],"answer":1,"explanation":"出租或提供帳戶給他人會淪為詐騙共犯，承擔刑責。"},
      {"sourceId":"S126","question":"26. 需要辦理戶籍謄本或身分證換發，應該去哪一個政府機關？","options":["(1)衛生所","(2)戶政事務所","(3)地政事務所","(4)警察局"],"answer":1,"explanation":"辦理戶籍與身分證件相關業務應至「戶政事務所」。"},
      {"sourceId":"S127","question":"27. 到郵局辦理郵寄信件時，信封上除了收件人地址，還需要填寫什麼？","options":["(1)收件人電話","(2)郵遞區號","(3)寄件人生日","(4)收件人星座"],"answer":1,"explanation":"填寫正確的「郵遞區號」能加快郵局分揀與投遞效率。"},
      {"sourceId":"S128","question":"28. 在圖書館借書時，下列哪一種行為是遵守規則的表現？","options":["(1)在書本上畫線做記號","(2)按時歸還圖書館書籍","(3)把喜歡的頁面剪下來","(4)在閱覽室大聲通話"],"answer":1,"explanation":"借閱圖書館圖書應愛護書本並於期限內按時歸還。"},
      {"sourceId":"S129","question":"29. 到醫院或診所看病時，必須出示哪一張重要卡片？","options":["(1)郵局提款卡","(2)國民健康保險卡（健保卡）","(3)學生證","(4)會員卡"],"answer":1,"explanation":"就醫看診時須出示「健保卡」以核對身分與醫療紀錄。"},
      {"sourceId":"S130","question":"30. 到公立游泳池或體育館使用設施，下列哪項行為是正確的？","options":["(1)穿著牛仔褲下水游泳","(2)遵守場館使用須知與安全守則","(3)在場館內任意飲食丟垃圾","(4)破壞運動器材"],"answer":1,"explanation":"使用公共體育設施應遵守該場館之規範與安全守則。"},
      {"sourceId":"S131","question":"31. 到衛生所施打流感疫苗或進行健康檢查，通常需要帶什麼？","options":["(1)健保卡與身分證件","(2)存摺","(3)護照","(4)畢業證書"],"answer":0,"explanation":"至衛生所辦理醫療保健業務須攜帶健保卡與身分證。"},
      {"sourceId":"S132","question":"32. 在社區公園散步時，看到運動器材故障損壞，應該怎麼做？","options":["(1)繼續強行使用","(2)通報公園管理單位或區公所維修","(3)自己拿鎚子修理","(4)假裝沒看到並叫小孩子去玩"],"answer":1,"explanation":"發現公共設施損壞應通報管理單位，勿強行使用。"},
      {"sourceId":"S133","question":"33. 到區公所或里長辦公室，主要可以尋求什麼樣的協助？","options":["(1)買便宜的衣服","(2)社福補助諮詢與社區服務申辦","(3)辦理信用卡","(4)購買火車票"],"answer":1,"explanation":"區公所與里辦公處提供在地社會福利與民政諮詢。"},
      {"sourceId":"S134","question":"34. 搭乘台鐵火車時，若不小心坐錯車廂或找不到座位，可以向誰尋求協助？","options":["(1)旁邊的陌生乘客","(2)列車長或站務人員","(3)打119","(4)喊警察來"],"answer":1,"explanation":"火車上有問題可向列車長或車站站務人員尋求協助。"},
      {"sourceId":"S135","question":"35. 使用圖書館的電腦設備時，下列哪一種做法是錯誤的？","options":["(1)遵守使用時間限制","(2)隨意下載不明檔案或更改系統設定","(3)離開時登出個人帳號","(4)保持安靜不打擾他人"],"answer":1,"explanation":"公用電腦不可任意下載不明程式或隨意更改設定。"},
      {"sourceId":"S136","question":"36. 想到郵局臨櫃辦理「存錢」或「提款」，第一步通常要先做什麼？","options":["(1)直接衝到櫃檯","(2)抽取號碼牌並依序等候叫號","(3)大聲喊叫","(4)找郵差拍照"],"answer":1,"explanation":"到郵局或銀行辦理業務應先抽取號碼牌，依序等候。"},

      {"sourceId":"S186","question":"86. 發現家中有老鼠或蟑螂出沒，最根本的環境清潔做法是？","options":["(1)堆積大量空盒垃圾","(2)妥善封存食物，保持環境乾淨無積水","(3)在床上吃零食","(4)不清理廚餘"],"answer":1,"explanation":"封存食物、清理廚餘與保持乾燥是防病媒蚊蠅之本。"},
      {"sourceId":"S187","question":"87. 上完洗手間或進食之前，正確的洗手步驟包含？","options":["(1)用清水摸一下即可","(2)使用肥皂或洗手乳落實「搓洗 20 秒」","(3)擦在衣服上","(4)不用洗手"],"answer":1,"explanation":"飯前便後應使用肥皂搓洗雙手至少 20 秒，才能有效清潔。"},
      {"sourceId":"S188","question":"88. 若家中水龍頭持續漏水不停，應先關閉什麼組件並找水電工維修？","options":["(1)關閉電視","(2)關閉該水管之止水閥或家戶總水閥","(3)關閉瓦斯","(4)關閉窗戶"],"answer":1,"explanation":"水箱或水管漏水應先關閉總水閥，避免浪費與積水。"},
      {"sourceId":"S189","question":"89. 當發生腹瀉（拉肚子）時，飲食補充上應該注意什麼？","options":["(1)吃油炸燒烤食物","(2)補充水分與電解質，吃清淡飲食","(3)喝大杯冰珍奶","(4)不喝水"],"answer":1,"explanation":"腹瀉易脫水，應補充水分電解質並食用清淡食物。"},
      {"sourceId":"S190","question":"90. 關於個人衛生用品（如牙刷），建議多久更換一次？","options":["(1)十年","(2)約 2～3 個月或刷毛散開時","(3)永遠不用換","(4)每天換一支"],"answer":1,"explanation":"牙刷建議每 2～3 個月或刷毛變形散開時更換。"},
      {"sourceId":"S191","question":"91. 到醫院就醫時，向醫生說明症狀下列哪種說法最清晰？","options":["(1)「就全身不舒服啦！」","(2)「我從昨天開始發燒到38.5度，而且會咳嗽」","(3)「你自己看著辦」","(4)「我不知道」"],"answer":1,"explanation":"清楚說明發作時間、具體體徵與症狀能協助醫生診斷。"},
      {"sourceId":"S192","question":"92. 居家防颱準備中，下列哪一項行動是正確的？","options":["(1)將陽台花盆移至室內，固定鬆動物品","(2)把窗戶大開通風","(3)跑去海邊觀浪","(4)準備大量煙火"],"answer":0,"explanation":"颱風來臨前應將陽台易墜落的花盆移入室內，並鎖緊門窗。"},
      {"sourceId":"S193","question":"93. 關於保健食品（如維他命），下列哪一種觀念才是正確的？","options":["(1)可以完全替代正餐與藥物","(2)補充應適量，不能取代均衡飲食與正規醫療","(3)吃越多越健康","(4)跟降血壓藥一起大量吃"],"answer":1,"explanation":"保健食品不能替代均衡飲食與藥物，過量無益。"},
      {"sourceId":"S194","question":"94. 清潔家裡高處灰塵或更換燈泡時，下列哪種做法比較安全？","options":["(1)站在滾輪椅子上","(2)使用穩固的梯子並請人在旁扶持","(3)站在堆疊的箱子上","(4)單腳跳躍"],"answer":1,"explanation":"高處清潔或換燈泡應使用穩固梯子，避免跌落。"},
      {"sourceId":"S195","question":"95. 女性生理期期間的衛生護理，下列何者正確？","options":["(1)一天只要換一片衛生棉","(2)定期更換衛生棉並保持乾爽","(3)不用洗澡","(4)隨意丟棄使用過的衛生棉"],"answer":1,"explanation":"生理期應依流量與產品指示定期更換衛生棉，維持乾淨衛生。"},
      {"sourceId":"S196","question":"96. 發現家中壁癌或牆壁發黴，長期對身體會有什麼不良影響？","options":["(1)讓皮膚變好","(2)易引發呼吸道過敏與氣喘","(3)沒有任何影響","(4)增強免疫力"],"answer":1,"explanation":"居家黴菌與濕氣易誘發呼吸道過敏、咳嗽與氣喘。"},
      {"sourceId":"S197","question":"97. 使用微波爐加熱食物時，下列哪一種容器是「絕對不能」放入的？","options":["(1)微波專用塑膠盒","(2)金屬碗盤或帶有金屬邊框的餐具","(3)可微波玻璃碗","(4)可微波陶瓷盤"],"answer":1,"explanation":"金屬容器放入微波爐會產生火花引發火災危險。"},
      {"sourceId":"S198","question":"98. 運動或戶外活動後大量流汗，應該注意什麼健康管理？","options":["(1)馬上吹強烈冷氣","(2)擦乾汗水並適度補充水分","(3)喝冰水狂灌","(4)不穿衣服"],"answer":1,"explanation":"流汗後應及時擦乾避免受涼，並適度補充水分。"},
      {"sourceId":"S199","question":"99. 當家中發生跳電（斷電）時，第一步處理動作應該是？","options":["(1)馬上打 119","(2)先關閉高功率電器，再查看無熔絲開關","(3)砸壞電器","(4)跑出去大叫"],"answer":1,"explanation":"跳電時應先關閉高功率電器，再檢查無熔絲開關；若反覆跳電，應請專業人員檢修。"},
      {"sourceId":"S200","question":"100. 保持良好的睡眠習慣，對身心健康有何重要性？","options":["(1)浪費時間","(2)幫助體力恢復、維持免疫力與注意力集中","(3)讓身體變弱","(4)沒任何作用"],"answer":1,"explanation":"充足良好的睡眠是維持免疫力、記憶力與體力的關鍵。"}
    ];
    const unitSelect=document.querySelector("#unit"),questionEl=document.querySelector("#question"),sourceEl=document.querySelector("#source"),optionsEl=document.querySelector("#options"),feedbackEl=document.querySelector("#feedback"),progressEl=document.querySelector("#progress"),scoreEl=document.querySelector("#score"),prevBtn=document.querySelector("#prev"),nextBtn=document.querySelector("#next");
    let unit=0,index=0,answers=Array(10).fill(null);
    for(let i=0;i<10;i++){const option=document.createElement("option");option.value=i;option.textContent=`單元 ${i+1}（第 ${i*10+1}～${i*10+10} 題）`;unitSelect.append(option)}
    function current(){return questions[unit*10+index]}
    function render(){speechSynthesis.cancel();const q=current();sourceEl.textContent=`題庫編號 ${q.sourceId}`;questionEl.textContent=q.question;progressEl.textContent=`第 ${index+1}／10 題`;optionsEl.replaceChildren();feedbackEl.className="feedback";q.options.forEach((text,i)=>{const button=document.createElement("button");button.type="button";button.className="option";button.textContent=text;button.addEventListener("click",()=>answer(i));if(answers[index]!==null){button.disabled=true;if(i===q.answer)button.classList.add("correct");if(i===answers[index]&&i!==q.answer)button.classList.add("wrong")}optionsEl.append(button)});if(answers[index]!==null)showFeedback();prevBtn.disabled=index===0;nextBtn.disabled=index===9;updateScore()}
    function answer(choice){if(answers[index]!==null)return;answers[index]=choice;render();const q=current();speak(choice===q.answer?`答對了。${q.explanation}`:`答錯了。正確答案是${q.options[q.answer]}。${q.explanation}`)}
    function showFeedback(){const q=current(),correct=answers[index]===q.answer;feedbackEl.className=`feedback show ${correct?"good":"bad"}`;feedbackEl.textContent=correct?`答對了！${q.explanation}`:`答錯了。正確答案是「${q.options[q.answer]}」。${q.explanation}`}
    function updateScore(){let score=0;answers.forEach((answer,i)=>{if(answer!==null&&answer===questions[unit*10+i].answer)score+=10});scoreEl.textContent=`${score} 分`}
    function speak(text){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="zh-TW";utterance.rate=.9;speechSynthesis.speak(utterance)}
    document.querySelector("#voice").addEventListener("click",()=>{const q=current();speak(`${q.question}。${q.options.join("。")}`)});unitSelect.addEventListener("change",()=>{unit=Number(unitSelect.value);index=0;answers=Array(10).fill(null);render()});prevBtn.addEventListener("click",()=>{if(index>0){index--;render()}});nextBtn.addEventListener("click",()=>{if(index<9){index++;render()}});render();
  </script>
