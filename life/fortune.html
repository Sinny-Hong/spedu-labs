<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>異想命運館｜Fortune Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    
    /* 深邃星空漸層 */
    .bg-tarot-pattern {
      background: radial-gradient(circle at 50% 35%, #241142 0%, #0d1127 65%, #050711 100%);
    }

    /* 卡背水晶球神秘呼吸動畫（略微放大） */
    @keyframes sigil-pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.45));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 32px rgba(245, 158, 11, 0.8));
      }
    }
    .animate-sigil {
      animation: sigil-pulse 3.5s infinite ease-in-out;
    }

    /* 2 秒神祕淡入＋輕柔上飄動畫 */
    .calm-fade-in {
      animation: calmFade 2.0s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }
    @keyframes calmFade {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 英文彩蛋流光細線 */
    .shimmer-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #fbbf24, #fef08a, #fbbf24, transparent);
      background-size: 200% 100%;
      animation: shimmer 2.5s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>

    let currentDeck = [];
    let isFlipped = false;
    let isAnimating = false;
    let canClick = false;
    let activeCard = null;

    function shuffleDeck(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getNextCard() {
      if (currentDeck.length === 0) {
        currentDeck = shuffleDeck(cardsData);
      }
      return currentDeck.pop();
    }

    function renderCard(card) {
      activeCard = card;
      document.getElementById('cardIcon').textContent = card.icon;
      document.getElementById('cardNameEN').textContent = card.nameEN.toUpperCase();
      document.getElementById('cardNameZH').textContent = card.nameZH;
      document.getElementById('cardQuoteEN').textContent = `"${card.quoteEN}"`;
      document.getElementById('cardQuoteZH').textContent = card.quoteZH;
      document.getElementById('cardFortuneZH').textContent = card.fortuneZH;
      document.getElementById('cardLuckyWord').textContent = card.luckyWord;
    }

      calmText.classList.remove('calm-fade-in');
      void calmText.offsetWidth; // 強制重繪
      calmText.classList.add('calm-fade-in');

      // 2 秒淡入結束，解鎖點擊
      setTimeout(() => {
        canClick = true;
      }, 2000);
    }

    // 英文發音彩蛋 (0.85x)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/["'“”]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // 翻牌與蓋牌邏輯
    function toggleCard() {
      if (isAnimating) return;

      const cardInner = document.getElementById('cardInner');

      if (!isFlipped) {
        // 如果處於冷卻中，不可翻牌
        if (!canClick) return;

        isAnimating = true;
        cardInner.classList.add('rotate-y-180');
        isFlipped = true;
        setTimeout(() => { isAnimating = false; }, 700);
      } else {
        // 翻回背面（重置下一張，並觸發 2 秒冷靜淡入）
        isAnimating = true;
        cardInner.classList.remove('rotate-y-180');
        isFlipped = false;

        setTimeout(() => {
          renderCard(getNextCard());
          isAnimating = false;
          triggerCalmNotice(); // 蓋牌完成後，開始 2 秒淡入新提示並鎖定
        }, 700);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      currentDeck = shuffleDeck(cardsData);
      renderCard(getNextCard());
      triggerCalmNotice(); // 首次進場啟動 2 秒冷卻與淡入

      const quoteArea = document.getElementById('quoteArea');

      // 全螢幕點擊翻牌／蓋牌
      document.body.addEventListener('click', (e) => {
        // 若在正面點擊英文發音區，只發音不蓋牌
        if (isFlipped && quoteArea.contains(e.target)) {
          speakText(activeCard.quoteEN);
          return;
        }
        toggleCard();
      });
    });
  </script>
</body>
</html>
