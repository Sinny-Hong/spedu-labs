<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異想事件簿 CASE001</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#143856;
  --navy2:#0e2a43;
  --cream:#fffaf0;
  --cream2:#f5efe2;
  --orange:#f7a936;
  --orange2:#d8891f;
  --red:#d44848;
  --bluebox:#e9f1ff;
  --ink:#183b5b;
  --muted:#8e9dad;
  --green:#4caf70;
}
html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#e8edf0;color:var(--ink)}
body{padding:10px}
button{font:inherit}
.app{
  min-height:calc(100vh - 20px);
  max-width:980px;
  margin:auto;
  border:4px solid var(--navy);
  border-radius:34px;
  overflow:hidden;
  background:linear-gradient(180deg,#183f61 0%,#153955 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  position:relative;
}
.topbar{
  height:105px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 34px;
  background:#143f63;
  color:white;
}
.info-btn{
  border:0;
  border-radius:16px;
  background:var(--orange);
  color:var(--ink);
  padding:17px 22px;
  font-weight:800;
  font-size:1.15rem;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);
  cursor:pointer;
}
.case-title{font-size:1.1rem;letter-spacing:.03em}
.scene{
  min-height:calc(100vh - 125px);
  padding:42px 28px 58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.scene h1{
  color:white;
  font-size:clamp(1.8rem,5vw,2.6rem);
  margin:0 0 32px;
}
.clue-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(70px,95px));
  gap:24px;
}
.clue{
  aspect-ratio:1;
  border:0;
  border-radius:22px;
  font-size:2.15rem;
  font-weight:900;
  box-shadow:0 9px 0 rgba(0,0,0,.24);
}
.clue.active{background:var(--orange);color:#614313;cursor:pointer}
.clue.locked{background:#eef2f6;color:#96a3b2}
.clue.done{background:var(--green);color:white}

/* 修正面板與遮罩的 z-index 層級 */
.panel{
  position:absolute;
  inset:0 auto 0 0;
  width:min(79%,560px);
  background:
    repeating-linear-gradient(0deg,transparent 0 38px,rgba(28,61,89,.055) 39px 40px),
    var(--cream);
  border-right:3px solid var(--navy);
  transform:translateX(-103%);
  transition:.28s ease;
  z-index:30; /* 調高，確保能蓋在最上層 */
  padding:28px 38px 150px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.panel.open{transform:translateX(0)}
.panel-close{
  float:right;
  border:0;
  border-radius:12px;
  background:var(--red);
  color:white;
  padding:12px 16px;
  font-weight:800;
  cursor:pointer;
}
.brand{clear:both;padding-top:20px}
.brand h2{font-size:2rem;margin:0 0 12px}
.orange-line{width:125px;height:12px;background:var(--orange);border-radius:99px;margin-bottom:30px}
.case-pill{display:inline-block;border:4px solid var(--navy);border-radius:999px;padding:11px 22px;background:#ffe7ae;font-size:1.4rem;font-weight:900;letter-spacing:.05em}
.panel h3{font-size:1.65rem;margin:28px 0}
.progress-card{
  background:rgba(255,255,255,.65);
  border:3px solid #d9ccb0;
  border-radius:26px;
  padding:22px 26px;
  margin:20px 0;
}
.progress-row{display:flex;justify-content:space-between;font-size:1.35rem;font-weight:800}
.track{height:18px;border:4px solid var(--navy);border-radius:99px;margin-top:16px;overflow:hidden;background:white}
.bar{height:100%;width:0;background:var(--orange);transition:.25s}
.notebook-btn{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:25px;
  padding:22px;
  background:#143f63;
  color:white;
  font-size:1.5rem;
  font-weight:900;
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.18);
  cursor:pointer;
}
.detective{
  margin-top:34px;
  display:flex;
  align-items:center;
  gap:18px;
  font-size:1.35rem;
  font-weight:900;
}
.avatar{width:110px;height:110px;border:5px solid var(--navy);border-radius:50%;background:#ffe2a2;display:grid;place-items:center;font-size:3.5rem}

.overlay{
  position:absolute;
  inset:105px 0 0;
  background:rgba(4,20,34,.35);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:60px 28px 90px;
  z-index:10;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.overlay.show{display:flex}
.card{
  width:min(92%,700px);
  background:var(--cream);
  border-radius:30px;
  padding:28px 38px 36px;
  box-shadow:0 14px 30px rgba(0,0,0,.25);
  position:relative;
}
.close{
  position:absolute;right:28px;top:26px;width:74px;height:74px;border:0;border-radius:50%;
  background:var(--red);color:white;font-size:2.3rem;cursor:pointer
}
.eyebrow{font-weight:900;font-size:1.25rem;margin:10px 0 34px}
.card h2{font-size:2rem;margin:0 95px 30px 0}
.label{font-size:1.15rem;font-weight:900;margin:22px 0 10px}
.read-note{font-weight:400}
.content{
  background:var(--bluebox);
  border-radius:22px;
  padding:22px 26px;
  font-size:1.35rem;
  line-height:1.75;
}
.choices{display:grid;gap:14px;margin-top:24px}
.choice{
  display:flex;gap:14px;align-items:flex-start;
  border:3px solid #d3c7a8;
  border-radius:20px;
  padding:17px 20px;background:#fff;cursor:pointer;font-size:1.18rem;font-weight:700
}
.choice:has(input:checked){border-color:var(--orange);box-shadow:0 0 0 4px rgba(247,169,54,.25)}
.choice input{margin-top:5px;transform:scale(1.35)}
.primary{
  width:100%;margin-top:22px;border:0;border-radius:18px;padding:17px;
  background:var(--navy);color:white;font-size:1.25rem;font-weight:900;cursor:pointer
}
.hint{min-height:1.4em;color:var(--red);font-weight:800;margin:12px 0 0}
.result-status{display:inline-block;border-radius:999px;padding:8px 14px;font-weight:900;margin-bottom:14px}
.correct{background:#def4e6;color:#176438}
.incorrect{background:#fde2e2;color:#902d2d}
.record{margin-top:18px;padding:18px;border-radius:18px;background:#fff0bf;font-weight:900;line-height:1.6}
.note-item{padding:17px;margin-top:14px;border-left:7px solid var(--navy);background:#eaf2ff;border-radius:12px;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:24px}

/* 點擊聲音與外框樣式修正 */
.speak{cursor:pointer}
.speak:hover, .speak:focus{outline:3px solid rgba(247,169,54,.85);outline-offset:3px;border-radius:8px;}

.final-summary{
  display:grid;
  gap:10px;
  margin:16px 0 24px;
  max-height:320px;
  overflow-y:auto;
  padding-right:6px;
}
.final-summary div{
  padding:12px 14px;
  border-radius:12px;
  background:#eef4ff;
  line-height:1.5;
}
.final-choice{
  display:grid;
  gap:12px;
  margin-top:16px;
}
.final-choice label{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 18px;
  border:3px solid #d3c7a8;
  border-radius:18px;
  background:white;
  font-size:1.2rem;
  font-weight:900;
  cursor:pointer;
}
.final-choice label:has(input:checked){
  border-color:var(--orange);
  box-shadow:0 0 0 4px rgba(247,169,54,.25);
}
.final-choice input{transform:scale(1.35)}
.final-btn{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:18px;
  padding:17px;
  background:var(--orange);
  color:#513510;
  font-size:1.25rem;
  font-weight:900;
  cursor:pointer;
}
.final-btn[disabled]{
  background:#d6dce2;
  color:#8793a1;
  cursor:not-allowed;
}
.unlock-note{
  margin-top:18px;
  padding:14px 16px;
  border-radius:14px;
  background:#fff1c5;
  font-weight:900;
  text-align:center;
}
.stamp-wrap{
  display:none;
  text-align:center;
  padding:24px 0 6px;
}
.stamp-wrap.show{display:block}
.stamp{
  display:inline-block;
  padding:20px 28px;
  border:8px double var(--red);
  border-radius:18px;
  color:var(--red);
  font-size:clamp(2rem,8vw,3.7rem);
  font-weight:1000;
  letter-spacing:.08em;
  transform:rotate(-6deg) scale(.9);
  animation:stampIn .28s ease-out forwards;
}
@keyframes stampIn{
  from{opacity:0;transform:rotate(-6deg) scale(1.8)}
  to{opacity:1;transform:rotate(-6deg) scale(1)}
}
.closed-message{
  margin-top:20px;
  font-weight:900;
  font-size:1.15rem;
}

.case-visual{
  width:min(100%,820px);
  margin:0 auto 28px;
  position:relative;
  background:#f6ead0;
  border:4px solid #d6b87a;
  border-radius:24px;
  padding:14px;
  box-shadow:0 12px 0 rgba(0,0,0,.16);
}
.case-visual::before,
.case-visual::after{
  content:"";
  position:absolute;
  width:72px;
  height:18px;
  background:rgba(255,221,135,.92);
  top:-10px;
  transform:rotate(-5deg);
}
.case-visual::before{left:34px}
.case-visual::after{right:34px;transform:rotate(5deg)}
.case-visual img{
  display:block;
  width:100%;
  border-radius:14px;
  cursor:zoom-in;
}
.case-visual figcaption{
  margin-top:10px;
  text-align:center;
  font-weight:900;
  color:var(--navy);
}
.evidence-label{
  display:inline-block;
  margin-bottom:10px;
  padding:7px 12px;
  border-radius:999px;
  background:var(--orange);
  color:#4d3412;
  font-weight:900;
  letter-spacing:.04em;
}
.question-image{
  margin:0 0 22px;
  padding:10px;
  border:3px solid #d8c7a5;
  border-radius:18px;
  background:#f9edd3;
}
.question-image img{
  display:block;
  width:100%;
  border-radius:12px;
  cursor:zoom-in;
}
.question-image figcaption{
  margin-top:8px;
  text-align:center;
  font-size:.95rem;
  font-weight:800;
}
.lightbox{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(4,14,24,.92);
  z-index:50;
  overflow:auto;
}
.lightbox.show{display:flex}
.lightbox img{
  max-width:100%;
  max-height:none;
  border-radius:16px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);
}
.lightbox-close{
  position:absolute;
  top:18px;
  right:18px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  font-size:1.8rem;
  font-weight:900;
  cursor:pointer;
}
@media(max-width:620px){
  .case-visual{padding:10px;margin-bottom:24px;border-radius:18px}
  .case-visual figcaption{font-size:.95rem}
  .question-image{padding:8px}
  .lightbox{align-items:flex-start;padding:86px 10px 40px}
  .lightbox img{width:100%;max-width:none}
}

@media(max-width:620px){
  body{padding:0}
  .app{min-height:100vh;border-radius:0;border-left-width:4px;border-right-width:4px}
  .topbar{height:92px;padding:0 22px}
  .case-title{font-size:1.1rem}
  .info-btn{padding:14px 18px}
  .scene{min-height:calc(100vh - 92px);padding:30px 16px}
  .clue-grid{grid-template-columns:repeat(5,1fr);gap:14px;width:100%;max-width:560px}
  .clue{border-radius:18px;font-size:2rem}
  .overlay{
    inset:92px 0 0;
    padding:44px 18px 110px;
    overflow-y:auto;
    align-items:flex-start;
  }
  .card{
    width:100%;
    padding:26px 26px 40px;
    margin-bottom:40px;
  }
  .close{width:66px;height:66px}
  .panel{
    width:80%;
    padding:24px 30px 80px;
    overflow-y:auto;
  }
  .detective{
    position:static;
    margin-top:30px;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="openInfo" class="info-btn" type="button">☰ 案件資訊</button>
    <div class="case-title">CASE 001 詐騙調查</div>
  </header>

  <main class="scene">
    <!-- 大廳的主題圖片，加上可讀音與點擊功能 -->
    <figure class="case-visual speak">
      <span class="evidence-label">案件情境圖</span>
      <img class="zoomable" src="discord_screenshot.png" alt="Discord 詐騙公告情境畫面">
      <figcaption>證物：可疑的 Discord 免費 Nitro 廣告公告</figcaption>
    </figure>
    
    <h1>🔍 請點擊號碼調查線索</h1>
    <section class="clue-grid" aria-label="線索">
      <button class="clue active" data-id="1" type="button">①</button>
      <button class="clue locked" data-id="2" type="button" disabled>②</button>
      <button class="clue locked" data-id="3" type="button" disabled>③</button>
      <button class="clue locked" data-id="4" type="button" disabled>④</button>
      <button class="clue locked" data-id="5" type="button" disabled>⑤</button>
      <button class="clue locked" data-id="6" type="button" disabled>⑥</button>
      <button class="clue locked" data-id="7" type="button" disabled>⑦</button>
      <button class="clue locked" data-id="8" type="button" disabled>⑧</button>
      <button class="clue locked" data-id="9" type="button" disabled>⑨</button>
      <button class="clue locked" data-id="10" type="button" disabled>⑩</button>
    </section>
  </main>

  <!-- 左側抽屜抽出來：案件資訊與計分板 -->
  <aside id="infoPanel" class="panel" aria-hidden="true">
    <button id="closeInfo" class="panel-close" type="button">✕ 關閉視窗</button>
    <div class="brand">
      <h2>異想事件簿</h2>
      <div class="orange-line"></div>
      <span class="case-pill">CASE 001</span>
      <h3>Discord 限時免費 Nitro</h3>

      <div class="progress-card">
        <div class="progress-row"><span>案件進度</span><span id="caseProgressText">0 / 1</span></div>
        <div class="track"><div id="caseProgressBar" class="bar"></div></div>
      </div>

      <div class="progress-card">
        <div class="progress-row"><span>線索進度</span><span id="clueProgressText">0 / 10</span></div>
        <div class="track"><div id="clueProgressBar" class="bar"></div></div>
      </div>

      <button id="openNotebook" class="notebook-btn" type="button">📒 偵探筆記</button>
    </div>
    <div class="detective"><div class="avatar">🕵️</div><span>小謙</span></div>
  </aside>

  <!-- 點擊線索號碼彈出的：答題與詳解遮罩層 -->
  <section id="questionOverlay" class="overlay" aria-hidden="true">
    <!-- 階段A：問答卡片 -->
    <article id="questionCard" class="card">
      <button id="closeQuestion" class="close" type="button" aria-label="返回案件">✕</button>
      <div class="eyebrow">線索調查</div>
      <h2 id="qTitle" class="speak"></h2>
      <div class="label">內容 (點擊文字可以聽聲音喔)</div>
      <div id="qContent" class="content speak" tabindex="0"></div>
      <div class="label">問題</div>
      <div id="qQuestion" class="content speak" tabindex="0"></div>
      <div id="choices" class="choices"></div>
      <p id="answerHint" class="hint" aria-live="polite"></p>
      <button id="submitAnswer" class="primary" type="button">確認答案</button>
    </article>

    <!-- 階段B：答題結果與詳解卡片 -->
    <article id="resultCard" class="card hidden">
      <button id="closeResult" class="close" type="button" aria-label="返回案件">✕</button>
      <div class="eyebrow">調查結果</div>
      <div id="resultStatus" class="result-status" aria-live="polite"></div>
      <div class="label">詳解</div>
      <div id="explain" class="explain speak" tabindex="0"></div>
      <hr>
      <div class="label">📄 已收錄線索</div>
      <div id="clueText" class="record speak" tabindex="0"></div>
    </article>

    <!-- 階段C：最終真相大白結案卡片 -->
    <article id="finalCard" class="card hidden">
      <button id="closeFinal" class="close" type="button" aria-label="返回案件">✕</button>
      <div class="eyebrow">結案指控</div>
      <h2>案件總結與破案宣告</h2>
      <p class="read-note" style="margin-bottom:15px;">根據你收集到的完整線索，請做出最後的正確推論：</p>
      <div class="final-summary" id="finalSummaryList"></div>
      <div class="label">請指出誰是幕後主使者，或這是什麼類型的事件？</div>
      <div class="final-choice">
        <label><input type="radio" name="finalAnswer" value="0"><span>(A) 這是一個合法的官方周年慶回饋活動</span></label>
        <label><input type="radio" name="finalAnswer" value="1"><span>(B) 這是一個利用偽造網址騙取個資的網路詐騙</span></label>
        <label><input type="radio" name="finalAnswer" value="2"><span>(C) 這是 Discord 伺服器壞掉產生的系統 Bug</span></label>
      </div>
      <p id="finalHint" class="hint" aria-live="polite"></p>
      <button id="submitFinal" class="final-btn" type="button">提交最終報告</button>
      <div class="stamp-wrap" id="stampWrap"><div class="stamp">CASE CLOSED</div></div>
      <p id="closedMessage" class="closed-message hidden" style="color:var(--green); text-align:center;"></p>
    </article>
  </section>

  <!-- 右側滑出來的：偵探筆記抽屜本 -->
  <aside id="notebookPanel" class="panel" style="inset:0 0 0 auto; border-left:3px solid var(--navy); border-right:0; transform:translateX(103%);" aria-hidden="true">
    <button id="closeNotebook" class="panel-close" type="button">✕ 關閉筆記</button>
    <div class="brand">
      <h2>📒 偵探筆記</h2>
      <div class="orange-line"></div>
      <div id="notebookList"></div>
    </div>
  </aside>

  <!-- 圖片放大看燈箱 -->
  <section id="lightbox" class="lightbox">
    <button id="closeLightbox" class="lightbox-close">✕</button>
    <img id="lightboxImg" src="" alt="放大證物畫面">
  </section>
</div>

<script>
    /* ==========================================
       2. 遊戲資料設定 (符合三選一格式)
       ========================================== */
    const CASE_DATA = {
        caseId: "CASE001",
        title: "Discord 限時免費 Nitro",
        totalClues: 10,
        finalCorrectAnswer: 1, // 正確答案是 (B)
        questions: [
            {
                id: 1,
                title: "線索 1｜可疑網址",
                content: "你收到一則訊息：『Discord 官方限時贈送免費 Nitro，請立刻前往 disc0rd-gift.com 領取。』",
                question: "這則訊息中，哪一個地方最可疑？",
                choices: [
                    "(A) 訊息中出現 Discord 的名稱",
                    "(B) 網址把英文字母 o 換成數字 0",
                    "(C) Nitro 是付費服務"
                ],
                answer: 1, 
                explain: "詐騙網站常利用看起來很像官方網址的拼字，例如把 discord 中的字母 o 換成數字 0。閱讀網址時不能只看大概的外形，要逐字確認。",
                clue: "可疑網址常用相似字母或數字假冒官方網站。"
            }
        ]
    };

    /* ==========================================
       3. 語音朗讀模組 (解決 Web Speech API 中中英文字體判斷)
       ========================================== */
    (() => {
        const synth = window.speechSynthesis;
        function speakText(text) {
            if (!synth || !text.trim()) return;
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text.trim());
            u.lang = /[A-Za-z]/.test(text) && !/[\u4e00-\u9fff]/.test(text) ? "en-US" : "zh-TW";
            u.rate = 0.9; 
            synth.speak(u);
        }

        document.addEventListener("click", e => {
            const t = e.target.closest(".speak");
            if (t) speakText(t.textContent);
        });
        window.speakText = speakText;
    })();

    /* ==========================================
       4. 遊戲核心邏輯控制 (抽屜、蓋章、計分、對齊)
       ========================================== */
    (() => {
        const infoPanel = document.getElementById("infoPanel");
        const notebookPanel = document.getElementById("notebookPanel");
        const overlay = document.getElementById("questionOverlay");
        const qCard = document.getElementById("questionCard");
        const rCard = document.getElementById("resultCard");
        const fCard = document.getElementById("finalCard");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        
        const state = { currentQuestion: null, completed: new Set(), isClosed: false };
        
        // 計分板文字與進度條元素
        const clueProgressText = document.getElementById("clueProgressText"),
              clueProgressBar = document.getElementById("clueProgressBar"),
              caseProgressText = document.getElementById("caseProgressText"),
              caseProgressBar = document.getElementById("caseProgressBar"),
              notebookList = document.getElementById("notebookList"),
              answerHint = document.getElementById("answerHint"),
              finalHint = document.getElementById("finalHint");

        // 側邊欄開關
        document.getElementById("openInfo").addEventListener("click", () => infoPanel.classList.add("open"));
        document.getElementById("closeInfo").addEventListener("click", () => infoPanel.classList.remove("open"));
        document.getElementById("openNotebook").addEventListener("click", () => {
            notebookPanel.classList.add("open");
            infoPanel.classList.remove("open");
        });
        document.getElementById("closeNotebook").addEventListener("click", () => notebookPanel.classList.remove("open"));

        // 圖片燈箱放大
        document.querySelectorAll(".zoomable").forEach(img => {
            img.addEventListener("click", () => {
                lightboxImg.src = img.src;
                lightbox.classList.add("show");
            });
        });
        document.getElementById("closeLightbox").addEventListener("click", () => lightbox.classList.remove("show"));

        // 渲染選單題目
        function renderQuestion(q) {
            if(state.isClosed) {
                alert("本案已結案，你可以開啟偵探筆記複習線索！");
                return;
            }
            state.currentQuestion = q;
            answerHint.textContent = "";
            document.getElementById("qTitle").textContent = q.title;
            document.getElementById("qContent").textContent = q.content;
            document.getElementById("qQuestion").textContent = q.question;
            
            const choices = document.getElementById("choices");
            choices.innerHTML = "";
            
            q.choices.forEach((c, i) => {
                const label = document.createElement("label");
                label.className = "choice speak";
                const input = document.createElement("input");
                input.type = "radio";
                input.name = "answer";
                input.value = String(i);
                const span = document.createElement("span");
                span.textContent = c;
                
                label.append(input, span);
                choices.appendChild(label);
            });

            qCard.classList.remove("hidden");
            rCard.classList.add("hidden");
            fCard.classList.add("hidden");
            overlay.classList.add("show");
        }

        // 檢查一般線索答案
        function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                answerHint.textContent = "請先選取一個答案喔！";
                return;
            }
            const q = state.currentQuestion;
            const ok = Number(selected.value) === q.answer;
            const status = document.getElementById("resultStatus");
            
            status.textContent = ok ? "🎉 答對了！" : "❌ 答案不太對，再想想看";
            status.className = `result-status ${ok ? "correct" : "incorrect"}`;
            
            document.getElementById("explain").textContent = q.explain;
            document.getElementById("clueText").textContent = `✔ ${q.clue}`;
            
            if (ok) {
                state.completed.add(q.id);
                updateProgress();
            }
            
            qCard.classList.add("hidden");
            rCard.classList.remove("hidden");
        }

        // 觸發最後一題：結案指控
        function triggerFinalCase() {
            fCard.classList.remove("hidden");
            qCard.classList.add("hidden");
            rCard.classList.add("hidden");
            overlay.classList.add("show");

            const finalSummaryList = document.getElementById("finalSummaryList");
            finalSummaryList.innerHTML = "";
            CASE_DATA.questions.forEach(q => {
                const div = document.createElement("div");
                div.textContent = `線索 ${q.id} 結晶：${q.clue}`;
                finalSummaryList.appendChild(div);
            });
        }

        // 檢查最終結案答案
        function submitFinalAnswer() {
            const selected = document.querySelector('input[name="finalAnswer"]:checked');
            if (!selected) {
                finalHint.textContent = "請選出最後的真相推論！";
                return;
            }
            if (Number(selected.value) === CASE_DATA.finalCorrectAnswer) {
                state.isClosed = true;
                finalHint.textContent = "";
                document.getElementById("stampWrap").classList.add("show");
                document.getElementById("submitFinal").disabled = true;
                
                const msg = document.getElementById("closedMessage");
                msg.textContent = "恭喜你成功破案！已將所有網路詐騙線索收錄在筆記本中。";
                msg.classList.remove("hidden");
                
                // 更新總進度條
                caseProgressText.textContent = "1 / 1";
                caseProgressBar.style.width = "100%";
            } else {
                finalHint.textContent = "❌ 推論錯誤！請根據收錄的線索重新思考看看。";
            }
        }

        function updateProgress() {
            const n = state.completed.size;
            clueProgressText.textContent = `${n} / ${CASE_DATA.totalClues}`;
            clueProgressBar.style.width = `${n / CASE_DATA.totalClues * 100}%`;
            
            document.querySelectorAll(".clue[data-id]").forEach(btn => {
                const id = Number(btn.dataset.id);
                if (state.completed.has(id)) {
                    btn.className = "clue done";
                    btn.textContent = "✔";
                    btn.disabled = true;
                }
            });

            // 💡 特教加強版：如果 10 題一般線索都答對了，點擊第 10 題時關閉後會自動觸發結案卡片
            if (n === CASE_DATA.totalClues && !state.isClosed) {
                setTimeout(() => { triggerFinalCase(); }, 800);
            }
            renderNotebook();
        }

        function renderNotebook() {
            const list = CASE_DATA.questions.filter(q => state.completed.has(q.id));
            notebookList.innerHTML = "";
            if (!list.length) {
                notebookList.innerHTML = '<p class="empty">目前筆記本空空的，快去收集線索吧！</p>';
                return;
            }
            list.forEach(q => {
                const item = document.createElement("div");
                item.className = "note-item speak";
                item.tabIndex = 0;
                item.textContent = `✔ [線索 ${q.id}] ${q.clue}`;
                notebookList.appendChild(item);
            });
        }

        // 綁定關閉事件
        document.getElementById("closeQuestion").addEventListener("click", () => overlay.classList.remove("show"));
        document.getElementById("closeResult").addEventListener("click", () => overlay.classList.remove("show"));
        document.getElementById("closeFinal").addEventListener("click", () => overlay.classList.remove("show"));
        
        // 綁定確認事件
        document.querySelector('.clue[data-id="1"]').addEventListener("click", () => renderQuestion(CASE_DATA.questions[0]));
        document.getElementById("submitAnswer").addEventListener("click", submitAnswer);
        document.getElementById("submitFinal").addEventListener("click", submitFinalAnswer);

        renderNotebook();
        updateProgress();
    })();
</script>
</body>
</html>
