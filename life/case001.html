<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異想事件簿｜CASE 001</title>
<style>
/* ==========================================
   1. 視覺樣式設定 (新增手機左側收折功能)
   ========================================== */
:root{
  --ink:#17324d; --navy:#183b59; --paper:#f7f0df; --paper2:#fffaf0;
  --line:#d8c9a8; --accent:#f0a23a; --accentSoft:#ffe3ad;
  --blue-soft: #eaf3ff; --red: #c94343; --green: #4caf70; --yellow: #f6c94c;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#dfeaf1,#f6ead6);
  color:var(--ink); overflow-x:hidden; overflow-y:auto;
}
.page{width:100%;min-height:100vh;display:grid;justify-items:center;align-items:start;padding:clamp(12px,2vw,28px)}
.hidden{display:none !important;}

/* 遊戲大廳外殼 */
.game-shell{
  width:min(95vw,1720px); height:min(90vh,980px); min-height:560px;
  display:grid; grid-template-columns:clamp(220px,18vw,300px) minmax(0,1fr);
  background:var(--paper); border:5px solid var(--navy); border-radius:26px;
  overflow:hidden; box-shadow:0 18px 45px rgba(26,42,57,.18);
  position: relative;
}

/* 手機版專用：上方工具列（預設在電腦版隱藏） */
.mobile-header {
  display: none;
  width: 100%;
  background: var(--navy);
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
  color: #fff;
  position: absolute;
  top: 0; left: 0; z-index: 5;
}
.menu-toggle-btn {
  background: var(--accent);
  color: var(--ink);
  border: 0;
  padding: 6px 12px;
  border-radius: 8px;
  font-weight: 900;
  cursor: pointer;
  font-size: 1rem;
}

/* 左側資訊面板 */
.case-panel{
  padding:clamp(22px,2vw,34px) clamp(18px,1.7vw,28px);
  background:
    linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.34)),
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(48,82,109,.07) 31px 32px),
    var(--paper);
  border-right:4px solid var(--navy); display:flex; flex-direction:column; overflow:hidden;
  transition: transform 0.3s ease; /* 讓收折動畫平滑 */
}
/* 手機版關閉面板按鈕（電腦版隱藏） */
.close-panel-btn { display: none; }

.brand{font-size:clamp(23px,2vw,34px);font-weight:900;letter-spacing:.08em;line-height:1.15;margin-bottom:18px}
.brand:after{content:"";display:block;width:68px;height:6px;margin-top:12px;border-radius:999px;background:var(--accent)}
.case-id{display:inline-block;align-self:flex-start;padding:7px 12px;border:2px solid var(--navy);border-radius:999px;background:var(--accentSoft);font-weight:900;letter-spacing:.08em;margin-bottom:14px}
.case-title{font-size:clamp(20px,1.55vw,27px);line-height:1.35;font-weight:900;margin-bottom:24px}

/* 進度條 */
.progress-card{padding:15px 14px;margin-bottom:13px;border:2px solid var(--line);border-radius:15px;background:rgba(255,255,255,.66)}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-weight:900}
.progress-value{font-family:"Comic Sans MS","Noto Sans TC",sans-serif;font-size:18px}
.progress-track{height:11px;border:2px solid var(--navy);border-radius:999px;background:#fff;overflow:hidden}
.progress-fill{width:0;height:100%;background:var(--accent);transition:width .25s}

/* 筆記本按鈕 */
.notebook-button{
  width:100%;margin-top:8px;padding:15px 14px;border:0;border-radius:16px;
  background:var(--navy);color:#fff;font-size:clamp(17px,1.3vw,21px);font-weight:900;
  cursor:pointer;box-shadow:0 6px 0 #0f2a41;transition: transform 0.1s;
}
.notebook-button:active{transform:translateY(4px);box-shadow:0 2px 0 #0f2a41}

/* 吉祥物小謙 */
.mascot{margin-top:auto;display:flex;align-items:flex-end;gap:12px;padding-top:18px}
.mascot-face{
  width:clamp(72px,6vw,96px);aspect-ratio:1;display:grid;place-items:center;
  border:3px solid var(--navy);border-radius:50%;background:var(--accentSoft);
  font-size:clamp(44px,4vw,62px);box-shadow:0 7px 0 rgba(24,59,89,.15)
}
.mascot-name{padding-bottom:8px;font-family:"Comic Sans MS","Noto Sans TC",sans-serif;font-weight:900;font-size:18px}

/* 右側主要互動區域 */
.evidence-area{min-width:0;min-height:0;padding:clamp(12px,1.3vw,22px);background:linear-gradient(135deg,rgba(17,42,65,.95),rgba(27,58,86,.97));display:grid;place-items:center;position:relative;}
.evidence-frame{
  position:relative;width:100%;height:100%;min-height:0;display:grid;place-items:center;
  overflow:hidden;border-radius:18px;background:#101820;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)
}

/* 線索按鈕棋盤格設定 */
.clue-board-container { width: 100%; max-width: 600px; padding: 20px; text-align: center; color: #fff;}
.clue-board-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 900; letter-spacing: 0.1em;}
.clue-board{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.clue-btn{aspect-ratio:1;border:3px solid var(--navy);border-radius:16px;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,0.3);}
.clue-btn.active{color:#553b00;background:var(--accent);border-color:var(--navy);}
.clue-btn.finished{color:#fff;background:var(--green);border-color:var(--navy);}
.clue-btn.locked{color:#8793a1;background:#d8dee5;cursor:not-allowed;box-shadow:none}

/* 彈出式調查與結果卡片 */
.card{position:absolute;width:min(650px,94%);max-height:85%;overflow-y:auto;padding:28px;border:4px solid var(--navy);border-radius:20px;background:var(--paper2);box-shadow:0 14px 35px rgba(0,0,0,0.3);z-index:10;}
.close-btn{position:absolute;right:16px;top:14px;width:40px;height:44px;border:0;border-radius:50%;color:#fff;background:var(--red);font-size:1.2rem;font-weight:700;cursor:pointer}
.eyebrow{margin:0 0 4px;color:var(--navy);font-size:.9rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.block{margin:20px 0; text-align: left;}
.label{margin-bottom:7px;color:var(--navy);font-weight:900;font-size:1.1rem}
.content,.explain,.clue-record{padding:15px;border-radius:13px;line-height:1.75;font-size:1.15rem;font-weight:700;}
.content{background:var(--blue-soft);color:var(--ink)}
.explain{margin:12px 0 22px;background:#f7f8fa;color:var(--ink)}
.clue-record{background:#fff4cc;font-weight:700;color:var(--ink)}

/* 點擊語音提示框設定 */
.speak{cursor:pointer; position: relative;}
.speak:hover, .speak:focus{outline:3px solid var(--accent);outline-offset:3px;border-radius: 8px;}

/* 三選一按鈕排版 */
.choices{display:grid;gap:11px;text-align: left;}
.choice{display:flex;align-items:flex-start;gap:10px;padding:14px;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;font-size:1.1rem;font-weight:700;}
.choice:hover{background:var(--blue-soft)}
.choice input{margin-top:6px; transform: scale(1.2);}
.hint{min-height:1.5em;margin:12px 0 0;color:var(--red);font-weight:700;text-align: left;}
.primary-btn{width:100%;border:0;border-radius:15px;color:#fff;background:var(--navy);cursor:pointer;padding:15px;margin-top:18px;font-weight:900;font-size:1.2rem}

/* 狀態標籤 */
.status{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:900;margin-bottom:10px;}
.status.correct{color:#176437;background:#ddf5e6}
.status.incorrect{color:#8b2828;background:#fde6e6}
hr{border:0;border-top:2px solid var(--line);margin:22px 0}

/* 側邊筆記本抽屜 */
.drawer{
  position:absolute;inset:0 0 0 auto;width:min(430px,92%);padding:28px;background:var(--paper2);
  border-left:4px solid var(--navy);transform:translateX(102%);transition:transform .24s ease;
  z-index:15;box-shadow:-14px 0 35px rgba(0,0,0,.24);overflow-y: auto;
}
.drawer.open{transform:translateX(0)}
.drawer h2{margin:0 0 12px;font-size:26px;font-weight:900;}
.note-item{padding:14px;margin-top:12px;border-left:6px solid var(--navy);border-radius:10px;background:var(--blue-soft);line-height:1.6;font-weight:700;}
.empty-note{color:var(--ink);text-align:center;padding:22px 0;font-weight:700;}
.drawer-close{position:absolute;right:16px;top:14px;border:0;background:transparent;font-size:28px;cursor:pointer}

/* ==========================================
   響應式斷點：當螢幕寬度小於 920px (手機/平板)
   ========================================== */
@media (max-width:920px){
  .page{padding:5px}
  
  /* 變更為主單欄排版 */
  .game-shell{
    width:100vw; height:95vh; 
    grid-template-columns: 1fr; /* 取消雙欄，變單欄 */
    border-width:4px; border-radius:20px;
    padding-top: 50px; /* 留空間給頂部工具列 */
  }

  /* 顯示手機頂部工具列 */
  .mobile-header { display: flex; }

  /* 左側面板變成隱藏式抽屜 */
  .case-panel {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: min(300px, 85vw);
    z-index: 20;
    transform: translateX(-102%); /* 預設躲在左邊外面 */
    box-shadow: 10px 0 35px rgba(0,0,0,0.3);
  }
  /* 當加了 .open 類別時滑出 */
  .case-panel.open { transform: translateX(0); }

  /* 顯示面板內的關閉按鈕 */
  .close-panel-btn {
    display: block;
    align-self: flex-end;
    background: var(--red);
    color: white;
    border: 0;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 900;
    margin-bottom: 10px;
    cursor: pointer;
  }

  .evidence-area { padding: 10px; }
  .clue-board { gap: 8px; }
}

@media (max-height:700px){
  .game-shell{height:95vh; min-height:initial;}
}
</style>
</head>
<body>
<main class="page">
  <section class="game-shell">
    
    <!-- 手機版才看得到的頂部工具列 -->
    <div class="mobile-header">
      <button class="menu-toggle-btn" id="openMenu">☰ 案件資訊</button>
      <span>CASE 001 詐騙調查</span>
    </div>

    <!-- 左側資訊面板 (在手機版會變成可收折的抽屜) -->
    <aside class="case-panel" id="casePanel">
      <button class="close-panel-btn" id="closeMenu">✕ 關閉視窗</button>
      
      <div class="brand">異想事件簿</div>
      <div class="case-id">CASE 001</div>
      <div class="case-title">Discord 限時免費點數</div>

      <div class="progress-card">
        <div class="progress-head"><span>案件進度</span><span id="caseProgressText" class="progress-value">0 / 1</span></div>
        <div class="progress-track"><div id="caseProgressBar" class="progress-fill"></div></div>
      </div>

      <div class="progress-card">
        <div class="progress-head"><span>線索進度</span><span id="clueProgressText" class="progress-value">0 / 10</span></div>
        <div class="progress-track"><div id="clueProgressBar" class="progress-fill"></div></div>
      </div>

      <button class="notebook-button" id="openNotebook">📒 偵探筆記</button>

      <div class="mascot">
        <div class="mascot-face">🕵️</div>
        <div class="mascot-name">小謙</div>
      </div>
    </aside>

    <!-- 右側主要互動區域 -->
    <section class="evidence-area">
      
      <!-- 線索棋盤大廳 -->
      <div id="clueBoardPage" class="clue-board-container">
        <div class="clue-board-title">🔍 請點擊號碼調查線索</div>
        <section id="clueBoard" class="clue-board">
          <button class="clue-btn active" data-id="1">①</button>
          <button class="clue-btn locked" disabled>②</button>
          <button class="clue-btn locked" disabled>③</button>
          <button class="clue-btn locked" disabled>④</button>
          <button class="clue-btn locked" disabled>⑤</button>
          <button class="clue-btn locked" disabled>⑥</button>
          <button class="clue-btn locked" disabled>⑦</button>
          <button class="clue-btn locked" disabled>⑧</button>
          <button class="clue-btn locked" disabled>⑨</button>
          <button class="clue-btn locked" disabled>⑩</button>
        </section>
      </div>

      <!-- 答題卡片 -->
      <section id="questionPage" class="card hidden">
        <button class="close-btn" id="closeQuestion" aria-label="返回案件">✕</button>
        <p class="eyebrow">線索調查</p>
        <h2 id="qTitle" class="speak" tabindex="0"></h2>
        <div class="block">
          <div class="label">內容 (點擊文字可以聽聲音)</div>
          <div id="qContent" class="content speak" tabindex="0"></div>
        </div>
        <div class="block">
          <div class="label">問題</div>
          <div id="qQuestion" class="content speak" tabindex="0"></div>
        </div>
        <div id="choices" class="choices"></div>
        <p id="answerHint" class="hint" aria-live="polite"></p>
        <button id="submitAnswer" class="primary-btn">確認答案</button>
      </section>

      <!-- 調查結果卡片 -->
      <section id="resultPage" class="card hidden">
        <button class="close-btn" id="closeResult" aria-label="返回案件">✕</button>
        <p class="eyebrow">調查結果</p>
        <div id="resultStatus" class="status" aria-live="polite"></div>
        <div class="block">
          <div class="label">詳解</div>
          <div id="explain" class="explain speak" tabindex="0"></div>
        </div>
        <hr>
        <div class="block">
          <div class="label">📄 已收錄線索</div>
          <div id="clueText" class="clue-record speak" tabindex="0"></div>
        </div>
      </section>

      <!-- 右側抽屜：偵探筆記本 -->
      <aside id="notebookDrawer" class="drawer">
        <button class="drawer-close" id="closeNotebook">✕</button>
        <h2>📒 偵探筆記</h2>
        <div id="notebookList"></div>
      </aside>

    </section>
  </section>
</main>

<script>
    /* ==========================================
       2. 遊戲資料設定 (三選一 A B C 模式)
       ========================================== */
    const CASE_DATA = {
        caseId: "CASE001",
        title: "Discord 限時免費點數",
        totalClues: 10,
        questions: [
            {
                id: 1,
                title: "線索 1｜可疑網址",
                content: "你收到一則訊息：『Discord 官方限時贈送免費 Nitro，請立刻前往 disc0rd-gift.com 領取。』",
                question: "這則訊息中，哪一個地方最可疑？",
                choices: [
                    "(A) 訊息中出現 Discord 的名稱",
                    "(B) 網址把英文字母 o 換成數字 0",
                    "(C) Nitro 是付費服務"
                ],
                answer: 1, 
                explain: "詐騙網站常利用看起來很像官方網址的拼字，例如把 discord 中的字母 o 換成數字 0。閱讀網址時不能只看大概的外形，要逐字確認。",
                clue: "可疑網址常用相似字母或數字假冒官方網站。"
            }
        ]
    };

    /* ==========================================
       3. 語音朗讀模組
       ========================================== */
    (() => {
        const synth = window.speechSynthesis;
        function speakText(text) {
            if (!synth || !text.trim()) return;
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text.trim());
            u.lang = /[A-Za-z]/.test(text) && !/[\u4e00-\u9fff]/.test(text) ? "en-US" : "zh-TW";
            u.rate = 0.9; 
            synth.speak(u);
        }

        document.addEventListener("click", e => {
            const t = e.target.closest(".speak");
            if (t) speakText(t.textContent);
        });

        document.addEventListener("keydown", e => {
            const t = e.target.closest?.(".speak");
            if (t && (e.key === "Enter" || e.key === " ")) {
                e.preventDefault();
                speakText(t.textContent);
            }
        });
        window.speakText = speakText;
    })();

    /* ==========================================
       4. 遊戲核心邏輯與收折選單控制
       ========================================== */
    (() => {
        const pages = {
            question: document.getElementById("questionPage"),
            result: document.getElementById("resultPage")
        };
        const drawer = document.getElementById("notebookDrawer");
        const casePanel = document.getElementById("casePanel");
        const state = { currentQuestion: null, completed: new Set() };
        
        const clueProgressText = document.getElementById("clueProgressText"),
              clueProgressBar = document.getElementById("clueProgressBar"),
              caseProgressText = document.getElementById("caseProgressText"),
              caseProgressBar = document.getElementById("caseProgressBar"),
              notebookList = document.getElementById("notebookList"),
              answerHint = document.getElementById("answerHint");

        function hideAllPopups() {
            Object.values(pages).forEach(p => p.classList.add("hidden"));
        }

        function renderQuestion(q) {
            hideAllPopups();
            state.currentQuestion = q;
            answerHint.textContent = "";
            document.getElementById("qTitle").textContent = q.title;
            document.getElementById("qContent").textContent = q.content;
            document.getElementById("qQuestion").textContent = q.question;
            
            const choices = document.getElementById("choices");
            choices.innerHTML = "";
            
            q.choices.forEach((c, i) => {
                const label = document.createElement("label");
                label.className = "choice speak";
                label.tabIndex = 0;
                
                const input = document.createElement("input");
                input.type = "radio";
                input.name = "answer";
                input.value = String(i);
                
                const span = document.createElement("span");
                span.textContent = c;
                
                label.append(input, span);
                choices.appendChild(label);
            });
            pages.question.classList.remove("hidden");
        }

        function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                answerHint.textContent = "請先選擇一個答案喔！";
                return;
            }
            const q = state.currentQuestion;
            const ok = Number(selected.value) === q.answer;
            const status = document.getElementById("resultStatus");
            
            status.textContent = ok ? "🎉 答對了！太棒了" : "❌ 再仔細觀察看看喔！";
            status.className = `status ${ok ? "correct" : "incorrect"}`;
            
            document.getElementById("explain").textContent = q.explain;
            document.getElementById("clueText").textContent = `✔ ${q.clue}`;
            
            if (ok) {
                state.completed.add(q.id);
                updateProgress();
            }
            
            pages.question.classList.add("hidden");
            pages.result.classList.remove("hidden");
        }

        function updateProgress() {
            const n = state.completed.size;
            clueProgressText.textContent = `${n} / ${CASE_DATA.totalClues}`;
            clueProgressBar.style.width = `${n / CASE_DATA.totalClues * 100}%`;
            
            const caseProgress = n === CASE_DATA.totalClues ? 1 : 0;
            caseProgressText.textContent = `${caseProgress} / 1`;
            caseProgressBar.style.width = `${caseProgress * 100}%`;
            
            document.querySelectorAll(".clue-btn[data-id]").forEach(btn => {
                if (state.completed.has(Number(btn.dataset.id))) {
                    btn.classList.remove("active");
                    btn.classList.add("finished");
                    btn.textContent = "✔";
                }
            });
            renderNotebook();
        }

        function renderNotebook() {
            const list = CASE_DATA.questions.filter(q => state.completed.has(q.id));
            notebookList.innerHTML = "";
            if (!list.length) {
                notebookList.innerHTML = '<p class="empty-note">目前筆記本還是空的，快去尋找線索吧！</p>';
                return;
            }
            list.forEach(q => {
                const item = document.createElement("div");
                item.className = "note-item speak";
                item.tabIndex = 0;
                item.textContent = `線索 ${q.id} ： ${q.clue}`;
                notebookList.appendChild(item);
            });
        }

        // --- 事件監聽綁定 ---
        document.querySelector('.clue-btn[data-id="1"]').addEventListener("click", () => renderQuestion(CASE_DATA.questions[0]));
        document.getElementById("submitAnswer").addEventListener("click", submitAnswer);
        
        // 筆記本抽屜控制
        document.getElementById("openNotebook").addEventListener("click", () => {
            drawer.classList.add("open");
            casePanel.classList.remove("open"); // 開筆記本時自動收起手機左側選單
        });
        document.getElementById("closeNotebook").addEventListener("click", () => drawer.classList.remove("open"));
        
        // 手機版左側資訊選單收折控制
        document.getElementById("openMenu").addEventListener("click", () => casePanel.classList.add("open"));
        document.getElementById("closeMenu").addEventListener("click", () => casePanel.classList.remove("open"));

        // 關閉視窗
        document.getElementById("closeQuestion").addEventListener("click", hideAllPopups);
        document.getElementById("closeResult").addEventListener("click", hideAllPopups);
        
        // 初始執行
        renderNotebook();
        updateProgress();
    })();
</script>
</body>
</html>
