<style>
:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#123b61;background:#fff9ed;font-synthesis:none;--blue:#2386bf;--red:#dc5f66;--line:#cfdae4}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{min-height:44px;border:1.5px solid #b9cee1;border-radius:12px;background:#fff;color:#123b61;font-weight:800}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.43}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e5a027;outline-offset:2px}button:active:not(:disabled){transform:translateY(1px)}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.shell{height:100dvh;padding:10px 16px 14px;display:flex;flex-direction:column;gap:12px;max-width:1920px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px;flex-shrink:0}h1{font-size:clamp(21px,2.3vw,35px);margin:0;white-space:nowrap;letter-spacing:.02em}.brand{font-family:"Comic Sans MS",system-ui,sans-serif}.top-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.top-tools button,.top-tools select{padding:0 13px}.voice-toggle{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;background:white;border:1.5px solid #b9cee1;border-radius:12px;padding:0 12px;font-weight:800;cursor:pointer;white-space:nowrap}.voice-toggle input{width:18px;height:18px;accent-color:#236ca4;margin:0}.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.07fr) minmax(0,1fr);gap:14px}.side{min-height:0;display:flex;flex-direction:column;gap:10px;--team:var(--blue);--pale:#e8f5ff}.side.red{--team:var(--red);--pale:#ffedef}.team{flex:0 0 auto;position:relative;padding:9px 13px 7px;border:1.5px solid color-mix(in srgb,var(--team) 35%,white);border-radius:20px;background:var(--pale);overflow:hidden}.score{color:var }.keys .delete{font-size:clamp(22px,2.5vw,31px)}.feedback{min-height:25px;line-height:25px;text-align:center;font-size:17px;font-weight:900;color:var(--team)}.feedback.correct{color:#228254;font-size:23px}.feedback.wrong{color:#b43c4f;font-size:23px}.center{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:18px;padding:8px 5px}.clock-area{text-align:center}.timer{font-size:clamp(44px,5.5vw,83px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:.02em}.mode-picker{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px}.mode-picker select{padding:0 10px;min-height:40px;font-size:14px}.ticket{position:relative;background:#fffdf6;border:2px solid #e7be61;border-radius:20px;box-shadow:0 5px 0 #eddfbd;padding:0 18px 14px;overflow:hidden;text-align:center}.ticket::before,.ticket::after{content:"";position:absolute;top:48px;width:22px;height:22px;border:2px solid #e7be61;border-radius:50%;background:#fff9ed;z-index:1}.ticket::before{left:-13px}.ticket::after{right:-13px}.ticket-top{height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px dashed #e4cca0;gap:8px}.ticket-top span{font-size:14px;font-weight:800;color:#7c704d}.voice{width:42px;min-height:38px;border:0;background:#fff1cc;font-size:21px}.prompt{min-height:140px;display:flex;justify-content:center;align-items:center;padding:14px 0}.prompt h2{font-family:"Comic Sans MS",system-ui,sans-serif;font-size:clamp(27px,3.2vw,48px);line-height:1.3;margin:0;overflow-wrap:anywhere}.status{min-height:48px;line-height:1.4;text-align:center;font-size:clamp(16px,1.6vw,22px);font-weight:800;color:#6e7b83;display:flex;justify-content:center;align-items:center}.status.counting{color:#b76a1c}.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.toolbar button{padding:0 15px;min-height:49px;font-size:17px}.primary{background:#174f73;border-color:#174f73;color:#fff}.is-paused .answer,.is-paused .prompt h2{opacity:.4}.settings{position:absolute;z-index:8;right:16px;top:72px;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 90px);overflow:auto;background:white;padding:20px;border:1.5px solid #b9cee1;border-radius:18px;box-shadow:0 10px 40px #123b6125}.fields{display:flex;flex-direction:column;gap:20px}.fields label{display:flex;align-items:center;gap:10px;font-weight:700}.fields input[type=checkbox]{width:20px;height:20px;accent-color:#236ca4}.fields input[type=range]{flex:1;min-width:60px}.fields output{min-width:37px;font-variant-numeric:tabular-nums}.overlay{position:fixed;inset:0;z-index:10;background:#173b6470;display:grid;place-items:center;padding:18px}.modal{position:relative;width:min(780px,100%);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;overflow:hidden;background:#fffdf5;border:3px solid white;border-radius:24px;box-shadow:0 15px 80px #123b6130;padding:22px 24px 16px;text-align:center}.close{position:absolute;right:12px;top:10px;min-width:44px;font-size:28px;border:0;background:transparent;line-height:1}.modal h2{font-size:clamp(25px,3vw,38px);margin:2px 42px 0}.end-reason{font-size:14px;color:#71818a;margin:5px 0}.results{display:flex;justify-content:center;gap:65px;margin:10px 0 15px;font-size:38px;font-weight:900}.results small{font-size:18px}.blue{color:var(--blue)}.red{color:var(--red)}.review{display:flex;flex-direction:column;min-height:0;flex:1;text-align:center;border-top:1px solid #dce4e6}.review h3{font-size:14px;color:#7b868c;font-weight:700;margin:12px 0 8px}.records{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 5px 3px}.record{display:grid;grid-template-columns:60px minmax(0,1fr) 60px;align-items:center;gap:10px;background:white;border:1px solid #dce5e9;border-radius:15px;padding:12px;margin:0 0 9px}.mark{font-family:Arial,sans-serif;font-size:36px;font-weight:800;text-align:center}.record-center{min-width:0;text-align:center}.record-english{border:0;background:transparent;min-height:36px;padding:0;font-family:"Comic Sans MS",system-ui,sans-serif;font-size:clamp(23px,2.7vw,33px);line-height:1.3;overflow-wrap:anywhere}.record-time{font-size:30px;font-weight:800;line-height:1.4;font-variant-numeric:tabular-nums}.modal .toolbar{margin-top:12px;flex-shrink:0}.modal .toolbar button{min-height:44px}.hidden{display:none!important}@keyframes board{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}@keyframes depart{0%,15%{transform:translateX(0)}65%{transform:translateX(135%);opacity:1}66%{transform:translateX(-135%);opacity:0}100%{transform:translateX(0);opacity:1}}
@media(max-height:700px) and (min-width:761px){.shell{padding:7px 12px 10px;gap:8px}header{min-height:44px}h1{font-size:25px}.team{padding:6px 10px}.score{font-size:32px}.rail{height:81px}.car{height:82px}.seats{height:60px}.animal{height:60px}.animal svg{height:64px}.empty{height:38px}.car-body{height:28px}.pad{gap:6px;padding:9px}.answer{font-size:35px;padding:5px}.keys{gap:6px}.feedback{min-height:22px;line-height:22px}.center{gap:10px}.timer{font-size:57px}.prompt{min-height:100px}.ticket-top{height:49px}.ticket::before,.ticket::after{top:38px}.status{min-height:36px}.toolbar button{min-height:44px;font-size:15px;padding:0 11px}}
@media(min-width:761px) and (max-height:550px){.shell{height:auto;min-height:550px}.board{min-height:475px}}
@media(max-width:1050px) and (min-width:761px){h1{font-size:23px}.top-tools{gap:5px}.top-tools button,.top-tools select,.voice-toggle{padding:0 8px;font-size:13px}.board{gap:9px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}.prompt h2{font-size:30px}.toolbar{gap:5px}.toolbar button{font-size:14px;padding:0 9px}}
@media(max-width:760px){.shell{height:auto;min-height:100dvh;padding:9px;gap:10px}header{flex-wrap:wrap;gap:9px}h1{font-size:24px}.top-tools{width:100%;justify-content:space-between;gap:5px}.top-tools select,.top-tools button,.voice-toggle{font-size:13px;padding:0 9px;min-height:42px}.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.center{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px;padding:0;align-items:center}.clock-area{grid-column:1;grid-row:1}.timer{font-size:44px}.mode-picker{margin-top:5px;gap:4px}.mode-picker select{font-size:11px;min-height:34px;padding:0 3px;max-width:100%}.ticket{grid-column:2;grid-row:1;padding:0 12px 8px;border-radius:15px}.ticket-top{height:38px}.ticket-top span{font-size:12px}.voice{min-height:30px;width:34px;font-size:18px}.ticket::before,.ticket::after{top:27px;width:18px;height:18px}.ticket::before{left:-11px}.ticket::after{right:-11px}.prompt{min-height:90px;padding:9px 0}.prompt h2{font-size:26px}.center-controls{grid-column:1 / -1}.status{min-height:25px;font-size:15px}.toolbar{gap:7px;margin-top:4px}.toolbar button{min-height:42px;font-size:15px;padding:0 17px}.side{gap:8px}.side.blue{grid-column:1;grid-row:2}.side.red{grid-column:2;grid-row:2}.team{padding:7px 6px;border-radius:15px}.score{font-size:29px}.rail{height:74px}.car{height:76px;width:100%;left:0}.seats{top:0;height:56px;gap:1px}.animal{height:56px}.animal svg{height:58px}.empty{height:33px;margin:0 1px}.car-body{height:26px;bottom:12px;border-top-width:4px}.wheel{width:20px;height:20px;border-width:5px}.pad{padding:8px;gap:6px;border-radius:15px}.answer{font-size:31px;letter-spacing:.02em;padding:6px 0}.keys{gap:6px;grid-template-rows:repeat(4,48px)}.keys button{font-size:26px}.keys .submit{font-size:16px}.keys .delete{font-size:24px}.feedback{font-size:14px;min-height:24px;line-height:24px}.settings{top:112px;right:9px;width:calc(100vw - 18px);max-height:calc(100dvh - 126px)}.overlay{padding:9px}.modal{max-height:calc(100dvh - 18px);padding:17px 10px 12px;border-radius:19px}.modal h2{font-size:27px}.results{font-size:32px;margin:8px 0 12px;gap:55px}.record{grid-template-columns:34px minmax(0,1fr) 34px;padding:10px 5px;gap:4px}.mark{font-size:27px}.record-english{font-size:23px}.record-time{font-size:27px}.close{right:6px;top:5px}}

<body>
<main class="shell">
 <header><h1><span class="brand">E-City</span>｜異想時光列車</h1><nav class="top-tools" aria-label="遊戲工具列"><select id="level" aria-label="題目等級"><option>L1 整點</option></select><label class="voice-toggle"><input type="checkbox" id="tts" checked><span id="ttsState">朗讀 開</span></label><button id="settingsToggle" aria-expanded="false" aria-controls="settings">⚙ 設定</button></nav></header>
 <section class="settings" id="settings" hidden aria-label="教師設定"><div class="fields"><label><input type="checkbox" id="autoVoice" checked>出題自動朗讀</label><label>語速 <input id="rate" type="range" min="0.5" max="1.2" step="0.01" value="0.82"><output id="rateValue">0.82</output></label><label><input type="checkbox" id="sound" checked>遊戲音效</label></div></section>
 <div class="board" id="board">
 <section class="side blue" aria-label="藍隊"><div class="team" id="train0"></div><div class="pad" id="pad0"></div></section>
 <section class="center" aria-label="題目與遊戲控制"><div class="clock-area"><div class="timer" id="timer" role="timer" aria-label="剩餘時間">01:00</div><div class="mode-picker"><select id="mode" aria-label="競賽模式"><option value="5">1 分鐘 · 5 人</option><option value="8">2 分鐘 · 8 人</option><option value="10">3 分鐘 · 10 人</option><option value="0">計時 · 不限人數</option></select><select id="duration" aria-label="不限人數賽時間" hidden><option value="60">1 分鐘</option><option value="120">2 分鐘</option><option value="180">3 分鐘</option></select></div><span id="target" class="sr-only">目標 5 人</span></div>
 <div class="ticket"><div class="ticket-top"><span id="questionNo">準備上車</span><button class="voice" id="speak" aria-label="朗讀英文題目" disabled>♫</button></div><div class="prompt"><h2 id="prompt" lang="en">Ready to go!</h2></div></div>
 <div class="center-controls"><div class="status" id="status" role="status" aria-live="polite"></div><div class="toolbar"><button class="primary" id="start">▶ 開始</button><button class="primary" id="pause" hidden>Ⅱ 暫停</button><button id="restart" hidden>↻ 重新開始</button></div></div>
 </section>
 <section class="side red" aria-label="紅隊"><div class="team" id="train1"></div><div class="pad" id="pad1"></div></section>
 </div>
</main>
<div class="overlay" id="endOverlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="endTitle"><button class="close" id="closeEnd" aria-label="關閉結算">×</button><h2 id="endTitle"></h2><p class="end-reason" id="endReason"></p><div class="results" id="endScores"></div><section class="review" aria-labelledby="reviewTitle"><h3 id="reviewTitle">錯題紀錄</h3><div class="records" id="records"></div></section><div class="toolbar"><button class="primary" id="again">↻ 再玩一次</button></div></section></div>

<script>
'use strict';
const $=id=>document.getElementById(id), names=['藍隊','紅隊'];
const words=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const animals=[['#e6b383','round'],['#d5a37f','bear'],['#f4b88d','cat'],['#becbd4','rabbit'],['#e7d7af','bear'],['#eaa17e','fox'],['#bdd1b5','round'],['#cab9d9','cat']];
function animalSVG(i){const [color,kind]=animals[i];let ears=kind==='rabbit'?'<ellipse cx="22" cy="15" rx="7" ry="19"/><ellipse cx="44" cy="15" rx="7" ry="19"/>':kind==='cat'||kind==='fox'?'<path d="M10 36 10 9 30 28M36 28 56 9 56 36Z"/>':'<circle cx="15" cy="26" r="11"/><circle cx="51" cy="26" r="11"/>';return `<svg viewBox="0 0 66 85" aria-hidden="true"><g fill="${color}" stroke="#614f49" stroke-width="1.5">${ears}<ellipse cx="33" cy="76" rx="23" ry="22"/><ellipse cx="33" cy="43" rx="26" ry="25"/></g><ellipse cx="33" cy="53" rx="13" ry="10" fill="#fff4dd"/><g fill="#403d3b"><circle cx="23" cy="41" r="2.7"/><circle cx="43" cy="41" r="2.7"/><path d="M29 49Q33 46 37 49L33 53Z"/></g><path d="M28 56Q33 60 38 56" fill="none" stroke="#614f49" stroke-width="1.8"/><g fill="#e48e88" opacity=".6"><ellipse cx="16" cy="51" rx="5" ry="3"/><ellipse cx="50" cy="51" rx="5" ry="3"/></g></svg>`}

names.forEach((name,i)=>{
 $('train'+i).innerHTML='<div class="score" aria-label="'+name+'總人數"><span id="score'+i+'">0</span><small> 人</small></div><div class="rail"><div class="car" id="car'+i+'"><div class="seats" id="seats'+i+'"></div><div class="car-body"></div><span class="wheel a"></span><span class="wheel b"></span></div></div>';
 $('pad'+i).innerHTML='<div class="answer" id="answer'+i+'" aria-label="'+name+'輸入時間">__ : __</div><div class="keys">'+['1','2','3','4','5','6','7','8','9','del','0','send'].map(k=>'<button disabled data-team="'+i+'" data-key="'+k+'" class="'+(k==='send'?'submit':k==='del'?'delete':'')+'" aria-label="'+name+(k==='del'?'刪除':k==='send'?'送出':k)+'">'+(k==='del'?'⌫':k==='send'?'送出':k)+'</button>').join('')+'</div><div class="feedback" id="feedback'+i+'" aria-live="polite"></div><span class="sr-only" id="lock'+i+'"></span>';
});

let state='idle',phase='waiting',teams=[],remaining=60000,grace=null,reveal=0,deck=[],question=null,number=0,history=[],lastTick=performance.now(),lastHour=null,config={limit:5,duration:60},audioContext;
function freshTeam(){return{input:'',submitted:false,score:0,seats:[],depart:0}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function validTime(v){return /^\d{4}$/.test(v)&&Number(v.slice(0,2))<=12&&Number(v.slice(2))<=59}
function formatInput(v){const s=v.padEnd(4,'_');return s.slice(0,2)+' : '+s.slice(2)}
function timeText(v){return v?v.slice(0,2)+':'+v.slice(2):'未送出'}
function renderSeats(i){$('seats'+i).innerHTML=Array.from({length:5},(_,j)=>teams[i].seats[j]===undefined?'<div class="empty"></div>':`<div class="animal">${animalSVG(teams[i].seats[j])}</div>`).join('');$('car'+i).classList.toggle('depart',teams[i].depart>0)}
function renderInputs(){teams.forEach((t,i)=>{$('answer'+i).textContent=formatInput(t.input);$('lock'+i).textContent=t.submitted?'已送出':'';if(phase==='waiting'){$('feedback'+i).textContent=t.submitted?'已送出':'';$('feedback'+i).className='feedback'}document.querySelectorAll('[data-team="'+i+'"]').forEach(b=>{b.disabled=state!=='running'||phase==='reveal'||t.submitted||(b.dataset.key==='send'&&!validTime(t.input))})})}
function renderClock(){$('timer').textContent=String(Math.floor(Math.ceil(remaining/1000)/60)).padStart(2,'0')+':'+String(Math.ceil(remaining/1000)%60).padStart(2,'0')}
function controls(){const active=state==='running'||state==='paused';$('start').hidden=active;$('start').disabled=false;$('pause').hidden=!active;$('pause').disabled=false;$('pause').textContent=state==='paused'?'▶ 繼續':'Ⅱ 暫停';$('restart').hidden=state==='idle';$('restart').disabled=false;$('mode').disabled=active;$('level').disabled=active;$('duration').hidden=$('mode').value!=='0';$('duration').disabled=active;$('speak').disabled=!question||!$('tts').checked||state==='paused';$('ttsState').textContent=$('tts').checked?'朗讀 開':'朗讀 關';$('board').classList.toggle('is-paused',state==='paused')}
function speak(text=question?.text){if(!text||!$('tts').checked)return;if(!('speechSynthesis'in window)){$('status').textContent='此瀏覽器不支援英文朗讀，仍可看題作答。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('rate').value);const voice=speechSynthesis.getVoices().find(v=>v.lang==='en-US')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
function beep(correct=true){if(!$('sound').checked)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.setValueAtTime(correct?660:210,audioContext.currentTime);o.frequency.linearRampToValueAtTime(correct?880:150,audioContext.currentTime+.12);g.gain.setValueAtTime(.07,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.start();o.stop(audioContext.currentTime+.2)}catch{}}
function nextQuestion(){if(!deck.length){deck=shuffle(Array.from({length:12},(_,i)=>i+1));if(deck[deck.length-1]===lastHour)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]]}const h=deck.pop();lastHour=h;question={text:words[h]+" o'clock",answer:String(h).padStart(2,'0')+'00'};number++;phase='waiting';grace=null;teams.forEach((t,i)=>{t.input='';t.submitted=false;$('feedback'+i).textContent='';$('feedback'+i).className='feedback'});$('prompt').textContent=question.text;$('questionNo').textContent='第 '+number+' 題';$('status').textContent='' ;$('status').className='status';renderInputs();controls();if($('autoVoice').checked)speak()}
function start(){config={limit:Number($('mode').value),duration:Number($('duration').value)};teams=[freshTeam(),freshTeam()];remaining=config.duration*1000;history=[];deck=[];number=0;lastHour=null;state='running';$('endOverlay').hidden=true;$('settings').hidden=true;$('settingsToggle').setAttribute('aria-expanded','false');teams.forEach((t,i)=>{$('score'+i).textContent='0';renderSeats(i);$('car'+i).style.animationPlayState='running'});$('target').textContent=config.limit?'目標 '+config.limit+' 人':'不限名額';lastTick=performance.now();renderClock();nextQuestion();$('pause').focus()}
function syncTime(){const now=performance.now(),dt=now-lastTick;lastTick=now;if(state!=='running')return;const elapsed=Math.min(dt,remaining);remaining=Math.max(0,remaining-dt);teams.forEach((t,i)=>{if(t.depart>0){t.depart-=elapsed;if(t.depart<=0){t.depart=0;t.seats=[];renderSeats(i)}}});if(phase==='waiting'&&grace!==null){grace-=elapsed;if(grace<=0)settle();else{$('status').textContent='搶票倒數 '+(grace/1000).toFixed(1)+' 秒';$('status').className='status counting'}}else if(phase==='reveal'){reveal-=elapsed;if(reveal<=0&&remaining>0)nextQuestion()}if(remaining<=0&&state==='running'){if(phase==='waiting'&&teams.some(t=>t.submitted))settle();if(state==='running')finish('時間到')}renderClock()}
function onKey(i,key){syncTime();if(state!=='running'||phase!=='waiting'||teams[i].submitted)return;const t=teams[i];if(/^\d$/.test(key)&&t.input.length<4)t.input+=key;else if(key==='del')t.input=t.input.slice(0,-1);else if(key==='send'&&validTime(t.input)){t.submitted=true;if(grace===null)grace=1000;$('status').textContent='搶票倒數 '+(grace/1000).toFixed(1)+' 秒';$('status').className='status counting'}renderInputs()}
function settle(){if(phase!=='waiting')return;phase='reveal';grace=null;const results=teams.map(t=>({input:t.submitted?t.input:null,correct:t.submitted&&t.input===question.answer}));history.push({number,text:question.text,answer:question.answer,results});results.forEach((r,i)=>{const t=teams[i];if(r.correct){t.score++;const pool=animals.map((_,j)=>j).filter(j=>!t.seats.includes(j));t.seats.push(pool[Math.floor(Math.random()*pool.length)]);if(t.seats.length===5){t.depart=900}$('score'+i).textContent=t.score;renderSeats(i)}$('feedback'+i).className='feedback '+(r.correct?'correct':'wrong');$('feedback'+i).textContent=r.correct?'O':r.input?'X':'—'});beep(results.some(r=>r.correct));$('status').className='status';$('status').textContent='正確時間 '+timeText(question.answer);reveal=1800;renderInputs();if(config.limit&&teams.some(t=>t.score>=config.limit))finish('額滿達標')}
function finish(reason){state='ended';speechSynthesisSafeCancel();const [a,b]=teams.map(t=>t.score);$('endTitle').textContent=a===b?'平手！':(a>b?names[0]:names[1])+'獲勝！';$('endReason').textContent=reason==='時間到'?'時間到':'額滿達標';$('endScores').innerHTML=teams.map((t,i)=>'<span class="final-score '+(i?'red':'blue')+'" aria-label="'+names[i]+' '+t.score+' 人">'+t.score+'<small> 人</small></span>').join('');const wrong=history.filter(r=>r.results.some(a=>!a.correct));$('reviewTitle').textContent='錯題紀錄 · '+wrong.length+' 題';$('records').replaceChildren();wrong.forEach(r=>{const div=document.createElement('div');div.className='record';const mark=(result,i)=>{const node=document.createElement('span');node.className='mark '+(i?'red':'blue');node.textContent=result.correct?'O':result.input?'X':'—';node.setAttribute('aria-label',names[i]+(result.correct?'答對':result.input?'答錯':'未送出'));node.title=names[i]+'：'+timeText(result.input);return node};const center=document.createElement('div');center.className='record-center';const btn=document.createElement('button');btn.className='record-english';btn.textContent=r.text;btn.lang='en';btn.setAttribute('aria-label','朗讀 '+r.text);btn.onclick=()=>speak(r.text);const time=document.createElement('div');time.className='record-time';time.textContent=timeText(r.answer);center.append(btn,time);div.append(mark(r.results[0],0),center,mark(r.results[1],1));$('records').append(div)});if(!wrong.length)$('records').textContent='本局沒有錯題。';$('endOverlay').hidden=false;renderInputs();controls();$('closeEnd').focus()}
function speechSynthesisSafeCancel(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function pause(){syncTime();if(state!=='running')return;state='paused';speechSynthesisSafeCancel();teams.forEach((t,i)=>$('car'+i).style.animationPlayState='paused');$('status').textContent='已暫停';renderInputs();controls();$('pause').focus()}
$('board').addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-key]');if(b&&!b.disabled){e.preventDefault();onKey(Number(b.dataset.team),b.dataset.key)}});
$('start').onclick=start;$('restart').onclick=start;$('again').onclick=start;$('pause').onclick=()=>{if(state!=='paused'){pause();return}state='running';lastTick=performance.now();teams.forEach((t,i)=>$('car'+i).style.animationPlayState='running');$('status').textContent=phase==='reveal'?'正確時間 '+timeText(question.answer):grace!==null?'搶票倒數 '+(grace/1000).toFixed(1)+' 秒':'';renderInputs();controls()};
$('closeEnd').onclick=()=>{$('endOverlay').hidden=true;speechSynthesisSafeCancel();$('start').focus()};
$('settingsToggle').onclick=()=>{$('settings').hidden=!$('settings').hidden;$('settingsToggle').setAttribute('aria-expanded',String(!$('settings').hidden))};
$('mode').onchange=()=>{const v=$('mode').value;if(v!=='0')$('duration').value=({5:'60',8:'120',10:'180'})[v];controls();if(state==='idle'||state==='ended'){remaining=Number($('duration').value)*1000;renderClock();$('target').textContent=v==='0'?'不限名額':'目標 '+v+' 人'}};
$('duration').onchange=()=>{remaining=Number($('duration').value)*1000;renderClock()};$('rate').oninput=()=>{$('rateValue').textContent=Number($('rate').value).toFixed(2)};$('tts').onchange=()=>{if(!$('tts').checked)speechSynthesisSafeCancel();controls()};$('speak').onclick=()=>speak();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});
teams=[freshTeam(),freshTeam()];teams.forEach((_,i)=>renderSeats(i));renderInputs();controls();setInterval(syncTime,40);

$('endOverlay').addEventListener('keydown',e=>{if(e.key==='Escape'){$('closeEnd').click();return}if(e.key==='Tab'){const nodes=[...$('endOverlay').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes[nodes.length-1].focus()}else if(!e.shiftKey&&document.activeElement===nodes[nodes.length-1]){e.preventDefault();nodes[0].focus()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settings').hidden){$('settings').hidden=true;$('settingsToggle').setAttribute('aria-expanded','false');$('settingsToggle').focus()}});
</script>
