/* 手機仍維持題目置上、兩側鍵盤並排，結算時恢復三欄紀錄 */
@media(max-width:780px){html,body{overflow:auto}.wrap{height:auto;min-height:100dvh;overflow:visible;padding:8px}.top{flex-wrap:wrap;gap:5px}.brand h1{font-size:22px}.actions{width:100%;justify-content:space-between;gap:4px}.actions>.field select{width:128px;max-width:128px}.actions .btn{padding:7px 9px}.game{min-height:0;display:block}.arena,.arena.idle,.results .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;gap:8px}.center,.arena.idle .center,.results .center{grid-column:1/-1;grid-row:1;min-height:0;padding:11px;gap:8px}.side.blue,.arena.idle .side.blue{grid-column:1;grid-row:2}.side.red,.arena.idle .side.red{grid-column:2;grid-row:2}.stop{height:110px}.keypad-section{min-height:330px}.padgrid{grid-template-rows:repeat(4,61px)}.num{font-size:26px}.center .prompt{min-height:50px}.center .english{font-size:clamp(23px,5vw,32px)}.arena.idle .center .prompt{min-height:0;display:none!important}.results .side.blue{grid-column:1;grid-row:1}.results .side.red{grid-column:2;grid-row:1}.results .center{grid-column:1/-1;grid-row:2}.results .summary{grid-column:1/-1;grid-row:3}.results .arena{grid-template-rows:auto auto auto}.results .bus{height:105px}.results .buslabel{font-size:23px}.record-head,.record{grid-template-columns:32px minmax(0,1fr) 32px}.record .mid{flex-wrap:wrap;gap:5px}.record .mid strong,.record .mid span{font-size:15px}.record{min-height:48px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand"><span class="brandmark">🚌</span><div><h1>E-City｜異想時光巴士</h1></div></div>
 <div class="actions"><label class="field">關卡<select id="level"><option value="l1">L1 整點</option><option value="l2">L2 半點</option><option value="l3">L3 直接讀法</option><option value="l4">L4 past</option><option value="l5">L5 to</option><option value="l6">L6 quarter</option><option value="mix">MIX 全部混合</option></select></label><button class="btn warn" id="posterBtn">📖 提示</button><button class="btn" id="howBtn">玩法</button><button class="btn" id="settingsBtn">⚙</button></div>
</header>
<main class="game" id="game">
<section class="quickbar" id="quickbar">
 
 

</section>
<section class="settings" id="settings" hidden>
 <label class="field">語速<select id="rate"><option value="0.7">慢 0.70</option><option value="0.82" selected>0.82</option><option value="1">一般 1.00</option></select></label>
 <label class="switch"><input type="checkbox" id="autoSpeak"> 自動朗讀</label>
 <label class="switch"><input type="checkbox" id="soundEffects" checked> 遊戲音效</label>
</section>

<div class="arena idle" id="arena">
 <section class="side blue" id="side-blue" aria-label="藍幹線候車區"><div class="route"><div class="teamname">🔵 藍幹線</div></div><div class="stop"><div class="sign"><div class="head">BUS STOP</div><div class="num" id="stop-blue">0 / 5</div></div><div class="queue" id="queue-blue"></div><div class="bus" id="bus-blue"><div class="crown">👑</div><div class="busbody"><div class="window"></div><div class="buslabel" id="buslabel-blue">BLUE 0</div></div><div class="wheel w1"></div><div class="wheel w2"></div></div></div><div class="keypad-section"><div class="screen" id="screen-blue" aria-live="polite">__ : __</div><div class="padgrid" id="pad-blue"></div><div class="sidefeedback" id="feedback-blue"></div></div></section>
 <section class="center"><div class="sub" id="phase"></div><div class="timer" id="timer">01:00</div><div class="center-mode" id="centerMode"><label class="field">競賽<select id="mode"><option value="5">1 分鐘／5 人</option><option value="8">2 分鐘／8 人</option><option value="10">3 分鐘／10 人</option><option value="unlimited">30 秒／不限人數</option></select></label></div><button class="btn primary center-start" id="start">▶ 開始遊戲</button><div class="prompt"><div class="english" id="question">Ready to go?</div><button class="speak" id="speak" aria-label="英文朗讀" title="重播英文">🎵</button></div><div class="notice" id="notice"></div><div class="scoreline" id="scoreline" hidden>0 : 0</div></section>
 <section class="side red" id="side-red" aria-label="紅幹線候車區"><div class="route"><div class="teamname">🔴 紅幹線</div></div><div class="stop"><div class="sign"><div class="head">BUS STOP</div><div class="num" id="stop-red">0 / 5</div></div><div class="queue" id="queue-red"></div><div class="bus" id="bus-red"><div class="crown">👑</div><div class="busbody"><div class="window"></div><div class="buslabel" id="buslabel-red">RED 0</div></div><div class="wheel w1"></div><div class="wheel w2"></div></div></div><div class="keypad-section"><div class="screen" id="screen-red" aria-live="polite">__ : __</div><div class="padgrid" id="pad-red"></div><div class="sidefeedback" id="feedback-red"></div></div></section>
 <section class="summary" id="summary"><div class="record-head"><div style="text-align:center;color:#2387b7">●</div><div style="text-align:center">英文時間　／　答案</div><div style="text-align:center;color:#d85d63">●</div></div><div class="record-list" id="records"></div><div class="foot"><button class="btn primary" id="again">↻ 再試一次</button></div></section>
</div>

</main>
</div>
<div class="modal-back" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="end"><button class="btn" id="closeModal">✕ 關閉</button></div><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const animals=['🐱','🐰','🐻','🐼','🦊','🐸','🐨','🐹','🐯','🐮','🐶','🐷','🐵','🐧','🐥','🦁','🐻‍❄️'];
const numWords=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const tens=['','','twenty','thirty','forty','fifty'];
function word(n){if(n<20)return numWords[n];return tens[Math.floor(n/10)]+(n%10?'-'+numWords[n%10]:'')}
function pad(n){return String(n).padStart(2,'0')}
function ans(h,m){return pad(h)+pad(m)}
function english(h,m,kind){if(kind==='oclock')return word(h)+" o'clock";if(kind==='half')return 'half past '+word(h);if(kind==='quarter')return 'a quarter '+(m===15?'past '+word(h):'to '+word(h===12?1:h+1));if(kind==='past')return word(m)+' past '+word(h);if(kind==='to')return word(60-m)+' to '+word(h===12?1:h+1);return word(h)+(m===0?" o'clock":m<10?' oh '+word(m):' '+word(m))}
function makePool(level){if(level==='mix'){const levels=['l1','l2','l3','l4','l5','l6'];let all=[];for(const l of levels){let part=shuffle(makePool(l));all.push(...part.slice(0,12));}return shuffle(all)}let list=[];let add=(h,m,k)=>list.push({en:english(h,m,k),value:ans(h,m),kind:k});for(let h=1;h<=12;h++){
 if(level==='l1'||level==='mix')add(h,0,'oclock');
 if(level==='l2'||level==='mix'){add(h,30,'half');add(h,30,'direct')}
 if(level==='l3'||level==='mix')for(let m of [5,8,10,12,15,18,20,25,30,35,40,45,50,55,58])add(h,m,'direct');
 if(level==='l4'||level==='mix')for(let m of [5,10,15,20,25,30])add(h,m,'past');
 if(level==='l5'||level==='mix')for(let m of [35,40,45,50,55,58])add(h,m,'to');
 if(level==='l6'||level==='mix'){add(h,15,'quarter');add(h,45,'quarter');add(h,30,'half')}
}return list}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const s={phase:'idle',players:{blue:{input:'',submitted:false,answer:null,score:0,queue:[]},red:{input:'',submitted:false,answer:null,score:0,queue:[]}},question:null,pool:[],past:[],remaining:60,target:5,firstDelay:null,revealDelay:0,round:0,lastTick:0};
let ticker=null;
let audioCtx=null;
function unlockAudio(){if(!$('soundEffects').checked)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,delay,duration,volume=.07,type='sine'){if(!$('soundEffects').checked)return;try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function successBell(){tone(784,0,.12,.055);tone(1175,.13,.23,.06)}
function busArrival(){tone(330,0,.13,.045,'triangle');tone(392,.16,.13,.045,'triangle');tone(523,.32,.3,.05,'triangle')}

function fmt(ms){let sec=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(sec/60))+':'+pad(sec%60)}
function gameConfig(){let m=$('mode').value;return m==='5'?{seconds:60,target:5}:m==='8'?{seconds:120,target:8}:m==='10'?{seconds:180,target:10}:{seconds:30,target:Infinity}}
function drawPad(color){const holder=$('pad-'+color);holder.replaceChildren();for(let key of ['1','2','3','4','5','6','7','8','9','刪除','0','送出']){const btn=document.createElement('button');btn.className='num '+(key==='送出'?'submit':key==='刪除'?'del':'');btn.textContent=key;btn.dataset.key=key;btn.addEventListener('click',()=>press(color,key));holder.appendChild(btn)}}
function press(color,key){unlockAudio();if(s.phase!=='playing')return;const p=s.players[color];if(p.submitted)return;
if(key==='刪除')p.input=p.input.slice(0,-1);else if(key==='送出'){if(p.input.length!==4||!validTime(p.input))return;p.submitted=true;p.answer=p.input;if(s.firstDelay===null)s.firstDelay=1000;}
else if(p.input.length<4)p.input+=key;renderInput(color);}
function validTime(code){let h=Number(code.slice(0,2)),m=Number(code.slice(2));return h>=1&&h<=12&&m<=59}
function renderInput(color){const p=s.players[color],display=(p.input+'____').slice(0,4);$('screen-'+color).textContent=display.slice(0,2)+' : '+display.slice(2);Array.from($('pad-'+color).children).forEach(b=>{let key=b.dataset.key;b.disabled=s.phase!=='playing'||p.submitted||(key==='送出'&&(p.input.length!==4||!validTime(p.input)))||(key!=='送出'&&key!=='刪除'&&p.input.length===4)});$('feedback-'+color).textContent=p.submitted?'✓ 已送出':'';}
function renderQueues(){for(let color of ['blue','red']){const p=s.players[color];let q=$('queue-'+color);q.replaceChildren();let show=p.queue.slice(-7);for(let a of show){let el=document.createElement('span');el.className='animal';el.textContent=a;q.appendChild(el)}if(p.queue.length>7){let el=document.createElement('span');el.className='more';el.textContent='+'+(p.queue.length-7);q.appendChild(el)}$('stop-'+color).textContent=p.score+(Number.isFinite(s.target)?' / '+s.target:'');$('buslabel-'+color).textContent=p.score+' 人';}}
function setQuestion(){if(!s.pool.length)s.pool=shuffle(makePool($('level').value));s.question=s.pool.pop();s.round++;s.phase='playing';for(let color of ['blue','red']){let p=s.players[color];p.input='';p.submitted=false;p.answer=null;renderInput(color)}s.firstDelay=null;s.revealDelay=0;s.phase='playing';$('phase').textContent='';$('question').textContent=s.question.en;$('notice').textContent='';$('scoreline').hidden=true;if($('autoSpeak').checked)say();}
function say(){if(!('speechSynthesis' in window)||!s.question)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.question.en);u.lang='en-US';u.rate=Number($('rate').value);u.pitch=1;const voices=speechSynthesis.getVoices();const en=voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u)}catch(e){$('notice').textContent='此瀏覽器無法播放語音，仍可閱讀英文題目。'}}
function settle(){if(s.phase!=='playing')return;s.phase='reveal';const item={en:s.question.en,value:s.question.value};for(let color of ['blue','red']){let p=s.players[color];item[color]=p.submitted?(p.answer===s.question.value?'correct':'wrong'):'none';if(item[color]==='correct'){successBell();p.score++;p.queue.push(animals[Math.floor(Math.random()*animals.length)]);$('feedback-'+color).textContent='✓';$('feedback-'+color).style.color='#14856e'}else{$('feedback-'+color).textContent=item[color]==='wrong'?'✕':'—';$('feedback-'+color).style.color='#bd5057'}renderInput(color)}s.past.push(item);renderQueues();$('notice').textContent=s.question.value.slice(0,2)+':'+s.question.value.slice(2);s.revealDelay=850;}
function finish(){if(s.phase==='done')return;busArrival();if(s.phase==='playing')settle();s.phase='done';$('game').classList.add('results');$('start').hidden=true;clearInterval(ticker);ticker=null;try{speechSynthesis.cancel()}catch(e){}
let b=s.players.blue.score,r=s.players.red.score;let why=s.remaining<=0?'時間到':'人數達標';$('phase').textContent=why;$('question').textContent='';$('scoreline').textContent=b+' : '+r;$('scoreline').hidden=false;for(let color of ['blue','red']){$('side-'+color).classList.add('buson');$('bus-'+color).classList.add('arrived')}if(b!==r)$('side-'+(b>r?'blue':'red')).classList.add('winner');renderRecords();}
function renderRecords(){let holder=$('records');holder.replaceChildren();for(let i=0;i<s.past.length;i++){const r=s.past[i];const row=document.createElement('div');row.className='record';const node=(cls,txt)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;return d};const symbol=v=>v==='correct'?'○':v==='wrong'?'×':'—';const css=v=>v==='correct'?'ok':v==='wrong'?'bad':'none';row.append(node('res '+css(r.blue),symbol(r.blue)));const mid=document.createElement('div');mid.className='mid';let strong=document.createElement('strong');strong.textContent=r.en;let time=document.createElement('span');time.textContent=r.value.slice(0,2)+':'+r.value.slice(2);mid.append(strong,time);row.append(mid,node('res '+css(r.red),symbol(r.red)));holder.appendChild(row)}}
function tick(){let now=performance.now(),delta=Math.min(500,now-s.lastTick);s.lastTick=now;if(!['playing','reveal'].includes(s.phase))return;s.remaining=Math.max(0,s.remaining-delta);$('timer').textContent=fmt(s.remaining);if(s.phase==='playing'&&s.firstDelay!==null){s.firstDelay-=delta;if(s.firstDelay<=0)settle();}if(s.phase==='reveal'){s.revealDelay-=delta;let reached=Number.isFinite(s.target)&&(s.players.blue.score>=s.target||s.players.red.score>=s.target);if(reached||s.remaining<=0){if(s.revealDelay<=0)finish();}else if(s.revealDelay<=0)setQuestion();}else if(s.remaining<=0){settle();s.revealDelay=400;}}
function start(){unlockAudio();$('arena').classList.remove('idle');$('centerMode').hidden=true;$('start').hidden=false;$('start').textContent='■ 終止遊戲';$('start').classList.add('end-game');$('settings').hidden=true;$('level').disabled=true;$('mode').disabled=true;try{speechSynthesis.cancel()}catch(e){}clearInterval(ticker);const cfg=gameConfig();s.remaining=cfg.seconds*1000;s.target=cfg.target;s.phase='playing';s.round=0;s.past=[];s.pool=shuffle(makePool($('level').value));s.firstDelay=null;$('game').classList.remove('results');for(let color of ['blue','red']){s.players[color]={input:'',submitted:false,answer:null,score:0,queue:[]};$('side-'+color).classList.remove('winner','buson');$('bus-'+color).classList.remove('arrived');$('feedback-'+color).textContent='';$('feedback-'+color).style.color='';}renderQueues();$('timer').textContent=fmt(s.remaining);setQuestion();s.lastTick=performance.now();ticker=setInterval(tick,50);}
function resetToStandby(){
 clearInterval(ticker);ticker=null;try{speechSynthesis.cancel()}catch(e){}
 s.phase='idle';s.question=null;s.past=[];s.pool=[];s.round=0;s.firstDelay=null;s.revealDelay=0;
 const cfg=gameConfig();s.remaining=cfg.seconds*1000;s.target=cfg.target;
 $('game').classList.remove('results');$('arena').classList.add('idle');$('centerMode').hidden=false;$('start').hidden=false;$('start').textContent='▶ 開始遊戲';$('start').classList.remove('end-game');
 $('level').disabled=false;$('mode').disabled=false;$('settings').hidden=true;
 $('timer').textContent=fmt(s.remaining);$('phase').textContent='';$('question').textContent='';$('notice').textContent='';
 $('scoreline').hidden=true;
 for(const color of ['blue','red']){
  s.players[color]={input:'',submitted:false,answer:null,score:0,queue:[]};
  $('side-'+color).classList.remove('winner','buson');$('bus-'+color).classList.remove('arrived');
  $('feedback-'+color).textContent='';renderInput(color);
 }
 renderQueues();window.scrollTo({top:0,behavior:'smooth'});
}
function modal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modal').hidden=false}
const posters=`<h3>整點、半點、直接讀法</h3><div class="poster-grid"><div class="poster-item"><b>o'clock＝整點</b><span>seven o'clock → 07:00</span></div><div class="poster-item"><b>half past＝半點</b><span>half past six → 06:30</span></div><div class="poster-item"><b>直接讀法＝小時＋分鐘</b><span>seven twenty → 07:20</span></div><div class="poster-item"><b>oh＝分鐘不足 10</b><span>nine oh five → 09:05</span></div></div><h3>past、to、quarter</h3><div class="poster-grid"><div class="poster-item"><b>past＝過了幾分</b><span>ten past eight → 08:10</span></div><div class="poster-item"><b>to＝還差幾分（下一個小時）</b><span>ten to eight → 07:50</span></div><div class="poster-item"><b>a quarter＝15 分鐘</b><span>a quarter past three → 03:15</span></div><div class="poster-item"><b>a quarter to＝還差 15 分</b><span>a quarter to nine → 08:45</span></div></div><h3>MIX 混合</h3><p>整點、半點、直接讀法、past、to、quarter 隨機混合。</p>`;
const how=`<p>兩隊共用中央英文時間題目；藍、紅隊分別使用自己的數字鍵盤，將英文轉換成四碼數位時間。</p><div class="poster-grid"><div class="poster-item"><b>① 聽題目</b><span>可以按 🔊 重聽英文。</span></div><div class="poster-item"><b>② 輸入四碼</b><span>例如 7:45 輸入 0745，畫面自動顯示冒號。</span></div><div class="poster-item"><b>③ 搶票</b><span>第一隊送出後，不論對錯，另一隊仍可在 1 秒內送出。</span></div><div class="poster-item"><b>④ 搭巴士</b><span>答對的隊伍各得一票、增加一位動物。達標或時間到，公車進站並顯示總人數。</span></div></div><p class="helpnote">每隊每題只能提交一次。時間不合法或未輸滿四碼不能送出。結算畫面列出全部題目，以及兩隊的 ○ 答對、× 答錯、— 未作答。</p>`;
$('posterBtn').addEventListener('click',()=>modal('📖 英文時間小提示',posters));$('howBtn').addEventListener('click',()=>modal('🚌 異想時光巴士｜玩法',how));$('closeModal').addEventListener('click',()=>{$('modal').hidden=true});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').hidden=true});window.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true});
$('settingsBtn').addEventListener('click',()=>{$('settings').hidden=!$('settings').hidden});$('mode').addEventListener('change',()=>{if(s.phase==='idle')$('timer').textContent=fmt(gameConfig().seconds*1000)});$('start').addEventListener('click',()=>{if(s.phase==='idle')start();else if(['playing','reveal'].includes(s.phase)){if(window.confirm('確定終止本局？目前成績不會保留。'))resetToStandby();}});$('speak').addEventListener('click',say);$('again').addEventListener('click',resetToStandby);
for(let color of ['blue','red'])drawPad(color);resetToStandby();
})();
</script>
</body>
</html>
