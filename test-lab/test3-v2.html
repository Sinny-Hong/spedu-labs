<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-City｜異想奇島 V2</title></head>
<body><p id="loading" style="font:16px system-ui;padding:24px">異想奇島載入中……</p>
<script>
/* V2 is a same-folder companion to test3.html; original remains unchanged. */
(async () => {
 try {
  const response = await fetch('./test3.html', {cache:'no-cache'});
  if (!response.ok) throw new Error('無法讀取 test3.html：HTTP ' + response.status);
  let html = await response.text();
  function swap(a,b){if(!html.includes(a))throw new Error('原始頁面版本已變更，無法定位：'+a.slice(0,45));html=html.replace(a,b)}
  swap('<span>單項每 10 分抽 1 物件 ｜ 總分每 100 分（10 等）島嶼擴建一倍</span>', '<button type="button" class="tool-btn" id="open-help" title="使用說明" aria-label="使用說明">❔ 說明</button><button type="button" class="tool-btn" id="open-settings" title="教師設定" aria-label="教師設定">⚙️</button>');
  swap('<button type="button" class="tool-btn" id="toggle-kenney" title="若將 HTML 放在 Kenney 的 Tiles 資料夾同層，可切換讀取真實 PNG 素材">🖼️ 切換 Kenney 圖檔模式</button>','');
  swap('<button type="button" class="tool-btn" id="reroll-island" title="重新隨機排列本組島嶼形狀與物件位置">🎲 重新排列島嶼</button>','<button type="button" class="tool-btn" id="reroll-island" title="重新隨機排列島嶼" aria-label="重新隨機排列島嶼">🎲</button>');
  swap('<span id="expand-hint" style="font-size:11px;color:#c77c00;font-weight:800"></span>','');
  swap('<div class="xp-caption">\n              <span id="next-level">距離下一級還差 10 XP</span>\n              <span id="land-caption">土地階段 1 / 4（15 格）</span>\n            </div>','');
  swap('<span style="font-size:11px;color:#93a3a9;font-weight:600">每滿 10 分自動抽 1 物件</span>','');
  html=html.replace(/        <section class="section">\s*<h2 class="section-title">教師管理<\/h2>[\s\S]*?<\/section>/, '<div class="footer-actions"><button class="smallbtn" id="undo">↶ 復原上一步</button></div>');
  swap('  </div>\n</main>\n\n<script>', `  </div>
  <footer class="credit"><a href="https://sinny-hong.github.io/spedu-labs/" target="_blank" rel="noopener">© Sinny's Spedu Labs</a></footer>
  <dialog id="help-dialog" class="pop-dialog"><h2>使用說明</h2><p>選擇組別，使用每項的 −／＋1 或直接修改數字，系統不限制每週加分次數。</p><p>每項累積 10 分會隨機新增一個對應景物；總分每 10 XP 升一級，每 100 XP 擴張土地。</p><p>骰子會重新抽取本組島嶼形狀、景物種類及位置，分數不變。各組資料儲存在目前的瀏覽器，不會跨裝置同步。</p><form method="dialog"><button class="smallbtn">關閉</button></form></dialog>
  <dialog id="settings-dialog" class="pop-dialog"><h2>⚙️ 教師設定</h2><div class="settings-stack"><button type="button" class="smallbtn" id="toggle-kenney" title="需另備 Tiles 圖檔才可使用 Kenney 模式">🎨 內建 SVG 模式</button><button type="button" class="smallbtn danger" id="reset-group">重設本組</button><button type="button" class="smallbtn danger" id="reset-all">清除全部組別</button></div><form method="dialog"><button class="smallbtn">關閉</button></form></dialog>
</main>

<script>`);
  html=html.replace(/\.score-controls button\.plus10\{[^\n]*\}\n/,'');
  html=html.replace(/\.score-sub\{[^\n]*\}\n/,'');
  html=html.replace(/\.item-badge\{[^\n]*\}\n/,'');
  html=html.replace(/\.tiny\{[^\n]*\}\n/,'');
  html=html.replace(/\.mini-bar\{[^\n]*\}\n/,'');
  html=html.replace(/\.mini-fill\{[^\n]*\}\n/,'');
  html=html.replace(/\.score-line\{[^\n]*\}\n/,'.score-line{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap}\n');
  html=html.replace(/\.score-name\{[^\n]*\}\n/,'.score-name{font-size:13px;font-weight:800;min-width:0;flex:0 1 auto;white-space:nowrap;line-height:1.2;display:flex;align-items:center;gap:4px}\n');
  html=html.replace(/\.score-item\{[^\n]*\}\n/,'.score-item{border-bottom:1px solid #edf2f3;padding-bottom:6px;min-width:0}\n');
  swap('</style>',`.inline-progress{flex:1 1 28px;min-width:0;max-width:90px;height:4px;border-radius:99px;background:#e5eff2;overflow:hidden;margin:0 3px}.inline-progress .mini-fill{display:block;height:100%;background:#38a169;border-radius:99px;transition:width .2s}.score-controls{margin-left:auto}.score-line{white-space:nowrap}.score-name .ico{font-size:17px}.score-controls button{min-width:29px;height:30px}.num{width:37px}.stage-foot{flex-wrap:nowrap;gap:8px}.stat-pills{flex-wrap:nowrap;gap:4px}.stat-pill{white-space:nowrap;padding:4px 7px}.credit{flex:none;text-align:right;font-size:11px;padding:0 5px}.credit a{color:#80939c;text-decoration:none}.pop-dialog{border:1px solid var(--line);border-radius:17px;max-width:min(480px,calc(100vw - 24px));padding:22px;color:var(--ink);line-height:1.65;box-shadow:0 16px 55px #1236}.pop-dialog::backdrop{background:#1238}.pop-dialog h2{margin:0 0 12px;color:var(--blue)}.pop-dialog p{margin:9px 0}.pop-dialog form{text-align:right;margin-top:16px}.settings-stack{display:grid;gap:10px;margin-top:18px}.stage-tools .tool-btn{font-size:18px;padding:4px 10px}@media(max-width:790px){.inline-progress{max-width:65px}.score-name{font-size:13px}.stage-foot{flex-wrap:wrap}.stat-pills{flex-wrap:nowrap}.stage{height:min(56vh,460px)}}@media(max-width:380px){.inline-progress{display:none}.score-name{font-size:12px}.stat-pill{padding:3px 5px;font-size:10px}}
</style>`);
  html=html.replace(/^.*\$\('next-level'\)\.textContent.*\n/gm,'').replace(/^.*\$\('expand-hint'\)\.textContent.*\n/gm,'').replace(/^.*\$\('land-caption'\)\.textContent.*\n/gm,'').replace(/^.*const toNextExpand =.*\n/gm,'');
  // Replace fixed-size viewBox only after SVG artwork exists, using the actual bounding box.
  swap('    svg.innerHTML = html;\n    lastAddedObjId = null;',`    svg.innerHTML = html;
    const bounds = svg.getBBox();
    const stage = $('island-view');
    const aspect = Math.max(.35, stage.clientWidth / Math.max(1,stage.clientHeight));
    const contentW = Math.max(1,bounds.width + 26), contentH = Math.max(1,bounds.height + 26);
    const viewW = Math.max(contentW, contentH * aspect), viewH = viewW / aspect;
    const cx = bounds.x + bounds.width / 2, cy = bounds.y + bounds.height / 2;
    svg.setAttribute('viewBox', \`${cx-viewW/2} 4{cy-viewH/2} 4{viewW} 4{viewH}\`);
    lastAddedObjId = null;`);
  // Remove original viewBox logic (do this independently of whitespace).
  html=html.replace(/    \/\/ 根據島嶼格數自動調整 SVG 視野縮放\n[\s\S]*?    svg\.setAttribute\('viewBox',[^\n]*\);\n/,'');
  swap('label.innerHTML = `<span class="ico">${item.ico}</span><span>${item.name}</span><span class="item-badge">已抽 ${drawnCount} ${item.label}</span>`;', 'label.innerHTML = `<span class="ico">${item.ico}</span><span>${item.name}</span>`;');
  html=html.replace(/      const plus10 = document\.createElement\('button'\);[\s\S]*?      plus10\.onclick = \(\) => updateScore\(i, scoreVal \+ 10\);\n\n/,'');
  swap('ctrl.append(minus, inp, plus, plus10);\n      line.append(label, ctrl);','ctrl.append(minus, inp, plus);\n      const progress = document.createElement(\'div\');\n      progress.className = \'inline-progress\';\n      progress.title = `${remainder}/10`;\n      progress.innerHTML = `<span class="mini-fill" style="width:${remainder*10}%"></span>`;\n      line.append(label, progress, ctrl);');
  html=html.replace(/      const sub = document\.createElement\('div'\);[\s\S]*?      el\.append\(line, sub\);/,'      el.append(line);');
  swap('  render();\n})();',`  $('open-help').onclick = () => $('help-dialog').showModal();
  $('open-settings').onclick = () => $('settings-dialog').showModal();
  $('reroll-island').addEventListener('click', e => { if (!confirm('要重新隨機排列本組島嶼嗎？分數不變，景物種類及位置將重新抽取。')) e.stopImmediatePropagation(); }, true);
  window.addEventListener('resize', () => renderIsometricIsland());
  render();
})();`);
  // Keep existing storage key: user explicitly wants the same group data available on the same device.
  // Material is drawn in the source script, and this companion only changes UI and SVG fitting.
  document.open(); document.write(html); document.close();
 } catch(e) {document.getElementById('loading').textContent='無法載入新版：'+e.message+'。請把本檔與原版 test3.html 放在同一個 test-lab 資料夾，透過網站網址開啟。'; console.error(e);}
})();
</script></body></html>
