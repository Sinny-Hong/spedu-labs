<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字配對挑戰｜Sinny's Spedu Labs</title>
<style>
:root{font-family:'Noto Sans TC',system-ui,sans-serif;color:#263448;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,810px);margin:auto;padding:14px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{font-size:20px;font-weight:900}.brand small{display:block;color:#798696;font-size:11px;letter-spacing:.08em}.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;padding:13px;border:1px solid #d8e0e8;border-radius:12px}.picker label{font-weight:800;font-size:14px;color:#647386}.picker select{display:block;margin-top:5px;width:100%;height:43px;border:1px solid #b6c2ce;background:white;border-radius:8px;padding:0 10px;color:#202f42;font-weight:800}.status{margin:12px 0 7px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900}.status .sub{font-size:13px;color:#617389}.track{height:6px;background:#dce5ed;border-radius:50px;overflow:hidden;margin-bottom:12px}.fill{height:100%;width:0;background:#f59e0b;transition:width .2s}.sheet{background:#fff;border:1px solid #d7e0e9;border-radius:12px;padding:12px;box-shadow:0 3px 13px #253a5109}.instructions{border-left:5px solid #64748b;padding:8px;background:#f3f6fa;font-size:13px;font-weight:700;margin-bottom:12px}.section{padding:10px 0 12px}.section+.section{border-top:2px dashed #ced8e1}.section-head{font-size:13px;color:#64748b;font-weight:900;margin-bottom:8px}.twocol{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:9px}.words,.choices{display:grid;gap:5px}.word{min-height:47px;display:flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:7px;padding:4px 5px;background:white;text-align:left;min-width:0}.word .ans{display:grid;place-items:center;flex:none;border-bottom:2px solid #8495a8;width:35px;height:29px;color:#d72b35;font-weight:900;font-size:18px}.word .num{color:#8d9bab;font-size:13px;flex:none;font-weight:800}.word .en{font-size:clamp(14px,3.8vw,20px);font-weight:800;overflow-wrap:anywhere;line-height:1.18}.word.active{background:#fef3a7;border-color:#eab308}.word.mark-good{background:#edfaf3}.word.mark-bad{background:#fff0f0}.word .feedback{display:block;font-size:11px;color:#c62b37;font-weight:900}.choice{display:flex;align-items:center;text-align:left;gap:5px;min-height:47px;padding:5px 8px;border:1px solid #b3d8eb;border-radius:6px;background:#e0f2fe;color:#223448;line-height:1.22;font-weight:750;font-size:clamp(13px,3.6vw,17px);overflow-wrap:anywhere}.choice b{color:#d52b35;flex:none}.choice.selected{outline:2px solid #278be4;background:#c4e5fc}.actions{display:flex;gap:8px;margin-top:12px}.action{border:0;border-radius:8px;padding:11px 13px;font-weight:900}.primary{background:#0f9776;color:white;flex:1}.neutral{background:#e7edf3;color:#43566b}.next{background:#2563eb;color:#fff;flex:1}.message{min-height:22px;color:#64748b;font-size:13px;margin:9px 0 0;font-weight:800}.message.error{color:#c12637}.message.success{color:#077e5f}.hidden{display:none!important}.results{text-align:center;padding:15px 10px}.results h1{font-size:23px;margin:8px 0}.score{background:#f3f6fa;border-radius:13px;margin:14px 0;padding:18px}.score strong{font-size:42px;display:block;color:#0a876a}.score span{font-size:23px;font-weight:900}.score-table{width:100%;border-collapse:collapse;text-align:left;margin:12px 0}.score-table td{padding:8px;border-bottom:1px solid #e0e6eb}.score-table td:last-child{text-align:right;font-weight:900}.capture{font-size:16px;font-weight:900;padding:12px;border:2px dashed #e9aa39;background:#fff9e9;border-radius:9px}.foot{text-align:center;color:#7c8895;font-size:11px;margin:16px 0 0}@media(max-width:380px){.app{padding:9px}.sheet{padding:9px}.twocol{gap:4px}.choice{padding:4px}.word{padding:3px}.word .ans{width:29px}.word .en{font-size:14px}}@media(min-width:620px){.choice,.word{min-height:52px}.app{padding-top:22px}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div class="brand">🔤 單字配對挑戰<small>SINNY'S SPEDU LABS</small></div><button class="action neutral" id="restartTop" type="button">重新挑戰</button></header>
 <div class="picker" id="picker"><label>冊別／年級<select id="book"></select></label><label>課次<select id="lesson"></select></label></div>
 <div id="play"><div class="status"><span id="groupTitle">第一組</span><span class="sub" id="groupProgress"></span></div><div class="track"><div class="fill" id="fill"></div></div><div class="sheet"><div class="instructions">◎ 先點左邊英文題目，再點右邊中文選項；整組完成後按「批改」。</div><div id="sections"></div><div class="actions"><button class="action neutral" id="clear" type="button">🧽 清空</button><button class="action primary" id="check" type="button">✅ 批改本組</button><button class="action next hidden" id="next" type="button">下一組 →</button></div><div class="message" id="message" aria-live="polite"></div></div></div>
 <div id="finish" class="sheet results hidden"><div style="font-size:34px">🏆</div><h1>單字配對挑戰完成！</h1><div id="finalLesson"></div><div class="score"><strong id="scoreText"></strong><span id="pctText"></span><div>本次總答對率</div></div><table class="score-table"><tbody id="scoreRows"></tbody></table><div id="finishedAt"></div><p class="capture">📸 截圖給老師看！</p><button class="action next" id="again" type="button" style="width:100%">重新挑戰這一課</button></div>
 <footer class="foot">© SINNY SPEDU LABS</footer>
</main>
<script src="../eng-115/vocab-data.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), books=window.VOCAB_DATA?.books;
const els={book:$('book'),lesson:$('lesson'),play:$('play'),finish:$('finish'),sections:$('sections'),message:$('message')};
if(!books){$('play').innerHTML='<div class="sheet">無法讀取共用資料：請確認檔案位於 share/ 或 test-lab/，且 ../eng-115/vocab-data.js 可以正常載入。</div>';return;}
// 八年級顯示正確出版社；不擅自更動共用資料中的單字內容。
const displayLabel=(key,book)=>key==='115-1-g8'?(book.label||'八年級').replace(/康軒/g,'翰林'):(book.label||key);
let groups=[],index=0,active=null,answers=new Map(),graded=false,results=[];
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const random=new Uint32Array(1);crypto.getRandomValues(random);const j=random[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function option(el,txt){const node=document.createElement('option');node.value=el;node.textContent=txt;return node;}
Object.entries(books).forEach(([k,b])=>els.book.append(option(k,displayLabel(k,b))));
function setLessons(){let b=books[els.book.value];els.lesson.replaceChildren();Object.keys(b.lessons||{}).forEach(k=>els.lesson.append(option(k,k)));begin();}
function split(words){let at=Math.ceil(words.length/2);return [words.slice(0,at),words.slice(at)].filter(a=>a.length);}
function begin(){let b=books[els.book.value], raw=b?.lessons?.[els.lesson.value];if(!Array.isArray(raw)||!raw.length){els.play.classList.remove('hidden');els.finish.classList.add('hidden');els.sections.textContent='此課沒有可用的分組資料';return;}
 groups=raw.filter(g=>Array.isArray(g.words)&&g.words.length).map(g=>({title:g.title||'配對練習',words:[...g.words].sort((a,b)=>(a.order||0)-(b.order||0))}));index=0;results=[];els.finish.classList.add('hidden');els.play.classList.remove('hidden');render();}
function mk(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function render(){active=null;graded=false;answers=new Map();els.message.textContent='';els.message.className='message';$('groupTitle').textContent=groups[index].title;$('groupProgress').textContent=`第 ${index+1} / ${groups.length} 組 · 共 ${groups[index].words.length} 題`;$('fill').style.width=`${index/groups.length*100}%`;els.sections.replaceChildren();$('check').classList.remove('hidden');$('clear').classList.remove('hidden');$('next').classList.add('hidden');
 const parts=split(groups[index].words);let offset=0;
 parts.forEach((part,p)=>{const sec=mk('section','section');sec.append(mk('div','section-head',`第 ${p+1} 區 · ${part.length} 題`));const cols=mk('div','twocol'),left=mk('div','words'),right=mk('div','choices');const entries=part.map((w,i)=>({id:offset+i,w}));const ordered=shuffle(entries),shuffledChoices=shuffle(entries);const keyById=new Map(shuffledChoices.map((v,i)=>[v.id,letters[i]]));
 ordered.forEach((entry,ii)=>{const id=entry.id, row=mk('button','word');row.type='button';row.dataset.id=id;const answer=mk('span','ans','　');const n=mk('span','num',`${ii+1+offset}.`);const word=mk('span','en',entry.w.english);row.append(answer,n,word);row.addEventListener('click',()=>{if(graded)return;sec.querySelectorAll('.word').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.word.active').forEach(x=>x.classList.remove('active'));row.classList.add('active');active={id,row,sec};});left.append(row);entry.correct=keyById.get(id);row.dataset.correct=entry.correct;});
 shuffledChoices.forEach((entry,i)=>{const choice=mk('button','choice');choice.type='button';const bold=mk('b','',`${letters[i]}.`);choice.append(bold,document.createTextNode(entry.w.chinese));choice.addEventListener('click',()=>{if(graded)return;if(!active||active.sec!==sec){els.message.textContent='請先點選同一區左側的英文題目';return;}answers.set(active.id,letters[i]);active.row.querySelector('.ans').textContent=letters[i];sec.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));choice.classList.add('selected');active.row.classList.remove('active');active=null;});right.append(choice);});cols.append(left,right);sec.append(cols);els.sections.append(sec);offset+=part.length;});}
$('clear').addEventListener('click',()=>{if(!graded)render();});
$('check').addEventListener('click',()=>{if(graded)return;let rows=[...els.sections.querySelectorAll('.word')];if(answers.size!==rows.length){els.message.className='message error';els.message.textContent=`還有 ${rows.length-answers.size} 題未填，請先完成本組。`;return;}
 graded=true;active=null;let correct=0;rows.forEach(row=>{let chosen=answers.get(Number(row.dataset.id)),expected=row.dataset.correct,ok=chosen===expected;if(ok)correct++;row.classList.add(ok?'mark-good':'mark-bad');if(!ok){row.append(mk('span','feedback',`✓ ${expected}`));}});results.push({title:groups[index].title,correct,total:rows.length});els.message.className='message success';els.message.textContent=`本組答對 ${correct} / ${rows.length} 題。${index===groups.length-1?'按「查看總成績」完成挑戰。':'請按「下一組」繼續。'}`;$('check').classList.add('hidden');$('clear').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===groups.length-1?'查看總成績 →':'下一組 →';$('fill').style.width=`${(index+1)/groups.length*100}%`;});
$('next').addEventListener('click',()=>{if(!graded)return;if(index+1<groups.length){index++;render();window.scrollTo({top:0,behavior:'instant'});}else complete();});
function complete(){els.play.classList.add('hidden');els.finish.classList.remove('hidden');let right=results.reduce((n,r)=>n+r.correct,0),total=results.reduce((n,r)=>n+r.total,0);$('finalLesson').textContent=`${displayLabel(els.book.value,books[els.book.value])} · ${els.lesson.value}`;$('scoreText').textContent=`${right} / ${total}`;$('pctText').textContent=`${total?Math.round(right/total*100):0}%`;$('scoreRows').replaceChildren();results.forEach(r=>{let tr=mk('tr');tr.append(mk('td','',r.title),mk('td','',`${r.correct} / ${r.total}`));$('scoreRows').append(tr);});$('finishedAt').textContent=`完成時間：${new Date().toLocaleString('zh-TW',{hour12:false})}`;window.scrollTo({top:0,behavior:'instant'});}
function restart(){if(results.length||answers.size){if(!confirm('重新開始會清除這次挑戰成績，確定嗎？'))return;}begin();window.scrollTo({top:0,behavior:'instant'});}
$('restartTop').addEventListener('click',restart);$('again').addEventListener('click',begin);els.book.addEventListener('change',setLessons);els.lesson.addEventListener('change',begin);setLessons();
})();
</script>
</body>
</html>
