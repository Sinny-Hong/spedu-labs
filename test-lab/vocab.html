<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單字講義（測試）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <style>
    :root { --line: #cbd5e1; --ink: #334155; --blue: #2563eb; --blue-bg: #dbeafe; --blue-ink: #1d4ed8; --green: #16a34a; --green-bg: #dcfce7; --green-ink: #15803d; --pink-bg: #fce7f3; --pink-ink: #dc2626; --hdr-title-h: 40px; --hdr-bar-h: 32px; --grp-bar-h: 36px; }
    body { font-family: var(--font-zh); background-color: #f1f5f9; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: flex-start; }
    body[data-mode="hear"] { font-family: var(--font-en); }
    .font-chinese { font-family: var(--font-zh); }
    .font-english { font-family: var(--font-en); }
    html body.show-zhuyin .vocab-meaning { font-family: var(--font-bpmf) !important; font-weight: 400; }

    /* ---- 功能列：永遠固定置頂；寬螢幕單行，窄螢幕自動換行 ---- */
    :root { --tb-h: 52px; }
    .toolbar { position: sticky; top: 0; left: 0; z-index: 100; width: 100%; max-width: 100vw; box-sizing: border-box; background: #fff; border-bottom: 1px solid #cbd5e1; box-shadow: 0 2px 6px #0001; padding: 6px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .tb-row { display: contents; }
    .field { display: flex; flex-direction: row; align-items: center; gap: 4px; }
    .field > span { font-size: 12px; font-weight: 700; color: #475569; white-space: nowrap; }
    .field select { height: 36px; padding: 2px 6px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 14px; font-family: var(--font-zh); }
    #bookSelect { width: 150px; max-width: 46vw; }
    #lessonSelect { width: 72px; }
    .tabs { display: flex; gap: 6px; }
    .tab, .tool { position: relative; height: 36px; padding: 0 10px; border: 2px solid var(--line); border-radius: 8px; background: #fff; font-size: 14px; font-weight: 700; font-family: var(--font-zh); color: var(--ink); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .tab:hover, .tool:hover { background: #f1f5f9; }
    /* 啟用狀態：深色實心底＋白字＋✓ 記號＋底部粗條（不只靠顏色辨識） */
    .tab[aria-pressed="true"], .tool[aria-pressed="true"] { background: #1d4ed8; border-color: #1e3a8a; color: #fff; box-shadow: inset 0 -4px 0 #93c5fd; padding-bottom: 3px; }
    .tab[aria-pressed="true"]::before, .tool[aria-pressed="true"]::before { content: "✓"; font-weight: 900; font-size: 15px; line-height: 1; }
    .tab[aria-pressed="true"]:hover, .tool[aria-pressed="true"]:hover { background: #1e40af; }
    .tab:focus-visible, .tool:focus-visible, .field select:focus-visible { outline: 3px solid #f59e0b; outline-offset: 1px; }
    .ico { width: 16px; height: 16px; flex: none; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .tab-menu { position: relative; }
    .menu { position: absolute; top: 40px; left: 0; z-index: 110; min-width: 100%; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 18px #0003; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
    .menu.right { left: auto; right: 0; }
    .menu[hidden] { display: none; }
    .menu button { height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #fff; text-align: left; font-size: 14px; font-family: var(--font-zh); color: #334155; cursor: pointer; white-space: nowrap; }
    .menu button:hover { background: #f1f5f9; }
    .menu button[aria-checked="true"] { background: var(--blue-bg); color: var(--blue-ink); font-weight: 700; box-shadow: inset 4px 0 0 var(--blue); }
    .menu button[aria-checked="true"]::before { content: "✓ "; font-weight: 900; }

    @media (max-width: 600px) {
      .toolbar { padding: 4px 8px; gap: 4px 6px; }
      .field select, .tab, .tool { height: 34px; }
      .tab, .tool { padding: 0 8px; font-size: 13px; }
      #bookSelect { width: auto; flex: 1 1 130px; max-width: none; }
      .field:first-child { flex: 1 1 auto; min-width: 0; }
      .tools { margin-left: 0; }
      .menu { top: 38px; }
    }


    /* ---- 三種題型共用的標題列、說明列、組別標題列（固定同一尺寸） ---- */
    .hdr-title { display: flex; justify-content: space-between; align-items: flex-end; height: var(--hdr-title-h); }
    .hdr-bar { display: flex; align-items: center; gap: 24px; height: var(--hdr-bar-h); margin-top: 8px; padding: 0 12px; box-sizing: border-box; background: #f1f5f9; border-left: 4px solid #64748b; border-radius: 4px; font-size: 14px; font-weight: 700; color: #334155; font-family: var(--font-zh); white-space: nowrap; flex: none; }
    .hdr-bar .blank { display: inline-block; width: 64px; height: 18px; margin: 0 4px; border-bottom: 2px solid #334155; vertical-align: bottom; }
    .grp-bar { display: flex; justify-content: space-between; align-items: center; height: var(--grp-bar-h); margin-bottom: 6px; padding: 0 10px; box-sizing: border-box; background: #f1f5f9; border: 1px solid var(--line); border-radius: 8px; flex: none; }
    .grp-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .grp-title h3 { margin: 0; font-size: 16px; font-weight: 700; color: #1e293b; font-family: var(--font-zh); letter-spacing: .02em; white-space: nowrap; }
    .grp-btns { display: flex; gap: 4px; }
    .gbtn { height: 28px; padding: 0 9px; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 800; font-family: var(--font-zh); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
    .gbtn .ico { width: 15px; height: 15px; stroke-width: 2.4; }
    /* 預設與預習＝藍；小考＝琥珀；批改＝綠；解答＝粉紅。淺色底＋深色字＋實色邊框 */
    .gbtn, .gbtn.tone-pre { color: #1e3a8a; border-color: #3b82f6; background: #bfdbfe; }
    .gbtn:hover, .gbtn.tone-pre:hover { background: #93c5fd; }
    .gbtn.tone-quiz { color: #78350f; border-color: #d97706; background: #fde68a; }
    .gbtn.tone-quiz:hover { background: #fcd34d; }
    .gbtn.tone-ok { color: #14532d; border-color: #16a34a; background: #bbf7d0; }
    .gbtn.tone-ok:hover { background: #86efac; }
    .gbtn.tone-ans { color: #9d174d; border-color: #db2777; background: #fbcfe8; }
    .gbtn.tone-ans:hover { background: #f9a8d4; }
    .gbtn:active { transform: translateY(1px); }
    .gbtn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 1px; }
    .score { padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; font-family: var(--font-zh); background: var(--green-bg); color: var(--green-ink); border: 1px solid #86efac; white-space: nowrap; }

    /* ---- 作答配色（全站規則）：作答＝藍底藍字；批改對＝綠底綠字；批改錯＝消失；解答＝粉底紅字 ---- */
    input.v-student { background: var(--blue-bg); color: var(--blue-ink); border-radius: 4px; }
    input.v-right { background: var(--green-bg); color: var(--green-ink); border-radius: 4px; }
    input.v-answer { background: var(--pink-bg); color: var(--pink-ink); border-radius: 4px; }
    /* ---- 手寫：工具列永遠在畫布之上；手寫工具盒避開工具列；啟用鍵加強辨識 ---- */
    #inkLayer { z-index: 20; pointer-events: none; }
    body .ink-tools { z-index: 90; top: calc(var(--tb-h) + 8px); transform: none; max-height: calc(100vh - var(--tb-h) - 16px); overflow-y: auto; }
    body .ink-tools button { position: relative; }
    body .ink-tools button[aria-pressed="true"] { background: #fde68a; border: 3px solid #b45309; color: #78350f; }
    body .ink-tools button[aria-pressed="true"]::after { content: "✓"; position: absolute; right: -4px; top: -6px; width: 15px; height: 15px; border-radius: 50%; background: #b45309; color: #fff; font-size: 11px; font-weight: 900; line-height: 15px; text-align: center; }
    @media screen { .write-cell.has-val .write-print-hint { visibility: hidden; } }

    /* ---- A4 頁面 ---- */
    #stage { width: 210mm; flex: none; margin-left: auto; margin-right: auto; }
    .page-a4 { width: 210mm; height: 297mm; background: #fff; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); margin: 15px 0; padding: 6mm 8mm; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .title-large { font-size: 24px; font-weight: 700; }
    .info-text { font-size: 16px; font-weight: 500; }

    .answer-input:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.3); background-color: #fef2f2; }
    .match-input:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.3); background-color: #fef2f2; }
    .row-item { height: 34px; }
    .active-row { background-color: #fef08a !important; }
    .match-option-selected { background-color: #bae6fd !important; outline: 3px solid #0284c7; outline-offset: -2px; }

    .spelling-input:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.3); background-color: #fef2f2; z-index: 3; }
    .spelling-input { position: relative; z-index: 1; }
    .row-border-style { border-bottom: 1px solid #e2e8f0; }
    .write-word-row { flex: none; height: 33px; padding-block: 2px; }
    .write-prompt { display: flex; align-items: center; flex: 0 0 105px; width: 105px; padding-right: 4px; }
    .write-prompt-number { flex: 0 0 24px; }
    .write-meaning-window { flex: 1 1 0; min-width: 0; max-height: 28px; overflow: hidden; letter-spacing: 0; }
    .write-meaning-window .vocab-meaning { display: block; font-size: 14px; line-height: 14px; overflow-wrap: anywhere; }
    body.show-zhuyin .write-meaning-window .vocab-meaning { width: 113.636%; transform: scaleX(.88); transform-origin: left top; }
    .write-print-hint { display: flex; position: absolute; z-index: 2; left: .5rem; right: 0; align-items: center; height: 1.25rem; line-height: 1; white-space: nowrap; overflow: visible; pointer-events: none; color: #334155; font-weight: 500; }
    .write-print-hint:not(.write-hint-trace) { transform: translateY(4px); }
    .write-hint-content { display: flex; align-items: baseline; gap: 2px; min-width: 0; white-space: nowrap; transform: scaleX(var(--write-hint-scale, 1)); transform-origin: left center; }
    .write-hint-token { flex: 0 0 auto; }
    .write-hint-space { display: inline-block; width: .7em; flex: 0 0 .7em; }
    .write-hint-trace { color: #aeb7c3; font-family: var(--font-en-trace); font-size: 17pt; font-style: normal; font-weight: 700; line-height: .82; letter-spacing: .01em; overflow: visible; transform: scaleX(var(--write-trace-scale, 1)); transform-origin: left center; }

    /* ---- 本冊列印：頁面先排在畫面外（讓字型載入），列印時才顯示 ---- */
    #printRoot { position: absolute; left: -10000px; top: 0; width: 210mm; }
    .teacher-tag { margin-bottom: 4px; padding: 2px 14px; border: 2px solid var(--pink-ink); border-radius: 8px; color: var(--pink-ink); font-size: 16px; font-weight: 700; font-family: var(--font-zh); }

    @media print {
      @page { size: A4; margin: 0; }
      body.batch #stage { display: none !important; }
      body.batch #printRoot { position: static; width: 210mm; }
      #printRoot .page-a4 { margin: 0; break-after: page; page-break-after: always; }
      #printRoot .page-a4:last-child { break-after: auto; page-break-after: auto; }
      input.v-answer { background: transparent; }
      body { background: #fff; display: block; min-height: 0; }
      .no-print, .toolbar, #inkLayer, .ink-tools, .module-notice { display: none !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      #stage { margin: 0; }
      .page-a4 { box-shadow: none; margin: 0; }
      .write-print-hint { display: flex !important; }
      .row-border-style { border-bottom: .65px solid #475569 !important; }
    }
  </style>
</head>
<body data-mode="hear">
  <header class="toolbar no-print">
    <div class="tb-row">
      <label class="field"><span>冊別</span><select id="bookSelect" aria-label="冊別／年級" title="冊別／年級"></select></label>
      <label class="field"><span>課次</span><select id="lessonSelect" aria-label="課次"></select></label>
    </div>
    <div class="tb-row">
      <nav class="tabs" aria-label="題型">
        <button type="button" class="tab" data-mode="hear" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg><span>聽力</span></button>
        <button type="button" class="tab" data-mode="match" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>配對</span></button>
        <div class="tab-menu">
          <button type="button" class="tab" id="writeTab" aria-pressed="false" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg><span id="writeLabel">拼寫 ▾</span></button>
          <div class="menu" id="hintMenu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-hint="blank" aria-checked="false">空白</button>
            <button type="button" role="menuitemradio" data-hint="count" aria-checked="false">字數</button>
            <button type="button" role="menuitemradio" data-hint="initial" aria-checked="false">字首</button>
            <button type="button" role="menuitemradio" data-hint="trace" aria-checked="false">描寫</button>
          </div>
        </div>
      </nav>
      <div class="tools">
        <button type="button" class="tool" id="zhuyinBtn" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 8h6M12 8v4.5a3 3 0 0 1-3 3"/></svg><span>注音</span></button>
        <button type="button" class="tool" id="inkBtn" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>手寫</span></button>
        <div class="tab-menu">
          <button type="button" class="tool" id="printBtn" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg><span>列印 ▾</span></button>
          <div class="menu right" id="printMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-print="page">列印本頁</button>
            <button type="button" role="menuitem" data-print="student">列印本冊(學生版36頁)</button>
            <button type="button" role="menuitem" data-print="zhuyin">列印本冊(注音版36頁)</button>
            <button type="button" role="menuitem" data-print="teacher">列印本冊(教師版12頁)</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="stage" class="paper"><div id="page" class="page-a4"></div></main>
  <div id="printRoot" aria-hidden="true"></div>

  <script src="../eng-115/vocab-data.js"></script>
  <script src="vocab-app.js"></script>
  <script>
    /* 量測固定工具列高度，讓手寫工具盒與選單永遠避開它 */
    (function () {
      var tb = document.querySelector('.toolbar');
      if (!tb) return;
      var set = function () { document.documentElement.style.setProperty('--tb-h', tb.offsetHeight + 'px'); };
      set();
      if (window.ResizeObserver) new ResizeObserver(set).observe(tb);
      window.addEventListener('resize', set);
    })();
  </script>
</body>
</html>
