<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-City｜立體導航城 v0.3</title>
<style>
:root {
  --blue: #245b86;
  --blue-light: #eef6fa;
  --orange: #f59e0b;
  --green: #16a34a;
  --ink: #263b4b;
  --line: #d8e5e9;
  --bg: #f5f9fa;
  --white: #fff;
  --muted: #718591;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', 'Noto Sans TC', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible {
  outline: 3px solid #f6b746;
  outline-offset: 2px;
}

/* 16:9 大電視與桌機主容器 */
.app {
  height: 100dvh;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 10px;
  max-width: 1900px;
  margin: auto;
}

/* 頂部 E-City 共用扁長工具列 */
.top {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  gap: 8px;
}
.brand {
  font-size: clamp(20px, 2vw, 29px);
  font-weight: 900;
  color: var(--blue);
  letter-spacing: .02em;
  display: flex;
  align-items: baseline;
  white-space: nowrap;
}
.brand span {
  font-size: .62em;
  color: #81929a;
  margin-right: 8px;
}
.brand small {
  font-size: .5em;
  background: #e3eff6;
  color: var(--blue);
  padding: 2px 7px;
  border-radius: 99px;
  margin-left: 8px;
  vertical-align: middle;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: nowrap;
}
.top-btn {
  font-size: 13px;
  font-weight: 800;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 7px 11px;
  color: var(--blue);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 2px 5px #2d59700a;
  transition: transform .1s, background .15s;
}
.top-btn:hover { background: #f4f8f9; }
.top-btn:active { transform: translateY(1px); }
.top-btn.accent {
  background: #fff7e7;
  color: #ad7100;
  border-color: #f6dda2;
}
.mission-select {
  font-size: 13px;
  font-weight: 900;
  border: 1px solid var(--line);
  background: #f4f8f9;
  color: var(--ink);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
}

/* 雙欄工作區 */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(330px, 3.2fr);
  gap: 12px;
  min-height: 0;
  flex: 1;
}
.stage, .panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  min-height: 0;
  box-shadow: 0 3px 12px #2d59700b;
}

/* 左側：地圖舞台 */
.stage {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 12px;
}
.stage-hud-top {
  position: absolute;
  top: 22px;
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 5;
}
.island-label {
  pointer-events: auto;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(4px);
  border: 1px solid #dde7e9;
  border-radius: 999px;
  box-shadow: 0 2px 8px #32556a13;
  padding: 7px 14px;
  color: var(--blue);
  font-weight: 900;
  font-size: clamp(13px, 1.2vw, 17px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.island-label .dir-badge {
  background: var(--blue);
  color: #fff;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 0.9em;
}
.map-controls {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(4px);
  border: 1px solid #dde7e9;
  border-radius: 12px;
  padding: 5px;
  box-shadow: 0 2px 8px #32556a13;
}
.map-ctrl-btn {
  width: 34px;
  height: 34px;
  border: 1px solid #d4e0e5;
  border-radius: 8px;
  background: #f4f8f9;
  color: var(--blue);
  font-size: 16px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-ctrl-btn:hover { background: #e6f0f4; }
.map-ctrl-btn:active { transform: scale(0.95); }

.island-view {
  flex: 1;
  min-height: 0;
  position: relative;
  background: radial-gradient(ellipse at 50% 60%, #e9f6f0 0%, #f4fbfc 52%, #ffffff 85%);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #edf4f6;
}
#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none; /* 僅在 Canvas 內攔截平移與縮放手勢 */
  cursor: grab;
}
#gameCanvas:active { cursor: grabbing; }

.stage-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px 0;
  color: var(--muted);
  font-size: 12px;
  flex: none;
}

/* 提示氣泡 Toast */
.toast {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #245b86;
  color: #fff;
  padding: 9px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  white-space: nowrap;
  z-index: 10;
  box-shadow: 0 4px 12px rgba(36,91,134,0.28);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
}
.toast.warn { background: #d97706; }
.toast.success { background: #15803d; }

/* 右側：卡拉 OK 導航與操作面板 */
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-head {
  padding: 13px 15px 10px;
  border-bottom: 1px solid #edf2f3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex: none;
}
.panel-title {
  font-weight: 900;
  color: var(--blue);
  font-size: 15px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.progress-pill {
  font-size: 12px;
  font-weight: 900;
  color: #ad7100;
  background: #fff7e7;
  border: 1px solid #f6dda2;
  padding: 3px 10px;
  border-radius: 99px;
}

/* 卡拉 OK 導航捲動區 */
.karaoke-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  min-height: 0;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.step-card {
  border: 1px solid #e3edf1;
  background: #f8fbfc;
  border-radius: 13px;
  padding: 11px 13px;
  transition: all .22s ease;
  position: relative;
}
/* 已完成句子：可點擊回溯 */
.step-card.done {
  background: #f3f7f9;
  border-color: #d8e5e9;
  color: #6b818c;
  cursor: pointer;
}
.step-card.done:hover {
  border-color: var(--blue);
  background: #eaf3f7;
}
/* 目前執行中句子：放大高亮，亦可點擊重置本句 */
.step-card.active {
  background: #fff;
  border: 2px solid var(--blue);
  box-shadow: 0 4px 14px rgba(36, 91, 134, 0.12);
  padding: 13px 14px;
  cursor: pointer;
}
/* 尚未解鎖句子：淡化預覽 */
.step-card.upcoming {
  opacity: 0.52;
  background: #fafcfd;
  border-style: dashed;
  pointer-events: none;
}
.step-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 900;
  margin-bottom: 5px;
}
.step-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
}
.step-card.active .step-badge { color: var(--blue); }
.step-card.done .step-badge { color: var(--green); }

.rollback-tag {
  font-size: 11px;
  font-weight: 800;
  color: var(--blue);
  background: #e9f3f8;
  padding: 2px 7px;
  border-radius: 6px;
}
.step-card.done .rollback-tag {
  color: #587082;
  background: #e2ecef;
}

.step-en {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--ink);
  margin: 0 0 4px;
}
.step-card.active .step-en {
  font-size: clamp(17px, 1.45vw, 20px);
  color: #133955;
}
.step-zh {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0;
  line-height: 1.35;
}
.step-card.active .step-zh {
  color: #4b6270;
  font-weight: 700;
}
.step-substatus {
  margin-top: 7px;
  padding-top: 6px;
  border-top: 1px dashed #dde7eb;
  font-size: 12px;
  font-weight: 800;
  color: #b4690e;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 過關橫幅 */
.win-banner {
  display: none;
  background: #ecfdf5;
  border: 2px solid #10b981;
  border-radius: 13px;
  padding: 12px 14px;
  text-align: center;
  margin: 0 14px 10px;
}
.win-banner.show { display: block; }
.win-banner h3 {
  margin: 0 0 4px;
  color: #065f46;
  font-size: 17px;
}
.win-banner p {
  margin: 0 0 8px;
  font-size: 13px;
  color: #047857;
}
.win-next-btn {
  background: #10b981;
  color: #fff;
  border: 0;
  border-radius: 9px;
  padding: 8px 16px;
  font-weight: 900;
  font-size: 14px;
}

/* 底部操作三鍵區 */
.control-dock {
  padding: 12px 14px 14px;
  background: #f5f9fb;
  border-top: 1px solid #e3edf1;
  flex: none;
}
.control-hint {
  font-size: 11.5px;
  color: var(--muted);
  margin: 0 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1.25fr 1fr;
  gap: 8px;
}
.act-btn {
  border: 1px solid #cadbe2;
  background: #fff;
  border-radius: 12px;
  padding: 12px 6px;
  color: var(--blue);
  font-weight: 900;
  font-size: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  box-shadow: 0 3px 0 #d5e3e9;
  transition: transform .08s, background .15s;
}
.act-btn small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 800;
}
.act-btn:hover { background: #f4f9fb; }
.act-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #d5e3e9;
}
.act-btn.go {
  background: var(--blue);
  border-color: #1b496d;
  color: #fff;
  box-shadow: 0 3px 0 #163b58;
}
.act-btn.go small { color: #cbe3f2; }
.act-btn.go:hover { background: #1e4f75; }

/* 手機直式響應式：自然向下捲動，不鎖死 body，與 ecity-fantasy-island-shell.html 對齊 */
@media (max-width: 790px) {
  .app {
    height: auto;
    min-height: 100dvh;
    padding: 9px;
    gap: 8px;
  }
  .top {
    height: auto;
    min-height: 46px;
    padding: 3px 4px;
    flex-wrap: wrap;
  }
  .brand { font-size: 20px; }
  .workspace {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stage {
    height: min(56vh, 450px);
    min-height: 295px;
    padding: 9px;
  }
  .stage-hud-top {
    top: 16px;
    left: 16px;
    right: 16px;
  }
  .island-label {
    font-size: 13px;
    padding: 6px 11px;
  }
  .panel {
    overflow: visible;
  }
  .karaoke-scroll {
    overflow: visible;
    padding: 12px;
  }
  .act-btn {
    padding: 13px 6px;
    font-size: 15px;
  }
}

/* 矮螢幕橫向適配 */
@media (max-height: 650px) and (min-width: 791px) {
  .app { padding: 6px; gap: 5px; }
  .top { height: 42px; }
  .stage { padding: 8px; }
  .panel-head { padding: 8px 12px; }
  .karaoke-scroll { padding: 8px 11px; gap: 6px; }
  .step-card { padding: 8px 10px; }
  .step-card.active { padding: 9px 11px; }
  .control-dock { padding: 8px 11px; }
  .act-btn { padding: 8px 4px; font-size: 14px; }
}
</style>
</head>
<body>
<main class="app">
  <!-- 頂部工具列：沿用 E-City 系列扁長風格 -->
  <header class="top">
    <div class="brand">
      <span>E-City</span>🧭 立體導航城
      <small>v0.3</small>
    </div>
    <div class="top-actions">
      <select id="missionSelect" class="mission-select" aria-label="選擇導航題目"></select>
      <button type="button" class="top-btn accent" id="btnSpeak" title="朗讀目前英文句子">🔊 語音</button>
      <button type="button" class="top-btn" id="btnNextMission" title="切換下一題">⇄ 換題</button>
      <button type="button" class="top-btn" id="btnResetMission" title="回到本題起點">↺ 重置</button>
    </div>
  </header>

  <div class="workspace">
    <!-- 左側（手機上方）：2.5D 城市地圖舞台 -->
    <section class="stage" aria-label="立體導航地圖舞台">
      <div class="stage-hud-top">
        <div class="island-label">
          <span>面向</span>
          <span class="dir-badge" id="hudDirText">右上 ↗</span>
        </div>
        <div class="map-controls" aria-label="地圖視野控制">
          <button type="button" class="map-ctrl-btn" id="btnZoomIn" title="放大地圖" aria-label="放大地圖">+</button>
          <button type="button" class="map-ctrl-btn" id="btnZoomOut" title="縮小地圖" aria-label="縮小地圖">−</button>
          <button type="button" class="map-ctrl-btn" id="btnCenterPlayer" title="定位角色" aria-label="定位角色">⌖</button>
          <button type="button" class="map-ctrl-btn" id="btnFitMap" title="顯示全圖" aria-label="顯示全圖">⛶</button>
        </div>
      </div>

      <div class="island-view" id="islandView">
        <canvas id="gameCanvas"></canvas>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>

      <div class="stage-foot">
        <span id="footStatus">18×14 街區導航島 · 投影測試 64:44</span>
        <span>© Sinny's Spedu Labs · E-City Series</span>
      </div>
    </section>

    <!-- 右側（手機下方）：卡拉 OK 導航文本與操作面板 -->
    <aside class="panel" aria-label="英文導航與操作面板">
      <div class="panel-head">
        <h2 class="panel-title">🎤 Follow the Directions</h2>
        <span class="progress-pill" id="stepProgressPill">已完成 0 / 4</span>
      </div>

      <!-- 卡拉 OK 句子清單 -->
      <div class="karaoke-scroll" id="karaokeList"></div>

      <!-- 任務完成橫幅 -->
      <div class="win-banner" id="winBanner">
        <h3 id="winTitle">🎉 導航任務完成！</h3>
        <p id="winDesc">你成功帶領角色抵達目的地！</p>
        <button type="button" class="win-next-btn" id="btnBannerNext">挑戰下一題 →</button>
      </div>

      <!-- 操作三鍵區 -->
      <div class="control-dock">
        <div class="control-hint">
          <span>💡 點擊上方句子可回溯至該句起點</span>
          <span id="coordInfo">座標 (6, 10)</span>
        </div>
        <div class="action-grid">
          <button type="button" class="act-btn" id="btnTurnLeft">
            <span>↶ 左轉</span>
            <small>Turn Left</small>
          </button>
          <button type="button" class="act-btn go" id="btnGoStraight">
            <span>↑ 直走</span>
            <small>Go Straight</small>
          </button>
          <button type="button" class="act-btn" id="btnTurnRight">
            <span>右轉 ↷</span>
            <small>Turn Right</small>
          </button>
        </div>
      </div>
    </aside>
  </div>
</main>

<script>
(() => {
  'use strict';

  /* =========================================================
   * 1. 2.5D 投影參數 (v0.3 待驗證測試參數 64:44)
   * ========================================================= */
  const MAP_COLS = 18;
  const MAP_ROWS = 14;
  const TILE_WIDTH = 64;
  const TILE_HEIGHT = 44; // 從 32 提升至 44，拉開前後景深
  const HALF_W = TILE_WIDTH / 2;   // 32
  const HALF_H = TILE_HEIGHT / 2;  // 22
  const SLAB_DEPTH = 14;

  /* =========================================================
   * 2. 嚴格校準的四方向定義（完全對應 gridToScreen 投影公式）
   *    screenX = (x - y) * HALF_W
   *    screenY = (x + y) * HALF_H
   * ========================================================= */
  const DIRECTIONS = [
    { id: 0, dx: 0,  dy: -1, label: '右上 ↗', short: '↗', en: 'Upper-Right' }, // y - 1
    { id: 1, dx: 1,  dy: 0,  label: '右下 ↘', short: '↘', en: 'Lower-Right' }, // x + 1
    { id: 2, dx: 0,  dy: 1,  label: '左下 ↙', short: '↙', en: 'Lower-Left'  }, // y + 1
    { id: 3, dx: -1, dy: 0,  label: '左上 ↖', short: '↖', en: 'Upper-Left'  }  // x - 1
  ];

  /* =========================================================
   * 3. 道路骨架與 12 座地標建築配置 (18x14)
   *    橫向街道 (y 軸固定，沿 x 延伸):
   *      y = 2  (Maple St.)
   *      y = 6  (Main St.)
   *      y = 10 (Oak St.)
   *    縱向大道 (x 軸固定，沿 y 延伸):
   *      x = 2  (West Rd.)
   *      x = 6  (1st Ave.)
   *      x = 11 (2nd Ave.)
   *      x = 15 (East Rd.)
   * ========================================================= */
  const ROAD_X = new Set([2, 6, 11, 15]);
  const ROAD_Y = new Set([2, 6, 10]);

  function isRoadTile(x, y) {
    if (x < 1 || x >= MAP_COLS - 1 || y < 1 || y >= MAP_ROWS - 1) return false;
    return ROAD_X.has(x) || ROAD_Y.has(y);
  }

  function isIntersectionTile(x, y) {
    return ROAD_X.has(x) && ROAD_Y.has(y);
  }

  // 街名標示牌位置
  const STREET_LABELS = [
    { x: 4,  y: 2,  text: 'Maple St.' },
    { x: 8.5,y: 6,  text: 'Main St.'  },
    { x: 13, y: 10, text: 'Oak St.'   },
    { x: 6,  y: 4,  text: '1st Ave.'  },
    { x: 11, y: 8,  text: '2nd Ave.'  }
  ];

  // 12 座地標建築（各自安放於街區基地內，繪製時縮至基地 65% 並居中留綠地）
  const BUILDINGS = [
    { id: 'hospital',    name: 'Hospital',      zh: '醫院',   icon: '🏥', x: 3,  y: 0,  w: 3, h: 2, wall: '#f8fafc', side: '#cbd5e1', roof: '#ef4444', accent: '#dc2626' },
    { id: 'bakery',      name: 'Bakery',        zh: '麵包店', icon: '🥐', x: 7,  y: 0,  w: 2, h: 2, wall: '#fffbeb', side: '#fde68a', roof: '#f59e0b', accent: '#d97706' },
    { id: 'police',      name: 'Police Station',zh: '警察局', icon: '🚓', x: 9,  y: 0,  w: 2, h: 2, wall: '#eff6ff', side: '#bfdbfe', roof: '#2563eb', accent: '#1d4ed8' },

  /* =========================================================
   * 7. 座標投影換算 (64:44 等距投影)
   * ========================================================= */
  function gridToWorld(gx, gy, gz = 0) {
    return {
      wx: (gx - gy) * HALF_W,
      wy: (gx + gy) * HALF_H - gz
    };
  }

  function worldToScreen(wx, wy) {
    return {
      sx: wx * camera.zoom + camera.x,
      sy: wy * camera.zoom + camera.y
    };
  }

  function gridToScreen(gx, gy, gz = 0) {
    const { wx, wy } = gridToWorld(gx, gy, gz);
    return worldToScreen(wx, wy);
  }

  function screenToGrid(sx, sy) {
    const wx = (sx - camera.x) / camera.zoom;
    const wy = (sy - camera.y) / camera.zoom;
    const gx = (wy / HALF_H + wx / HALF_W) / 2;
    const gy = (wy / HALF_H - wx / HALF_W) / 2;
    return { gx: Math.floor(gx), gy: Math.floor(gy), rawX: gx, rawY: gy };
  }

  /* =========================================================
   * 8. 鏡頭控制：自動計算 Fit-to-Screen、中心錨點縮放、定位角色
   * ========================================================= */
  function getMapWorldBounds() {
    // 18x14 四個角落在世界座標的極值
    const top = gridToWorld(0, 0);
    const right = gridToWorld(MAP_COLS, 0);
    const bottom = gridToWorld(MAP_COLS, MAP_ROWS);
    const left = gridToWorld(0, MAP_ROWS);
    return {
      minX: left.wx - 45,
      maxX: right.wx + 45,
      minY: top.wy - 85, // 預留上方建築與招牌高度
      maxY: bottom.wy + 35
    };
  }

  function fitMapToScreen() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const b = getMapWorldBounds();
    const worldW = b.maxX - b.minX;
    const worldH = b.maxY - b.minY;

    const padX = 28;
    const padY = 36;
    const scaleX = (rect.width - padX * 2) / worldW;
    const scaleY = (rect.height - padY * 2) / worldH;
    camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, Math.min(scaleX, scaleY)));

    const centerX = (b.minX + b.maxX) / 2;
    const centerY = (b.minY + b.maxY) / 2;
    camera.x = rect.width / 2 - centerX * camera.zoom;
    camera.y = rect.height / 2 - centerY * camera.zoom;
  }

  function centerOnPlayer(targetZoom = null) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    if (targetZoom !== null) {
      camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, targetZoom));
    }
    const { wx, wy } = gridToWorld(player.renderX + 0.5, player.renderY + 0.5, 12);
    camera.x = rect.width / 2 - wx * camera.zoom;
    camera.y = rect.height / 2 - wy * camera.zoom;
  }

  function zoomAroundCenter(factor) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const oldZoom = camera.zoom;
    const newZoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, oldZoom * factor));
    if (newZoom === oldZoom) return;

    // 保持目前視野中心的世界座標不變
    const wx = (cx - camera.x) / oldZoom;
    const wy = (cy - camera.y) / oldZoom;
    camera.zoom = newZoom;
    camera.x = cx - wx * newZoom;
    camera.y = cy - wy * newZoom;
  }

  /* =========================================================
   * 9. Checkpoint 建立與句子回溯機制
   * ========================================================= */
  function createProgressForStep(x, y) {
    return {
      blocksWalked: 0,
      leftLastIntersection: !isIntersectionTile(x, y),
      lastIntersectionKey: isIntersectionTile(x, y) ? `${x},${y}` : '',
      turnedCorrectly: false
    };
  }

  function saveCheckpointForStep(stepIdx) {
    // 截斷該步驟之後的舊紀錄，寫入該句剛開始前的乾淨快照
    checkpoints = checkpoints.slice(0, stepIdx);
    checkpoints[stepIdx] = {
      stepIndex: stepIdx,
      x: player.x,
      y: player.y,
      dir: player.dir,
      progress: JSON.parse(JSON.stringify(stepProgress))
    };
  }

  function rollbackToStep(targetStepIdx) {
    if (targetStepIdx < 0 || targetStepIdx >= checkpoints.length) return;
    const cp = checkpoints[targetStepIdx];
    if (!cp) return;

    // 強制終止進行中的移動動畫
    player.isMoving = false;
    player.x = cp.x;
    player.y = cp.y;
    player.renderX = cp.x;
    player.renderY = cp.y;
    player.dir = cp.dir;

    currentStepIdx = targetStepIdx;
    missionCompleted = false;
    stepProgress = JSON.parse(JSON.stringify(cp.progress));

    // 移除被回溯句子之後的所有完成紀錄與 Checkpoint
    checkpoints = checkpoints.slice(0, targetStepIdx + 1);

    $('winBanner').classList.remove('show');
    updateHUD();
    renderKaraokePanel();
    centerOnPlayer();
    showToast(`已回到 Step ${targetStepIdx + 1} 起始位置與朝向`);
  }

  function loadMission(index) {
    currentMissionIdx = (index + MISSIONS.length) % MISSIONS.length;
    const m = MISSIONS[currentMissionIdx];
    $('missionSelect').value = String(currentMissionIdx);

    player.isMoving = false;
    player.x = m.start.x;
    player.y = m.start.y;
    player.renderX = m.start.x;
    player.renderY = m.start.y;
    player.dir = m.start.dir;

    currentStepIdx = 0;
    missionCompleted = false;
    checkpoints = [];
    stepProgress = createProgressForStep(player.x, player.y);

    // 在第 0 句開始執行前立即建立 Checkpoint[0]
    saveCheckpointForStep(0);

    $('winBanner').classList.remove('show');
    updateHUD();
    renderKaraokePanel();
    fitMapToScreen();
  }

  /* =========================================================
   * 10. 過程型與結果型導航條件判定器 (Trigger Engine)
   * ========================================================= */
  function advanceToNextStep() {
    const m = MISSIONS[currentMissionIdx];
    if (currentStepIdx < m.steps.length - 1) {
      currentStepIdx++;
      stepProgress = createProgressForStep(player.x, player.y);
      // 在新一句開始執行前立即儲存 Checkpoint
      saveCheckpointForStep(currentStepIdx);
      renderKaraokePanel();
      showToast(`✓ 完成！進入 Step ${currentStepIdx + 1}`, 'success');
    }
  }

  // 當角色「完成移動一格」後觸發的過程型判定
  function evaluateAfterMove() {
    if (missionCompleted) return;
    const m = MISSIONS[currentMissionIdx];
    const step = m.steps[currentStepIdx];
    if (!step) return;

    if (step.type === 'walk_blocks') {
      // 驗證角色是否朝正確方向走在路段上
      if (player.dir !== step.expectedDir) {
        renderKaraokePanel();
        return;
      }
      const onInter = isIntersectionTile(player.x, player.y);
      const key = `${player.x},${player.y}`;

      if (!onInter) {
        // 真正走進兩個路口之間的一般道路格（Road Segment）
        stepProgress.leftLastIntersection = true;
      } else if (onInter && stepProgress.leftLastIntersection && key !== stepProgress.lastIntersectionKey) {
        // 經過完整路段並進入下一個路口，計為 1 個真正的 Block
        stepProgress.blocksWalked++;
        stepProgress.leftLastIntersection = false;
        stepProgress.lastIntersectionKey = key;
      }

      // 達成條件：累積走完指定 Block 數，且抵達目標路口座標與正確面向
      if (
        stepProgress.blocksWalked >= step.targetBlocks &&
        player.x === step.targetX &&
        player.y === step.targetY &&
        player.dir === step.expectedDir
      ) {
        advanceToNextStep();
        return;
      }
    }
    renderKaraokePanel();
  }

  // 當角色「執行左轉／右轉」後觸發的過程型判定
  function evaluateAfterTurn(turnAction) {
    if (missionCompleted) return;
    const m = MISSIONS[currentMissionIdx];
    const step = m.steps[currentStepIdx];
    if (!step) return;

    if (step.type === 'turn_at') {
      // 必須位於指定路口，且轉向後面向等於目標面向
      if (player.x === step.atX && player.y === step.atY && player.dir === step.targetDir) {
        stepProgress.turnedCorrectly = true;
        advanceToNextStep();
        return;
      } else if (player.x !== step.atX || player.y !== step.atY) {
        showToast('請在指定的路口轉彎喔！可點句子回溯', 'warn');
      }
    }
    renderKaraokePanel();
  }

  // 當學生點擊地圖建築或招牌時的結果型判定
  function handleBuildingTap(building) {
    if (missionCompleted) return;
    const m = MISSIONS[currentMissionIdx];
    const step = m.steps[currentStepIdx];

    if (!step || step.type !== 'tap_building') {
      showToast(`這是 ${building.name}（${building.zh}），請先完成目前的導航步驟！`, 'warn');
      return;
    }

    if (building.id !== step.targetBuildingId) {
      showToast(`這裡是 ${building.name}（${building.zh}），再確認一下方位描述喔！`, 'warn');
      return;
    }

    // 檢查角色是否已經走到該建築周邊的合理道路位置
    const isNear = step.validPositions.some(p => p.x === player.x && p.y === player.y);
    if (!isNear) {
      showToast(`你找到了 ${building.name}，但請先操作角色走到它門口的道路！`, 'warn');
      return;
    }

    // 過關！
    missionCompleted = true;
    renderKaraokePanel();
    $('winTitle').textContent = `🎉 成功抵達 ${building.name}（${building.zh}）！`;
    $('winDesc').textContent = `太棒了！你完成了「${m.title}」的所有導航指令。`;
    $('winBanner').classList.add('show');
    showToast(`🎉 任務完成！抵達 ${building.name}！`, 'success');
  }

  /* =========================================================
   * 11. 角色操作：左轉、直走、右轉（含動畫鎖定）
   * ========================================================= */
  function turnLeft() {
    if (player.isMoving || missionCompleted) return;
    player.dir = (player.dir + 3) % 4;
    updateHUD();
    evaluateAfterTurn('left');
  }

  function turnRight() {
    if (player.isMoving || missionCompleted) return;
    player.dir = (player.dir + 1) % 4;
    updateHUD();
    evaluateAfterTurn('right');
  }

  function goStraight() {
    if (player.isMoving || missionCompleted) return;
    const d = DIRECTIONS[player.dir];
    const nx = player.x + d.dx;
    const ny = player.y + d.dy;

    if (!isRoadTile(nx, ny)) {
      showToast('前方不是道路，請先轉彎或點句子回溯！', 'warn');
      return;
    }

    player.isMoving = true;
    player.fromX = player.x;
    player.fromY = player.y;
    player.x = nx;
    player.y = ny;
    player.animStart = performance.now();
    updateHUD();
  }

  /* =========================================================
   * 12. UI 更新：HUD 與卡拉 OK 導航面板渲染
   * ========================================================= */
  function updateHUD() {
    const d = DIRECTIONS[player.dir];
    $('hudDirText').textContent = d.label;
    $('coordInfo').textContent = `座標 (${player.x}, ${player.y}) · 面向${d.label}`;
  }

  function renderKaraokePanel() {
    const m = MISSIONS[currentMissionIdx];
    const list = $('karaokeList');
    list.innerHTML = '';

    const completedCount = missionCompleted ? m.steps.length : currentStepIdx;
    $('stepProgressPill').textContent = `已完成 ${completedCount} / ${m.steps.length}`;

    m.steps.forEach((step, idx) => {
      const card = document.createElement('div');
      let stateClass = 'upcoming';
      if (missionCompleted || idx < currentStepIdx) stateClass = 'done';
      else if (idx === currentStepIdx) stateClass = 'active';

      card.className = `step-card ${stateClass}`;

      const meta = document.createElement('div');
      meta.className = 'step-meta';

      const badge = document.createElement('span');
      badge.className = 'step-badge';
      if (stateClass === 'done') {
        badge.textContent = `✓ STEP ${idx + 1} · 已完成`;
      } else if (stateClass === 'active') {
        badge.textContent = `▶ STEP ${idx + 1} · 目前執行`;
      } else {
        badge.textContent = `STEP ${idx + 1} · 下一步`;
      }
      meta.appendChild(badge);

      // 已完成或目前執行中的句子皆可點擊回溯
      if (stateClass === 'done' || stateClass === 'active') {
        const rb = document.createElement('span');
        rb.className = 'rollback-tag';
        rb.textContent = stateClass === 'active' ? '↺ 重走本句' : '↺ 點擊回溯';
        meta.appendChild(rb);
        card.onclick = () => rollbackToStep(idx);
      }

      const en = document.createElement('p');
      en.className = 'step-en';
      en.textContent = step.en;

      const zh = document.createElement('p');
      zh.className = 'step-zh';
      zh.textContent = step.zh;

      card.append(meta, en, zh);

      // 若為目前執行中的句子，顯示即時進度提示
      if (stateClass === 'active') {
        const sub = document.createElement('div');
        sub.className = 'step-substatus';
        if (step.type === 'walk_blocks') {
          sub.innerHTML = `<span>🚶 街區進度：${Math.min(stepProgress.blocksWalked, step.targetBlocks)} / ${step.targetBlocks} block(s)</span><span>需朝向：${DIRECTIONS[step.expectedDir].label}</span>`;
        } else if (step.type === 'turn_at') {
          const atIntersection = (player.x === step.atX && player.y === step.atY);
          sub.innerHTML = `<span>${atIntersection ? '✅ 已在指定路口，請轉彎' : `📍 請在路口 (${step.atX}, ${step.atY}) 轉彎`}</span><span>目標面向：${DIRECTIONS[step.targetDir].label}</span>`;
        } else if (step.type === 'tap_building') {
          sub.innerHTML = `<span>👆 請直接點擊地圖上的目標建築招牌！</span>`;
        }
        card.appendChild(sub);
      }

      list.appendChild(card);

      // 桌機版自動將目前句子平滑置中顯示
      if (stateClass === 'active' && window.innerWidth > 790) {
        setTimeout(() => {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 40);
      }
    });
  }

  /* =========================================================
   * 13. Canvas 2.5D 繪圖引擎（含退縮綠地、縮小建築、無髮鴨舌帽人、X-Ray 透明）
   * ========================================================= */
  function drawIsoTilePolygon(gx, gy, w, h, gz, fillStyle, strokeStyle = null, lineWidth = 1) {
    const p0 = gridToScreen(gx, gy, gz);
    const p1 = gridToScreen(gx + w, gy, gz);
    const p2 = gridToScreen(gx + w, gy + h, gz);
    const p3 = gridToScreen(gx, gy + h, gz);

    ctx.beginPath();
    ctx.moveTo(p0.sx, p0.sy);
    ctx.lineTo(p1.sx, p1.sy);
    ctx.lineTo(p2.sx, p2.sy);
    ctx.lineTo(p3.sx, p3.sy);
    ctx.closePath();

    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth * camera.zoom;
      ctx.stroke();
    }
  }

  function drawIslandBase() {
    const depth = SLAB_DEPTH * camera.zoom;
    const pLeft = gridToScreen(0, MAP_ROWS, 0);
    const pBottom = gridToScreen(MAP_COLS, MAP_ROWS, 0);
    const pRight = gridToScreen(MAP_COLS, 0, 0);

    // 左下泥土切面
    ctx.beginPath();
    ctx.moveTo(pLeft.sx, pLeft.sy);
    ctx.lineTo(pBottom.sx, pBottom.sy);
    ctx.lineTo(pBottom.sx, pBottom.sy + depth);
    ctx.lineTo(pLeft.sx, pLeft.sy + depth);
    ctx.closePath();
    ctx.fillStyle = '#9c6b43';
    ctx.fill();

    // 右下泥土切面
    ctx.beginPath();
    ctx.moveTo(pBottom.sx, pBottom.sy);
    ctx.lineTo(pRight.sx, pRight.sy);
    ctx.lineTo(pRight.sx, pRight.sy + depth);
    ctx.lineTo(pBottom.sx, pBottom.sy + depth);
    ctx.closePath();
    ctx.fillStyle = '#7c5130';
    ctx.fill();
  }

  function drawGroundGrid() {
    const m = MISSIONS[currentMissionIdx];
    const activeStep = m.steps[currentStepIdx];

    for (let y = 0; y < MAP_ROWS; y++) {
      for (let x = 0; x < MAP_COLS; x++) {
        const road = isRoadTile(x, y);
        const inter = isIntersectionTile(x, y);

        if (road) {
          // 道路格與路口格區分
          const fill = inter ? '#475569' : '#64748b';
          drawIsoTilePolygon(x, y, 1, 1, 0, fill, '#526277', 0.8);

          // 路口繪製十字斑馬線點綴，一般道路繪製白色中線
          const c = gridToScreen(x + 0.5, y + 0.5, 0);
          if (inter) {
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.beginPath();
            ctx.arc(c.sx, c.sy, 4.5 * camera.zoom, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.65)';
            ctx.lineWidth = 1.6 * camera.zoom;
            ctx.beginPath();
            if (ROAD_X.has(x)) {
              const a = gridToScreen(x + 0.5, y + 0.25, 0);
              const b = gridToScreen(x + 0.5, y + 0.75, 0);
              ctx.moveTo(a.sx, a.sy);
              ctx.lineTo(b.sx, b.sy);
            } else {
              const a = gridToScreen(x + 0.25, y + 0.5, 0);
              const b = gridToScreen(x + 0.75, y + 0.5, 0);
              ctx.moveTo(a.sx, a.sy);
              ctx.lineTo(b.sx, b.sy);
            }
            ctx.stroke();
          }

          // 若目前步驟有指定轉彎路口或目標路口，給予溫和光圈提示
          if (!missionCompleted && activeStep) {
            const isTargetNode =
              (activeStep.type === 'walk_blocks' && activeStep.targetX === x && activeStep.targetY === y) ||
              (activeStep.type === 'turn_at' && activeStep.atX === x && activeStep.atY === y);
            if (isTargetNode) {
              drawIsoTilePolygon(x + 0.12, y + 0.12, 0.76, 0.76, 1, 'rgba(250, 204, 21, 0.28)', '#f59e0b', 1.8);
            }
          }
        } else {
          // 草地格（棋盤深淺綠）
          const grassColor = (x + y) % 2 === 0 ? '#86efac' : '#74e39a';
          drawIsoTilePolygon(x, y, 1, 1, 0, grassColor, '#65d68c', 0.6);
        }
      }
    }

    // 繪製草地小花裝飾
    GRASS_FLOWERS.forEach(f => {
      const p = gridToScreen(f.x + 0.5, f.y + 0.5, 1);
      ctx.fillStyle = f.c;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, 3.2 * camera.zoom, 0, Math.PI * 2);
      ctx.fill();
    });

    // 繪製街名標示
    STREET_LABELS.forEach(st => {
      const p = gridToScreen(st.x + 0.5, st.y + 0.5, 2);
      ctx.save();
      ctx.font = `900 ${Math.max(9, Math.round(10.5 * camera.zoom))}px 'Trebuchet MS', sans-serif`;
      const tw = ctx.measureText(st.text).width;
      const pw = tw + 10 * camera.zoom;
      const ph = 16 * camera.zoom;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      ctx.beginPath();
      ctx.roundRect(p.sx - pw / 2, p.sy - ph / 2, pw, ph, 5 * camera.zoom);
      ctx.fill();
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.text, p.sx, p.sy);
      ctx.restore();
    });
  }

  // 繪製 3D 建築（基地保留退縮綠地，房屋本體縮小至 64% 並置中，支援 X-Ray 半透明）
  function drawBuilding(b) {
    // 1. 建築基地綠地退縮墊
    drawIsoTilePolygon(b.x + 0.06, b.y + 0.06, b.w - 0.12, b.h - 0.12, 2, '#bbf7d0', '#86efac', 1);

    // 檢查是否遮擋後方的角色（X-Ray 動態透明判定）
    const px = player.renderX;
    const py = player.renderY;
    const bFrontSum = (b.x + b.w) + (b.y + b.h);
    const pSum = px + py + 1;
    const isOccludingPlayer =
      !b.isPark &&
      pSum < bFrontSum &&
      px >= b.x - 1.2 && px <= b.x + b.w + 0.4 &&
      py >= b.y - 1.2 && py <= b.y + b.h + 0.4;

    ctx.save();
    if (isOccludingPlayer) {
      ctx.globalAlpha = 0.38;
    }

    // 2. 以基地中心定位，縮小建築本體至基地寬長的 64%
    const scale = b.isPark ? 0.84 : 0.64;
    const bw = b.w * scale;
    const bh = b.h * scale;
    const bx = b.x + (b.w - bw) / 2;
    const by = b.y + (b.h - bh) / 2;
    const heightZ = b.isPark ? 7 : 26; // 降低高度約 60%，不壓迫道路

    const pTop = gridToScreen(bx, by, heightZ);
    const pRight = gridToScreen(bx + bw, by, heightZ);
    const pBottom = gridToScreen(bx + bw, by + bh, heightZ);
    const pLeft = gridToScreen(bx, by + bh, heightZ);

    const bRight = gridToScreen(bx + bw, by, 2);
    const bBottom = gridToScreen(bx + bw, by + bh, 2);
    const bLeft = gridToScreen(bx, by + bh, 2);

    // 左下正面牆
    ctx.beginPath();
    ctx.moveTo(pLeft.sx, pLeft.sy);
    ctx.lineTo(pBottom.sx, pBottom.sy);
    ctx.lineTo(bBottom.sx, bBottom.sy);
    ctx.lineTo(bLeft.sx, bLeft.sy);
    ctx.closePath();
    ctx.fillStyle = b.wall;
    ctx.fill();
    ctx.strokeStyle = b.side;
    ctx.lineWidth = 1 * camera.zoom;
    ctx.stroke();

    // 右下側面牆
    ctx.beginPath();
    ctx.moveTo(pBottom.sx, pBottom.sy);
    ctx.lineTo(pRight.sx, pRight.sy);
    ctx.lineTo(bRight.sx, bRight.sy);
    ctx.lineTo(bBottom.sx, bBottom.sy);
    ctx.closePath();
    ctx.fillStyle = b.side;
    ctx.fill();
    ctx.stroke();

    // 屋頂面
    ctx.beginPath();
    ctx.moveTo(pTop.sx, pTop.sy);
    ctx.lineTo(pRight.sx, pRight.sy);
    ctx.lineTo(pBottom.sx, pBottom.sy);
    ctx.lineTo(pLeft.sx, pLeft.sy);
    ctx.closePath();
    ctx.fillStyle = b.roof;
    ctx.fill();
    ctx.strokeStyle = b.accent;
    ctx.lineWidth = 1.5 * camera.zoom;
    ctx.stroke();

    // 公園小樹或一般建築門口點綴
    const centerGround = gridToScreen(b.x + b.w * 0.14, b.y + b.h * 0.86, 3);
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(centerGround.sx, centerGround.sy, 4 * camera.zoom, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // 記錄建築本體點擊範圍
    buildingHitBoxes.push({
      building: b,
      x1: Math.min(pLeft.sx, bLeft.sx),
      y1: pTop.sy - 28 * camera.zoom,
      x2: Math.max(pRight.sx, bRight.sx),
      y2: bBottom.sy
    });
  }

  // 獨立繪製水平清楚的建築英文招牌（最後一層繪製，不遮住小人且方便點擊）
  function drawBuildingSign(b) {
    const m = MISSIONS[currentMissionIdx];
    const step = m.steps[currentStepIdx];
    const isTapStep = !missionCompleted && step && step.type === 'tap_building';

    const heightZ = b.isPark ? 18 : 38;
    const center = gridToScreen(b.x + b.w / 2, b.y + b.h / 2, heightZ);

    ctx.save();
    const fontSize = Math.max(11, Math.round(12.5 * camera.zoom));
    ctx.font = `900 ${fontSize}px 'Trebuchet MS', 'Noto Sans TC', sans-serif`;
    const labelText = `${b.icon} ${b.name}`;
    const textW = ctx.measureText(labelText).width;
    const padX = 9 * camera.zoom;
    const boxW = textW + padX * 2;
    const boxH = 23 * camera.zoom;
    const bx = center.sx - boxW / 2;
    const by = center.sy - boxH / 2;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.strokeStyle = isTapStep ? '#f59e0b' : b.accent;
    ctx.lineWidth = (isTapStep ? 2.4 : 1.8) * camera.zoom;

    ctx.beginPath();
    ctx.roundRect(bx, by, boxW, boxH, 999);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labelText, center.sx, center.sy + 0.5);
    ctx.restore();

    // 將招牌本身也加入精準點擊判定區
    buildingHitBoxes.push({
      building: b,
      x1: bx - 4,
      y1: by - 4,
      x2: bx + boxW + 4,
      y2: by + boxH + 4
    });
  }

  // 繪製無頭髮、藍色鴨舌帽、大眼睛的四向 Q 版角色
  function drawPlayerCharacter() {
    const pos = gridToScreen(player.renderX + 0.5, player.renderY + 0.5, 2);
    const z = camera.zoom;
    const d = DIRECTIONS[player.dir];

    ctx.save();
    ctx.translate(pos.sx, pos.sy);

    // 1. 腳底柔和陰影與微幅朝向小尖角（不放過長指示棒）
    ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 2 * z, 11 * z, 6.5 * z, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2. 雙腿
    ctx.fillStyle = '#1e3a8a';
    ctx.fillRect(-5 * z, -9 * z, 4 * z, 9 * z);
    ctx.fillRect(1 * z, -9 * z, 4 * z, 9 * z);

    // 3. 身體上衣（鮮明湖水綠）
    ctx.fillStyle = '#0d9488';
    ctx.beginPath();
    ctx.roundRect(-7.5 * z, -21 * z, 15 * z, 13 * z, 3.5 * z);
    ctx.fill();
    ctx.strokeStyle = '#115e59';
    ctx.lineWidth = 1.2 * z;
    ctx.stroke();

    // 背面朝向 (dir 0 右上↗、dir 3 左上↖) 時，背後畫出小背包
    if (player.dir === 0 || player.dir === 3) {
      const packX = player.dir === 0 ? -5.5 * z : -2.5 * z;
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.roundRect(packX, -19.5 * z, 8 * z, 9.5 * z, 2 * z);
      ctx.fill();
    }

    // 4. 無頭髮圓潤頭部（完全移除棕色頭髮，避免干擾左右判斷）
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.roundRect(-8.5 * z, -35 * z, 17 * z, 15 * z, 5 * z);
    ctx.fill();
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.1 * z;
    ctx.stroke();

    // 5. 依四個實際方向繪製大眼睛與藍色鴨舌帽帽簷
    //    dir 0: 右上 ↗ (背對偏右，帽簷朝右上突出，不畫正臉眼睛)
    //    dir 1: 右下 ↘ (正臉朝右下，大眼睛在右側，帽簷朝右下突出)
    //    dir 2: 左下 ↙ (正臉朝左下，大眼睛在左側，帽簷朝左下突出)
    //    dir 3: 左上 ↖ (背對偏左，帽簷朝左上突出，不畫正臉眼睛)

    if (player.dir === 1) {
      // 面向右下 ↘：大大的白色眼睛與黑瞳孔偏右
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(1.5 * z, -27 * z, 3.1 * z, 3.6 * z, 0, 0, Math.PI * 2);
      ctx.ellipse(6.5 * z, -26.5 * z, 2.8 * z, 3.4 * z, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(2.4 * z, -26.6 * z, 1.6 * z, 0, Math.PI * 2);
      ctx.arc(7.2 * z, -26.1 * z, 1.5 * z, 0, Math.PI * 2);
      ctx.fill();
    } else if (player.dir === 2) {
      // 面向左下 ↙：大大的白色眼睛與黑瞳孔偏左
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-6.5 * z, -26.5 * z, 2.8 * z, 3.4 * z, 0, 0, Math.PI * 2);
      ctx.ellipse(-1.5 * z, -27 * z, 3.1 * z, 3.6 * z, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-7.2 * z, -26.1 * z, 1.5 * z, 0, Math.PI * 2);
      ctx.arc(-2.4 * z, -26.6 * z, 1.6 * z, 0, Math.PI * 2);
      ctx.fill();
    } else if (player.dir === 0) {
      // 面向右上 ↗：背面與右側臉頰，僅露出右眼側邊一點點高光
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(7.2 * z, -27.5 * z, 1.6 * z, 2.5 * z, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (player.dir === 3) {
      // 面向左上 ↖：背面與左側臉頰，僅露出左眼側邊一點點高光
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-7.2 * z, -27.5 * z, 1.6 * z, 2.5 * z, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 6. 藍色鴨舌帽本體（Cap Crown）
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.roundRect(-9.2 * z, -40 * z, 18.4 * z, 8.5 * z, 4.2 * z);
    ctx.fill();
    ctx.strokeStyle = '#1e40af';
    ctx.lineWidth = 1.2 * z;
    ctx.stroke();

    // 帽子頂部小圓鈕
    ctx.fillStyle = '#93c5fd';
    ctx.beginPath();
    ctx.arc(0, -40 * z, 2 * z, 0, Math.PI * 2);
    ctx.fill();

    // 7. 鴨舌帽簷（Cap Brim）：依四個方向明確朝該斜角伸出
    ctx.fillStyle = '#1d4ed8';
    ctx.strokeStyle = '#1e3a8a';
    ctx.lineWidth = 1.2 * z;
    ctx.beginPath();
    if (player.dir === 1) {
      // 右下 ↘ 帽簷
      ctx.moveTo(0 * z, -33.5 * z);
      ctx.lineTo(15.5 * z, -29.5 * z);
      ctx.lineTo(12.5 * z, -26.5 * z);
      ctx.lineTo(-2 * z, -31.5 * z);
    } else if (player.dir === 2) {
      // 左下 ↙ 帽簷
      ctx.moveTo(0 * z, -33.5 * z);
      ctx.lineTo(-15.5 * z, -29.5 * z);
      ctx.lineTo(-12.5 * z, -26.5 * z);
      ctx.lineTo(2 * z, -31.5 * z);
    } else if (player.dir === 0) {
      // 右上 ↗ 帽簷（往右上方斜角突出）
      ctx.moveTo(2 * z, -36 * z);
      ctx.lineTo(15.5 * z, -39.5 * z);
      ctx.lineTo(13 * z, -34.5 * z);
      ctx.lineTo(3 * z, -33 * z);
    } else if (player.dir === 3) {
      // 左上 ↖ 帽簷（往左上方斜角突出）
      ctx.moveTo(-2 * z, -36 * z);
      ctx.lineTo(-15.5 * z, -39.5 * z);
      ctx.lineTo(-13 * z, -34.5 * z);
      ctx.lineTo(-3 * z, -33 * z);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 背面朝向時加上帽子後方調整扣帶，強化後腦勺辨識
    if (player.dir === 0 || player.dir === 3) {
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(-4 * z, -34 * z, 8 * z, 2.3 * z);
    }

    ctx.restore();
  }

  /* =========================================================
   * 14. 主繪圖迴圈（單一實例保護，避免重複啟動）
   * ========================================================= */
  let rafId = null;

  function renderFrame(now) {
    // 處理角色平滑移動插值
    if (player.isMoving) {
      const elapsed = now - player.animStart;
      const t = Math.min(1, elapsed / player.animDuration);
      const ease = t * (2 - t);
      player.renderX = player.fromX + (player.x - player.fromX) * ease;
      player.renderY = player.fromY + (player.y - player.fromY) * ease;

      if (t >= 1) {
        player.renderX = player.x;
        player.renderY = player.y;
        player.isMoving = false;
        evaluateAfterMove();
      }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    buildingHitBoxes = [];

    // 1. 島嶼底座與地面格網
    drawIslandBase();
    drawGroundGrid();

    // 2. 深度排序（Painter's Algorithm）：將 12 座建築與角色依 (x + y) 排序繪製
    const renderables = [];
    BUILDINGS.forEach(b => {
      renderables.push({
        type: 'building',
        depth: (b.x + b.w * 0.5) + (b.y + b.h * 0.5),
        data: b
      });
    });
    renderables.push({
      type: 'player',
      depth: (player.renderX + 0.5) + (player.renderY + 0.5) + 0.15
    });

    renderables.sort((a, b) => a.depth - b.depth);

    renderables.forEach(item => {
      if (item.type === 'building') {
        drawBuilding(item.data);
      } else {
        drawPlayerCharacter();
      }
    });

    // 3. 最上層繪製水平建築招牌（確保清晰可讀且點擊熱區準確）
    BUILDINGS.forEach(b => drawBuildingSign(b));

    rafId = requestAnimationFrame(renderFrame);
  }

  /* =========================================================
   * 15. Canvas 尺寸調整與手勢互動（拖曳平移、雙指縮放、點擊建築）
   * ========================================================= */
  function resizeCanvas() {
    const view = $('islandView');
    const rect = view.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let camStartX = 0;
  let camStartY = 0;
  let movedDistance = 0;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;

  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    movedDistance = 0;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    camStartX = camera.x;
    camStartY = camera.y;
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    movedDistance = Math.hypot(dx, dy);
    camera.x = camStartX + dx;
    camera.y = camStartY + dy;
  });

  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    if (movedDistance < 6) {
      handleCanvasTap(e.clientX, e.clientY);
    }
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoomAroundCenter(factor);
  }, { passive: false });

  // 手機單指平移與雙指縮放（僅作用於 Canvas，不干擾頁面上下捲動）
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      isDragging = true;
      movedDistance = 0;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      camStartX = camera.x;
      camStartY = camera.y;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartZoom = camera.zoom;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      movedDistance = Math.hypot(dx, dy);
      camera.x = camStartX + dx;
      camera.y = camStartY + dy;
    } else if (e.touches.length === 2 && pinchStartDist > 0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const targetZoom = pinchStartZoom * (dist / pinchStartDist);
      zoomAroundCenter(targetZoom / camera.zoom);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (isDragging && movedDistance < 8 && e.changedTouches.length === 1) {
      const t = e.changedTouches[0];
      handleCanvasTap(t.clientX, t.clientY);
    }
    if (e.touches.length === 0) {
      isDragging = false;
      pinchStartDist = 0;
    }
  });

  function handleCanvasTap(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;

    // 1. 優先檢查是否點擊到建築招牌或本體熱區（由上層往底層找）
    for (let i = buildingHitBoxes.length - 1; i >= 0; i--) {
      const box = buildingHitBoxes[i];
      if (sx >= box.x1 && sx <= box.x2 && sy >= box.y1 && sy <= box.y2) {
        handleBuildingTap(box.building);
        return;
      }
    }

    // 2. 次要檢查：反推點擊的格子座標是否落在某棟建築基地內
    const { gx, gy } = screenToGrid(sx, sy);
    const hitB = BUILDINGS.find(b => gx >= b.x && gx < b.x + b.w && gy >= b.y && gy < b.y + b.h);
    if (hitB) {
      handleBuildingTap(hitB);
    }
  }

  /* =========================================================
   * 16. 事件綁定與初始化
   * ========================================================= */
  function initEvents() {
    // 題目選單初始化
    const sel = $('missionSelect');
    MISSIONS.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = m.title;
      sel.appendChild(opt);
    });
    sel.onchange = () => loadMission(Number(sel.value));

    // 頂部工具列按鈕
    $('btnSpeak').onclick = () => {
      const m = MISSIONS[currentMissionIdx];
      const step = m.steps[currentStepIdx];
      if (step) speakText(step.en);
    };
    $('btnNextMission').onclick = () => loadMission(currentMissionIdx + 1);
    $('btnBannerNext').onclick = () => loadMission(currentMissionIdx + 1);
    $('btnResetMission').onclick = () => {
      rollbackToStep(0);
      showToast('已重置本題至最初起點');
    };

    // 地圖控制鈕
    $('btnZoomIn').onclick = () => zoomAroundCenter(1.2);
    $('btnZoomOut').onclick = () => zoomAroundCenter(0.84);
    $('btnCenterPlayer').onclick = () => centerOnPlayer(1.15);
    $('btnFitMap').onclick = () => fitMapToScreen();

    // 角色操作三鍵
    $('btnTurnLeft').onclick = turnLeft;
    $('btnGoStraight').onclick = goStraight;
    $('btnTurnRight').onclick = turnRight;

    // 鍵盤方向鍵支援（大電視外接鍵盤或筆電操作）
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        turnLeft();
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        goStraight();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        turnRight();
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      fitMapToScreen();
    });
  }

  function startApp() {
    resizeCanvas();
    initEvents();
    loadMission(0);
    if (!rafId) {
      rafId = requestAnimationFrame(renderFrame);
    }
  }

  startApp();
})();
</script>
</body>
</html>
