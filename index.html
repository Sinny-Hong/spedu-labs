<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINNY SPEDU LABS | 特教創新實驗室</title>
    <!-- 使用 Tailwind CSS 快速美化介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Noto Sans TC 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽與大 LOGO 區（深色系底凸顯 Logo） -->
    <header class="bg-[#0B2240] shadow-md py-6">
        <div class="max-w-6xl mx-auto px-6 flex flex-col items-center justify-center text-center">
            <!-- 插入橫版 Logo，調整至精準比例大小 -->
            <img src="logo-landscape.png" alt="SINNY SPEDU LABS" class="h-24 md:h-28 object-contain">
        </div>
    </header>

    <!-- 主內容區：左側網站介紹 + 右側按鈕目錄 -->
    <main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full flex flex-col md:flex-row gap-10 items-start">
        
        <!-- 左側：網站核心介紹語錄 -->
        <div class="w-full md:w-1/3 bg-white/60 backdrop-blur-sm p-8 rounded-2xl border border-slate-200/60 shadow-sm md:sticky md:top-6">
            <h2 class="text-xl font-bold text-slate-800 tracking-wider mb-4 border-b border-slate-200 pb-2">網站介紹</h2>
            <p class="text-slate-600 leading-relaxed text-base font-medium tracking-wide whitespace-pre-line">
                希望每個異想天開的想法，
                都能成為點亮生命的瞬間。
            </p>
        </div>

        <!-- 右側：主目錄選單區（單色文青風圖示置左） -->
        <div class="w-full md:w-2/3 grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- 1. 班級經營桌面 -->
            <a href="board/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 儀表板圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">班級經營桌面</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Classroom Board</p>
                </div>
            </a>

            <!-- 2. 英文教學 -->
            <a href="english/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 書本圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">英文教學</h3>
                    <p class="text-xs text-slate-400 mt-0.5">English Learning</p>
                </div>
            </a>

            <!-- 3. 互動遊戲 -->
            <a href="game/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 搖桿圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">互動小遊戲</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Classroom Games</p>
                </div>
            </a>

            <!-- 4. 特教資訊 -->
            <a href="info/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 喇叭圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">特教資訊</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Special Edu Info</p>
                </div>
            </a>

            <!-- 5. 生活管理 -->
            <a href="life/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 行事曆圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">生活管理</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Life Skills</p>
                </div>
            </a>

            <!-- 6. 數學功能 -->
            <a href="math/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 計算機圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 11h.01M9 11h.01M12 7h.01M15 11h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">數學功能</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Math Tools</p>
                </div>
            </a>

            <!-- 7. 社交技巧 -->
            <a href="social/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 握手/社交圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">社交技巧</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Social Skills</p>
                </div>
            </a>

            <!-- 8. 其他試作 -->
            <a href="other/" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200/80 transition-all duration-200 flex items-center gap-4">
                <div class="text-[#0B2240] bg-slate-50 p-3 rounded-lg group-hover:bg-indigo-50 transition-colors">
                    <!-- 燒杯/實驗圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <div class="text-left">
                    <h3 class="font-bold text-slate-700 text-base group-hover:text-indigo-600">其他試作</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Other Labs</p>
                </div>
            </a>

        </div>
    </main>

    <!-- 底部版權與單純連結區（與頂部同色系） -->
    <footer class="bg-[#0B2240] text-slate-400 py-8 border-t border-slate-800 text-sm">
        <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left text-xs text-slate-400">
                <p class="font-semibold text-slate-300 mb-1">SINNY SPEDU LABS &copy; 2026</p>
                <p>本站內容皆為特殊教育教學與實驗用途，歡迎引用，引用時請註明出處。</p>
            </div>
            
            <!-- 單純的按鈕連結，拿掉 QR code 圖片 -->
            <div>
                <a href="https://lin.ee/ZB5eGqO" target="_blank" class="inline-flex items-center gap-2 bg-[#06C755] hover:bg-[#05b34c] text-white font-bold px-5 py-2 rounded-xl text-xs shadow-sm transition-colors duration-150">
                    💬 聯絡官方帳號
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
