<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數學教材｜Sinny Spedu Labs</title>
  <link rel="stylesheet" href="../shared/css/workspace.css">
</head>
<body>
  <button class="mobile-toggle" id="mobileToggle" aria-label="開啟分類選單">☰</button>
  <div class="workspace-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand-home" href="../index.html" aria-label="回到異想教室首頁"><img src="../assets/logo-banner.png" alt="Sinny Spedu Labs"></a>
      <div class="workspace-name"><small>MATH WORKSPACE</small><strong>數學教材</strong></div>
      <nav class="category-nav" aria-label="教材分類">
        <button class="category-btn active" data-filter="all">全部教材</button>
        <button class="category-btn" data-filter="worksheet">數學講義</button>
        <button class="category-btn" data-filter="game">互動遊戲</button>
      </nav>
      <p class="sidebar-note">點擊上方橫標即可回到異想教室首頁。</p>
    </aside>
    <main class="main">
      <header class="topbar"><div class="title-block"><p>SINNY SPEDU LABS</p><h1>數學教材工作區</h1></div><a class="home-link" href="../index.html">回到首頁</a></header>
      <div class="search-row"><input class="search-box" id="resourceSearch" type="search" placeholder="搜尋數學教材…" aria-label="搜尋數學教材"><div class="count-badge" id="resultCount"></div></div>
      <h2 class="section-heading">教材與活動</h2>
      <section class="card-grid">
        <article class="resource-card" data-category="worksheet"><div class="card-top"><span class="tag">數學講義</span><button class="favorite" data-id="dating" aria-label="收藏約會大作戰">★</button></div><h2>實用數學講義｜約會大作戰</h2><p>從生活情境練習時間、金錢與規劃。</p><a class="card-link" href="實用數學講義-約會大作戰(教師版).pdf">開啟講義 →</a></article>
        <article class="resource-card" data-category="worksheet"><div class="card-top"><span class="tag">數學講義</span><button class="favorite" data-id="motorcycle" aria-label="收藏重機圓夢">★</button></div><h2>實用數學講義｜重機圓夢</h2><p>以購車與生活規劃為主題的實用數學教材。</p><a class="card-link" href="實用數學講義-重機圓夢.pdf">開啟講義 →</a></article>
        <article class="resource-card is-placeholder" data-category="game"><div class="card-top"><span class="tag">互動遊戲</span></div><h2>數學互動遊戲</h2><p>分類入口已預留，之後新增遊戲即可放入。</p><span class="card-link">教材準備中</span></article>
      </section>
      <div class="empty-state" id="emptyState">目前沒有符合條件的教材。</div>
    </main>
  </div>
  <script src="../shared/js/workspace.js"></script>
</body>
</html>
