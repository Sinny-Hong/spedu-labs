<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>異想教室段考成績通知單</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #64748b;
      --panel: #ffffff;
      --page: #ffffff;
      --workspace: #f1f5f9;
      --navy: #0f172a;
      --blue: #2563eb;
      --green: #059669;
      --border: #cbd5e1;
      --row-height: 1.3cm;
      --print-font-size: 18pt;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: var(--workspace);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    button, select, input { font: inherit; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 72px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #fff;
      background: var(--navy);
      box-shadow: 0 3px 10px #0f172a33;
    }
    .brand h1 { margin: 0 0 3px; font-size: 20px; }
    .brand p { margin: 0; color: #94a3b8; font-size: 12px; }
    .layout {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 96px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      padding: 18px;
      background: var(--panel);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0f172a12;
    }
    .card h2 {
      margin: 0 0 14px;
      color: #64748b;
      font-size: 13px;
      letter-spacing: .08em;
    }
    .field { display: block; margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field span { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; }
    .field select, .field input {
      width: 100%;
      height: 40px;
      padding: 6px 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #94a3b8;
      border-radius: 7px;
    }
    .button-stack { display: grid; gap: 10px; }
    .button {
      min-height: 42px;
      padding: 8px 12px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
    }
    .button.green { background: var(--green); }
    .button.slate { background: #475569; }
    .button.small { min-height: 36px; font-size: 13px; }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .adjuster {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .value-readout {
      margin: 6px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .tip, .status {
      margin: 0;
      color: #475569;
      font-size: 12px;
      line-height: 1.65;
    }
    .status.error { color: #b91c1c; }
    .student-filter-list {
      max-height: 310px;
      margin-top: 10px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
    }
    .student-filter-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px 9px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
      cursor: pointer;
    }
    .student-filter-item:last-child { border-bottom: 0; }
    .student-filter-item:hover { background: #f8fafc; }
    .student-filter-item input { width: 17px; height: 17px; accent-color: var(--blue); }
    .student-filter-item.excluded { color: #94a3b8; text-decoration: line-through; }
    .filter-summary { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .preview-title {
      margin: 0 0 8px 4px;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
    }
    .paper {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 24px;
      padding: 16mm 12mm;
      background: var(--page);
      box-shadow: 0 12px 28px #0f172a2b;
    }
    .notice {
      color: #000;
      font-family: "DFKai-SB", "BiauKai", "標楷體", "PMingLiU", serif;
      font-size: var(--print-font-size);
      line-height: 1.3;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .notice + .notice { margin-top: 18mm; }
    .notice-title {
      margin: 0 0 1.5mm;
      text-align: center;
      font-size: 1em;
      font-weight: 400;
      white-space: nowrap;
    }
    .teacher-name {
      margin: 0 0 1.5mm 9mm;
      font-size: 1.18em;
      font-weight: 700;
      line-height: 1.25;
    }
    .teacher-name .name { text-decoration: underline; text-underline-offset: 3px; }
    .grade-table {
      width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: .8em;
    }
    .grade-table th, .grade-table td {
      height: var(--row-height);
      padding: 1mm .8mm;
      border: 1px solid #000;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
      font-weight: 400;
    }
    .grade-table th { height: auto; min-height: 9mm; white-space: nowrap; }
    .col-class { width: 9%; }
    .col-seat { width: 8%; }
    .col-name { width: 14%; }
    .col-original { width: 16%; }
    .col-daily { width: 16%; }
    .col-withdrawn { width: 17%; }
    .col-resource { width: 20%; }
    .notes { margin-top: 2mm; font-size: .68em; line-height: 1.45; }
    .notes p { margin: 0; }
    .empty {
      padding: 60mm 10mm;
      color: #64748b;
      text-align: center;
      font-family: "Microsoft JhengHei", sans-serif;
      font-size: 16px;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 240px minmax(0, 1fr); padding: 16px; }
      .preview { overflow-x: auto; }
    }
    @page { size: A4 portrait; margin: 16mm 12mm; }
    @media print {
      html, body { width: 210mm; min-height: auto; background: #fff; }
      .no-print { display: none !important; }
      .layout { display: block; width: auto; margin: 0; padding: 0; }
      .preview { overflow: visible; }
      .paper { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
      .notice { break-inside: avoid-page !important; page-break-inside: avoid !important; }
      .notice + .notice { margin-top: 12mm; }
    }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <h1>異想教室段考成績通知單</h1>
      <p>115學年度｜Word 原稿版面｜A4 直向單面列印</p>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar no-print">
      <section class="card">
        <h2>📋 通知單選擇</h2>
        <label class="field">
          <span>學期與段考</span>
          <select id="exam">
            <option value="上學期|第一次" selected>上學期第一次段考</option>
            <option value="上學期|第二次">上學期第二次段考</option>
            <option value="上學期|第三次">上學期第三次段考</option>
            <option value="下學期|第一次">下學期第一次段考</option>
            <option value="下學期|第二次">下學期第二次段考</option>
            <option value="下學期|第三次">下學期第三次段考</option>
          </select>
        </label>
        <label class="field">
          <span>收件教師</span>
          <select id="teacher"><option value="all">全部教師</option></select>
        </label>
      </section>

      <section class="card">
        <h2>✅ 學生篩選</h2>
        <label class="field">
          <span>搜尋學生</span>
          <input id="studentSearch" type="search" placeholder="輸入班級、座號或姓名">
        </label>
        <div id="studentFilters" class="student-filter-list"></div>
        <p id="filterSummary" class="filter-summary"></p>
        <button id="restoreStudents" class="button small slate" style="width:100%;margin-top:10px" type="button">全部恢復</button>
      </section>

      <section class="card">
        <h2>↕️ 版面微調</h2>
        <span style="font-size:14px;font-weight:700">表格每格高度</span>
        <div class="adjuster">
          <button id="rowDown" class="button small slate" type="button">− 降低</button>
          <button id="rowUp" class="button small slate" type="button">＋ 增加</button>
        </div>
        <p id="rowValue" class="value-readout">1.30 公分</p>
        <span style="display:block;margin-top:14px;font-size:14px;font-weight:700">整體字級</span>
        <div class="adjuster">
          <button id="fontDown" class="button small slate" type="button">A− 縮小</button>
          <button id="fontUp" class="button small slate" type="button">A＋ 放大</button>
        </div>
        <p id="fontValue" class="value-readout">18 pt</p>
      </section>

      <section class="card">
        <h2>🖨️ 列印與資料</h2>
        <div class="button-stack">
          <button id="printPage" class="button green" type="button">列印本頁</button>
          <button id="reload" class="button slate" type="button">重新載入資料</button>
        </div>
        <p class="tip" style="margin-top:12px"><strong>請使用單面列印。</strong><br>列印設定：A4、直向、比例 100%。畫面顯示什麼就列印什麼，功能列會自動隱藏。</p>
      </section>

      <section class="card">
        <p id="status" class="status">正在載入 Google 試算表資料……</p>
      </section>
    </aside>

    <section class="preview">
      <p class="preview-title no-print">👁️ A4 通知單預覽</p>
      <div id="single-page" class="paper">
        <div id="notice"><div class="empty">正在載入通知單……</div></div>
      </div>
    </section>
  </main>
  <script>
    const SHEET_ID = "2PACX-1vSNEots8pxAuco9lAY1ZNv1nVH-GgKODMA_DN-diDP40jsoR-ZXEN7fAdmBmdEKm0NMkPYDvGY7KfCk";
    const SHEET_CSV_BASE = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?single=true&output=csv&gid=`;
    const PEOPLE_GID = "1896534716";
    const WITHDRAWALS_GID = "439972429";
    const $ = selector => document.querySelector(selector);
    let records = [];
    let rowHeight = 1.3;
    let fontSize = 18;
    let excluded = new Set(JSON.parse(sessionStorage.getItem("score-notice-excluded") || "[]"));

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], field = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i], next = text[i + 1];
        if (char === '"' && quoted && next === '"') { field += '"'; i++; }
        else if (char === '"') quoted = !quoted;
        else if (char === "," && !quoted) { row.push(field.trim()); field = ""; }
        else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i++;
          row.push(field.trim());
          if (row.some(Boolean)) rows.push(row);
          row = []; field = "";
        } else field += char;
      }
      row.push(field.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function normalize(value) {
      return String(value ?? "").replace(/[\s　:：()（）_\-]/g, "").toLowerCase();
    }

    function toRecords(rows) {
      if (!rows.length) return [];
      const headers = rows[0];
      return rows.slice(1).map(cells => {
        const record = {};
        headers.forEach((header, index) => record[normalize(header)] = cells[index] ?? "");
        return record;
      });
    }

    function valueOf(record, aliases) {
      for (const alias of aliases) {
        const value = record[normalize(alias)];
        if (String(value ?? "").trim()) return String(value).trim();
      }
      return "";
    }

    async function fetchSheet(gid) {
      const response = await fetch(`${SHEET_CSV_BASE}${gid}&_=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`試算表讀取失敗（${response.status}）`);
      return toRecords(parseCsv(await response.text()));
    }

    function buildRecords(people, withdrawals) {
      const peopleMap = new Map();
      people.forEach(person => {
        const className = valueOf(person, ["班級", "班別"]);
        const name = valueOf(person, ["姓名", "學生姓名"]);
        if (className && name) peopleMap.set(`${className}|${name}`, person);
      });
      return withdrawals.map((row, index) => {
        const className = valueOf(row, ["原班", "班級", "班別"]);
        const name = valueOf(row, ["學生", "姓名", "學生姓名"]);
        const person = peopleMap.get(`${className}|${name}`) || {};
        return {
          id: `${className}-${name}-${index}`,
          className,
          seat: valueOf(row, ["座號", "座次"]) || valueOf(person, ["座號", "座次"]),
          name,
          originalSubject: valueOf(row, ["原班科目", "原班學科", "科目"]),
          withdrawnSubject: valueOf(row, ["抽離課程", "抽離科目", "異想課程"]),
          resourceTeacher: valueOf(row, ["異想授課老師", "異想教室老師", "異想老師", "資源班老師"]),
          originalTeacher: valueOf(row, ["原班老師", "原班科目教師", "原班任課老師", "原班教師", "任課老師"])
        };
      }).filter(item => item.className && item.name && item.originalTeacher);
    }

    function groups() {
      const map = new Map();
      records.forEach(record => {
        if (!map.has(record.originalTeacher)) map.set(record.originalTeacher, []);
        map.get(record.originalTeacher).push(record);
      });
      return [...map.entries()]
        .sort(([a], [b]) => a.localeCompare(b, "zh-Hant"))
        .map(([teacher, students]) => ({
          teacher,
          students: students.sort((a, b) =>
            a.className.localeCompare(b.className, "zh-Hant") ||
            Number(a.seat || 999) - Number(b.seat || 999)
          )
        }));
    }

    function noticeHtml(group) {
      const [semester, period] = $("#exam").value.split("|");
      return `<article class="notice">
        <h2 class="notice-title">115學年度 ${semester} 異想教室${period}段考成績</h2>
        <p class="teacher-name"><span class="name">${escapeHtml(group.teacher)}</span> 老師：</p>
        <table class="grade-table">
          <thead><tr>
            <th class="col-class">班級</th>
            <th class="col-seat">座號</th>
            <th class="col-name">姓名</th>
            <th class="col-original">原班科目</th>
            <th class="col-daily">日常評量</th>
            <th class="col-withdrawn">抽離課程</th>
            <th class="col-resource">異想教室老師</th>
          </tr></thead>
          <tbody>${group.students.filter(student => !excluded.has(student.id)).map(student => `<tr>
            <td>${escapeHtml(student.className)}</td>
            <td>${escapeHtml(student.seat)}</td>
            <td>${escapeHtml(student.name)}</td>
            <td>${escapeHtml(student.originalSubject)}</td>
            <td aria-label="日常評量手寫欄"></td>
            <td>${escapeHtml(student.withdrawnSubject)}</td>
            <td>${escapeHtml(student.resourceTeacher)}</td>
          </tr>`).join("")}</tbody>
        </table>
        <div class="notes">
          <p>☆依據104.1.7特推會決議，請老師參閱此分數作為上傳成績之依據：</p>
          <p>原班科目被異想教室抽離，且任課老師無法評定該生平時成績，由異想教室評100%日常成績。</p>
        </div>
      </article>`;
    }

    function refreshTeacherOptions() {
      const list = groups();
      $("#teacher").innerHTML = '<option value="all">全部教師</option>' + list.map(group =>
        `<option value="${escapeHtml(group.teacher)}">${escapeHtml(group.teacher)} 老師</option>`
      ).join("");
      $("#teacher").value = "all";
    }

    function render() {
      const selected = $("#teacher").value;
      const visibleGroups = groups()
        .filter(group => selected === "all" || group.teacher === selected)
        .filter(group => group.students.some(student => !excluded.has(student.id)));
      $("#notice").innerHTML = visibleGroups.length
        ? visibleGroups.map(noticeHtml).join("")
        : '<div class="empty">目前沒有可顯示的通知單資料。</div>';
    }

    function selectedStudents() {
      const selected = $("#teacher").value;
      return groups()
        .filter(group => selected === "all" || group.teacher === selected)
        .flatMap(group => group.students.map(student => ({ ...student, recipient: group.teacher })));
    }

    function saveExcluded() {
      sessionStorage.setItem("score-notice-excluded", JSON.stringify([...excluded]));
    }

    function renderStudentFilters() {
      const keyword = normalize($("#studentSearch").value);
      const students = selectedStudents();
      const filtered = students.filter(student =>
        !keyword || normalize(`${student.className}${student.seat}${student.name}${student.originalSubject}${student.recipient}`).includes(keyword)
      );
      $("#studentFilters").innerHTML = filtered.length ? filtered.map(student => {
        const isExcluded = excluded.has(student.id);
        return `<label class="student-filter-item${isExcluded ? " excluded" : ""}">
          <input type="checkbox" data-student-id="${escapeHtml(student.id)}" ${isExcluded ? "" : "checked"}>
          <span>${escapeHtml(student.className)}班 ${escapeHtml(student.seat)}號　${escapeHtml(student.name)}<br><small>${escapeHtml(student.originalSubject)} → ${escapeHtml(student.recipient)}老師</small></span>
        </label>`;
      }).join("") : '<div style="padding:12px;color:#64748b;font-size:13px">找不到符合的學生。</div>';
      const includedCount = students.filter(student => !excluded.has(student.id)).length;
      $("#filterSummary").textContent = `目前保留 ${includedCount} 人，排除 ${students.length - includedCount} 人。`;
      $("#studentFilters").querySelectorAll("[data-student-id]").forEach(input => {
        input.addEventListener("change", event => {
          const id = event.currentTarget.dataset.studentId;
          if (event.currentTarget.checked) excluded.delete(id);
          else excluded.add(id);
          saveExcluded();
          render();
          renderStudentFilters();
        });
      });
    }

    function setAdjustments() {
      document.documentElement.style.setProperty("--row-height", `${rowHeight.toFixed(2)}cm`);
      document.documentElement.style.setProperty("--print-font-size", `${fontSize}pt`);
      $("#rowValue").textContent = `${rowHeight.toFixed(2)} 公分`;
      $("#fontValue").textContent = `${fontSize} pt`;
    }

    async function loadData() {
      $("#status").className = "status";
      $("#status").textContent = "正在載入 Google 試算表資料……";
      try {
        const [people, withdrawals] = await Promise.all([
          fetchSheet(PEOPLE_GID), fetchSheet(WITHDRAWALS_GID)
        ]);
        records = buildRecords(people, withdrawals);
        refreshTeacherOptions();
        render();
        renderStudentFilters();
        $("#status").textContent = `已載入 ${groups().length} 位教師、${records.length} 筆學生資料。`;
      } catch (error) {
        $("#status").className = "status error";
        $("#status").textContent = `${error.message}。請確認網路與試算表公開權限。`;
        $("#notice").innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    $("#teacher").addEventListener("change", () => {
      render();
      renderStudentFilters();
    });
    $("#exam").addEventListener("change", render);
    $("#studentSearch").addEventListener("input", renderStudentFilters);
    $("#restoreStudents").addEventListener("click", () => {
      selectedStudents().forEach(student => excluded.delete(student.id));
      saveExcluded();
      render();
      renderStudentFilters();
    });
    $("#rowDown").addEventListener("click", () => { rowHeight = Math.max(.8, rowHeight - .05); setAdjustments(); });
    $("#rowUp").addEventListener("click", () => { rowHeight = Math.min(2.2, rowHeight + .05); setAdjustments(); });
    $("#fontDown").addEventListener("click", () => { fontSize = Math.max(12, fontSize - 1); setAdjustments(); });
    $("#fontUp").addEventListener("click", () => { fontSize = Math.min(26, fontSize + 1); setAdjustments(); });
    $("#printPage").addEventListener("click", () => window.print());
    $("#reload").addEventListener("click", loadData);
    setAdjustments();
    loadData();
  </script>
</body>
</html>
