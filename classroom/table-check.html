
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異想教室－教師出缺席點名表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --paper-width: 210mm;
            --paper-height: 297mm;
            --paper-padding-x: 10mm;
            --paper-padding-y: 9mm;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f1f5f9;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }
        .official-doc {
            color: #000;
            font-family: "DFKai-SB", "BiauKai", "Noto Serif TC", serif;
        }
        .page-container {
            width: var(--paper-width);
            height: var(--paper-height);
            margin: 20px auto;
            padding: var(--paper-padding-y) var(--paper-padding-x);
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, .12);
        }
        .document-title { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 4px; line-height: 1.15; text-align: center; }
        .document-subtitle { margin: 3px 0 0; font-size: 18px; font-weight: 700; letter-spacing: 2px; line-height: 1.15; text-align: center; }
        .document-meta {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end;
            gap: 8px;
            margin: 7px 2px 5px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
        }
        .document-meta > :last-child { text-align: right; }
        .meta-value { display: inline-block; min-width: 66px; padding: 0 4px 1px; border-bottom: 1px solid #000; text-align: center; }
        .attendance-table { width: 100%; border: 2px solid #000; border-collapse: collapse; table-layout: fixed; }
        .attendance-table th, .attendance-table td { border: 1px solid #000; }
        .attendance-table th {
            height: 24px;
            padding: 1px 3px;
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.05;
            text-align: center;
        }
        .attendance-table thead tr:last-child th { border-bottom-width: 2px; }
        .attendance-table tbody td {
            height: 25.5mm;
            padding: 1.5px 2px;
            overflow: hidden;
            vertical-align: top;
            font-size: 10px;
            line-height: 1.04;
        }
        .attendance-table .period-cell {
            width: 11%;
            padding: 2px 1px;
            vertical-align: middle;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.04;
            text-align: center;
        }
        .period-time { margin-top: 2px; font-size: 9.5px; font-weight: 400; line-height: 1.02; }
        .course-group + .course-group { margin-top: 1px; padding-top: 1px; border-top: .5px dotted #777; }
        .course-heading { display: flex; align-items: baseline; gap: 2px; min-width: 0; font-size: 10.5px; font-weight: 700; line-height: 1.05; }
        .course-dot { flex: 0 0 auto; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        .course-name { min-width: 0; overflow-wrap: anywhere; }
        .course-teacher { margin-left: auto; color: #000; font-size: 8.5px; font-weight: 400; white-space: nowrap; }
        .attendance-caption { margin: 0 0 1px 7px; color: #333; font-size: 8px; line-height: 1; text-align: right; }
        .student-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 3px; row-gap: 0; margin-left: 7px; color: #000; }
        .student-entry { display: flex; align-items: center; justify-content: space-between; gap: 1px; min-width: 0; white-space: nowrap; }
        .student-name { min-width: 0; overflow: hidden; text-overflow: clip; font-size: 9.5px; font-weight: 400; line-height: 1.03; }
        .attendance-box { flex: 0 0 auto; width: 7px; height: 7px; border: .7px solid #000; background: #fff; }
        .empty-cell { color: transparent; }
        .screen-note { max-width: 210mm; margin: 0 auto 8px; color: #64748b; font-size: 12px; }
        #print-all-section { display: none; }
        @media (max-width: 1100px) {
            .preview-scroll-wrapper { justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
        @page { size: A4 portrait; margin: 0; }
        @media print {
            html, body { width: 210mm; margin: 0 !important; background: #fff !important; }
            .no-print { display: none !important; }
            #app-main, #preview-panel, .preview-scroll-wrapper { display: block !important; width: auto !important; max-width: none !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            .page-container {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: var(--paper-padding-y) var(--paper-padding-x) !important;
                border: 0 !important;
                box-shadow: none !important;
                break-after: page;
                break-inside: avoid;
                page-break-after: always;
                page-break-inside: avoid;
            }
            .page-container:last-child { break-after: auto; page-break-after: auto; }
            #single-page-container { display: block !important; }
            body.print-batch-mode #single-page-container { display: none !important; }
            body.print-batch-mode #print-all-section { display: block !important; }
            .attendance-table th { background: #fff !important; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <header class="no-print bg-slate-900 text-white shadow-md">
        <div class="max-w-[1500px] mx-auto px-4 py-3 flex items-center gap-3">
            <div class="bg-emerald-600 p-2 rounded-lg" aria-hidden="true">✓</div>
            <div>
                <h1 class="text-lg font-bold tracking-wide">異想教室教師出缺席點名表</h1>
                <div id="sync-status-badge" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-medium bg-blue-900/50 border border-blue-700 text-blue-300 mt-0.5">
                    <span id="sync-status-icon" class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                    <span id="sync-status-text">正在讀取雲端資料……</span>
                </div>
            </div>
        </div>
    </header>

    <main id="app-main" class="max-w-[1500px] mx-auto px-4 mt-6 grid grid-cols-1 xl:grid-cols-[280px_minmax(0,1fr)] gap-6 items-start">
        <aside class="no-print flex flex-col gap-5 xl:sticky xl:top-6">
            <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
               

            <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <label for="teacher-select" class="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">👤 教師</label>
                <select id="teacher-select" class="w-full bg-slate-50 border-2 border-slate-200 rounded-lg px-3 py-2.5 text-slate-800 font-medium focus:outline-none focus:border-emerald-500" disabled>
                    <option value="">載入中……</option>
                </select>
            </section>

            <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">📅 日期</h2>
                <div class="space-y-2 text-sm text-slate-700">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="date-mode" value="blank" checked class="accent-emerald-600">空白（預設）</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="date-mode" value="auto" class="accent-emerald-600">自動帶入日期</label>
                </div>
                <label for="semester-start-date" class="block text-xs font-bold text-slate-500 mt-4 mb-2">學期開始日期</label>
                <input id="semester-start-date" type="date" value="2026-08-31" disabled class="w-full bg-slate-100 border-2 border-slate-200 rounded-lg px-3 py-2 text-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed focus:outline-none focus:border-emerald-500">
                <p class="mt-2 text-[11px] leading-relaxed text-slate-500">自動模式會將所選日期回推到該週星期一，再連續產生 21 週。</p>
            </section>

            <section class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">🖨️ 列印</h2>
                <button id="btn-print-attendance" type="button" onclick="printAttendanceSheets()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition-colors disabled:bg-slate-400" disabled>產生並開啟瀏覽器列印</button>
                <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3 text-xs mt-4 leading-relaxed"><strong>列印設定：</strong><br>A4、直向、邊界選擇「無」、比例 100%。可在瀏覽器輸入頁碼或頁碼範圍。</div>
            </section>
        </aside>

        <section id="preview-panel" class="min-w-0 flex flex-col items-center">
            <div id="preview-caption" class="no-print text-sm font-semibold text-slate-500 mb-2 self-start">👁️ A4 點名表預覽</div>
            <div class="preview-scroll-wrapper w-full flex justify-center">
                <div id="single-page-container"></div>
            </div>
        </section>
    </main>

    <div id="print-all-section"></div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNEots8pxAuco9lAY1ZNv1nVH-GgKODMA_DN-diDP40jsoR-ZXEN7fAdmBmdEKm0NMkPYDvGY7KfCk/pub?gid=1823409322&single=true&output=csv";
        const ALL_TEACHERS_VALUE = "__ALL_TEACHERS__";
        const ITINERANT_VALUE = "__ITINERANT__";
        const DEFAULT_START_DATE = "2026-08-31";
        const WEEKDAYS = ["星期一", "星期二", "星期三", "星期四", "星期五"];
        const periodsConfig = [
            { id: "1", name: "第一節", start: "08:20", end: "09:05" },
            { id: "2", name: "第二節", start: "09:15", end: "10:00" },
            { id: "3", name: "第三節", start: "10:10", end: "10:55" },
            { id: "4", name: "第四節", start: "11:05", end: "11:50" },
            { id: "5", name: "第五節", start: "13:15", end: "14:00" },
            { id: "6", name: "第六節", start: "14:10", end: "14:55" },
            { id: "7", name: "第七節", start: "15:05", end: "15:50" },
            { id: "8", name: "第八節", start: "16:00", end: "16:45" }
        ];
        const colorPalette = ["#be123c", "#15803d", "#1d4ed8", "#a21caf", "#b45309", "#0369a1", "#be185d", "#4d7c0f", "#4338ca", "#0f766e"];

        let globalRawData = [];
        let attendanceRecords = [];
        let teachersList = [];
        let versionString = "114-2 更新版";
        let scheduleDatabase = {};

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
        }

        function getGroupColor(subject) {
            if (!subject) return "#000000";
            let hash = 0;
            for (let i = 0; i < subject.length; i++) hash = subject.charCodeAt(i) + ((hash << 5) - hash);
            return colorPalette[Math.abs(hash) % colorPalette.length];
        }

        function parseLocalDate(value) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || DEFAULT_START_DATE);
            if (!match) return new Date(Date.UTC(2026, 7, 31));
            return new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
        }

        function addUtcDays(date, days) {
            const result = new Date(date.getTime());
            result.setUTCDate(result.getUTCDate() + days);
            return result;
        }

        function getMondayOfWeek(date) {
            const day = date.getUTCDay();
            const distance = day === 0 ? -6 : 1 - day;
            return addUtcDays(date, distance);
        }

        function generate21Weeks(startValue) {
            const firstMonday = getMondayOfWeek(parseLocalDate(startValue));
            return Array.from({ length: 21 }, (_, weekIndex) => ({
                number: weekIndex + 1,
                dates: Array.from({ length: 5 }, (_, dayIndex) => addUtcDays(firstMonday, weekIndex * 7 + dayIndex))
            }));
        }

        function formatMonthDay(date) {
            return `${date.getUTCMonth() + 1}/${date.getUTCDate()}`;
        }

        function cleanTeacherName(name) {
            return String(name || "").replace(/\s*老師\s*$/, "").trim();
        }

        function isItinerantRecord(record) {
            return [record.note, record.rawTeacher, record.teacher, record.subject, record.location]
                .some(value => /巡迴/.test(String(value || "")));
        }

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];
                if (char === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else inQuotes = !inQuotes;
                } else if (char === "," && !inQuotes) row.push("");
                else if ((char === "\r" || char === "\n") && !inQuotes) {
                    if (char === "\r" && next === "\n") i++;
                    lines.push(row); row = [""];
                } else row[row.length - 1] += char;
            }
            if (row.length > 1 || row[0] !== "") lines.push(row);
            return lines;
        }

        function buildItinerantSchedule(records = attendanceRecords) {
            const merged = {};
            records.filter(record => record.itinerant).forEach(record => {
                record.codes.forEach(code => {
                    if (!merged[code]) merged[code] = [];
                    merged[code].push(record);
                });
            });
            return merged;
        }

        function getScheduleForTarget(target) {
            return target === ITINERANT_VALUE ? buildItinerantSchedule() : (scheduleDatabase[target] || {});
        }

        function getPrintTargets(selection) {
            if (selection === ALL_TEACHERS_VALUE) return [...teachersList];
            if (selection === ITINERANT_VALUE) return [ITINERANT_VALUE];
            return selection ? [selection] : [];
        }

        function buildPrintPlan(selection, dateMode, startValue) {
            const targets = getPrintTargets(selection);
            const weeks = dateMode === "auto" ? generate21Weeks(startValue) : [null];
            return targets.flatMap(target => weeks.map(week => ({ target, week })));
        }

        window.onload = function () {
            bindControls();
            fetchWithRetry(csvUrl, 5, 1000);
        };

        function bindControls() {
            document.getElementById("teacher-select").addEventListener("change", renderPreview);
            document.querySelectorAll('input[name="date-mode"]').forEach(input => input.addEventListener("change", () => {
                document.getElementById("semester-start-date").disabled = getDateMode() !== "auto";
                renderPreview();
            }));
            document.getElementById("semester-start-date").addEventListener("change", renderPreview);
        }

        async function fetchWithRetry(url, retries, delay) {
            updateStatus("connecting", `正在連線試算表……（剩餘重試 ${retries} 次）`);
            try {
                const response = await fetch(`${url}&t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                parseAndBuildSchedule(await response.text());
            } catch (error) {
                if (retries > 0) setTimeout(() => fetchWithRetry(url, retries - 1, delay * 2), delay);
                else {
                    updateStatus("fallback", "雲端資料載入失敗");
                    showErrorModal("無法讀取 Google 試算表。請確認網路連線及試算表是否已發布到網路。");
                }
            }
        }

        function updateStatus(type, message) {
            const badge = document.getElementById("sync-status-badge");
            const icon = document.getElementById("sync-status-icon");
            const text = document.getElementById("sync-status-text");
            badge.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-medium mt-0.5 border ";
            icon.className = "w-2 h-2 rounded-full ";
            if (type === "success") {
                badge.classList.add("bg-emerald-900/50", "border-emerald-700", "text-emerald-300");
                icon.classList.add("bg-emerald-400");
            } else if (type === "connecting") {
                badge.classList.add("bg-blue-900/50", "border-blue-700", "text-blue-300");
                icon.classList.add("bg-blue-400", "animate-pulse");
            } else {
                badge.classList.add("bg-amber-950", "border-amber-600", "text-amber-300");
                icon.classList.add("bg-amber-400");
            }
            text.textContent = message;
        }

        function parseAndBuildSchedule(csvText) {
            const rows = parseCSV(csvText);
            if (rows.length < 2) { showErrorModal("試算表內無有效資料或欄位格式不符。"); return; }
            globalRawData = rows;
            const noteFound = rows.slice(1).map(row => row[0]?.trim()).find(note => note && !["備註", "改版日期", "列印日期", "改版日期："].includes(note));
            if (noteFound) versionString = noteFound;

            attendanceRecords = [];
            scheduleDatabase = {};
            for (let index = 1; index < rows.length; index++) {
                const row = rows[index];
                if (row.length < 8) continue;
                const rawTeacher = row[1]?.trim() || "";
                const teacher = cleanTeacherName(rawTeacher);
                const subject = row[2]?.trim() || "";
                const codes = (row[5]?.trim() || "").split(/[\s,，]+/).map(value => value.trim()).filter(Boolean);
                if (!teacher || !subject || !codes.length) continue;
                const record = {
                    note: row[0]?.trim() || "",
                    rawTeacher,
                    teacher,
                    subject,
                    periods: row[3]?.trim() || "",
                    location: row[4]?.trim() || "",
                    codes,
                    time: row[6]?.trim() || "",
                    students: (row[7]?.trim() || "").split(/[\s、,，]+/).map(value => value.trim()).filter(Boolean)
                };
                record.itinerant = isItinerantRecord(record);
                attendanceRecords.push(record);
                if (!scheduleDatabase[teacher]) scheduleDatabase[teacher] = {};
                codes.forEach(code => {
                    if (!scheduleDatabase[teacher][code]) scheduleDatabase[teacher][code] = [];
                    scheduleDatabase[teacher][code].push(record);
                });
            }

            const regularTeachers = new Set(attendanceRecords.filter(record => !record.itinerant).map(record => record.teacher));
            teachersList = Array.from(regularTeachers).sort((a, b) => a.localeCompare(b, "zh-Hant"));
            if (!teachersList.length && !attendanceRecords.some(record => record.itinerant)) {
                showErrorModal("在「特教教師」欄位中找不到可用的教師資料。");
                return;
            }
            populateDropdown();
            document.getElementById("teacher-select").disabled = false;
            document.getElementById("btn-print-attendance").disabled = false;
            updateStatus("success", "與試算表成功連線，資料已同步");
            renderPreview();
        }

        function populateDropdown() {
            const select = document.getElementById("teacher-select");
            select.innerHTML = `<option value="${ALL_TEACHERS_VALUE}">全部教師</option>`;
            teachersList.forEach(teacher => {
                const option = document.createElement("option");
                option.value = teacher;
                option.textContent = teacher;
                select.appendChild(option);
            });
            const itineraryOption = document.createElement("option");
            itineraryOption.value = ITINERANT_VALUE;
            itineraryOption.textContent = "巡迴輔導";
            select.appendChild(itineraryOption);
            select.value = ALL_TEACHERS_VALUE;
        }

        function getDateMode() {
            return document.querySelector('input[name="date-mode"]:checked')?.value || "blank";
        }

        function getTargetLabel(target) {
            return target === ITINERANT_VALUE ? "巡迴輔導" : target;
        }

        function renderPreview() {
            if (!attendanceRecords.length) return;
            const selection = document.getElementById("teacher-select").value;
            const previewTarget = selection === ALL_TEACHERS_VALUE ? teachersList[0] : selection;
            if (!previewTarget) return;
            const week = getDateMode() === "auto" ? generate21Weeks(document.getElementById("semester-start-date").value)[0] : null;
            document.getElementById("single-page-container").innerHTML = generateAttendancePageHTML(previewTarget, week);
            const suffix = selection === ALL_TEACHERS_VALUE ? `（全部教師列印將從 ${getTargetLabel(previewTarget)} 開始）` : "";
            document.getElementById("preview-caption").textContent = `👁️ A4 點名表預覽${suffix}`;
        }

        function generateDateHeaderHTML(week) {
            const dates = week ? week.dates.map(formatMonthDay) : ["", "", "", "", ""];
            return `
                <tr><th style="width:11%">日期</th>${dates.map(date => `<th style="width:17.8%">${date}</th>`).join("")}</tr>
                <tr><th>星期</th>${WEEKDAYS.map(day => `<th>${day}</th>`).join("")}</tr>`;
        }

        function generateCourseGroupHTML(course, showTeacher) {
            const color = getGroupColor(course.subject);
            const teacher = showTeacher ? `<span class="course-teacher">${escapeHtml(course.teacher)}</span>` : "";
            const students = course.students.length
                ? course.students.map(student => `<div class="student-entry"><span class="student-name">${escapeHtml(student)}</span><span class="attendance-box" aria-hidden="true"></span></div>`).join("")
                : `<div class="student-entry"><span class="student-name">（無學生資料）</span><span class="attendance-box" aria-hidden="true"></span></div>`;
            return `<div class="course-group">
                <div class="course-heading" style="color:${color}"><span class="course-dot"></span><span class="course-name">${escapeHtml(course.subject)}</span>${teacher}</div>
                <div class="attendance-caption">學生出缺席</div>
                <div class="student-grid">${students}</div>
            </div>`;
        }

        function generateTimetableRowsHTML(target) {
            const schedule = getScheduleForTarget(target);
            const showTeacher = target === ITINERANT_VALUE;
            return periodsConfig.map(period => {
                const cells = Array.from({ length: 5 }, (_, dayIndex) => {
                    const courses = schedule[`${dayIndex + 1}${period.id}`] || [];
                    return `<td>${courses.length ? courses.map(course => generateCourseGroupHTML(course, showTeacher)).join("") : `<span class="empty-cell">－</span>`}</td>`;
                }).join("");
                return `<tr><td class="period-cell"><div>${period.name}</div><div class="period-time">${period.start}<br>～<br>${period.end}</div></td>${cells}</tr>`;
            }).join("");
        }

        function generateAttendancePageHTML(target, week) {
            const weekText = week ? `第 ${week.number} 週` : "第　週";
            return `<div class="page-container official-doc attendance-page">
                <h1 class="document-title">臺南市立新市國民中學</h1>
                <h2 class="document-subtitle">114學年度第二學期　異想教室教師出缺席點名表</h2>
                <div class="document-meta">
                    <div>教師：<span class="meta-value">${escapeHtml(getTargetLabel(target))}</span></div>
                    <div>${weekText}</div>
                    <div>版本：<span class="meta-value">${escapeHtml(versionString)}</span></div>
                </div>
                <table class="attendance-table">
                    <thead>${generateDateHeaderHTML(week)}</thead>
                    <tbody>${generateTimetableRowsHTML(target)}</tbody>
                </table>
            </div>`;
        }

        function printAttendanceSheets() {
            const selection = document.getElementById("teacher-select").value;
            const dateMode = getDateMode();
            const plan = buildPrintPlan(selection, dateMode, document.getElementById("semester-start-date").value);
            if (!plan.length) { showErrorModal("目前沒有可列印的教師資料。"); return; }
            const section = document.getElementById("print-all-section");
            section.innerHTML = plan.map(item => generateAttendancePageHTML(item.target, item.week)).join("");
            document.body.classList.add("print-batch-mode");
            setTimeout(() => window.print(), 250);
        }

        window.addEventListener("afterprint", () => {
            document.body.classList.remove("print-batch-mode");
            document.getElementById("print-all-section").innerHTML = "";
        });

        function showErrorModal(message) {
            const modal = document.createElement("div");
            modal.className = "fixed inset-0 bg-black/60 flex items-center justify-center z-[9999] no-print p-4";
            modal.innerHTML = `<div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full"><h3 class="text-base font-bold text-slate-900">資料載入出現狀況</h3><p class="text-sm text-slate-600 mt-2 leading-relaxed">${escapeHtml(message)}</p><div class="mt-6 text-right"><button type="button" onclick="this.closest('.fixed').remove()" class="bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-lg">關閉</button></div></div>`;
            document.body.appendChild(modal);
        }
    </script>
</body>
</html>
