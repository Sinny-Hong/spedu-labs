<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新市國中 115學年度 特殊需求學生簡介 v5</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#cbd5e1; --soft:#f1f5f9; --accent:#2563eb; --green:#059669; --danger:#c1121f; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef2f7; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    button, select { font:inherit; }
    button { cursor:pointer; }
    button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
    .control-shell { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.97); border-bottom:1px solid #dbe2ea; box-shadow:0 2px 10px #0f172a12; }
    .mode-switch { display:flex; justify-content:center; gap:5px; padding:8px 16px 0; }
    .mode-btn { height:36px; min-width:132px; padding:0 18px; border:1px solid #b8c4d2; border-radius:9px 9px 0 0; background:#f8fafc; color:#475569; font-weight:900; }
    .mode-btn.active { color:#fff; background:#334155; border-color:#334155; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; max-width:1180px; margin:auto; padding:10px 16px 8px; }
    .toolbar[hidden] { display:none; }
    .toolbar label { font-weight:800; }
    .toolbar select, .toolbar button { height:39px; border-radius:8px; border:1px solid #b8c4d2; background:#fff; padding:0 12px; }
    .toolbar select { min-width:180px; }
    .toolbar button { font-weight:800; }
    .toolbar button.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    .toolbar button.all-print { color:#fff; background:var(--green); border-color:var(--green); }
    .grade-options { display:flex; gap:4px; padding:3px; border:1px solid #cbd5e1; border-radius:9px; background:#f1f5f9; }
    .grade-btn { height:31px !important; padding:0 10px !important; border:0 !important; background:transparent !important; color:#475569; }
    .grade-btn.active { color:#fff !important; background:#475569 !important; }
    .status-row { display:flex; justify-content:center; padding:0 16px 9px; }
    .status { color:var(--muted); font-size:13px; }
    .status.error { color:#b91c1c; font-weight:800; }
    .screen-note { max-width:210mm; margin:12px auto 0; color:var(--muted); font-size:13px; }
    #pages { padding:12px 0 32px; }
    .notice-page { width:210mm; height:297mm; margin:0 auto 16px; padding:10mm 10mm 9mm; overflow:hidden; background:#fff; box-shadow:0 4px 18px #0f172a20; break-after:page; page-break-after:always; }
    .notice-page:last-child { break-after:auto; page-break-after:auto; }
    .title-row { display:grid; grid-template-columns:45mm minmax(0,1fr) 34mm; align-items:center; gap:2mm; padding-bottom:2mm; border-bottom:2px solid var(--ink); }
    h1 { margin:0; text-align:center; font-size:19px; letter-spacing:.025em; white-space:nowrap; }
    .teacher-greeting { justify-self:start; padding:1px 4px 2px; font-size:19px; font-weight:950; white-space:nowrap; background:linear-gradient(transparent 38%,#fbcfe8 38%,#fbcfe8 90%,transparent 90%); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .admin-office { justify-self:start; font-size:18px; font-weight:950; white-space:nowrap; }
    .header-actions { justify-self:end; display:flex; flex-direction:column; align-items:flex-end; gap:1mm; }
    .confidential-stamp { min-width:30mm; height:10mm; padding:0 2.2mm; display:grid; place-items:center; color:var(--danger); background:#fff5f5; border:2px solid var(--danger); border-radius:5px; font-size:14.5px; font-weight:950; letter-spacing:.04em; white-space:nowrap; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .page-number { min-height:4mm; color:#475569; font-size:10.5px; white-space:nowrap; }
    .intro-block { margin-top:1.8mm; padding:1.7mm 2.5mm 1.5mm; border:1px solid var(--line); border-radius:4px; font-size:14px; line-height:1.35; }
    .intro-list { margin:0; padding-left:1.45em; }
    .intro-list li { margin:0 0 .8mm; padding-left:.2em; text-align:justify; }
    .intro-list li:last-child { margin-bottom:.5mm; }
    .signoff { margin:.5mm 0 0; text-align:right; font-weight:800; letter-spacing:.04em; }
    .content-grid { display:grid; grid-template-columns:41mm minmax(0,1fr); gap:3mm; padding-top:2.3mm; }
    .section-title { margin:0 0 2mm; padding:1.5mm 2mm; background:var(--soft); border-left:4px solid #64748b; font-size:15px; font-weight:900; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .class-list { border:1px solid var(--line); border-radius:5px; overflow:hidden; }
    .class-item { padding:2.1mm 2.2mm; border-bottom:1px solid var(--line); line-height:1.35; }
    .class-item:last-child { border-bottom:0; }
    .class-code { display:inline-block; min-width:26px; margin-right:5px; font-size:15px; font-weight:900; }
    .subjects { font-size:14px; }
    .student-list { border-top:1.5px solid #94a3b8; }
    .student-item { display:grid; grid-template-columns:52mm minmax(0,1fr); align-items:start; gap:1mm; padding:1.45mm .7mm; border-bottom:1px solid #b9c4d0; line-height:1.3; break-inside:avoid; page-break-inside:avoid; }
    .student-meta { font-size:14.2px; font-weight:800; white-space:nowrap; }
    .student-note { font-size:14.2px; overflow-wrap:anywhere; }
    .continuation-header { display:grid; grid-template-columns:minmax(0,1fr) 34mm; align-items:start; gap:4mm; padding-bottom:2mm; border-bottom:2px solid var(--ink); }
    .continuation-title { align-self:center; font-size:18px; font-weight:950; }
    .continuation-body, .admin-body { padding-top:3mm; }
    .admin-filter-note { margin:-.5mm 0 2mm; color:#475569; font-size:12px; text-align:right; }
    .empty { padding:6mm; text-align:center; color:var(--muted); border:1px dashed var(--line); }
    .loading-card { width:min(720px,calc(100% - 32px)); margin:48px auto; padding:28px; text-align:center; background:#fff; border-radius:12px; box-shadow:0 4px 18px #0f172a12; }
    #measureRoot { position:absolute; left:-12000px; top:0; width:210mm; visibility:hidden; pointer-events:none; }
    #measureRoot .notice-page { margin:0; box-shadow:none; }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body { background:#fff; }
      .control-shell, .screen-note, .loading-card, #measureRoot { display:none !important; }
      #pages { padding:0; }
      .notice-page { width:210mm; height:297mm; margin:0; box-shadow:none; }
    }
    @media (max-width:850px) {
      .mode-switch { justify-content:flex-start; overflow-x:auto; }
      .toolbar { align-items:stretch; }
      .toolbar label { width:100%; }
      .toolbar select { flex:1; min-width:150px; }
      .grade-options { width:100%; overflow-x:auto; }
      .screen-note { margin-inline:16px; }
      #pages { overflow-x:auto; padding-inline:10px; }
    }
  </style>
</head>
<body>
  <section class="control-shell">
    <div class="mode-switch" aria-label="呈現模式">
      <button id="teacherModeBtn" class="mode-btn active" type="button">教師通知單</button>
      <button id="adminModeBtn" class="mode-btn" type="button">行政總表</button>
    </div>
    <div id="teacherControls" class="toolbar">
      <label for="teacherSelect">授課教師</label>
      <select id="teacherSelect" disabled><option>資料載入中…</option></select>
      <button id="refreshBtn" type="button">重新載入</button>
      <button id="printOneBtn" class="primary" type="button" disabled>列印這位教師</button>
      <button id="printAllBtn" class="all-print" type="button" disabled>整疊列印（全部單面）</button>
    </div>
    <div id="adminControls" class="toolbar" hidden>
      <label for="officeSelect">留存處室</label>
      <select id="officeSelect" disabled></select>
      <label>年級</label>
      <div class="grade-options" role="group" aria-label="年級篩選">
        <button class="grade-btn active" type="button" data-grade="all">全校</button>
        <button class="grade-btn" type="button" data-grade="1">一年級</button>
        <button class="grade-btn" type="button" data-grade="2">二年級</button>
        <button class="grade-btn" type="button" data-grade="3">三年級</button>
      </div>
      <button id="printOfficeBtn" class="primary" type="button" disabled>列印目前處室</button>
      <button id="printAllOfficesBtn" class="all-print" type="button" disabled>列印全部處室</button>
    </div>
    <div class="status-row"><span id="status" class="status" role="status">正在讀取公開試算表…</span></div>
  </section>
  <div id="screenNote" class="screen-note">列印時請選 A4、直向、縮放 100%，並關閉頁首與頁尾。整疊列印採全部單面，每一頁都有姓名或留存處室及頁碼。</div>
  <main id="pages"><div class="loading-card">正在整理教師、任教班級與特殊生資料…</div></main>
  <div id="measureRoot" aria-hidden="true"></div>

  <script>
  (() => {
    'use strict';
    const SPREADSHEET_ID='1WC605Hj5k4UWQvtx4APj85S87fJ-QAfOZTX3tVL-jPo';
    const OFFICES=['教務處','學務處','輔導室'];
    const SHEETS={
      teaching:{name:'教師任課班級',gid:'1784041306',headers:1,required:['班級','科目','教師']},
      students:{name:'特殊生名單',gid:'1639309932',headers:1,required:['班級','學生','障礙類別','特殊狀況']},
      info:{name:'說明欄',range:'A1:A6',headers:0}
    };
    const FALLBACK_INFO={
      title:'新市國中 115學年度 特殊需求學生簡介',
      greeting:'OOO老師您好：',
      paragraphs:[
        '為協助您掌握任教班級中特殊需求學生之學習、溝通、情緒與身心狀況，以下整理目前較重要的需求與教學提醒，供課堂安排與班級互動時參考。',
        '學生狀況可能隨時間調整，如有疑問、觀察到新的適應情形，或需要進一步資訊，請與輔導室（6005）或異想教室（6019）聯繫。',
        '本資料涉及學生個人與身心資訊，僅供校內教學與輔導使用，請妥善保管，勿公開、轉傳或另作無關用途。'
      ],
      signoff:'輔導室、異想教室 敬上'
    };
    const $=id=>document.getElementById(id);
    const state={teachers:new Map(),studentsByClass:new Map(),allStudents:[],eligibleTeachers:[],info:{...FALLBACK_INFO},activeView:'teacher',grade:'all',loaded:false,restoreAfterPrint:null};

    function text(tag,className,value){const el=document.createElement(tag);if(className)el.className=className;el.textContent=value;return el;}
    function classSort(a,b){return String(a).localeCompare(String(b),'zh-Hant',{numeric:true});}
    function cellValue(cell){return String(cell?.f??cell?.v??'').trim();}
    function querySheet(sheet){
      return new Promise((resolve,reject)=>{
        const callbackName=`__noticeSheet_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script=document.createElement('script');let settled=false;
        const timeout=window.setTimeout(()=>finish(new Error(`${sheet.name}讀取逾時`)),15000);
        function finish(error,table){if(settled)return;settled=true;clearTimeout(timeout);script.remove();try{delete window[callbackName];}catch(_){window[callbackName]=undefined;}error?reject(error):resolve(table);}
        window[callbackName]=response=>{if(!response||response.status!=='ok'||!response.table){const message=response?.errors?.[0]?.detailed_message||response?.errors?.[0]?.message||'Google 試算表未回傳資料';finish(new Error(`${sheet.name}讀取失敗（${message}）`));return;}finish(null,response.table);};
        script.onerror=()=>finish(new Error(`${sheet.name}讀取失敗`));
        const params=new URLSearchParams({headers:String(sheet.headers??1),tqx:`out:json;responseHandler:${callbackName}`,_:String(Date.now())});
        if(sheet.gid)params.set('gid',sheet.gid);else params.set('sheet',sheet.name);
        if(sheet.range)params.set('range',sheet.range);
        script.src=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?${params}`;
        document.head.append(script);
      });
    }
    async function loadRecords(sheet){
      const table=await querySheet(sheet),headers=table.cols.map(col=>String(col.label||'').trim());
      const missing=sheet.required.filter(h=>!headers.includes(h));if(missing.length)throw new Error(`${sheet.name}缺少欄位：${missing.join('、')}`);
      return (table.rows||[]).map(row=>Object.fromEntries(headers.map((h,i)=>[h,cellValue(row.c?.[i])]))).filter(record=>Object.values(record).some(Boolean));
    }
    async function loadInfo(){
      const table=await querySheet(SHEETS.info),values=(table.rows||[]).map(row=>cellValue(row.c?.[0]));
      if(values.length<6)throw new Error('說明欄 A1:A6 資料不足');
      return {title:values[0]||FALLBACK_INFO.title,greeting:values[1]||FALLBACK_INFO.greeting,paragraphs:[values[2],values[3],values[4]].map((v,i)=>v||FALLBACK_INFO.paragraphs[i]),signoff:values[5]||FALLBACK_INFO.signoff};
    }
    function studentClassFor(teachingClass){return String(teachingClass).trim().replace(/^7(?=\d{2}$)/,'1').replace(/^8(?=\d{2}$)/,'2').replace(/^9(?=\d{2}$)/,'3');}
    function buildState(teachingRows,studentRows){
      state.teachers.clear();state.studentsByClass.clear();
      for(const[index,r]of studentRows.entries()){if(!r['班級']||!r['學生'])continue;const student={className:r['班級'],name:r['學生'],disability:r['障礙類別']||'未填',note:r['特殊狀況']||'',order:index};if(!state.studentsByClass.has(student.className))state.studentsByClass.set(student.className,[]);state.studentsByClass.get(student.className).push(student);}
      state.allStudents=[...state.studentsByClass.values()].flat().sort((a,b)=>classSort(a.className,b.className)||a.order-b.order);
      for(const r of teachingRows){const teacher=r['教師'],className=r['班級'],subject=r['科目'];if(!teacher||!className||!subject)continue;if(!state.teachers.has(teacher))state.teachers.set(teacher,new Map());const classes=state.teachers.get(teacher);if(!classes.has(className))classes.set(className,new Set());classes.get(className).add(subject);}
      state.eligibleTeachers=[...state.teachers.keys()].filter(name=>[...state.teachers.get(name).keys()].some(c=>state.studentsByClass.has(studentClassFor(c)))).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    }
    function teacherData(name){
      const classes=[...(state.teachers.get(name)||new Map()).entries()].filter(([c])=>state.studentsByClass.has(studentClassFor(c))).sort(([a],[b])=>classSort(a,b));
      const seen=new Set(),students=[];for(const[teachingClass]of classes){for(const student of state.studentsByClass.get(studentClassFor(teachingClass))||[]){const key=`${student.className}\u0000${student.name}`;if(!seen.has(key)){seen.add(key);students.push(student);}}}
      students.sort((a,b)=>classSort(a.className,b.className)||a.order-b.order);return{name,classes,students};
    }
    function greetingFor(name){
      const template=state.info.greeting||FALLBACK_INFO.greeting;
      if(/OOO/i.test(template))return template.replace(/OOO/gi,name);
      if(/[○Ｏ]{3}/.test(template))return template.replace(/[○Ｏ]{3}/g,name);
      if(template.includes('{教師}'))return template.replaceAll('{教師}',name);
      return `${name}老師您好：`;
    }
    function adminStudents(){return state.grade==='all'?state.allStudents:state.allStudents.filter(s=>s.className.startsWith(state.grade));}
    function makeStamp(){return text('div','confidential-stamp','密件勿外流');}
    function makeHeaderActions(){const actions=text('div','header-actions','');actions.append(makeStamp(),text('div','page-number',''));return actions;}
    function makeStudentItem(student){const item=text('article','student-item','');item.append(text('div','student-meta',`${student.className}｜${student.name}｜${student.disability}`),text('div','student-note',student.note||'—'));return item;}
    function fillClasses(container,classes){for(const[className,subjects]of classes){const item=text('div','class-item','');item.append(text('span','class-code',className),text('span','subjects',[...subjects].sort((a,b)=>a.localeCompare(b,'zh-Hant')).join('、')));container.append(item);}}
    function makeTeacherFirstPage(data){
      const page=text('section','notice-page',''),header=text('header','title-row','');header.append(text('div','teacher-greeting',greetingFor(data.name)),text('h1','',state.info.title),makeHeaderActions());page.append(header);
      const intro=text('section','intro-block',''),list=text('ul','intro-list','');state.info.paragraphs.forEach(p=>list.append(text('li','',p)));intro.append(list,text('p','signoff',state.info.signoff));page.append(intro);
      const grid=text('div','content-grid',''),left=text('aside','',''),classes=text('div','class-list','');left.append(text('h2','section-title','任教班級｜科目'));fillClasses(classes,data.classes);left.append(classes);
      const right=text('section','','');right.append(text('h2','section-title',`相關特殊生（${data.students.length}人）`));const students=text('div','student-list','');students.dataset.studentList='';right.append(students);grid.append(left,right);page.append(grid);return page;
    }
    function makeTeacherContinuationPage(data){
      const page=text('section','notice-page',''),header=text('header','continuation-header','');header.append(text('div','continuation-title',`${data.name}老師｜特殊需求學生簡介（續）`),makeHeaderActions());page.append(header);
      const body=text('section','continuation-body','');body.append(text('h2','section-title','相關特殊生（續）'));const students=text('div','student-list','');students.dataset.studentList='';body.append(students);page.append(body);return page;
    }
    function adminTitle(){return '新市國中 115學年度 特殊需求學生總表';}
    function gradeLabel(){return state.grade==='all'?'全校':`${['','一','二','三'][Number(state.grade)]}年級`;}
    function makeAdminFirstPage(office,total){
      const page=text('section','notice-page',''),header=text('header','title-row','');header.append(text('div','admin-office',`${office} 留存`),text('h1','',adminTitle()),makeHeaderActions());page.append(header);
      const body=text('section','admin-body','');body.append(text('p','admin-filter-note',`篩選：${gradeLabel()}`),text('h2','section-title',`特殊需求學生（${total}人）`));const students=text('div','student-list','');students.dataset.studentList='';body.append(students);page.append(body);return page;
    }
    function makeAdminContinuationPage(office){
      const page=text('section','notice-page',''),header=text('header','continuation-header','');header.append(text('div','continuation-title',`${office}｜特殊需求學生總表（續）`),makeHeaderActions());page.append(header);
      const body=text('section','continuation-body','');body.append(text('h2','section-title',`特殊需求學生（續｜${gradeLabel()}）`));const students=text('div','student-list','');students.dataset.studentList='';body.append(students);page.append(body);return page;
    }
    function pageFits(page){return page.scrollHeight<=page.clientHeight+1;}
    function paginate(students,pageFactory){
      const measure=$('measureRoot'),pages=[];let index=0,page=pageFactory(index),list=page.querySelector('[data-student-list]');measure.append(page);
      if(!students.length)list.append(text('div','empty','查無符合條件的特殊生'));
      for(const student of students){const item=makeStudentItem(student);list.append(item);if(!pageFits(page)&&list.children.length>1){item.remove();pages.push(page);index++;page=pageFactory(index);list=page.querySelector('[data-student-list]');measure.append(page);list.append(item);}}
      pages.push(page);measure.replaceChildren();const total=pages.length;pages.forEach((p,i)=>{const number=p.querySelector('.page-number');if(number)number.textContent=total>1?`第 ${i+1} 頁／共 ${total} 頁`:'';});return pages;
    }
    function teacherPages(name){const data=teacherData(name);return paginate(data.students,index=>index===0?makeTeacherFirstPage(data):makeTeacherContinuationPage(data));}
    function adminPages(office){const students=adminStudents();return paginate(students,index=>index===0?makeAdminFirstPage(office,students.length):makeAdminContinuationPage(office));}
    function renderTeacher(names){$('pages').replaceChildren(...names.flatMap(teacherPages));}
    function renderAdmin(offices){$('pages').replaceChildren(...offices.flatMap(adminPages));}
    function renderCurrent(){if(!state.loaded)return;if(state.activeView==='teacher')renderTeacher([$('teacherSelect').value]);else renderAdmin([$('officeSelect').value]);}
    function setView(view){state.activeView=view;$('teacherModeBtn').classList.toggle('active',view==='teacher');$('adminModeBtn').classList.toggle('active',view==='admin');$('teacherControls').hidden=view!=='teacher';$('adminControls').hidden=view!=='admin';$('screenNote').textContent=view==='teacher'?'列印時請選 A4、直向、縮放 100%，並關閉頁首與頁尾。整疊列印採全部單面，每一頁都有教師姓名及頁碼。':'行政總表使用同一份已載入資料；可依年級篩選，列印採全部單面，每頁都有留存處室及頁碼。';renderCurrent();}
    function printPages(renderPrint){state.restoreAfterPrint=()=>{state.restoreAfterPrint=null;renderCurrent();};renderPrint();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));}
    function printTeachers(all){printPages(()=>renderTeacher(all?state.eligibleTeachers:[$('teacherSelect').value]));}
    function printOffices(all){printPages(()=>renderAdmin(all?OFFICES:[$('officeSelect').value]));}
    function populateControls(){
      const teacherSelect=$('teacherSelect'),prior=teacherSelect.value;teacherSelect.replaceChildren(...state.eligibleTeachers.map(name=>{const option=text('option','',name);option.value=name;return option;}));if(state.eligibleTeachers.includes(prior))teacherSelect.value=prior;
      const officeSelect=$('officeSelect');officeSelect.replaceChildren(...OFFICES.map(name=>{const option=text('option','',`${name} 留存`);option.value=name;return option;}));
      [$('teacherSelect'),$('officeSelect'),$('printOneBtn'),$('printAllBtn'),$('printOfficeBtn'),$('printAllOfficesBtn')].forEach(el=>el.disabled=false);
    }
    async function loadData(){
      [$('teacherSelect'),$('officeSelect'),$('printOneBtn'),$('printAllBtn'),$('printOfficeBtn'),$('printAllOfficesBtn')].forEach(el=>el.disabled=true);$('status').className='status';$('status').textContent='正在讀取公開試算表…';$('pages').innerHTML='<div class="loading-card">正在整理教師、任教班級與特殊生資料…</div>';
      try{
        const infoPromise=loadInfo().then(info=>({info,fallback:false})).catch(error=>({info:{...FALLBACK_INFO},fallback:true,error}));
        const[teachingRows,studentRows,infoResult]=await Promise.all([loadRecords(SHEETS.teaching),loadRecords(SHEETS.students),infoPromise]);state.info=infoResult.info;buildState(teachingRows,studentRows);if(!state.eligibleTeachers.length)throw new Error('沒有找到任教班級可對應到特殊生的教師');state.loaded=true;populateControls();renderCurrent();$('status').textContent=`已載入 ${state.eligibleTeachers.length} 位相關教師、${state.allStudents.length} 位特殊生${infoResult.fallback?'；說明欄暫用備用文字':''}；更新時間 ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
      }catch(error){state.loaded=false;$('status').className='status error';$('status').textContent='資料載入失敗';const card=text('div','loading-card','');card.append(text('strong','','無法讀取公開試算表'),document.createElement('br'),text('span','',error.message),document.createElement('br'),text('small','','請確認網路連線、試算表權限及欄位名稱。'));$('pages').replaceChildren(card);console.error(error);}
    }
    $('teacherModeBtn').addEventListener('click',()=>setView('teacher'));
    $('adminModeBtn').addEventListener('click',()=>setView('admin'));
    $('teacherSelect').addEventListener('change',renderCurrent);
    $('officeSelect').addEventListener('change',renderCurrent);
    $('refreshBtn').addEventListener('click',loadData);
    $('printOneBtn').addEventListener('click',()=>printTeachers(false));
    $('printAllBtn').addEventListener('click',()=>printTeachers(true));
    $('printOfficeBtn').addEventListener('click',()=>printOffices(false));
    $('printAllOfficesBtn').addEventListener('click',()=>printOffices(true));
    document.querySelectorAll('.grade-btn').forEach(button=>button.addEventListener('click',()=>{state.grade=button.dataset.grade;document.querySelectorAll('.grade-btn').forEach(b=>b.classList.toggle('active',b===button));renderCurrent();}));
    window.addEventListener('afterprint',()=>state.restoreAfterPrint?.());
    loadData();
  })();
  </script>
</body>
</html>
