<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新市國中 115學年度 特殊需求學生簡介 v5</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#cbd5e1; --soft:#f1f5f9; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:#eef2f7; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    .toolbar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; background:rgba(255,255,255,.96); border-bottom:1px solid #dbe2ea; box-shadow:0 2px 10px #0f172a12; }
    .toolbar label { font-weight:700; }
    select, button { height:38px; border-radius:8px; border:1px solid #b8c4d2; background:#fff; padding:0 12px; font:inherit; }
    select { min-width:190px; }
    button { cursor:pointer; font-weight:700; }
    button.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-left:auto; color:var(--muted); font-size:14px; }
    .status.error { color:#b91c1c; font-weight:700; }
    .screen-note { max-width:210mm; margin:14px auto 0; color:var(--muted); font-size:13px; }
    #pages { padding:14px 0 32px; }
    .notice-page { width:210mm; min-height:297mm; margin:0 auto 16px; padding:10mm 10mm 9mm; background:#fff; box-shadow:0 4px 18px #0f172a20; break-after:page; page-break-after:always; }
    .notice-page:last-child { break-after:auto; page-break-after:auto; }
    .title-row { display:grid; grid-template-columns:42mm minmax(0,1fr) 22mm; align-items:center; gap:2mm; padding-bottom:2mm; border-bottom:2px solid var(--ink); }
    h1 { margin:0; text-align:center; font-size:19px; letter-spacing:.035em; white-space:nowrap; }
    .teacher-greeting { justify-self:start; font-size:17px; font-weight:950; white-space:nowrap; }
    .confidential-stamp { justify-self:end; min-width:18mm; height:10mm; padding:0 2.5mm; display:grid; place-items:center; color:#c1121f; background:#fff5f5; border:2px solid #c1121f; border-radius:5px; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:15px; font-weight:950; letter-spacing:.12em; }
    .intro-block { margin-top:1.8mm; padding:1.7mm 2.5mm 1.5mm; border:1px solid #cbd5e1; border-radius:4px; background:#fff; font-size:14px; line-height:1.35; }
    .intro-list { margin:0; padding-left:1.45em; }
    .intro-list li { margin:0 0 .8mm; padding-left:.2em; text-align:justify; }
    .intro-list li:last-child { margin-bottom:.5mm; }
    .signoff { margin:.5mm 0 0; text-align:right !important; font-weight:800; letter-spacing:.04em; }
    .content-grid { display:grid; grid-template-columns:41mm minmax(0,1fr); gap:3mm; padding-top:2.3mm; }
    .section-title { margin:0 0 2mm; padding:1.5mm 2mm; background:var(--soft); border-left:4px solid #64748b; font-size:15px; font-weight:900; }
    .class-list { border:1px solid var(--line); border-radius:5px; overflow:hidden; }
    .class-item { padding:2.1mm 2.2mm; border-bottom:1px solid var(--line); line-height:1.35; }
    .class-item:last-child { border-bottom:0; }
    .class-code { display:inline-block; min-width:26px; margin-right:5px; font-size:15px; font-weight:900; }
    .subjects { font-size:14px; }
    .student-list { border-top:1.5px solid #94a3b8; }
    .student-item { display:grid; grid-template-columns:52mm minmax(0,1fr); align-items:start; gap:1mm; padding:1.45mm .7mm; border-bottom:1px solid #b9c4d0; line-height:1.3; break-inside:avoid; page-break-inside:avoid; }
    .student-meta { font-size:14.2px; font-weight:800; white-space:nowrap; }
    .student-note { font-size:14.2px; overflow-wrap:anywhere; }
    .empty { padding:6mm; text-align:center; color:var(--muted); border:1px dashed var(--line); }
    .loading-card { width:min(720px,calc(100% - 32px)); margin:48px auto; padding:28px; text-align:center; background:#fff; border-radius:12px; box-shadow:0 4px 18px #0f172a12; }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body { background:#fff; }
      .toolbar, .screen-note, .loading-card { display:none !important; }
      #pages { padding:0; }
      .notice-page { width:210mm; min-height:297mm; margin:0; box-shadow:none; }
    }
    @media (max-width:850px) {
      .status { width:100%; margin-left:0; }
      .screen-note { margin-inline:16px; }
      #pages { overflow-x:auto; padding-inline:10px; }
      .notice-page { transform-origin:top left; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="teacherSelect">授課教師</label>
    <select id="teacherSelect" disabled><option>資料載入中…</option></select>
    <button id="refreshBtn" type="button">重新載入</button>
    <button id="printOneBtn" class="primary" type="button" disabled>列印這位教師</button>
    <button id="printAllBtn" type="button" disabled>整疊列印</button>
    <span id="status" class="status" role="status">正在讀取公開試算表…</span>
  </div>
  <div class="screen-note">列印時請選 A4、直向、縮放 100%，並關閉瀏覽器頁首與頁尾。畫面只顯示目前教師；「整疊列印」會自動產生所有有特殊生任教班級的教師頁面。</div>
  <main id="pages"><div class="loading-card">正在整理教師、任教班級與特殊生資料…</div></main>

  <script>
  (() => {
    'use strict';
    const SPREADSHEET_ID = '1WC605Hj5k4UWQvtx4APj85S87fJ-QAfOZTX3tVL-jPo';
    const SHEETS = {
      teaching: { name:'教師任課班級', gid:'1784041306', required:['班級','科目','教師'] },
      students: { name:'特殊生名單', gid:'1639309932', required:['班級','學生','障礙類別','特殊狀況'] }
    };
    const $ = id => document.getElementById(id);
    const state = { teachers:new Map(), studentsByClass:new Map(), eligibleTeachers:[], mode:'one' };

    function loadSheetJsonp(sheet) {
      return new Promise((resolve, reject) => {
        const callbackName=`__noticeSheet_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script=document.createElement('script');
        let settled=false;
        const timeout=window.setTimeout(()=>finish(new Error(`${sheet.name}讀取逾時`)),15000);

        function finish(error, records) {
          if (settled) return;
          settled=true;
          window.clearTimeout(timeout);
          script.remove();
          try { delete window[callbackName]; } catch (_) { window[callbackName]=undefined; }
          if (error) reject(error); else resolve(records);
        }

        window[callbackName]=response => {
          try {
            if (!response || response.status !== 'ok' || !response.table) {
              const message=response?.errors?.[0]?.detailed_message || response?.errors?.[0]?.message || 'Google 試算表未回傳資料';
              throw new Error(message);
            }
            const headers=response.table.cols.map(col=>String(col.label || '').trim());
            const missing=sheet.required.filter(h=>!headers.includes(h));
            if (missing.length) throw new Error(`缺少欄位：${missing.join('、')}`);
            const records=(response.table.rows || []).map(row =>
              Object.fromEntries(headers.map((header,index) => {
                const cell=row.c?.[index];
                return [header,String(cell?.f ?? cell?.v ?? '').trim()];
              }))
            ).filter(record=>Object.values(record).some(Boolean));
            finish(null,records);
          } catch (error) {
            finish(new Error(`${sheet.name}讀取失敗（${error.message}）`));
          }
        };

        script.onerror=()=>finish(new Error(`${sheet.name}讀取失敗（請確認試算表已設為知道連結者可查看）`));
        const tqx=`out:json;responseHandler:${callbackName}`;
        script.src=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${encodeURIComponent(sheet.gid)}&headers=1&tqx=${encodeURIComponent(tqx)}&_=${Date.now()}`;
        document.head.append(script);
      });
    }

    function studentClassFor(teachingClass) {
      const value=String(teachingClass).trim();
      return value.replace(/^7(?=\d{2}$)/,'1').replace(/^8(?=\d{2}$)/,'2').replace(/^9(?=\d{2}$)/,'3');
    }

    function classSort(a,b) { return String(a).localeCompare(String(b), 'zh-Hant', {numeric:true}); }
    function text(tag, className, value) { const el=document.createElement(tag); if(className) el.className=className; el.textContent=value; return el; }

    function buildState(teachingRows, studentRows) {
      state.teachers.clear(); state.studentsByClass.clear();
      for (const r of studentRows) {
        if (!r['班級'] || !r['學生']) continue;
        if (!state.studentsByClass.has(r['班級'])) state.studentsByClass.set(r['班級'], []);
        state.studentsByClass.get(r['班級']).push({ className:r['班級'], name:r['學生'], disability:r['障礙類別'] || '未填', note:r['特殊狀況'] || '' });
      }
      for (const r of teachingRows) {
        const teacher=r['教師'], className=r['班級'], subject=r['科目'];
        if (!teacher || !className || !subject) continue;
        if (!state.teachers.has(teacher)) state.teachers.set(teacher, new Map());
        const classes=state.teachers.get(teacher);
        if (!classes.has(className)) classes.set(className, new Set());
        classes.get(className).add(subject);
      }
      state.eligibleTeachers=[...state.teachers.keys()].filter(name =>
        [...state.teachers.get(name).keys()].some(c => state.studentsByClass.has(studentClassFor(c)))
      ).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    }

    function teacherData(name) {
      const classes=[...(state.teachers.get(name) || new Map()).entries()]
        .filter(([c])=>state.studentsByClass.has(studentClassFor(c)))
        .sort(([a],[b])=>classSort(a,b));
      const seen=new Set(), students=[];
      for (const [teachingClass] of classes) {
        for (const student of state.studentsByClass.get(studentClassFor(teachingClass)) || []) {
          const key=`${student.className}\u0000${student.name}`;
          if (!seen.has(key)) { seen.add(key); students.push(student); }
        }
      }
      students.sort((a,b)=>classSort(a.className,b.className)||a.name.localeCompare(b.name,'zh-Hant'));
      return { name, classes, students };
    }

    function makePage(data) {
      const page=text('section','notice-page','');
      const titleRow=text('header','title-row','');
      titleRow.append(text('div','teacher-greeting',`${data.name}老師您好：`));
      titleRow.append(text('h1','', '新市國中 115學年度 特殊需求學生簡介'));
      titleRow.append(text('div','confidential-stamp','密件'));
      page.append(titleRow);
      const intro=text('section','intro-block','');
      const introList=text('ul','intro-list','');
      introList.append(text('li','', '為協助您掌握任教班級中特殊需求學生之學習、溝通、情緒與身心狀況，以下整理目前較重要的需求與教學提醒，供課堂安排與班級互動時參考。'));
      introList.append(text('li','', '學生狀況可能隨時間調整，如有疑問、觀察到新的適應情形，或需要進一步資訊，請與輔導室（6005）或異想教室（6019）聯繫。'));
      introList.append(text('li','', '本資料涉及學生個人與身心資訊，僅供校內教學與輔導使用，請妥善保管，勿公開、轉傳或另作無關用途。'));
      intro.append(introList);
      intro.append(text('p','signoff','輔導室、異想教室 敬上'));
      page.append(intro);
      const grid=text('div','content-grid','');
      const left=text('aside','',''); left.append(text('h2','section-title','任教班級｜科目'));
      const classList=text('div','class-list','');
      for (const [className, subjects] of data.classes) {
        const item=text('div','class-item','');
        item.append(text('span','class-code',className));
        item.append(text('span','subjects',[...subjects].sort((a,b)=>a.localeCompare(b,'zh-Hant')).join('、')));
        classList.append(item);
      }
      left.append(classList);
      const right=text('section','',''); right.append(text('h2','section-title',`相關特殊生（${data.students.length}人）`));
      if (!data.students.length) right.append(text('div','empty','查無相關特殊生'));
      else {
        const list=text('div','student-list','');
        for (const s of data.students) {
          const item=text('article','student-item','');
          item.append(text('div','student-meta',`${s.className}｜${s.name}｜${s.disability}`));
          item.append(text('div','student-note',s.note || '—'));
          list.append(item);
        }
        right.append(list);
      }
      grid.append(left,right); page.append(grid); return page;
    }

    function render(names) {
      const pages=$('pages'); pages.replaceChildren(...names.map(n=>makePage(teacherData(n))));
    }

    function renderSelected() { state.mode='one'; render([$('teacherSelect').value]); }
    function doPrint(all) {
      const previous=$('teacherSelect').value;
      state.mode=all?'all':'one'; render(all ? state.eligibleTeachers : [previous]);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ window.print(); if(all){ state.mode='one'; render([previous]); } }));
    }

    async function loadData() {
      const controls=[$('teacherSelect'),$('printOneBtn'),$('printAllBtn')]; controls.forEach(el=>el.disabled=true);
      $('status').className='status'; $('status').textContent='正在讀取公開試算表…';
      $('pages').innerHTML='<div class="loading-card">正在整理教師、任教班級與特殊生資料…</div>';
      try {
        const [teachingRows,studentRows]=await Promise.all([loadSheetJsonp(SHEETS.teaching),loadSheetJsonp(SHEETS.students)]);
        buildState(teachingRows,studentRows);
        if (!state.eligibleTeachers.length) throw new Error('沒有找到任教班級可對應到特殊生的教師');
        const select=$('teacherSelect'), prior=select.value;
        select.replaceChildren(...state.eligibleTeachers.map(name=>{ const o=document.createElement('option'); o.value=o.textContent=name; return o; }));
        if (state.eligibleTeachers.includes(prior)) select.value=prior;
        controls.forEach(el=>el.disabled=false); renderSelected();
        $('status').textContent=`已載入 ${state.eligibleTeachers.length} 位相關教師；更新時間 ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
      } catch (error) {
        $('status').className='status error'; $('status').textContent='資料載入失敗';
        $('pages').innerHTML=''; const card=text('div','loading-card','');
        card.append(text('strong','','無法讀取公開試算表')); card.append(document.createElement('br')); card.append(text('span','',error.message));
        card.append(document.createElement('br')); card.append(text('small','', '請確認網路連線、試算表仍為「發布到網路」，且欄位名稱未變更。'));
        $('pages').append(card); console.error(error);
      }
    }

    $('teacherSelect').addEventListener('change',renderSelected);
    $('refreshBtn').addEventListener('click',loadData);
    $('printOneBtn').addEventListener('click',()=>doPrint(false));
    $('printAllBtn').addEventListener('click',()=>doPrint(true));
    window.addEventListener('afterprint',()=>{ if(state.mode==='all' && $('teacherSelect').value){ state.mode='one'; renderSelected(); } });
    loadData();
  })();
  </script>
</body>
</html>
