<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國文科段考成績通知單產生器</title>
  <style>
    :root {
      --ink:#111827; --muted:#64748b; --panel:#fff; --page:#fff;
      --navy:#1e293b; --blue:#2563eb; --green:#059669; --row-height:1.3cm;
      --print-font-size:18pt;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { color:var(--ink); background:#f8fafc; font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; }
    button,select,input { font:inherit; }
    .topbar { position:sticky; top:0; z-index:20; min-height:72px; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; color:#fff; background:var(--navy); box-shadow:0 3px 10px #0f172a33; }
    .brand h1 { margin:0 0 3px; font-size:20px; }
    .brand p { margin:0; color:#94a3b8; font-size:12px; }
    .sync-area { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .sync-badge,.count-badge { display:inline-flex; align-items:center; gap:7px; min-height:30px; padding:5px 12px; border:1px solid #1d4ed8; border-radius:999px; color:#bfdbfe; background:#1e3a5f; font-size:12px; }
    .count-badge { color:#e2e8f0; background:#0f172a; border-color:#334155; }
    .sync-dot { width:9px; height:9px; flex:0 0 auto; border-radius:50%; background:#60a5fa; }
    .sync-badge.connecting .sync-dot { animation:pulse 1.1s infinite; }
    .sync-badge.success { color:#a7f3d0; background:#064e3b; border-color:#059669; }
    .sync-badge.success .sync-dot { background:#34d399; }
    .sync-badge.fallback { color:#fde68a; background:#713f12; border-color:#d97706; }
    .sync-badge.fallback .sync-dot { background:#fbbf24; }
    @keyframes pulse { 50% { opacity:.3; } }
    .layout { width:min(1480px,100%); margin:0 auto; padding:24px; display:grid; grid-template-columns:280px minmax(0,1fr); gap:24px; align-items:start; }
    .sidebar { position:sticky; top:96px; display:flex; flex-direction:column; gap:16px; }
    .card { padding:18px; background:var(--panel); border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 2px 8px #0f172a12; }
    .card h2 { margin:0 0 14px; color:#64748b; font-size:13px; letter-spacing:.08em; }
    .field { display:block; margin-bottom:14px; }
    .field:last-child { margin-bottom:0; }
    .field span { display:block; margin-bottom:6px; font-size:14px; font-weight:700; }
    .field select,.field input { width:100%; height:40px; padding:6px 10px; color:var(--ink); background:#fff; border:1px solid #94a3b8; border-radius:7px; }
    .button-stack { display:grid; gap:10px; }
    .button { min-height:42px; padding:8px 12px; border:0; border-radius:7px; color:#fff; background:var(--blue); font-weight:700; cursor:pointer; }
    .button.green { background:var(--green); }
    .button.slate { background:#475569; }
    .button.word { background:#2563eb; }
    .button:disabled { opacity:.58; cursor:wait; }
    .button.small { min-height:36px; font-size:13px; }
    .tip { margin:12px 0 0; color:#475569; font-size:12px; line-height:1.6; }
    .filter-card { padding:0; overflow:hidden; }
    .filter-card summary { padding:18px; color:#64748b; font-size:13px; font-weight:700; letter-spacing:.08em; cursor:pointer; user-select:none; }
    .filter-card[open] summary { border-bottom:1px solid #e2e8f0; }
    .filter-content { padding:16px 18px 18px; }
    .student-filter-list { max-height:280px; margin-top:10px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:7px; }
    .student-filter-item { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; padding:8px 9px; border-bottom:1px solid #e2e8f0; font-size:13px; cursor:pointer; }
    .student-filter-item:last-child { border-bottom:0; }
    .student-filter-item:hover { background:#f8fafc; }
    .student-filter-item input { width:17px; height:17px; accent-color:var(--blue); }
    .student-filter-item.excluded { color:#94a3b8; text-decoration:line-through; }
    .filter-summary { margin:8px 0 0; color:var(--muted); font-size:12px; }
    .preview-title { margin:0 0 8px 4px; color:#64748b; font-size:14px; font-weight:700; }
    .paper { width:210mm; min-height:297mm; margin:0 auto 24px; padding:16mm 12mm; background:var(--page); box-shadow:0 12px 28px #0f172a2b; }
    .notice-unit,.mismatch-notice { color:#000; font-family:"DFKai-SB","BiauKai","標楷體","PMingLiU",serif; font-size:var(--print-font-size); line-height:1.3; break-inside:avoid; page-break-inside:avoid; }
    .notice-unit + .notice-unit,.notice-unit + .mismatch-notice,.mismatch-notice + .mismatch-notice { margin-top:14mm; }
    .notice-title { margin:0 0 2mm; text-align:center; font-size:1.05em; font-weight:400; white-space:nowrap; }
    .teacher-name { margin:0 0 2mm 9mm; font-size:1.18em; font-weight:700; line-height:1.25; }
    .teacher-name .name { text-decoration:underline; text-underline-offset:3px; }
    .table-block { margin-top:2mm; break-inside:avoid; page-break-inside:avoid; }
    .ratio-guide {
      width:100%; min-height:14mm; display:grid;
      grid-template-columns:10% 14% 9% 10% 15% 19% 23%;
      align-items:end; margin:0 auto 1.5mm;
    }
    .ratio-house {
      width:18mm; height:14mm; display:flex; align-items:flex-start; justify-content:center;
      padding-top:2.5mm; background:#eef2f7; color:#111827;
      clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);
      box-shadow:inset 0 0 0 .35mm #111827;
      font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
      font-size:11.5pt; font-weight:800; line-height:1;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .ratio-house.daily { grid-column:5; justify-self:center; }
    .ratio-house.exam { grid-column:6; justify-self:center; }

    .grade-table { width:100%; margin:0 auto; border-collapse:collapse; table-layout:fixed; font-size:.83em; }
    .grade-table th,.grade-table td { height:var(--row-height); padding:1mm; border:1px solid #000; text-align:center; vertical-align:middle; overflow-wrap:anywhere; font-weight:400; }
    .grade-table th { height:auto; min-height:9mm; white-space:nowrap; }
    .main-table .col-class { width:10%; } .main-table .col-name { width:14%; } .main-table .col-seat { width:9%; }
    .main-table .col-subject { width:10%; }
    .main-table .col-daily { width:15%; position:relative; }
    .main-table .col-exam { width:19%; position:relative; }
    .main-table .col-teacher { width:23%; }

    .ratio-corner {
      position:absolute; right:1mm; bottom:.7mm; padding:.4mm 1.2mm .3mm;
      border-radius:1.2mm; background:#fde047;
      font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
      font-size:12pt; font-weight:800; line-height:1; color:#111827; white-space:nowrap;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .composition-note {
      position:absolute; right:1mm; bottom:.7mm; padding:.4mm 1.2mm .3mm;
      border-radius:1.2mm; background:#fde047;
      font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
      font-size:11.5pt; font-weight:800; line-height:1; color:#111827; white-space:nowrap;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }

    .ratio-section + .ratio-section { margin-top:6mm; }
    .ratio-note { margin:1.8mm 0 0; font-size:.62em; line-height:1.45; }
    .ratio-note p,.notes p { margin:0; }
    .notes { margin-top:3mm; font-size:.65em; line-height:1.45; }
    .cut-line { position:relative; height:8mm; margin:4mm 0 3mm; border-bottom:1.5px dashed #a3a3a3; }
    .cut-line span { position:absolute; left:5mm; bottom:-.58em; padding:0 2mm; color:#737373; background:#fff; font:16px "Microsoft JhengHei","Noto Sans TC",sans-serif; }
    .receipt-title { margin:0 0 1mm; text-align:center; font-size:.9em; font-weight:700; }
    .receipt-instruction { margin:0 0 2mm; font-size:.62em; line-height:1.55; }
    .highlight-mark {
      padding:0 .3mm;
      background:linear-gradient(transparent 15%,rgba(250,204,21,.62) 15%,rgba(250,204,21,.62) 90%,transparent 90%);
      -webkit-box-decoration-break:clone; box-decoration-break:clone;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .receipt-table { font-size:.72em; }
    .receipt-table th,.receipt-table td { height:10mm; }
    .receipt-table .col-class { width:13%; } .receipt-table .col-name { width:18%; } .receipt-table .col-seat { width:12%; }
    .receipt-table .col-subject { width:12%; } .receipt-table .col-composition { width:18%; } .receipt-table .col-score { width:25%; } .receipt-table .col-return { width:17%; }
    .receipt-table.mixed-teachers .col-class { width:11%; } .receipt-table.mixed-teachers .col-name { width:17%; } .receipt-table.mixed-teachers .col-seat { width:10%; }
    .receipt-table.mixed-teachers .col-subject { width:11%; } .receipt-table.mixed-teachers .col-composition { width:16%; } .receipt-table.mixed-teachers .col-score { width:18%; }
    .empty { padding:60mm 10mm; color:#64748b; text-align:center; font:16px "Microsoft JhengHei",sans-serif; }
    @page { size:A4 portrait; margin:16mm 12mm; }
    @media print {
      html,body { width:210mm; background:#fff; }
      .no-print { display:none !important; }
      .layout { display:block; width:auto; margin:0; padding:0; }
      .paper { width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
      .notice-unit,.mismatch-notice,.table-block { break-inside:avoid-page !important; page-break-inside:avoid !important; }
      .notice-unit + .notice-unit,.notice-unit + .mismatch-notice,.mismatch-notice + .mismatch-notice { margin-top:10mm; }
      .ratio-house,.ratio-corner,.composition-note,.highlight-mark { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand"><h1>國文科段考成績通知單產生器</h1><p>115學年度｜含作文分數回條｜A4 直向單面列印</p></div>
    <div class="sync-area" aria-live="polite">
      <div id="syncBadge" class="sync-badge connecting"><span class="sync-dot"></span><span id="syncText">正在連線至雲端試算表 A7 抽課分頁……</span></div>
      <div class="count-badge">收件教師 <strong id="teacherCount">0</strong> 位｜通知紀錄 <strong id="studentCount">0</strong> 筆</div>
    </div>
  </header>
  <main class="layout">
    <aside class="sidebar no-print">
      <section class="card">
        <h2>📋 成績單設定</h2>
        <label class="field"><span>學年度與段考</span><select id="exam">
          <option value="115學年度|上學期|第一次">115學年度 上學期 第一次段考</option>
          <option value="115學年度|上學期|第二次" selected>115學年度 上學期 第二次段考</option>
          <option value="115學年度|上學期|第三次">115學年度 上學期 第三次段考</option>
          <option value="115學年度|下學期|第一次">115學年度 下學期 第一次段考</option>
          <option value="115學年度|下學期|第二次">115學年度 下學期 第二次段考</option>
          <option value="115學年度|下學期|第三次">115學年度 下學期 第三次段考</option>
        </select></label>
        <label class="field"><span>收件教師（原班教師）</span><select id="teacher"><option value="all">全部教師</option></select></label>
        <label class="field"><span>異想教室國文老師</span><select id="resourceTeacher"><option value="all">全部教師</option></select></label>
        <label class="field"><span>版面模式</span><select id="viewMode">
          <option value="compact" selected>班級集中｜格內 50%</option>
          <option value="arrow">比例分區｜箭頭</option>
                  </select></label>
      </section>
      <section class="card">
        <h2>🖨️ 操作與輸出</h2>
        <div class="button-stack">
          <button id="printPage" class="button green" type="button">列印通知單 (A4)</button>
          <button id="reload" class="button slate" type="button">即時同步雲端資料</button>
        </div>
        <p class="tip">班級集中不拆 50%／100%；比例分區模式依 50%／100% 分開顯示箭頭。</p>
      </section>
      <details class="card filter-card"><summary id="filterToggleText">✅ 學生篩選（點此展開）</summary><div class="filter-content">
        <label class="field"><span>搜尋學生</span><input id="studentSearch" type="search" placeholder="搜尋班級、座號、姓名或教師"></label>
        <div id="studentFilters" class="student-filter-list"></div><p id="filterSummary" class="filter-summary"></p>
        <button id="restoreStudents" class="button small slate" style="width:100%;margin-top:10px" type="button">全部恢復顯示</button>
      </div></details>
    </aside>
    <section class="preview"><p class="preview-title no-print">👁️ A4 通知單預覽</p><div id="single-page" class="paper"><div id="notice"><div class="empty">正在讀取雲端試算表 A7 抽課資料……</div></div></div></section>
  </main>
  <script>
    const SHEET_ID="2PACX-1vSNEots8pxAuco9lAY1ZNv1nVH-GgKODMA_DN-diDP40jsoR-ZXEN7fAdmBmdEKm0NMkPYDvGY7KfCk";
    const SHEET_CSV_BASE=`https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?single=true&output=csv&gid=`;
    const A7_GID="240638258";
    const $=selector=>document.querySelector(selector);
    let records=[];
    let excluded=new Set(JSON.parse(sessionStorage.getItem("chinese-score-notice-excluded")||"[]"));

    const FALLBACK_RECORDS=[
      {id:"fallback-match-1",kind:"match",className:"測試班",seat:"1",name:"測試學生甲",originalTeacher:"測試國文老師",resourceTeacher:"陳秋錡",pulloutCount:1,subject:"國文"},
      {id:"fallback-match-2",kind:"match",className:"測試班",seat:"2",name:"測試學生乙",originalTeacher:"測試國文老師",resourceTeacher:"洪羽晶",pulloutCount:3,subject:"國文"}
    ];

    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
    function parseCsv(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&quoted&&next==='"'){field+='"';i++;}else if(char==='"')quoted=!quoted;else if(char===","&&!quoted){row.push(field.trim());field="";}else if((char==="\n"||char==="\r")&&!quoted){if(char==="\r"&&next==="\n")i++;row.push(field.trim());if(row.some(Boolean))rows.push(row);row=[];field="";}else field+=char;}row.push(field.trim());if(row.some(Boolean))rows.push(row);return rows;}
    function normalizeHeader(value){return String(value??"").replace(/[\s　:：()（）_\-]/g,"").toLowerCase();}
    function findHeaderIndex(headers,aliases){const normalized=headers.map(normalizeHeader);for(const alias of aliases){const index=normalized.indexOf(normalizeHeader(alias));if(index>=0)return index;}return -1;}

    function buildRecordsFromA7Rows(rows){
      if(!rows||rows.length<2)return[];
      const headers=rows[0];
      const classIndex=findHeaderIndex(headers,["原班","班級","班別"]),seatIndex=findHeaderIndex(headers,["座號","座次"]),nameIndex=findHeaderIndex(headers,["學生","學生姓名","姓名"]);
      const pulloutIndex=findHeaderIndex(headers,["國文抽離","國文抽離節數","抽離國文","國文節數","國文"]),originalTeacherIndex=findHeaderIndex(headers,["原班國師","原班國文老師","原班國文教師","原班國文任課老師","國文老師"]),resourceTeacherIndex=findHeaderIndex(headers,["特教國師","特教國文老師","異想國師","異想教室國文老師","資源班國文老師"]);
      const missing=[];if(classIndex<0)missing.push("班級");if(seatIndex<0)missing.push("座號");if(nameIndex<0)missing.push("學生姓名");if(pulloutIndex<0)missing.push("國文抽離");if(originalTeacherIndex<0)missing.push("原班國師");if(resourceTeacherIndex<0)missing.push("特教國師");if(missing.length)throw new Error(`找不到欄位：${missing.join("、")}。請確認 A7抽課表頭名稱。`);
      const parsed=[];
      rows.slice(1).forEach((row,offset)=>{
        const rowNumber=offset+2,className=String(row[classIndex]??"").trim(),seat=String(row[seatIndex]??"").trim(),name=String(row[nameIndex]??"").trim(),originalTeacher=String(row[originalTeacherIndex]??"").trim(),resourceTeacher=String(row[resourceTeacherIndex]??"").trim(),pulloutCount=parseInt(String(row[pulloutIndex]??"").trim(),10)||0;
        if(className&&name&&originalTeacher&&resourceTeacher&&pulloutCount>0)parsed.push({id:`a7-chinese-match-${className}-${seat}-${name}-${rowNumber}`,kind:"match",className,seat,name,originalTeacher,resourceTeacher,pulloutCount,subject:"國文"});
      });
      return parsed;
    }

    async function fetchA7SheetData(){const response=await fetch(`${SHEET_CSV_BASE}${A7_GID}&_=${Date.now()}`,{cache:"no-store"});if(!response.ok)throw new Error(`試算表讀取失敗（${response.status}）`);const data=buildRecordsFromA7Rows(parseCsv(await response.text()));if(!data.length)throw new Error("A7抽課分頁已讀取，但找不到國文通知資料");return data;}
    function filteredRecords(){const selected=$("#resourceTeacher")?.value||"all";return records.filter(record=>selected==="all"||record.resourceTeacher===selected);}
    function groups(){const map=new Map();filteredRecords().forEach(record=>{if(!map.has(record.originalTeacher))map.set(record.originalTeacher,[]);map.get(record.originalTeacher).push(record);});return [...map.entries()].sort(([a],[b])=>a.localeCompare(b,"zh-Hant")).map(([teacher,students])=>({teacher,students:students.sort((a,b)=>a.className.localeCompare(b.className,"zh-Hant")||Number(a.seat||999)-Number(b.seat||999))}));}
    function studentRatio(student){return student.pulloutCount<3?50:100;}

    function ratioHouseHtml(ratio,kind){
      return `<div class="ratio-house ${kind}" aria-label="${kind==="daily"?"日常":"定期"}評量 ${ratio}%">${ratio}%</div>`;
    }

    function ratioGuideHtml(dailyRatio){
      return `<div class="ratio-guide" aria-label="成績比例箭頭">
        ${ratioHouseHtml(dailyRatio,"daily")}
        ${ratioHouseHtml(100,"exam")}
      </div>`;
    }

    function mainTableHtml(students,{showCorner=false}={}){
      return `<table class="grade-table main-table"><thead><tr>
        <th class="col-class">班級</th><th class="col-name">姓名</th><th class="col-seat">座號</th>
        <th class="col-subject">科目</th><th class="col-daily">日常評量</th><th class="col-exam">定期評量</th>
        <th class="col-teacher">異想教室老師</th></tr></thead><tbody>${students.map(student=>`<tr>
        <td>${escapeHtml(student.className)}</td><td>${escapeHtml(student.name)}</td><td>${escapeHtml(student.seat)}</td>
        <td>國文</td>
        <td class="col-daily">${showCorner&&studentRatio(student)===50?'<span class="ratio-corner">50%</span>':""}</td>
        <td class="col-exam"><span class="composition-note">＋作文分數</span></td>
        <td>${escapeHtml(student.resourceTeacher)}</td></tr>`).join("")}</tbody></table>`;
    }

    function tableBlockHtml(students,dailyRatio,mode){
      if(mode==="arrow") return `<div class="table-block">${ratioGuideHtml(dailyRatio)}${mainTableHtml(students)}</div>`;
      return `<div class="table-block">${mainTableHtml(students,{showCorner:true})}</div>`;
    }

    function receiptHtml(students){
      const teachers=[...new Set(students.map(student=>student.resourceTeacher).filter(Boolean))];
      const mixed=teachers.length>1;
      const target=mixed?"異想教室任課老師":`${teachers[0]||"異想教室任課"}老師`;
      const instruction=`<span class="highlight-mark">定期評量成績加上作文分數後</span>，請將回條交給${escapeHtml(target)}，以利成績登記，感謝。`;
      return `<div class="cut-line" aria-hidden="true"><span>✂</span></div><section class="receipt">
        <h3 class="receipt-title">定期評量成績回條</h3>
        <p class="receipt-instruction">☆ ${instruction}</p>
        <table class="grade-table receipt-table${mixed?" mixed-teachers":""}"><thead><tr>
        <th class="col-class">班級</th><th class="col-name">姓名</th><th class="col-seat">座號</th><th class="col-subject">科目</th>
        <th class="col-composition">作文分</th><th class="col-score">定期評量</th>${mixed?'<th class="col-return">交回老師</th>':""}
        </tr></thead><tbody>${students.map(student=>`<tr><td>${escapeHtml(student.className)}</td><td>${escapeHtml(student.name)}</td>
        <td>${escapeHtml(student.seat)}</td><td>國文</td><td aria-label="作文分手寫欄"></td><td aria-label="定期評量手寫欄"></td>
        ${mixed?`<td>${escapeHtml(student.resourceTeacher)}</td>`:""}</tr>`).join("")}</tbody></table></section>`;
    }

    function matchNoticeHtml(group){
      const [year,semester,period]=$("#exam").value.split("|");
      const students=group.students.filter(student=>!excluded.has(student.id));
      const mode=$("#viewMode").value;
      let body="";

      if(mode==="compact"){
        body=tableBlockHtml(students,null,"compact");
      }else{
        const fifty=students.filter(student=>studentRatio(student)===50);
        const hundred=students.filter(student=>studentRatio(student)===100);
        if(fifty.length)body+=`<section class="ratio-section">${tableBlockHtml(fifty,50,mode)}
          <div class="ratio-note"><p>異想教室上課節數未達原班 50%者，請老師參閱此成績，依 50%比例評定該生日常成績。</p></div></section>`;
        if(hundred.length)body+=`<section class="ratio-section">${tableBlockHtml(hundred,100,mode)}
          <div class="ratio-note"><p>異想教室上課節數超過原班 50%者，由異想教室評定 100%日常成績。</p></div></section>`;
      }

      body+=`<div class="notes"><p>☆依據 104.1.7 特推會決議，請老師參閱此分數作為上傳成績之依據：</p>
      <p>1. 課程科目與原班符合，定期評量成績須加上作文分數後登記。</p>
      <p>2. 異想教室上課節數超過原班 50%者，由異想教室評定 100%日常成績。</p>
      <p>3. 異想教室上課節數未達原班 50%者，請老師參閱此成績依 50%比例評定該生日常成績。</p></div>`;

      return `<article class="notice-unit"><section class="main-notice"><h2 class="notice-title">${year} ${semester} 異想教室${period}成績</h2>
      <p class="teacher-name"><span class="name">${escapeHtml(group.teacher)}</span> 老師：</p>${body}</section>${receiptHtml(students)}</article>`;
    }

    function refreshResourceTeacherOptions(){const current=$("#resourceTeacher").value,teachers=[...new Set(records.map(record=>record.resourceTeacher).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));$("#resourceTeacher").innerHTML='<option value="all">全部教師</option>'+teachers.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)} 老師</option>`).join("");$("#resourceTeacher").value=teachers.includes(current)?current:"all";}
    function refreshTeacherOptions(preserve=false){const current=preserve?$("#teacher").value:"all",teachers=[...new Set(groups().map(group=>group.teacher))];$("#teacher").innerHTML='<option value="all">全部教師</option>'+teachers.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)} 老師</option>`).join("");$("#teacher").value=current==="all"||teachers.includes(current)?current:"all";}
    function visibleGroups(){const selected=$("#teacher").value;return groups().filter(group=>selected==="all"||group.teacher===selected).map(group=>({...group,students:group.students.filter(student=>!excluded.has(student.id))})).filter(group=>group.students.length);}
    function render(){const visible=visibleGroups();$("#notice").innerHTML=visible.length?visible.map(matchNoticeHtml).join(""):'<div class="empty">目前沒有可顯示的通知單資料。</div>';}
    function selectedStudents(){const selected=$("#teacher").value;return groups().filter(group=>selected==="all"||group.teacher===selected).flatMap(group=>group.students.map(student=>({...student,recipient:group.teacher})));}

    function saveExcluded(){sessionStorage.setItem("chinese-score-notice-excluded",JSON.stringify([...excluded]));}
    function renderStudentFilters(){
      const keyword=normalizeHeader($("#studentSearch").value),students=selectedStudents(),filtered=students.filter(student=>!keyword||normalizeHeader(`${student.className}${student.seat}${student.name}${student.subject}${student.recipient}${student.resourceTeacher}`).includes(keyword));
      $("#studentFilters").innerHTML=filtered.length?filtered.map(student=>{const off=excluded.has(student.id);return `<label class="student-filter-item${off?" excluded":""}"><input type="checkbox" data-student-id="${escapeHtml(student.id)}" ${off?"":"checked"}><span>${escapeHtml(student.className)}班 ${escapeHtml(student.seat)}號 ${escapeHtml(student.name)}<br><small>國文 → ${escapeHtml(student.recipient)}老師｜${escapeHtml(student.resourceTeacher)}老師</small></span></label>`;}).join(""):'<div style="padding:12px;color:#64748b;font-size:13px">找不到符合條件的學生。</div>';
      const included=students.filter(student=>!excluded.has(student.id)).length;
      $("#filterSummary").textContent=`目前保留 ${included} 筆，排除 ${students.length-included} 筆。`;
      $("#filterToggleText").textContent=`✅ 學生篩選（保留 ${included}／排除 ${students.length-included}）`;
      $("#studentFilters").querySelectorAll("[data-student-id]").forEach(input=>input.addEventListener("change",event=>{const id=event.currentTarget.dataset.studentId;if(event.currentTarget.checked)excluded.delete(id);else excluded.add(id);saveExcluded();render();renderStudentFilters();}));
    }

    function updateConnectionStatus(type,message){$("#syncBadge").className=`sync-badge ${type}`;$("#syncText").textContent=message;$("#teacherCount").textContent=new Set(groups().map(group=>group.teacher)).size;$("#studentCount").textContent=filteredRecords().length;}
    async function loadData(){updateConnectionStatus("connecting","正在連線至雲端試算表 A7 抽課分頁……");try{records=await fetchA7SheetData();refreshResourceTeacherOptions();refreshTeacherOptions();render();renderStudentFilters();updateConnectionStatus("success","雲端連線成功！已同步國文資料。");}catch(error){console.warn("雲端讀取失敗，載入測試資料：",error);records=FALLBACK_RECORDS.map(record=>({...record}));refreshResourceTeacherOptions();refreshTeacherOptions();render();renderStudentFilters();updateConnectionStatus("fallback",`連線失敗，目前顯示測試資料。原因：${error.message}`);}}

    async function downloadWord(){
      const button=$("#downloadWord");
      const visible=visibleGroups();
      if(!visible.length){alert("目前沒有可輸出的通知單資料。");return;}
      button.disabled=true;button.textContent="正在產生 Word…";
      try{
        const {
          AlignmentType, BorderStyle, Document, HighlightColor, Packer, Paragraph, Table, TableCell, TableLayoutType,
          TableRow, TextRun, VerticalAlign, WidthType
        }=await import("https://cdn.jsdelivr.net/npm/docx@9.5.1/+esm");

        const FONT="DFKai-SB";
        const mainWidths=[10,14,9,10,15,19,23];
        const border={style:BorderStyle.SINGLE,size:4,color:"000000"};
        const borders={top:border,bottom:border,left:border,right:border};
        const noBorder={style:BorderStyle.NONE,size:0,color:"FFFFFF"};
        const noBorders={top:noBorder,bottom:noBorder,left:noBorder,right:noBorder};

        const text=(value,size=28,bold=false)=>new TextRun({text:String(value??""),font:FONT,size,bold});
        const para=(value,{size=28,bold=false,align=AlignmentType.CENTER,spacingAfter=0,pageBreakBefore=false}={})=>new Paragraph({
          alignment:align,
          pageBreakBefore,
          spacing:{after:spacingAfter},
          children:[text(value,size,bold)]
        });
        const cell=(value,width,{size=28,bold=false,borderSet=borders,align=AlignmentType.CENTER}={})=>new TableCell({
          width:{size:width,type:WidthType.PERCENTAGE},
          verticalAlign:VerticalAlign.CENTER,
          borders:borderSet,
          children:[para(value,{size,bold,align})]
        });

        function wordRatioGuide(dailyRatio){
          const guideCell=(label,width)=>new TableCell({
            width:{size:width,type:WidthType.PERCENTAGE},
            verticalAlign:VerticalAlign.CENTER,
            borders:noBorders,
            children:label?[
              para(`${label}%`,{size:26,bold:true,align:AlignmentType.CENTER}),
              para("↓",{size:30,bold:true,align:AlignmentType.CENTER})
            ]:[para("",{size:10})]
          });
          const labels=["","","","",dailyRatio,100,""];
          return new Table({
            width:{size:100,type:WidthType.PERCENTAGE},
            layout:TableLayoutType.FIXED,
            borders:noBorders,
            rows:[new TableRow({
              cantSplit:true,
              children:labels.map((label,index)=>guideCell(label,mainWidths[index]))
            })]
          });
        }

        function wordMainTable(students,mode){
          const headers=["班級","姓名","座號","科目","日常評量","定期評量","異想教室老師"];
          const rows=[
            new TableRow({cantSplit:true,tableHeader:true,children:headers.map((header,index)=>cell(header,mainWidths[index],{size:28}))}),
            ...students.map(student=>new TableRow({cantSplit:true,children:[
              cell(student.className,mainWidths[0]),
              cell(student.name,mainWidths[1]),
              cell(student.seat,mainWidths[2]),
              cell("國文",mainWidths[3]),
              cell(mode==="compact"&&studentRatio(student)===50?"50%":"",mainWidths[4],{size:22}),
              cell("＋作文分數",mainWidths[5],{size:20}),
              cell(student.resourceTeacher,mainWidths[6])
            ]}))
          ];
          return new Table({width:{size:100,type:WidthType.PERCENTAGE},layout:TableLayoutType.FIXED,rows});
        }

        function wordReceiptTable(students){
          const teachers=[...new Set(students.map(student=>student.resourceTeacher).filter(Boolean))],mixed=teachers.length>1;
          const widths=mixed?[11,17,10,11,16,18,17]:[13,18,12,12,18,27];
          const headers=mixed?["班級","姓名","座號","科目","作文分","定期評量","交回老師"]:["班級","姓名","座號","科目","作文分","定期評量"];
          const rows=[
            new TableRow({cantSplit:true,tableHeader:true,children:headers.map((header,index)=>cell(header,widths[index],{size:26}))}),
            ...students.map(student=>new TableRow({cantSplit:true,children:[
              cell(student.className,widths[0],{size:26}),
              cell(student.name,widths[1],{size:26}),
              cell(student.seat,widths[2],{size:26}),
              cell("國文",widths[3],{size:26}),
              cell("",widths[4],{size:26}),
              cell("",widths[5],{size:26}),
              ...(mixed?[cell(student.resourceTeacher,widths[6],{size:24})]:[])
            ]}))
          ];
          return new Table({width:{size:100,type:WidthType.PERCENTAGE},layout:TableLayoutType.FIXED,rows});
        }

        const [year,semester,period]=$("#exam").value.split("|");
        const children=[];
        visible.forEach((group,groupIndex)=>{
          children.push(para(`${year} ${semester} 異想教室${period}成績`,{size:36,align:AlignmentType.CENTER,pageBreakBefore:groupIndex>0,spacingAfter:160}));
          children.push(para(`${group.teacher} 老師：`,{size:38,bold:true,align:AlignmentType.LEFT,spacingAfter:120}));

          const mode=$("#viewMode").value;
          if(mode==="compact"){
            children.push(wordMainTable(group.students,"compact"));
          }else{
            const wordChunks=[50,100].map(ratio=>({ratio,students:group.students.filter(student=>studentRatio(student)===ratio)})).filter(chunk=>chunk.students.length);
            wordChunks.forEach(chunk=>{
              children.push(wordRatioGuide(chunk.ratio));
              children.push(wordMainTable(chunk.students,mode));
              children.push(para("",{size:10,spacingAfter:80}));
            });
          }

          children.push(para("☆依據 104.1.7 特推會決議，請老師參閱此分數作為上傳成績之依據：",{size:24,align:AlignmentType.LEFT,spacingAfter:30}));
          children.push(para("1. 課程科目與原班符合，定期評量成績須加上作文分數後登記。",{size:24,align:AlignmentType.LEFT,spacingAfter:30}));
          children.push(para("2. 異想教室上課節數超過原班 50%者，由異想教室評定 100%日常成績。",{size:24,align:AlignmentType.LEFT,spacingAfter:30}));
          children.push(para("3. 異想教室上課節數未達原班 50%者，請老師參閱此成績依 50%比例評定該生日常成績。",{size:24,align:AlignmentType.LEFT,spacingAfter:180}));

          children.push(para("────────────────────────────────",{size:18,align:AlignmentType.CENTER,spacingAfter:80}));
          children.push(para("定期評量成績回條",{size:32,bold:true,align:AlignmentType.CENTER,spacingAfter:60}));
          const teachers=[...new Set(group.students.map(student=>student.resourceTeacher).filter(Boolean))];
          const target=teachers.length>1?"異想教室任課老師":`${teachers[0]||"異想教室任課"}老師`;
          children.push(new Paragraph({
            alignment:AlignmentType.LEFT,
            spacing:{after:80},
            children:[
              new TextRun({text:"☆ ",font:FONT,size:24}),
              new TextRun({text:"定期評量成績加上作文分數後",font:FONT,size:24,highlight:HighlightColor.YELLOW}),
              new TextRun({text:`，請將回條交給${target}，以利成績登記，感謝。`,font:FONT,size:24})
            ]
          }));
          children.push(wordReceiptTable(group.students));
        });

        const doc=new Document({
          styles:{default:{document:{run:{font:FONT,size:28},paragraph:{spacing:{line:360}}}}},
          sections:[{
            properties:{page:{size:{width:11906,height:16838},margin:{top:907,right:680,bottom:907,left:680}}},
            children
          }]
        });

        const blob=await Packer.toBlob(doc);
        const url=URL.createObjectURL(blob);
        const link=document.createElement("a");
        link.href=url;
        link.download=`${year}_${semester}_${period}_國文段考成績通知單.docx`;
        document.body.appendChild(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }catch(error){
        console.error(error);
        alert(`Word 產生失敗：${error.message}`);
      }finally{
        button.disabled=false;button.textContent="下載 Word (.docx)";
      }
    }

    $("#teacher").addEventListener("change",()=>{render();renderStudentFilters();});
    $("#resourceTeacher").addEventListener("change",()=>{refreshTeacherOptions(true);render();renderStudentFilters();updateConnectionStatus("success","已套用異想教室國文老師篩選。");});
    $("#exam").addEventListener("change",render);
    $("#viewMode").addEventListener("change",render);
    $("#studentSearch").addEventListener("input",renderStudentFilters);
    $("#restoreStudents").addEventListener("click",()=>{selectedStudents().forEach(student=>excluded.delete(student.id));saveExcluded();render();renderStudentFilters();});
    $("#printPage").addEventListener("click",()=>window.print());
    $("#reload").addEventListener("click",loadData);

    window.__chineseNoticeTest={parseCsv,buildRecordsFromA7Rows,receiptHtml,mainTableHtml,studentRatio};
    loadData();
  </script>
</body>
</html>
