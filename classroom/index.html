<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課表與班務工作區｜Sinny Spedu Labs</title>
  <link rel="stylesheet" href="../shared/css/workspace.css?v=2.3">
</head>
<body class="grammar-page classroom-page">
  <button class="mobile-toggle" id="mobileToggle" aria-label="開啟選單">☰</button>
  <div class="workspace-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand-home" href="../index.html" aria-label="回到異想教室首頁"><img src="../assets/logo-banner.png" alt="Sinny Spedu Labs"></a>
      <div class="workspace-name"><small>CLASSROOM WORKSPACE</small><strong>課表與班務</strong></div>
      <nav class="category-nav" id="categoryList" aria-label="功能分類">
        <button class="category-btn active" data-filter="all"><span>全部功能</span><span class="category-count" data-total-count></span></button>
        <button class="category-btn" data-filter="favorites"><span>我的收藏</span><span class="category-count" data-favorite-count>0</span></button>
        <p class="category-label">課務分類</p>
      </nav>
      <p class="sidebar-note">課表工具與一般快速工具分開管理；點選 Logo 可回首頁。</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block"><p>SINNY SPEDU LABS</p><h1>課表與班務工作區</h1></div>
        <a class="home-link" href="../index.html">回到首頁</a>
      </header>
      <div class="search-row">
        <input class="search-box" id="resourceSearch" type="search" placeholder="搜尋學生、班級、教師、教室、日誌或點名…" aria-label="搜尋課表與班務功能">
        <div class="count-badge" id="resultCount"></div>
      </div>
      <h2 class="section-heading">課表工具與班務紀錄</h2>
      <section class="card-grid" id="classroomCards"></section>
      <div class="empty-state" id="emptyState">目前沒有符合條件的功能。</div>
    </main>
  </div>

  <script src="classroom-cards.js?v=2.4"></script>
  <script>
    const escapeHtml = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    document.querySelector("[data-total-count]").textContent = window.CLASSROOM_DATA.length;
    document.getElementById("categoryList").insertAdjacentHTML("beforeend",
      window.CLASSROOM_CATEGORIES.map(category =>
        `<button class="category-btn" data-filter="${escapeHtml(category)}"><span>${escapeHtml(category)}</span><span class="category-count">${window.CLASSROOM_DATA.filter(item => item.category === category).length}</span></button>`
      ).join("")
    );

    document.getElementById("classroomCards").innerHTML = window.CLASSROOM_DATA.map(item => {
      const action = item.available === false
        ? '<span class="card-link">功能準備中</span>'
        : `<a class="card-link" href="${escapeHtml(item.filename)}"${item.external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${escapeHtml(item.linkLabel || (item.external ? '開啟試算表 ↗' : '開啟功能 →'))}</a>`;
      return `<article class="resource-card${item.available === false ? ' is-placeholder' : ''}" data-category="${escapeHtml(item.category)}" style="border-top-color:${escapeHtml(item.themeColor)}">
        <div class="card-top"><span class="tag">${escapeHtml(item.tag)}</span><button class="favorite" data-id="${escapeHtml(item.id)}" aria-label="收藏 ${escapeHtml(item.title)}">★</button></div>
        <h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p>${action}
      </article>`;
    }).join("");
  </script>
  <script src="../shared/js/workspace.js?v=2.4"></script>
</body>
</html>
