<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課表與班務工作區｜Sinny Spedu Labs</title>
  <link rel="stylesheet" href="../shared/css/workspace.css?v=3.1">
  <style>
    .classroom-sections { display: grid; gap: 30px; }
    .classroom-section-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 14px;
      color: var(--navy);
      font-size: 21px;
      font-weight: 800;
    }
    .classroom-section-heading::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }
  </style>
</head>
<body class="grammar-page classroom-page">
  <button class="mobile-toggle" id="mobileToggle" aria-label="開啟選單">☰</button>
  <div class="workspace-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand-home" href="../index.html" aria-label="回到異想教室首頁"><img src="../assets/logo-banner.png" alt="Sinny Spedu Labs"></a>
      <div class="workspace-name"><small>CLASSROOM WORKSPACE</small><strong>課表與班務</strong></div>
      <nav class="category-nav" id="categoryList" aria-label="功能分類">
        <p class="category-label">課務分類</p>
      </nav>
      <p class="sidebar-note">課表工具與一般快速工具分開管理；點選 Logo 可回首頁。</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block"><p>SINNY SPEDU LABS</p><h1>課表與班務工作區</h1></div>
        <a class="home-link" href="../index.html">回到首頁</a>
      </header>
      <div class="classroom-sections" id="classroomSections"></div>
    </main>
  </div>

  <script src="classroom-cards.js?v=2.6"></script>
  <script>
    const escapeHtml = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    document.getElementById("categoryList").insertAdjacentHTML("beforeend",
      window.CLASSROOM_CATEGORIES.map(category =>
        `<button class="category-btn" type="button" data-jump-category="${escapeHtml(category)}"><span>${escapeHtml(category)}</span><span class="category-count">${window.CLASSROOM_DATA.filter(item => item.category === category).length}</span></button>`
      ).join("")
    );

    const renderCard = item => {
      const unavailable = item.available === false;
      const action = unavailable ? '<span class="card-link">功能準備中</span>' : '';
      const href = unavailable ? '' : ` data-href="${escapeHtml(item.filename)}"${item.external || item.newTab ? ' data-target="_blank"' : ''}`;
      return `<article class="resource-card${unavailable ? ' is-placeholder' : ''}" data-category="${escapeHtml(item.category)}" style="border-top-color:${escapeHtml(item.themeColor)}"${href}>
        <div class="card-top"><span class="tag">${escapeHtml(item.tag)}</span></div>
        <h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p>${action}
      </article>`;
    };

    document.getElementById("classroomSections").innerHTML = window.CLASSROOM_CATEGORIES.map(category => {
      const cards = window.CLASSROOM_DATA.filter(item => item.category === category).map(renderCard).join("");
      return `<section class="classroom-section" data-category-section="${escapeHtml(category)}">
        <h2 class="classroom-section-heading">${escapeHtml(window.CLASSROOM_CATEGORY_LABELS[category] || category)}</h2>
        <div class="card-grid">${cards}</div>
      </section>`;
    }).join("");
  </script>
  <script src="../shared/js/workspace.js?v=4.0"></script>
</body>
</html>
