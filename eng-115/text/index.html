<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課文教材｜主題總覽</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17324d;
      --blue: #236a93;
      --gold: #f0a426;
      --paper: #f4f7f9;
      --line: #ccd8e1;
      --text: #20374d;
      --muted: #607386;
      --shell-height: 54px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--paper); color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }
    body {
      display: grid; grid-template-rows: var(--shell-height) minmax(0, 1fr);
      transition: grid-template-rows .2s ease;
    }
    body.shell-collapsed { grid-template-rows: 0 minmax(0, 1fr); }
    .shell-bar {
      position: relative; z-index: 10; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: minmax(230px, 360px) minmax(180px, 1fr) auto;
      align-items: center; gap: 14px; min-width: 0; padding: 6px 12px;
      border-bottom: 1px solid #0d263a;
      background: linear-gradient(135deg, var(--navy), #214d70);
      box-shadow: 0 3px 14px rgba(17, 37, 55, .24);
      transition: transform .2s ease, opacity .16s ease;
    }
    body.shell-collapsed .shell-bar {
      transform: translateY(-100%); opacity: 0; pointer-events: none;
    }
    .picker-wrap { position: relative; min-width: 0; }
    .picker-label {
      position: absolute; top: -7px; left: 11px; z-index: 1;
      padding: 0 5px; background: var(--navy); color: #c9d9e6;
      font-size: 11px; font-weight: 800; letter-spacing: .08em;
    }
    #text-picker {
      width: 100%; height: 38px; min-width: 0; padding: 0 38px 0 13px;
      border: 1px solid #8fb1c8; border-radius: 10px;
      background: #fff; color: var(--navy); font: 800 15px/1.2 inherit; cursor: pointer;
    }
    #text-picker:focus-visible, .shell-action:focus-visible {
      outline: 3px solid #ffd27a; outline-offset: 2px;
    }
    .current-title {
      min-width: 0; overflow: hidden; color: #fff;
      font-size: clamp(15px, 1.45vw, 21px); font-weight: 900;
      line-height: 1.25; text-overflow: ellipsis; white-space: nowrap;
    }
    .current-title small {
      display: block; margin-bottom: 1px; color: #bcd0df;
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
    }
    .shell-actions { display: flex; align-items: center; gap: 8px; }
    .shell-action {
      height: 36px; padding: 0 11px; border: 1px solid rgba(255,255,255,.3);
      border-radius: 10px; background: rgba(255,255,255,.11); color: #fff;
      font: 800 14px/1 inherit; white-space: nowrap; cursor: pointer;
    }
    .shell-action:hover { background: rgba(255,255,255,.2); }
    .shell-action.primary { border-color: #ffc35d; background: var(--gold); color: #302009; }
    .shell-action.primary:hover { background: #ffb936; }
    .viewer {
      position: relative; min-width: 0; min-height: 0; overflow: hidden;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.9), rgba(231,237,242,.75)), var(--paper);
    }
    #text-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .status-card {
      position: absolute; inset: 50% auto auto 50%; width: min(520px, calc(100% - 32px));
      transform: translate(-50%, -50%); padding: 24px; border: 1px solid var(--line);
      border-radius: 16px; background: rgba(255,255,255,.96);
      box-shadow: 0 12px 35px rgba(31,55,75,.15); text-align: center;
      color: var(--muted); font-weight: 800;
    }
    .status-card[hidden] { display: none; }
    .status-card h1 { margin: 0 0 8px; color: var(--text); font-size: 20px; }
    .status-card p { margin: 0; font-weight: 500; line-height: 1.6; }
    @media (max-width: 900px) {
      :root { --shell-height: 92px; }
      .shell-bar {
        grid-template-columns: minmax(0,1fr) auto; grid-template-rows: 40px 34px;
        gap: 5px 8px; padding: 6px 8px;
      }
      .picker-wrap { grid-column: 1; grid-row: 1; }
      .current-title { grid-column: 1 / -1; grid-row: 2; padding-right: 270px; }
      .current-title small { display: none; }
      .shell-actions { grid-column: 2; grid-row: 1 / 3; align-self: end; }
      .shell-action { width: 40px; padding: 0; font-size: 0; }
      .shell-action::before { font-size: 18px; }
      .shell-action[data-action="reload"]::before { content: "↻"; }
      .shell-action[data-action="open"]::before { content: "↗"; }
      .shell-action[data-action="print"]::before { content: "⎙"; }
    }
    @media (max-width: 560px) {
      :root { --shell-height: 88px; }
      .current-title { padding-right: 0; font-size: 14px; }
      .shell-actions { gap: 5px; }
      .shell-action { width: 36px; height: 34px; }
    }
    @media (min-width: 1500px) {
      :root { --shell-height: 60px; }
      .shell-bar { padding: 7px 18px; gap: 18px; }
      #text-picker { height: 42px; font-size: 17px; }
      .shell-action { height: 40px; padding-inline: 15px; font-size: 16px; }
    }
    @media print {
      .shell-bar { display: none !important; }
      body { display: block; height: auto; overflow: visible; background: #fff; }
      .viewer { height: auto; overflow: visible; }
      #text-frame { width: 100%; height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .shell-bar { transition: none; }
    }
  </style>
</head>
<body>
  <header class="shell-bar" aria-label="課文教材共用工具列">
    <div class="picker-wrap">
      <label class="picker-label" for="text-picker">切換課文教材</label>
      <select id="text-picker" aria-label="切換課文教材"></select>
    </div>
    <div class="current-title" id="current-title" aria-live="polite"><small>目前教材</small><span>載入中</span></div>
    <nav class="shell-actions" aria-label="頁面操作">
      <button class="shell-action" type="button" data-action="reload" title="重新載入目前教材">重新載入</button>
      <button class="shell-action" type="button" data-action="open" title="在新視窗開啟原始教材">另開原頁</button>
      <button class="shell-action primary" type="button" data-action="print" title="列印目前教材">列印目前版</button>
    </nav>
  </header>
  <main class="viewer">
    <div class="status-card" id="loading-card">正在載入課文教材……</div>
    <div class="status-card" id="error-card" hidden><h1>教材載入失敗</h1><p>請確認教材檔案仍在相同資料夾，或用「另開原頁」檢查檔案。</p></div>
    <iframe id="text-frame" title="課文教材內容" allow="fullscreen"></iframe>
  </main>
  <script src="text-manifest.js"></script>
  <script>
    (() => {
      "use strict";
      const items = Array.isArray(window.TEXT_MANIFEST) ? window.TEXT_MANIFEST : [];
      const picker = document.getElementById("text-picker");
      const frame = document.getElementById("text-frame");
      const currentTitle = document.querySelector("#current-title span");
      const loadingCard = document.getElementById("loading-card");
      const errorCard = document.getElementById("error-card");

      const findItem = file => items.find(item => item.file === file) || items[0] || null;
      const currentItem = () => findItem(picker.value);

      function setQuery(file) {
        const next = new URL(location.href);
        next.searchParams.set("page", file);
        history.replaceState({ page: file }, "", next);
      }

      function loadItem(item, updateUrl = true) {
        if (!item) {
          loadingCard.hidden = true; errorCard.hidden = false;
          currentTitle.textContent = "找不到可載入的課文教材";
          return;
        }
        document.body.classList.remove("shell-collapsed");
        loadingCard.hidden = false; errorCard.hidden = true;
        currentTitle.textContent = item.title; picker.value = item.file;
        frame.title = item.title; frame.src = item.file;
        if (updateUrl) setQuery(item.file);
      }

      items.forEach(item => {
        const option = document.createElement("option");
        option.value = item.file; option.textContent = item.title; picker.append(option);
      });

      picker.addEventListener("change", () => loadItem(currentItem()));
      frame.addEventListener("load", () => {
        loadingCard.hidden = true; errorCard.hidden = true;
        try {
          const frameWindow = frame.contentWindow;
          const syncShellVisibility = () => {
            const scrollTop = frameWindow.scrollY
              || frameWindow.document.documentElement.scrollTop
              || frameWindow.document.body.scrollTop || 0;
            document.body.classList.toggle("shell-collapsed", scrollTop > 12);
          };
          frameWindow.addEventListener("scroll", syncShellVisibility, { passive: true });
          syncShellVisibility(); frameWindow.focus();
        } catch (_) { /* Same-origin access may be unavailable. */ }
      });
      frame.addEventListener("error", () => { loadingCard.hidden = true; errorCard.hidden = false; });

      document.querySelector('[data-action="reload"]').addEventListener("click", () => {
        loadingCard.hidden = false;
        try { frame.contentWindow.location.reload(); } catch (_) { frame.src = currentItem().file; }
      });
      document.querySelector('[data-action="open"]').addEventListener("click", () => {
        const item = currentItem(); if (item) window.open(item.file, "_blank", "noopener");
      });
      document.querySelector('[data-action="print"]').addEventListener("click", () => {
        try { frame.contentWindow.focus(); frame.contentWindow.print(); }
        catch (_) { const item = currentItem(); if (item) window.open(item.file, "_blank", "noopener"); }
      });
      window.addEventListener("popstate", () => {
        loadItem(findItem(new URLSearchParams(location.search).get("page")), false);
      });

      loadItem(findItem(new URLSearchParams(location.search).get("page")));
    })();
  </script>
</body>
</html>
