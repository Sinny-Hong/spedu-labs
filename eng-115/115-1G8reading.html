<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八上 英文科講義 課文翻譯</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    .font-chinese { font-family: 'Noto Sans TC', sans-serif; }
    .font-english { font-family: 'Lexend', sans-serif; }
    
    /* 網頁呈現時的 A4 樣式（上下題型採不同題高） */
    .page-a4 {
      width: 210mm;
      height: 297mm;
      background-color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      margin: 15px auto;
      padding: 6mm 12mm;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* 大電視選取聚焦特效 */
    .active-row {
      background-color: #fef08a !important; 
      border-radius: 4px;
    }

    /* 題目與選項預設全黑；按提示後才以紅字標出關鍵字。 */
    .target-word {
      color: inherit !important;
      background-color: transparent !important;
      text-decoration: none !important;
    }
    .target-highlight {
      background-color: transparent !important;
      color: #ef4444 !important;
      font-weight: 700 !important;
      text-decoration: underline !important;
      padding: 0;
    }

    .answer-input:focus {
      outline: none;
    }

    /* 選項盒：移除 flex 以免吞掉 inline elements 旁的自然空格 */
    .opt-box {
      display: block;
      padding: 2px 8px;
      border-radius: 4px;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      line-height: 1.5;
      font-size: 14px;
    }
    .opt-box:hover {
      background-color: #f1f5f9;
    }
    .opt-box.opt-medium { font-size: 13px; line-height: 1.5; }
    .opt-box.opt-long { font-size: 12px; line-height: 1.5; }

    /* 英翻中只讓 A/B 同列，C 獨占下一列；英文長句選項仍維持單欄。 */
    .options-ab-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 8px;
      row-gap: 1px;
    }
    .options-ab-row .opt-box:last-child { grid-column: 1 / -1; }

    .questions-layout {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 40fr) auto minmax(0, 60fr);
      overflow: hidden;
    }
    .question-section { min-height: 0; display: flex; flex-direction: column; }

    /* 英翻中較短、中翻英英文選項較長，分別配置題高。 */
    .quiz-row {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .level2-row { height: 68px; padding: 2px 0; }
    .level3-row {
      min-height: 82px;
      height: auto;
      padding: 2px 0;
      justify-content: flex-start;
    }
    .level3-row > div:last-child { margin-top: 2px; }
    .level3-section .opt-box {
      padding-top: 0;
      padding-bottom: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .level3-section .opt-box + .opt-box { margin-top: 0; }
    .level3-section .opt-box.opt-english-long {
      font-size: 13px;
      line-height: 1.5;
    }
    #print-all-container { display: none; }
    
    @media print {
      @page { 
        size: A4; 
        margin: 0; 
      }
      body { 
        background-color: #ffffff; 
        margin: 0; 
        padding: 0; 
      }
      .no-print { 
        display: none !important; 
      }
      .page-a4 { 
        width: 210mm;
        height: 297mm;
        box-shadow: none; 
        border: none; 
        margin: 0; 
        padding: 6mm 12mm;
        page-break-after: always;
        overflow: hidden;
      }
      .page-a4:last-child {
        page-break-after: avoid;
      }
      body.printing-all #all-pages-container { display: none !important; }
      body.printing-all #print-all-container { display: block !important; width: 210mm; }
    }
  </style>
</head>
<body class="p-0 m-0 min-h-screen flex flex-col items-center justify-start">

  <!-- 頂端控制列（列印時自動隱藏） -->
  <div class="no-print w-full max-w-[210mm] bg-white mt-4 p-4 rounded-xl shadow-md flex flex-col gap-3 border border-slate-200">

      </div>
      <div class="flex gap-2">
        <button onclick="toggleAllAnswers()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition shadow-md font-chinese">💡 公布 / 隱藏全頁答案</button>

        <button onclick="printCurrentLesson()" class="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg text-xs transition shadow-md font-chinese">🖨️ 列印本課（正反面）</button>
        <button onclick="printAllLessons(false)" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition shadow-md font-chinese">🖨️ 全部列印學生版</button>
        <button onclick="printAllLessons(true)" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg text-xs transition shadow-md font-chinese">🖨️ 全部列印教師版</button>
      </div>
    </div>
    
    <!-- 導覽切換區：一課一個按鈕，按列印剛好就是正反面 -->
    <div class="flex flex-col gap-1">
      <span class="text-xs font-bold text-slate-500 font-chinese">請選擇課程單元：</span>
      <div class="grid grid-cols-6 gap-2" id="lesson-selectors"></div>
    </div>
  </div>

  <!-- 兩頁連續 A4 容器（列印時第一頁為對話、第二頁為閱讀，剛好是一張紙） -->
  <div id="all-pages-container" class="w-full flex flex-col items-center">
    <!-- 動態生成第一頁 (對話篇) 與第二頁 (閱讀篇) -->
  </div>
  <div id="print-all-container"></div>

    let currentLesson = "L1";

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.70; // 慢速發音[cite: 1]
        window.speechSynthesis.speak(utterance);
      }
    }

    function escapeAttribute(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getSpeechText(question) {
      if (question.type === 'eng_full') return question.qTxt;
      const correctIndex = ['A', 'B', 'C'].indexOf(question.ans);
      return question.opts[correctIndex] || question.tts || question.qTxt;
    }

    function highlightOptionKeywords(optionText, keywordData) {
      const keywords = Array.isArray(keywordData) ? keywordData : [keywordData];
      return keywords.filter(Boolean).reduce((html, keyword) => {
        return html.split(keyword).join(`<span class="target-word font-bold">${keyword}</span>`);
      }, optionText);
    }

    function buildPageHtml(data, sectionType, lessonKey = currentLesson) {
      const isDialogue = (sectionType === 'dialogue');
      const pageData = isDialogue ? data.dialogue : data.reading;

        const optionLayoutClass = q.opts.some(opt => opt.length > 34) ? 'options-single-column' : 'options-ab-row';
        
        let optsHtml = '';
        q.opts.forEach((opt, oIdx) => {
          const label = ["A", "B", "C"][oIdx];
          const lengthClass = opt.length >= 28 ? 'opt-long' : (opt.length >= 20 ? 'opt-medium' : '');
          const keywordData = q[["keyA", "keyB", "keyC"][oIdx]];
          const highlightedOpt = highlightOptionKeywords(opt, keywordData);
          optsHtml += `
            <div onclick="selectAnswer(event, this, '${label}')" data-opt-id="${label}" class="opt-box ${lengthClass}">
              (${label}) ${highlightedOpt}
            </div>`;
        });

        l2Html += `

              <span class="text-slate-700 font-bold shrink-0 mt-0.5 text-[15px]">(</span>
              <input type="text" maxlength="1" readonly class="answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none">

        let optsHtml = '';
        q.opts.forEach((opt, oIdx) => {

    // 載入指定課單元
    function loadLesson(lessonKey) {
      currentLesson = lessonKey;
      isAnswersRevealed = false;
      
      document.querySelectorAll('.lesson-btn').forEach(btn => {
        const k = btn.getAttribute('data-lesson');
        btn.className = (k === lessonKey) ? 
          "lesson-btn py-1.5 rounded-lg text-xs font-bold border transition font-chinese bg-indigo-600 text-white border-indigo-600 shadow-md" :
          "lesson-btn py-1.5 rounded-lg text-xs font-bold border transition font-chinese bg-slate-50 text-slate-700 hover:bg-indigo-50 border-slate-200 shadow-sm";
      });

      const container = document.getElementById('all-pages-container');
      container.innerHTML = '';

      const data = database[lessonKey];
      // 輸出正面（對話篇）和反面（閱讀篇）
      container.innerHTML += buildPageHtml(data, 'dialogue', lessonKey);
      container.innerHTML += buildPageHtml(data, 'reading', lessonKey);
    }

    // 每列直接攜帶自己的 TTS，避免課別、頁別或陣列索引錯位。
    function setActiveRow(element) {
      document.querySelectorAll('.quiz-row').forEach(row => row.classList.remove('active-row'));
      element.classList.add('active-row');
      activeInput = element.querySelector('.answer-input');

      const ttsText = element.dataset.tts;
      if (ttsText) speakWord(ttsText);
    }

    // 選項防呆直接點擊填入，並自動移動聚焦到下一題
    function selectAnswer(event, optElement, label) {
      event.stopPropagation(); // 阻止重複發音

      const row = optElement.closest('.quiz-row');
      if (row) {
        const input = row.querySelector('.answer-input');
        if (input) {
          input.value = label;
          input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 cursor-pointer pointer-events-none";
        }
        row.classList.remove('active-row');
        
        // 只把黃底移到下一題，不自動播放，避免聽到下一題卻以為仍是原題。
        const allRows = Array.from(document.querySelectorAll('.quiz-row'));
        const currentIdx = allRows.indexOf(row);
        if (currentIdx !== -1 && currentIdx < allRows.length - 1) {
          const nextRow = allRows[currentIdx + 1];
          document.querySelectorAll('.quiz-row').forEach(item => item.classList.remove('active-row'));
          nextRow.classList.add('active-row');
          activeInput = nextRow.querySelector('.answer-input');
        } else {
          activeInput = null;
        }
      }
    }

    // 局部大題批改 (包含答對題數顯示徽章)
    function checkSectionAnswers(event, btnElement) {
      event.stopPropagation();
      const section = btnElement.closest('.question-section');
      if (!section) return;

      const rows = section.querySelectorAll('.quiz-row');
      const totalCount = rows.length;
      let correctCount = 0;

      rows.forEach(row => {
        const input = row.querySelector('.answer-input');
        const userAns = input.value.trim().toUpperCase();
        const correctAns = row.getAttribute('data-ans');

        if (userAns === '') return;

        if (userAns === correctAns) {
          correctCount++;
          input.className = "answer-input w-5 h-5 text-center font-bold text-emerald-700 bg-emerald-100 rounded focus:outline-none uppercase text-[15px] shrink-0 mx-0.5 cursor-pointer pointer-events-none border-b-2 border-emerald-500";
        } else {
          input.value = '';
          input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none";
        }
      });

      // 更新與顯示大題答對數
      const badge = btnElement.parentElement.querySelector('.score-badge');
      if (badge) {
        badge.innerText = `答對 ${correctCount} / ${totalCount}`;
        badge.classList.remove('hidden');
      }
    }

    // 局部大題清空重設
    function clearSectionAnswers(event, btnElement) {
      event.stopPropagation();
      const section = btnElement.closest('.question-section');
      if (!section) return;

      const inputs = section.querySelectorAll('.answer-input');
      inputs.forEach(input => {
        input.value = '';
        input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none";
      });

      const badge = btnElement.parentElement.querySelector('.score-badge');
      if (badge) {
        badge.classList.add('hidden');
      }

      // 移除此區域的高亮與狀態
      section.querySelectorAll('.quiz-row').forEach(row => {
        row.classList.remove('bg-yellow-200/90', 'active-row');
        row.querySelectorAll('.target-word').forEach(el => el.classList.remove('target-highlight'));
        row.querySelectorAll('.opt-box').forEach(el => el.classList.remove('text-red-500', 'font-bold'));
      });

      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    // 提示採所見即所得：畫面紅字會原樣保留到列印結果。
    function toggleSectionHint(event, btnElement) {
      event.stopPropagation();
      const section = btnElement.closest('.question-section');
      if (!section) return;

      const rows = section.querySelectorAll('.quiz-row');
      const shouldShow = !section.querySelector('.target-highlight');
      rows.forEach(row => {
        const targets = row.querySelectorAll('.target-word');

        targets.forEach(el => el.classList.toggle('target-highlight', shouldShow));
      });
    }

    // 局部大題解答顯示/隱藏
    function toggleSectionAnswers(event, btnElement) {
      event.stopPropagation();
      const section = btnElement.closest('.question-section');
      if (!section) return;

      const inputs = section.querySelectorAll('.answer-input');
      let currentlyShowing = false;
      
      // 檢測是否已公布
      inputs.forEach(input => {
        if (input.classList.contains('text-red-600')) {
          currentlyShowing = true;
        }
      });

      const badge = btnElement.parentElement.querySelector('.score-badge');
      if (badge) badge.classList.add('hidden');

      inputs.forEach(input => {
        const row = input.closest('.quiz-row');
        const ans = row.getAttribute('data-ans');
        if (!currentlyShowing) {
          input.value = ans;
          input.className = "answer-input w-5 h-5 text-center font-bold text-red-600 bg-red-50 rounded focus:outline-none uppercase text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer border-b-2 border-red-400";
        } else {
          input.value = '';
          input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none";
        }
      });
    }

    // 全域公布與隱藏解答
    function toggleAllAnswers() {
      isAnswersRevealed = !isAnswersRevealed;
      document.querySelectorAll('.quiz-row').forEach(row => {
        const input = row.querySelector('.answer-input');
        const ans = row.getAttribute('data-ans');
        if (isAnswersRevealed) {
          input.value = ans;
          input.className = "answer-input w-5 h-5 text-center font-bold text-red-600 bg-red-50 rounded focus:outline-none uppercase text-[15px] shrink-0 mx-0.5 border-b-2 border-rose-400 pointer-events-none";
        } else {
          input.value = '';
          input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none";
        }
      });
      document.querySelectorAll('.score-badge').forEach(badge => badge.classList.add('hidden'));
    }

    // 重設清除所有輸入
    function clearAllAnswers() {
      document.querySelectorAll('.quiz-row').forEach(row => {
        row.classList.remove('active-row');
        const input = row.querySelector('.answer-input');
        input.value = '';
        input.className = "answer-input w-5 h-5 text-center font-bold text-indigo-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none";
        
        row.querySelectorAll('.target-word').forEach(el => el.classList.remove('target-highlight'));
        row.querySelectorAll('.opt-box').forEach(el => {
          el.classList.remove('bg-rose-50', 'text-rose-600', 'text-red-500', 'font-bold');
          const t = el.querySelector('.target-word');
          if (t) t.classList.remove('target-highlight');
        });
      });
      document.querySelectorAll('.score-badge').forEach(badge => badge.classList.add('hidden'));
      isAnswersRevealed = false;
      activeInput = null;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function printCurrentLesson() {
      document.body.classList.remove('printing-all');
      window.print();
    }

    function printAllLessons(includeAnswers = false) {
      const printContainer = document.getElementById('print-all-container');
      printContainer.innerHTML = Object.keys(database).map(lessonKey => {
        const data = database[lessonKey];
        return buildPageHtml(data, 'dialogue', lessonKey) + buildPageHtml(data, 'reading', lessonKey);
      }).join('');
      if (includeAnswers) {
        printContainer.querySelectorAll('.page-a4 h1').forEach(title => {
          title.textContent += '（教師版）';
        });
        printContainer.querySelectorAll('.quiz-row').forEach(row => {
          const input = row.querySelector('.answer-input');
          if (input) {
            input.value = row.getAttribute('data-ans') || '-';
            input.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-500', 'font-extrabold');
          }
        });
      }
      document.body.classList.add('printing-all');
      requestAnimationFrame(() => window.print());
    }

    window.addEventListener('afterprint', () => {
      document.body.classList.remove('printing-all');
      document.getElementById('print-all-container').innerHTML = '';
    });

    // 初始化課單元導覽列
    function initApp() {
      const selectorContainer = document.getElementById('lesson-selectors');
      selectorContainer.innerHTML = '';
      
      for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        btn.innerText = `八上 L${i}`;
        btn.setAttribute('data-lesson', `L${i}`);
        btn.className = "lesson-btn py-1.5 rounded-lg text-xs font-bold border transition font-chinese";
        btn.onclick = () => loadLesson(`L${i}`);
        selectorContainer.appendChild(btn);
      }
      
      // 預設載入 L1
      loadLesson("L1");
    }

    window.onload = initApp;
  </script>
</body>
</html>
