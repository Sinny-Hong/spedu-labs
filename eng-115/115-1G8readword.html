          { speaker: "Diary", txtPre: "I was ", target: "busy", txtPost: " taking pictures when the clock hit twelve.", tts: "I was busy taking pictures when the clock hit twelve.", ans: "A", opts: ["忙碌的", "空閒的", "開心的"] },
          { speaker: "Diary", txtPre: "It was a great ", target: "experience", txtPost: " to see the famous play with my family.", tts: "It was a great experience to see the famous play with my family.", ans: "B", opts: ["功課", "經驗/體驗", "秘密"] },
          { speaker: "Diary", txtPre: "We went on a boat ride on the River Thames and enjoyed ", target: "afternoon tea", txtPost: ".", tts: "We went on a boat ride on the River Thames and enjoyed afternoon tea.", ans: "A", opts: ["下午茶", "早餐", "宵夜"] },
          { speaker: "Diary", txtPre: "What a ", target: "wonderful", txtPost: " day!", tts: "What a wonderful day!", ans: "B", opts: ["糟糕的", "美好的/棒極了", "寒冷"] }
        ]
      },
      "L6": {
        part1: [
          { speaker: "Jamie", txtPre: "There will be an ugly Christmas sweater ", target: "party", txtPost: " tonight.", tts: "There will be an ugly Christmas sweater party tonight.", ans: "B", opts: ["考試", "派對/聚會", "課堂"] },
          { speaker: "Cody", txtPre: "How much does it ", target: "cost", txtPost: "?", tts: "How much does it cost?", ans: "A", opts: ["花費/要價", "買", "賣"] },
          { speaker: "Cody", txtPre: "Don't ", target: "spend", txtPost: " that much money on a sweater.", tts: "Don't spend that much money on a sweater.", ans: "B", opts: ["賺取", "花費(金錢/時間)", "借給"] },
          { speaker: "Jamie", txtPre: "Yesterday I spent an hour looking for ", target: "gloves", txtPost: ".", tts: "Yesterday I spent an hour looking for gloves.", ans: "B", opts: ["襪子", "手套", "外套"] },
          { speaker: "Cody", txtPre: "Look at these gloves. They're ", target: "on sale", txtPost: ".", tts: "Look at these gloves. They're on sale.", ans: "A", opts: ["特價中", "弄丟了", "很貴"] },
          { speaker: "Clerk", txtPre: "The ", target: "total", txtPost: " is NT$510.", tts: "The total is NT$510.", ans: "B", opts: ["找零", "總共/總計", "特價"] },
          { speaker: "Clerk", txtPre: "How would you like to pay, in ", target: "cash", txtPost: " or by card?", tts: "How would you like to pay, in cash or by card?", ans: "C", opts: ["支票", "信用卡", "現金"] },
          { speaker: "Clerk", txtPre: "OK. Here's your ", target: "change", txtPost: ". Have a nice day.", tts: "OK. Here's your change. Have a nice day.", ans: "A", opts: ["找零/零錢", "課本", "發票"] }
        ],
        part2: [
          { speaker: "Article", txtPre: "People can buy new clothes with nice designs at low ", target: "prices", txtPost: ".", tts: "People can buy new clothes with nice designs at low prices.", ans: "B", opts: ["顏色", "價格", "尺寸"] },
          { speaker: "Article", txtPre: "However, the truth ", target: "behind", txtPost: " those beautiful clothes can be really ugly.", tts: "However, the truth behind those beautiful clothes can be really ugly.", ans: "B", opts: ["在...前面", "在...後面/背後", "關於"] },
          { speaker: "Article", txtPre: "They move the factories for ", target: "cheap", txtPost: " workers.", tts: "They move the factories for cheap workers.", ans: "A", opts: ["便宜的/廉價的", "聰明的", "辛苦的"] },
          { speaker: "Article", txtPre: "Workers work long hours for very low ", target: "pay", txtPost: ".", tts: "Workers work long hours for very low pay.", ans: "B", opts: ["時間", "工資/報酬", "餐點"] },
          { speaker: "Article", txtPre: "It goes into the sea and ", target: "hurts", txtPost: " the environment.", tts: "It goes into the sea and hurts the environment.", ans: "B", opts: ["幫助", "傷害", "保護"] },
          { speaker: "Article", txtPre: "Stop for a ", target: "second", txtPost: " and think - do I really need them?", tts: "Stop for a second and think - do I really need them?", ans: "A", opts: ["一秒/片刻", "一個小時", "一天"] }
        ]
      }
    };

    let currentLesson = "L1";
    let isShowingAnswers = false;

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.65; // 慢速發音
        window.speechSynthesis.speak(utterance);
      }
    }

    function buildItemHtml(item, globalIndex, relativeIndex) {
      const sentence = `${item.speaker}: ${item.txtPre}<span class="target-word">${item.target}</span>${item.txtPost}`;
      
      const optHtml = item.opts.map((opt, oIdx) => {
        const label = ["A", "B", "C"][oIdx];
        return `
          <div onclick="selectAnswerDirectly(event, this, '${label}')" class="opt-box px-2 py-0.5 rounded transition cursor-pointer hover:bg-slate-100 flex items-center">
            (${label}) ${opt}
          </div>
        `;
      }).join('');

      return `
        <div class="flex flex-col leading-tight quiz-row transition py-1 rounded px-1" onclick="setActiveRow(this, '${item.tts.replace(/'/g, "\\'")}')">
          <div class="flex items-start">
            <span class="text-slate-800 font-bold shrink-0 mt-0.5 text-[16px]">(</span>
            <input type="text" maxlength="1" data-ans="${item.ans}" readonly class="answer-input w-7 h-6 text-center font-bold text-blue-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer">
            <span class="text-slate-800 font-bold shrink-0 mt-0.5 text-[16px]">) ${relativeIndex}.</span>
            <span class="font-medium text-slate-800 font-english text-[16px] pl-1 tracking-tight truncate flex-grow cursor-pointer">${sentence}</span>
          </div>
          <div class="pl-14 flex gap-12 text-[14.5px] font-chinese text-slate-500 font-medium mt-1 shrink-0">
            ${optHtml}
          </div>
        </div>
      `;
    }

    function selectAnswerDirectly(event, optElement, label) {
      event.stopPropagation(); // 阻止點選選項時觸發整句語音發音與黃底高亮

      // 直接靜音、消除所有題目的黃色背景，上課更安靜
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.querySelectorAll('.quiz-row').forEach(row => {
        row.classList.remove('bg-yellow-200/90');
      });

      // 精準定位並填入對應題目的 input
      const row = optElement.closest('.quiz-row');
      if (row) {
        const input = row.querySelector('.answer-input');
        if (input) {
          input.value = label;
          // 恢復一般作答樣式
          input.className = "answer-input w-7 h-6 text-center font-bold text-blue-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer";
        }
      }
    }

    function setActiveRow(element, ttsText) {
      // 移除其他題目的黃底高亮
      document.querySelectorAll('.quiz-row').forEach(row => {
        row.classList.remove('bg-yellow-200/90');
      });
      // 本題高亮
      element.classList.add('bg-yellow-200/90');
      speakWord(ttsText);
    }

    function loadLesson(lessonKey) {
      currentLesson = lessonKey;
      isShowingAnswers = false;

      // 隱藏區塊徽章
      document.getElementById('score-badge-part1').classList.add('hidden');
      document.getElementById('score-badge-part2').classList.add('hidden');

      // 更新選擇按鈕樣式
      document.querySelectorAll('.lesson-btn').forEach(btn => {
        const k = btn.getAttribute('data-lesson');
        btn.className = (k === lessonKey) ? 
          "lesson-btn py-1.5 rounded-md text-xs font-semibold border transition font-chinese bg-indigo-600 text-white border-indigo-600 shadow-sm" :
          "lesson-btn py-1.5 rounded-md text-xs font-semibold border transition font-chinese bg-slate-50 text-slate-700 hover:bg-slate-200 border-slate-200";
      });

      document.getElementById('main-title').innerText = `八下 ${lessonKey} 英文科講義 課文關鍵字選擇`;
      
      const p1List = document.getElementById('part-1-list');
      const p2List = document.getElementById('part-2-list');
      p1List.innerHTML = '';
      p2List.innerHTML = '';

      let globalIdx = 1;
      const data = database[lessonKey];

      // 渲染上半部 (對話)
      data.part1.forEach((item, rIdx) => {
        p1List.innerHTML += buildItemHtml(item, globalIdx++, rIdx + 1);
      });

      // 渲染下半部 (閱讀)
      data.part2.forEach((item, rIdx) => {
        p2List.innerHTML += buildItemHtml(item, globalIdx++, rIdx + 1);
      });
    }

    function checkPartAnswers(partId) {
      const listId = partId === 'part1' ? 'part-1-list' : 'part-2-list';
      const badgeId = partId === 'part1' ? 'score-badge-part1' : 'score-badge-part2';
      const listContainer = document.getElementById(listId);
      if (!listContainer) return;
      
      const inputs = listContainer.querySelectorAll('.answer-input');
      const totalCount = inputs.length;
      let correctCount = 0;
      
      inputs.forEach(input => {
        const userAns = input.value.trim().toUpperCase();
        const correctAns = input.getAttribute('data-ans').toUpperCase();
        
        if (userAns === correctAns) {
          correctCount++;
          // 正確：綠底白字
          input.className = "answer-input w-7 h-6 text-center font-extrabold bg-emerald-500 text-white border-b-2 border-emerald-600 focus:outline-none uppercase text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer rounded shadow-sm";
        } else {
          // 錯誤：自動清空讓孩子重選
          input.value = '';
          input.className = "answer-input w-7 h-6 text-center font-bold text-blue-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer";
        }
      });
      
      // 更新對應區塊得分徽章
      const badge = document.getElementById(badgeId);
      if (badge) {
        badge.innerText = `答對 ${correctCount} / ${totalCount}`;
        badge.classList.remove('hidden');
      }
    }

    function clearPartAnswers(partId) {
      const listId = partId === 'part1' ? 'part-1-list' : 'part-2-list';
      const badgeId = partId === 'part1' ? 'score-badge-part1' : 'score-badge-part2';
      const listContainer = document.getElementById(listId);
      if (!listContainer) return;
      
      const inputs = listContainer.querySelectorAll('.answer-input');
      inputs.forEach(input => {
        input.value = '';
        input.className = "answer-input w-7 h-6 text-center font-bold text-blue-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer";
      });
      
      const badge = document.getElementById(badgeId);
      if (badge) {
        badge.classList.add('hidden');
      }
      
      // 消除此區塊的所有高亮
      listContainer.querySelectorAll('.quiz-row').forEach(row => {
        row.classList.remove('bg-yellow-200/90');
      });
      
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function togglePartAnswers(partId) {
      const listId = partId === 'part1' ? 'part-1-list' : 'part-2-list';
      const badgeId = partId === 'part1' ? 'score-badge-part1' : 'score-badge-part2';
      const listContainer = document.getElementById(listId);
      if (!listContainer) return;
      
      const inputs = listContainer.querySelectorAll('.answer-input');
      let currentlyShowing = false;
      
      // 偵測目前是否已經是公布狀態
      inputs.forEach(input => {
        if (input.classList.contains('text-red-600')) {
          currentlyShowing = true;
        }
      });
      
      const badge = document.getElementById(badgeId);
      if (badge) badge.classList.add('hidden');
      
      inputs.forEach(input => {
        const ans = input.getAttribute('data-ans');
        if (!currentlyShowing) {
          input.value = ans;
          input.className = "answer-input w-7 h-6 text-center font-extrabold bg-red-50 text-red-600 border-b-2 border-red-400 focus:outline-none uppercase text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer rounded";
        } else {
          input.value = '';
          input.className = "answer-input w-7 h-6 text-center font-bold text-blue-600 border-b-2 border-slate-400 focus:outline-none uppercase bg-transparent text-[15px] shrink-0 mx-0.5 pointer-events-none cursor-pointer";
        }
      });
    }

    function toggleAllAnswers() {
      togglePartAnswers('part1');
      togglePartAnswers('part2');
    }

    function clearAllAnswers() {
      clearPartAnswers('part1');
      clearPartAnswers('part2');
    }

    function initApp() {
      const selectorContainer = document.getElementById('lesson-selectors');
      selectorContainer.innerHTML = '';
      Object.keys(database).forEach(key => {
        const btn = document.createElement('button');
        btn.innerText = `八下 ${key}`;
        btn.setAttribute('data-lesson', key);
        btn.className = "lesson-btn py-1.5 rounded-md text-xs font-semibold border transition font-chinese";
        btn.onclick = () => loadLesson(key);
        selectorContainer.appendChild(btn);
      });
      loadLesson("L1");
    }

    function printAllLessons(includeAnswers = false) {
      const printContainer = document.getElementById('print-all-container');
      printContainer.innerHTML = '';

      Object.keys(database).forEach(lessonKey => {
        const page = document.createElement('div');
        page.className = "print-page";

        let p1Html = '';
        let p2Html = '';
        let globalIdx = 1;

        database[lessonKey].part1.forEach((item, rIdx) => {
          p1Html += buildItemHtml(item, globalIdx++, rIdx + 1);
        });

        database[lessonKey].part2.forEach((item, rIdx) => {
          p2Html += buildItemHtml(item, globalIdx++, rIdx + 1);
        });

        page.innerHTML = `
          <div class="border-b-4 border-double border-slate-400 pb-2 mb-3 shrink-0">
            <div class="flex justify-between items-end">
              <h1 class="title-large text-slate-800 tracking-wider font-chinese">八下 ${lessonKey} 英文科講義 課文關鍵字選擇${includeAnswers ? '（教師版）' : ''}</h1>
              <div class="flex gap-4 info-text text-slate-700 font-chinese mb-1">
                <div class="flex items-end">
                  <span class="border-b-2 border-slate-400 w-20 text-center h-7 inline-block"></span>
                  <span class="ml-1 shrink-0">班</span>
                </div>
                <div class="flex items-end">
                  <span class="shrink-0">姓名：</span>
                  <span class="border-b-2 border-slate-400 w-28 text-center h-7 inline-block"></span>
                </div>
              </div>
            </div>
            <div class="mt-2 flex flex-col justify-start bg-slate-100 px-3 py-1.5 rounded border-l-4 border-slate-500 shrink-0">
              <span class="text-[13.5px] font-bold text-slate-800 font-chinese">◎ 每題五分，錯字用紅筆訂正，中文、英文各 1次。</span>
            </div>
          </div>
          <div class="flex-grow flex flex-col justify-between overflow-hidden">
            <div class="flex-grow flex flex-col justify-start">
              <div class="bg-slate-200/60 px-2 py-0.5 rounded text-[13.5px] font-bold text-slate-700 mb-2 font-chinese shrink-0">【上半部：對話篇】</div>
              <div class="flex-grow flex flex-col justify-between">${p1Html}</div>
            </div>
            <div class="border-t-2 border-dashed border-slate-300 my-2 shrink-0"></div>
            <div class="flex-grow flex flex-col justify-start">
              <div class="bg-slate-200/60 px-2 py-0.5 rounded text-[13.5px] font-bold text-slate-700 mb-2 font-chinese shrink-0">【下半部：閱讀篇】</div>
              <div class="flex-grow flex flex-col justify-between">${p2Html}</div>
            </div>
          </div>
        `;
        printContainer.appendChild(page);
        if (includeAnswers) {
          page.querySelectorAll('.answer-input').forEach(input => {
            input.value = input.getAttribute('data-ans') || '-';
            input.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-500', 'font-extrabold');
          });
        }
      });

      setTimeout(() => {
        document.body.classList.add('printing-all');
        window.print();
        setTimeout(() => { document.body.classList.remove('printing-all'); }, 600);
      }, 50);
    }

    window.onload = initApp;
  </script>
</body>
</html>
