<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課本講義工作區｜Sinny Spedu Labs</title>
  <link rel="stylesheet" href="../shared/css/workspace.css?v=2.5">
</head>
<body class="grammar-page book-page">
  <button class="mobile-toggle" id="mobileToggle" aria-label="開啟選單">☰</button>
  <div class="workspace-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand-home" href="../index.html" aria-label="回到異想教室首頁"><img src="../assets/logo-banner.png" alt="Sinny Spedu Labs"></a>
      <div class="workspace-name"><small>BOOK WORKSPACE</small><strong>課本講義</strong></div>
      <nav class="category-nav" id="categoryList" aria-label="教材分類">
        <button class="category-btn active" data-filter="all"><span>全部教材</span><span class="category-count" data-total-count></span></button>
        <button class="category-btn" data-filter="favorites"><span>我的收藏</span><span class="category-count" data-favorite-count>0</span></button>
        <p class="category-label">年級與資源</p>
      </nav>
      <p class="sidebar-note">點選上方 Logo 可隨時回到異想教室首頁。</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block"><p>SINNY SPEDU LABS</p><h1>課本講義工作區</h1></div>
        <a class="home-link" href="../index.html">回到首頁</a>
      </header>
      <div class="search-row">
        <input class="search-box" id="resourceSearch" type="search" placeholder="搜尋年級、聽力、配對、拼寫或電子書…" aria-label="搜尋課本講義">
        <div class="count-badge" id="resultCount"></div>
      </div>
      <h2 class="section-heading">教材與電子書</h2>
      <section class="card-grid" id="bookCards"></section>
      <div class="empty-state" id="emptyState">目前沒有符合條件的教材。</div>
    </main>
  </div>

  <script src="book-cards.js?v=2.6"></script>
  <script>
    const availableFiles = new Set([
      "115-1G7hear.html", "115-1G7match.html", "115-1G7readword.html", "115-1G7reading.html", "115-1G7write.html",
      "115-1G8hear.html", "115-1G8match.html", "115-1G8readword.html", "115-1G8reading.html", "115-1G8write.html",
      "115-1G9hear.html", "115-1G9match.html", "115-1G9readword.html", "115-1G9reading.html", "115-1G9write.html"
    ]);
    const escapeHtml = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    document.querySelector("[data-total-count]").textContent = window.BOOK_DATA.length;
    document.getElementById("categoryList").insertAdjacentHTML("beforeend",
      window.BOOK_CATEGORIES.map(category =>
        `<button class="category-btn" data-filter="${escapeHtml(category)}"><span>${escapeHtml(category)}</span><span class="category-count">${window.BOOK_DATA.filter(item => item.category === category).length}</span></button>`
      ).join("")
    );

    document.getElementById("bookCards").innerHTML = window.BOOK_DATA.map(item => {
      const unavailable = !item.external && !availableFiles.has(item.filename);
      const action = unavailable
        ? `<span class="card-link">教材準備中</span>`
        : `<a class="card-link" href="${escapeHtml(item.filename)}"${item.external ? ' target="_blank" rel="noopener"' : ""}>${item.external ? "開啟電子書 ↗" : "開啟教材 →"}</a>`;
      return `<article class="resource-card${unavailable ? " is-placeholder" : ""}" data-category="${escapeHtml(item.category)}" style="border-top-color:${escapeHtml(item.themeColor)}">
        <div class="card-top"><span class="tag">${escapeHtml(item.tag)}</span><button class="favorite" data-id="${escapeHtml(item.id)}" aria-label="收藏 ${escapeHtml(item.title)}">★</button></div>
        <h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p>${action}
      </article>`;
    }).join("");

    try {
      const legacyFavorites = JSON.parse(localStorage.getItem("book_favs") || "[]");
      legacyFavorites.forEach(id => localStorage.setItem(`spedu-favorite:${location.pathname}:${id}`, "1"));
    } catch (error) { /* 舊收藏格式無效時不影響頁面 */ }
  </script>
  <script src="../shared/js/workspace.js?v=2.5"></script>
</body>
</html>
