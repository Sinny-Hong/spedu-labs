<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課本講義工作區｜Sinny Spedu Labs</title>
  <link rel="stylesheet" href="../shared/css/workspace.css?v=3.1">
  <style>.resource-section{margin-bottom:26px;scroll-margin-top:18px}</style>
</head>
<body class="grammar-page book-page">
  <button class="mobile-toggle" id="mobileToggle" aria-label="開啟選單">☰</button>
  <div class="workspace-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand-home" href="../index.html" aria-label="回到異想教室首頁"><img src="../assets/logo-banner.png" alt="Sinny Spedu Labs"></a>
      <div class="workspace-name"><small>BOOK WORKSPACE</small><strong>課本講義</strong></div>
      <nav class="category-nav" id="categoryList" aria-label="教材分類">
        <p class="category-label">教材區段</p>
      </nav>
      <p class="sidebar-note">點選上方 Logo 可隨時回到異想教室首頁。</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block"><p>SINNY SPEDU LABS</p><h1>課本講義工作區</h1></div>
        <a class="home-link" href="../index.html">回到首頁</a>
      </header>
      <div id="bookSections"></div>
    </main>
  </div>

  <script src="book-cards.js?v=3.1"></script>
  <script>
    const availableFiles = new Set([
      "1200voc.html", "vocab.html", "text-translation-match.html", "../eng-grammar/match-numbers.html", "../eng-grammar/match-family.html",
      "../eng-grammar/match-pronouns.html", "../eng-grammar/match-time-date.html", "library-text.html",
      "Midterm/115-1eng1.html", "Midterm/115-1eng1h1.html", "Midterm/115-1eng1h2.html", "Midterm/115-1eng1h3.html",
      "test1.html", "test2.html"
    ]);
    const escapeHtml = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    document.getElementById("categoryList").insertAdjacentHTML("beforeend",
      window.BOOK_CATEGORIES.map(category =>
        `<button class="category-btn" type="button" data-jump-category="${escapeHtml(category)}"><span>${escapeHtml(category)}</span><span class="category-count">${window.BOOK_DATA.filter(item => item.category === category).length}</span></button>`
      ).join("")
    );

    const renderCard = item => {
      const unavailable = !item.external && !availableFiles.has(item.filename);
      const action = unavailable ? `<span class="card-link">教材準備中</span>` : "";
      const href = unavailable ? "" : ` data-href="${escapeHtml(item.filename)}"${item.external ? ' data-target="_blank"' : ""}`;
      return `<article class="resource-card${unavailable ? " is-placeholder" : ""}" data-category="${escapeHtml(item.category)}" style="border-top-color:${escapeHtml(item.themeColor)}"${href}>
        <div class="card-top"><span class="tag">${escapeHtml(item.tag)}</span></div>
        <h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p>${action}
      </article>`;
    };
    document.getElementById("bookSections").innerHTML = window.BOOK_CATEGORIES.map(category =>
      `<section class="resource-section" data-category-section="${escapeHtml(category)}"><h2 class="section-heading">${escapeHtml(category)}</h2><div class="card-grid">${window.BOOK_DATA.filter(item => item.category === category).map(renderCard).join("")}</div></section>`
    ).join("");
  </script>
  <script src="../shared/js/workspace.js?v=4.0"></script>
</body>
</html>
