<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f0e8">
  <title>1200 單字朗讀</title>
  <meta name="description" content="新市國中英語單字朗讀與紙本批改工具">
  <style>
:root {
  --ink: #24312d;
  --muted: #6c7772;
  --paper: #fffdf8;
  --canvas: #f3efe7;
  --line: #d8d1c4;
  --green: #336c5a;
  --green-dark: #245143;
  --green-pale: #e8f1ed;
  --amber: #d3912f;
  --amber-pale: #fff1d4;
  --red: #b34238;
  --red-pale: #fbe9e6;
  --shadow: 0 10px 28px rgba(45, 54, 49, .1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 10%, rgba(211, 145, 47, .1), transparent 28rem),
    linear-gradient(180deg, #f8f5ee, var(--canvas));
  font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  min-height: 100vh;
}

button, select { font: inherit; }
button { touch-action: manipulation; }

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  padding: 1.2rem clamp(1rem, 4vw, 3.5rem);
  color: white;
  background: var(--green-dark);
  border-bottom: 5px solid var(--amber);
}

.eyebrow {
  margin: 0 0 .25rem;
  color: var(--amber);
  font-size: .82rem;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
}

h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: clamp(1.55rem, 3vw, 2.2rem); }
h2 { margin-bottom: .45rem; font-size: clamp(1.55rem, 3vw, 2.2rem); }

.settings-toggle,
.button {
  border: 1px solid transparent;
  border-radius: .8rem;
  cursor: pointer;
  min-height: 2.8rem;
  padding: .65rem 1rem;
  font-weight: 800;
  transition: transform .15s, background .15s, border-color .15s;
}

.settings-toggle {
  color: var(--green-dark);
  background: white;
  box-shadow: 0 5px 16px rgba(0,0,0,.16);
}

button:hover:not(:disabled) { transform: translateY(-1px); }
button:focus-visible, select:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 2px;
}
button:disabled { opacity: .35; cursor: not-allowed; }

.settings-panel {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 1rem 1.5rem;
  padding: 1rem clamp(1rem, 4vw, 3.5rem);
  background: #e6eee9;
  border-bottom: 1px solid #b8c9c1;
}
.settings-panel[hidden] { display: none; }
.settings-panel label { display: grid; gap: .35rem; font-size: .88rem; font-weight: 800; }
.settings-panel select { min-width: 9rem; padding: .6rem .7rem; border: 1px solid #9eb2a9; border-radius: .55rem; background: white; }
.settings-panel .check-label { display: flex; align-items: center; min-height: 2.8rem; }
.check-label input { width: 1.2rem; height: 1.2rem; accent-color: var(--green); }
.settings-actions { display: flex; gap: .55rem; margin-left: auto; }

main { width: min(1500px, 100%); margin: 0 auto; padding: clamp(1rem, 3vw, 2rem); }
.view { min-height: 65vh; }

.index-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  padding: clamp(1.2rem, 3vw, 2rem);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 1.2rem;
  box-shadow: var(--shadow);
}
.index-intro p:last-child { margin-bottom: 0; color: var(--muted); }
.page-count { display: grid; min-width: 7rem; text-align: center; }
.page-count strong { color: var(--green); font-family: Georgia, serif; font-size: 3.1rem; line-height: 1; }
.page-count span { color: var(--muted); font-weight: 800; }

.index-pages {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1rem;
  margin: 1.25rem 0;
}
.page-tile {
  position: relative;
  display: grid;
  gap: .4rem;
  min-height: 8.3rem;
  padding: 1.15rem;
  text-align: left;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 1rem;
  box-shadow: 0 5px 14px rgba(45,54,49,.07);
  cursor: pointer;
}
.page-tile::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: .38rem;
  background: var(--green);
  border-radius: 1rem 0 0 1rem;
}
.page-tile strong { color: var(--green-dark); font-family: Georgia, serif; font-size: 2rem; }
.page-tile span { color: var(--muted); font-size: .9rem; font-weight: 700; }
.page-tile small { align-self: end; color: var(--amber); font-weight: 900; }

.index-pagination,
.lesson-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}
.index-pagination p { min-width: 8rem; margin: 0; text-align: center; font-weight: 800; }
.nav-button { color: white; background: var(--green); }
.index-button { color: var(--green-dark); background: var(--amber-pale); border-color: #e5bd76; }
.ghost { color: var(--green-dark); background: white; border-color: #aabbb3; }
.danger-outline { color: var(--red); background: white; border-color: #dca49f; }

.lesson-nav {
  justify-content: space-between;
  padding: .75rem;
  background: rgba(243,239,231,.94);
  border: 1px solid var(--line);
  border-radius: 1rem;
}
.lesson-heading { flex: 1; margin: 0; text-align: center; font-size: 1.08rem; font-weight: 900; }

.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.15rem;
  margin-top: 1.15rem;
}
.word-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(8.8rem, .34fr) minmax(0, 1fr);
  min-height: 19rem;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 1.15rem;
  box-shadow: var(--shadow);
}
.card-column-left { grid-column: 1; }
.card-column-right { grid-column: 2; }
.card-row-1 { grid-row: 1; }
.card-row-2 { grid-row: 2; }
.card-row-3 { grid-row: 3; }
.card-controls {
  display: flex;
  flex-direction: column;
  gap: .48rem;
  padding: .78rem;
  color: white;
  background: var(--green-dark);
}
.card-range {
  margin: 0 0 .1rem;
  font-family: Georgia, "Noto Serif TC", serif;
  font-size: 1.18rem;
}
.card-controls .button {
  width: 100%;
  min-height: 2.25rem;
  padding: .42rem .55rem;
  font-size: .82rem;
}
.play-group { color: var(--green-dark); background: white; }
.show-chinese { color: #68410a; background: var(--amber-pale); border-color: #e5bd76; }
.show-answer { color: #822d27; background: var(--red-pale); border-color: #dfa39d; }
.expand-card { margin-top: auto; color: white; background: transparent; border-color: rgba(255,255,255,.5); }

.word-list {
  display: grid;
  align-content: center;
  gap: .32rem;
  padding: 1rem 1.2rem;
}
.word-row {
  display: grid;
  grid-template-columns: 2rem 3rem minmax(5.5rem, 1fr) minmax(0, 1.1fr);
  align-items: center;
  min-height: 2.55rem;
  padding: .25rem .4rem;
  border-radius: .55rem;
  transition: background .15s;
}
.word-row:hover { background: #f1eee7; }
.word-row.playing { background: var(--amber-pale); box-shadow: inset 4px 0 var(--amber); }
.answer-letter {
  color: var(--red);
  font-family: Georgia, serif;
  font-size: 1.25rem;
  font-weight: 900;
  visibility: hidden;
}
.word-number { color: var(--muted); font-size: .92rem; font-weight: 800; }
.word-button {
  padding: .25rem .4rem;
  text-align: left;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: .4rem;
  cursor: pointer;
  font-family: "Comic Sans MS", Verdana, sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: .012em;
}
.word-button:hover { color: var(--green); text-decoration: underline; }
.chinese-text { color: var(--green-dark); font-weight: 800; visibility: hidden; }
.word-card.showing-answers .answer-letter,
.word-card.showing-chinese .chinese-text { visibility: visible; }

.modal-backdrop {
  position: fixed;
  z-index: 80;
  inset: 0;
  background: rgba(25,35,31,.68);
  backdrop-filter: blur(4px);
}
.modal-backdrop[hidden] { display: none; }
.word-card.expanded {
  position: fixed;
  z-index: 90;
  inset: 4vh 4vw;
  grid-template-columns: minmax(16rem, .34fr) minmax(0, 1fr);
  min-height: 0;
  font-size: clamp(1rem, 1.8vw, 1.5rem);
}
.word-card.expanded .card-controls { padding: 1.4em; gap: .8em; }
.word-card.expanded .card-range { font-size: 1.8em; }
.word-card.expanded .button { min-height: 3.1em; font-size: 1em; }
.word-card.expanded .word-list { gap: .5em; padding: 1.5em 2em; }
.word-card.expanded .word-row {
  grid-template-columns: 2.5em 3.2em minmax(8em, 1fr) minmax(0, 1.2fr);
  min-height: 3.1em;
}
.word-card.expanded .answer-letter { font-size: 1.55em; }
.word-card.expanded .word-number { font-size: .9em; }
.word-card.expanded .word-button { font-size: 1.35em; }
.word-card.expanded .chinese-text { font-size: 1.05em; }

footer {
  padding: 1.25rem 1rem 2rem;
  text-align: center;
  color: var(--muted);
  font-size: .84rem;
}
footer p { display: inline; margin: 0 .6rem; }

@media (max-width: 900px) {
  .index-pages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards-grid { grid-template-columns: 1fr; }
  .card-column-left,
  .card-column-right { grid-column: 1; }
  .card-row-1,
  .card-row-2,
  .card-row-3 { grid-row: auto; }
  .word-card { grid-template-columns: minmax(8.3rem, .34fr) minmax(0, 1fr); }
}

@media (max-width: 620px) {
  .site-header { align-items: flex-start; padding: 1rem; }
  .settings-toggle { padding: .55rem .7rem; }
  main { padding: .75rem; }
  .index-intro { align-items: flex-start; }
  .page-count { min-width: 4rem; }
  .page-count strong { font-size: 2.4rem; }
  .index-pages { gap: .7rem; }
  .page-tile { min-height: 7.2rem; padding: .9rem; }
  .lesson-nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; }
  .lesson-heading { grid-column: 1 / -1; grid-row: 1; }
  .lesson-nav .button { padding: .55rem .35rem; }
  .word-card { grid-template-columns: 1fr; }
  .card-controls { display: grid; grid-template-columns: 1fr 1fr; }
  .card-range { grid-column: 1 / -1; }
  .expand-card { margin-top: 0; }
  .word-list { padding: .8rem; }
  .word-row { grid-template-columns: 1.8rem 2.6rem minmax(4.5rem, .8fr) minmax(0, 1.2fr); }
  .word-card.expanded { inset: 1.5vh 2vw; display: block; overflow: auto; font-size: 1rem; }
  .word-card.expanded .card-controls { display: grid; grid-template-columns: 1fr 1fr; }
  .word-card.expanded .word-list { padding: 1rem; }
  footer p { display: block; margin: .25rem 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

</style>
</head>

      <span aria-hidden="true">⚙</span> 朗讀設定

        <p id="index-range" aria-live="polite"></p>
        <button id="index-next" class="button nav-button" type="button">下十頁 →</button>
      </nav>
    </section>

    <section id="lesson-view" class="view" hidden>

        <button id="next-page" class="button nav-button" type="button">下一頁 →</button>
      </nav>
      <div id="cards-grid" class="cards-grid"></div>
    </section>
  </main>

  <footer>
    <p>題庫來源：桃園市 1200 單字題庫</p>
    <p>教材編修：臺南市立新市國民中學</p>
  </footer>

"answer":"C","chinese":"公分"},{"number":1240,"word":"Teacher's Day","options":{"A":"新年","B":"教師節","C":"除夕","D":"父親節"},"answer":"B","chinese":"教師節"},{"number":1241,"word":"New Year's Eve","options":{"A":"除夕","B":"教師節","C":"中秋","D":"端午節"},"answer":"A","chinese":"除夕"},{"number":1242,"word":"New Year's Day","options":{"A":"中秋","B":"教師節","C":"端午節","D":"新年"},"answer":"D","chinese":"新年"},{"number":1243,"word":"physical education","options":{"A":"躲避球","B":"直排輪","C":"桌球","D":"體育"},"answer":"D","chinese":"體育"},{"number":1244,"word":"elementary school","options":{"A":"蠟筆","B":"小學","C":"課本","D":"分數"},"answer":"B","chinese":"小學"},{"number":1245,"word":"junior high school","options":{"A":"大學","B":"高中","C":"小學","D":"國中"},"answer":"D","chinese":"國中"},{"number":1246,"word":"senior high school","options":{"A":"進步","B":"高中","C":"標題","D":"課本"},"answer":"B","chinese":"高中"}];

</script>
  <script>
(() => {
  const questions = window.QUESTIONS || [];
  const pageSize = 30;
  const pageCount = Math.ceil(questions.length / pageSize);
  const state = {
    indexBlock: 0,
    page: null,
    expanded: null,
    speaking: false,
    speechToken: 0,
  };

  const $ = (selector) => document.querySelector(selector);
  const indexView = $("#index-view");
  const lessonView = $("#lesson-view");
  const pagesContainer = $("#index-pages");
  const cardsGrid = $("#cards-grid");
  const modalBackdrop = $("#modal-backdrop");

  const settings = {
    rate: Number(localStorage.getItem("reader-rate") || 0.9),
    gap: Number(localStorage.getItem("reader-gap") || 2000),
    speakNumber: localStorage.getItem("reader-number") === "true",
    voice: localStorage.getItem("reader-voice") || "",
  };

  function saveSettings() {
    localStorage.setItem("reader-rate", String(settings.rate));
    localStorage.setItem("reader-gap", String(settings.gap));
    localStorage.setItem("reader-number", String(settings.speakNumber));
    localStorage.setItem("reader-voice", settings.voice);
  }

  function loadVoices() {
    const select = $("#voice-select");
    const voices = speechSynthesis.getVoices().filter((voice) => /^en[-_]/i.test(voice.lang));
    select.innerHTML = "";
    voices.forEach((voice) => {
      const option = document.createElement("option");
      option.value = voice.name;
      option.textContent = `${voice.name}（${voice.lang}）`;
      option.selected = voice.name === settings.voice;
      select.append(option);
    });
    if (!settings.voice && voices[0]) {
      settings.voice = voices[0].name;
      select.value = settings.voice;
    }
  }

  function selectedVoice() {
    return speechSynthesis.getVoices().find((voice) => voice.name === settings.voice);
  }

  function stopSpeech() {
    state.speechToken += 1;
    state.speaking = false;
    speechSynthesis.cancel();
    document.querySelectorAll(".word-row.playing").forEach((row) => row.classList.remove("playing"));
  }

  function speakText(question) {
    return new Promise((resolve) => {
      const utterance = new SpeechSynthesisUtterance(
        settings.speakNumber ? `Question ${question.number}. ${question.word}` : question.word
      );
      utterance.lang = "en-US";
      utterance.rate = settings.rate;
      utterance.voice = selectedVoice() || null;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      speechSynthesis.speak(utterance);
    });
  }

  async function speakQuestions(group) {
    stopSpeech();
    const token = state.speechToken;
    state.speaking = true;
    for (let index = 0; index < group.length; index += 1) {
      if (token !== state.speechToken) return;
      const question = group[index];
      const row = document.querySelector(`[data-question="${question.number}"]`);
      document.querySelectorAll(".word-row.playing").forEach((item) => item.classList.remove("playing"));
      row?.classList.add("playing");
      await speakText(question);
      if (token !== state.speechToken) return;
      if (index < group.length - 1) {
        await new Promise((resolve) => setTimeout(resolve, settings.gap));
      }
    }
    rowCleanup();
    state.speaking = false;
  }

  function rowCleanup() {
    document.querySelectorAll(".word-row.playing").forEach((row) => row.classList.remove("playing"));
  }

  function renderIndex() {
    const start = state.indexBlock * 10;
    const end = Math.min(start + 10, pageCount);
    pagesContainer.innerHTML = "";
    for (let page = start; page < end; page += 1) {
      const first = page * pageSize + 1;
      const last = Math.min((page + 1) * pageSize, questions.length);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "page-tile";
      button.innerHTML = `<strong>第 ${page + 1} 頁</strong><span>第 ${first}～${last} 題</span><small>進入朗讀 →</small>`;
      button.addEventListener("click", () => openPage(page));
      pagesContainer.append(button);
    }
    $("#index-range").textContent = `第 ${start + 1}～${end} 頁`;
    $("#index-prev").disabled = state.indexBlock === 0;
    $("#index-next").disabled = end >= pageCount;
  }

  function questionRow(question) {
    const row = document.createElement("div");
    row.className = "word-row";
    row.dataset.question = question.number;
    row.innerHTML = `
      <span class="answer-letter" aria-label="答案 ${question.answer}">${question.answer}</span>
      <span class="word-number">${question.number}</span>
      <button class="word-button" type="button" title="朗讀 ${question.word}">${question.word}</button>
      <span class="chinese-text">${question.chinese}</span>`;
    row.querySelector(".word-button").addEventListener("click", () => speakQuestions([question]));
    return row;
  }

  function makeCard(group, groupIndex) {
    const card = document.createElement("article");
    const columnClass = groupIndex < 3 ? "card-column-left" : "card-column-right";
    const rowClass = `card-row-${(groupIndex % 3) + 1}`;
    card.className = `word-card ${columnClass} ${rowClass}`;
    card.dataset.group = groupIndex;
    const first = group[0].number;
    const last = group[group.length - 1].number;
    card.innerHTML = `
      <div class="card-controls">
        <h3 class="card-range">第 ${first}～${last} 題</h3>
        <button class="button play-group" type="button">▶ 朗讀本組</button>
        <button class="button show-chinese" type="button">參考中文</button>
        <button class="button show-answer" type="button">批改答案</button>
        <button class="button expand-card" type="button">⛶ 放大</button>
      </div>
      <div class="word-list"></div>`;
    group.forEach((question) => card.querySelector(".word-list").append(questionRow(question)));
    card.querySelector(".play-group").addEventListener("click", () => speakQuestions(group));
    card.querySelector(".show-chinese").addEventListener("click", (event) => {
      card.classList.toggle("showing-chinese");
      event.currentTarget.textContent = card.classList.contains("showing-chinese") ? "隱藏中文" : "參考中文";
    });
    card.querySelector(".show-answer").addEventListener("click", (event) => {
      card.classList.toggle("showing-answers");
      event.currentTarget.textContent = card.classList.contains("showing-answers") ? "隱藏答案" : "批改答案";
    });
    card.querySelector(".expand-card").addEventListener("click", () => toggleExpand(card));
    return card;
  }

  function toggleExpand(card) {
    const isExpanded = card.classList.contains("expanded");
    document.querySelectorAll(".word-card.expanded").forEach((item) => {
      item.classList.remove("expanded");
      item.querySelector(".expand-card").textContent = "⛶ 放大";
    });
    if (isExpanded) {
      state.expanded = null;
      modalBackdrop.hidden = true;
      return;
    }
    card.classList.add("expanded");
    card.querySelector(".expand-card").textContent = "✕ 縮小";
    state.expanded = Number(card.dataset.group);
    modalBackdrop.hidden = false;
  }

  function openPage(page) {
    stopSpeech();
    state.page = page;
    state.expanded = null;
    modalBackdrop.hidden = true;
    indexView.hidden = true;
    lessonView.hidden = false;
    cardsGrid.innerHTML = "";
    const pageQuestions = questions.slice(page * pageSize, (page + 1) * pageSize);
    for (let index = 0; index < pageQuestions.length; index += 5) {
      cardsGrid.append(makeCard(pageQuestions.slice(index, index + 5), index / 5));
    }
    const first = pageQuestions[0].number;
    const last = pageQuestions[pageQuestions.length - 1].number;
    $("#lesson-heading").textContent = `題本第 ${page + 1} 頁｜第 ${first}～${last} 題`;
    $("#prev-page").disabled = page === 0;
    $("#next-page").disabled = page === pageCount - 1;
    history.replaceState(null, "", `#page-${page + 1}`);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function showIndex() {
    stopSpeech();
    state.page = null;
    state.expanded = null;
    modalBackdrop.hidden = true;
    lessonView.hidden = true;
    indexView.hidden = false;
    history.replaceState(null, "", "#index");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("#settings-toggle").addEventListener("click", (event) => {
    const panel = $("#settings-panel");
    panel.hidden = !panel.hidden;
    event.currentTarget.setAttribute("aria-expanded", String(!panel.hidden));
  });
  $("#index-prev").addEventListener("click", () => { state.indexBlock -= 1; renderIndex(); });
  $("#index-next").addEventListener("click", () => { state.indexBlock += 1; renderIndex(); });
  $("#prev-page").addEventListener("click", () => openPage(state.page - 1));
  $("#next-page").addEventListener("click", () => openPage(state.page + 1));
  $("#back-index").addEventListener("click", showIndex);
  $("#stop-all").addEventListener("click", stopSpeech);
  modalBackdrop.addEventListener("click", () => {
    const expanded = document.querySelector(".word-card.expanded");
    if (expanded) toggleExpand(expanded);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      const expanded = document.querySelector(".word-card.expanded");
      if (expanded) toggleExpand(expanded);
    }
  });

  $("#rate-select").value = String(settings.rate);
  $("#gap-select").value = String(settings.gap);
  $("#speak-number").checked = settings.speakNumber;
  $("#rate-select").addEventListener("change", (event) => { settings.rate = Number(event.target.value); saveSettings(); });
  $("#gap-select").addEventListener("change", (event) => { settings.gap = Number(event.target.value); saveSettings(); });
  $("#speak-number").addEventListener("change", (event) => { settings.speakNumber = event.target.checked; saveSettings(); });
  $("#voice-select").addEventListener("change", (event) => { settings.voice = event.target.value; saveSettings(); });
  $("#reset-settings").addEventListener("click", () => {
    settings.rate = 0.9;
    settings.gap = 2000;
    settings.speakNumber = false;
    $("#rate-select").value = "0.9";
    $("#gap-select").value = "2000";
    $("#speak-number").checked = false;
    saveSettings();
  });

  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
  renderIndex();
  const hashMatch = location.hash.match(/^#page-(\d+)$/);
  if (hashMatch) {
    const page = Number(hashMatch[1]) - 1;
    if (page >= 0 && page < pageCount) openPage(page);
  }
})();

</script>
