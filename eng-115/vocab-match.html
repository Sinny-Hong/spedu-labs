<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課本單字配對挑戰</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#273548;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.app{width:min(100%,810px);margin:auto;padding:10px 12px 23px}.top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:2px 0 9px}.brand{font-size:clamp(16px,4.3vw,22px);font-weight:900;line-height:1.2}.picker{display:grid;grid-template-columns:1.15fr .85fr;gap:8px;background:white;padding:9px;border:1px solid #d7e0e9;border-radius:11px}.picker label{font-size:12px;font-weight:800;color:#69798d}.picker select{margin-top:3px;display:block;width:100%;height:36px;padding:0 7px;background:white;border:1px solid #b7c4cf;border-radius:7px;font-size:14px;color:#273548;font-weight:800;min-width:0}.status{display:flex;justify-content:space-between;align-items:center;gap:7px;font-weight:900;margin:10px 1px 6px}.status .sub{color:#64748b;font-size:12px}.track{height:5px;background:#dfe7ef;border-radius:50px;overflow:hidden;margin-bottom:9px}.fill{height:100%;width:0;background:#f59e0b;transition:width .15s}.sheet{background:white;border:1px solid #d5dfe8;border-radius:12px;padding:10px;box-shadow:0 3px 13px #253a5108}.instructions{border-left:4px solid #64748b;background:#f3f6fa;padding:6px 8px;font-size:12px;font-weight:750;margin-bottom:8px}.twocol{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px}.words,.choices{display:grid;grid-template-rows:repeat(var(--count),minmax(36px,auto))}.word{display:flex;align-items:center;flex-wrap:wrap;gap:4px;width:100%;min-width:0;min-height:36px;padding:2px 2px;border:0;background:transparent;text-align:left;border-radius:4px}.word .ans{flex:none;width:30px;text-align:center;border-bottom:2px solid #8a9aad;height:25px;line-height:23px;color:#d72b35;font-weight:900;font-size:17px}.word .num{flex:none;color:#8998aa;font-weight:800;font-size:12px}.word .en{font-size:clamp(13px,3.7vw,18px);font-weight:850;line-height:1.14;overflow-wrap:anywhere}.word.active{background:#fff0a3}.word.mark-good{background:#eaf9f0}.word.mark-bad{background:#fff0f0}.feedback{color:#c62838;font-size:clamp(11px,3vw,13px);font-weight:900;line-height:1.15;overflow-wrap:anywhere}.choices{border:1px solid #a9cfe4;border-radius:6px;overflow:hidden;background:#e0f2fe}.choice{border:0;border-radius:0;border-bottom:1px solid #c1ddeb;background:transparent;display:flex;align-items:center;text-align:left;gap:4px;min-width:0;min-height:36px;padding:3px 7px;font-size:clamp(12px,3.5vw,16px);font-weight:700;line-height:1.15;color:#263548;overflow-wrap:anywhere}.choice:last-child{border-bottom:0}.choice b{color:#d52b35;flex:none}.choice.selected{background:#c5e7fc}.actions{display:flex;gap:7px;margin-top:10px}.action{border:0;border-radius:7px;padding:9px 11px;font-weight:900;font-size:13px}.primary{background:#0e9877;color:white;flex:1}.neutral{background:#e7edf3;color:#4c5e71}.next{background:#2563eb;color:white;flex:1}.message{color:#64748b;font-size:12px;font-weight:800;margin:6px 0 0}.message:empty{display:none}.message.error{color:#c12637}.message.success{color:#067c5c}.hidden{display:none!important}.results{text-align:center;padding:15px 11px}.results h1{font-size:clamp(23px,5.8vw,29px);margin:7px 0 9px}.final-lesson{font-size:clamp(21px,5.8vw,30px);font-weight:900;line-height:1.5;margin:6px auto 15px;color:#b94a12}.lesson-highlight{background:linear-gradient(transparent 42%,#fff0b9 42%,#fff0b9 92%,transparent 92%);padding:0 5px}.lesson-code{color:#2563eb}.score{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;background:#f0f5fb;border-radius:14px;padding:20px 9px;margin:13px 0 15px}.score-unit{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:3px}.score-unit+.score-unit{border-left:1px solid #c9d6e4}.score strong,.score .percent{font-size:clamp(35px,9.2vw,55px);font-weight:950;line-height:1.14;white-space:nowrap}.score strong{color:#2563eb}.score .percent{color:#0b897b}.score-label{font-size:clamp(12px,3.5vw,16px);font-weight:800;color:#34465b;margin-top:5px}.score-grid{border:1px solid #d8e1ea;border-radius:11px;overflow:hidden;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));background:#f2f5fb;margin:13px 0 15px}.score-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:13px 2px;min-width:0}.score-cell:not(:last-child){border-right:1px solid #cdd7e3}.sg{font-size:clamp(11px,2.8vw,15px);font-weight:800;color:#62718a}.sv{font-size:clamp(13px,3.5vw,20px);font-weight:900;color:#253650;white-space:nowrap}.capture{font-size:15px;font-weight:900;padding:10px;border:2px dashed #e9aa39;background:#fff9e9;border-radius:8px}.foot{text-align:center;color:#788695;font-size:11px;margin:13px 0 0}.foot a{color:inherit;text-decoration:none}.foot a:hover{text-decoration:underline}@media(max-width:380px){.app{padding:8px}.sheet{padding:8px}.twocol{gap:4px}.word .ans{width:25px}.choice{padding:2px 4px}.brand{font-size:15px}.action{padding:8px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">📖 課本單字配對挑戰</div><button class="action neutral" id="restartTop" type="button">🔀 重新挑戰</button></header>
<div class="picker"><label>冊別／年級<select id="book"></select></label><label>課次<select id="lesson"></select></label></div>
<div id="play"><div class="status"><span id="groupTitle"></span><span class="sub" id="groupProgress"></span></div><div class="track"><div class="fill" id="fill"></div></div><div class="sheet"><div class="instructions">先點英文再點中文，完成後按批改。</div><div id="sections"></div><div class="actions"><button class="action neutral" id="clear" type="button">🧽 清空</button><button class="action primary" id="check" type="button">✅ 批改本組</button><button class="action next hidden" id="next" type="button">下一組 →</button></div><div class="message" id="message" aria-live="polite"></div></div></div>
<div id="finish" class="sheet results hidden"><div style="font-size:28px">🏆</div><h1>單字配對挑戰完成！</h1><div id="finalLesson" class="final-lesson"></div><div class="score"><div class="score-unit"><strong id="scoreText"></strong><span class="score-label">答對題數</span></div><div class="score-unit"><span class="percent" id="pctText"></span><span class="score-label">正確率</span></div></div><div id="scoreGrid" class="score-grid"></div><div id="finishedAt" style="font-size:13px"></div><p class="capture">📸 截圖給老師看！</p><button class="action next" id="again" type="button" style="width:100%">重新挑戰這一課</button></div>
<footer class="foot">© <a href="https://sinny-hong.github.io/spedu-labs/share/" target="_blank" rel="noopener noreferrer">SINNY SPEDU LABS</a></footer>
</main><script src="../eng-115/vocab-data.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),books=window.VOCAB_DATA?.books,els={book:$('book'),lesson:$('lesson'),play:$('play'),finish:$('finish'),sections:$('sections'),message:$('message')};
if(!books){$('play').innerHTML='<div class="sheet">無法讀取共用單字資料。請確認本檔案位於 test-lab/ 或 share/，且 ../eng-115/vocab-data.js 可正常載入。</div>';return;}
const label=(k,b)=>k==='115-1-g8'?(b.label||'八年級').replace(/康軒/g,'翰林'):(b.label||k);const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let groups=[],index=0,active=null,answers=new Map(),graded=false,results=[],entries=[],choices=[];
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function addOption(sel,value,txt){const e=mk('option','',txt);e.value=value;sel.append(e);}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const n=new Uint32Array(1);crypto.getRandomValues(n);const j=n[0]%(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
Object.entries(books).forEach(([k,b])=>addOption(els.book,k,label(k,b)));
function lessons(){const b=books[els.book.value];els.lesson.replaceChildren();Object.keys(b.lessons||{}).forEach(k=>addOption(els.lesson,k,k));begin();}
function begin(){const b=books[els.book.value],raw=b?.lessons?.[els.lesson.value];if(!Array.isArray(raw)||!raw.length){els.finish.classList.add('hidden');els.play.classList.remove('hidden');els.sections.textContent='這一課暫無單字資料';return;}groups=raw.filter(g=>Array.isArray(g.words)&&g.words.length).map(g=>({title:g.title||'配對練習',words:[...g.words].sort((a,b)=>(a.order||0)-(b.order||0))}));index=0;results=[];els.finish.classList.add('hidden');els.play.classList.remove('hidden');render();}
function render(){active=null;graded=false;answers=new Map();els.message.textContent='';els.message.className='message';const group=groups[index];$('groupTitle').textContent=group.title;$('groupProgress').textContent=`第 ${index+1} / ${groups.length} 組 · 共 ${group.words.length} 題`;$('fill').style.width=`${index/groups.length*100}%`;els.sections.replaceChildren();$('check').classList.remove('hidden');$('clear').classList.remove('hidden');$('next').classList.add('hidden');
entries=shuffle(group.words.map((w,id)=>({id,w})));choices=shuffle(group.words.map((w,id)=>({id,w})));const keyById=new Map(choices.map((e,i)=>[e.id,letters[i]]));
const cols=mk('div','twocol'),left=mk('div','words'),right=mk('div','choices');left.style.setProperty('--count',entries.length);right.style.setProperty('--count',choices.length);
entries.forEach((entry,i)=>{const row=mk('button','word');row.type='button';row.dataset.id=entry.id;row.dataset.correct=keyById.get(entry.id);row.append(mk('span','ans','　'),mk('span','num',`${i+1}.`),mk('span','en',entry.w.english));row.addEventListener('click',()=>{if(graded)return;if(active===entry.id){active=null;row.classList.remove('active');return;}active=entry.id;left.querySelectorAll('.word.active').forEach(x=>x.classList.remove('active'));row.classList.add('active');});left.append(row);});
choices.forEach((entry,i)=>{const choice=mk('button','choice');choice.type='button';choice.append(mk('b','',`${letters[i]}.`),document.createTextNode(entry.w.chinese));choice.addEventListener('click',()=>{if(graded||active===null)return;const letter=letters[i];for(const [id,selected] of answers){if(selected===letter&&id!==active)answers.delete(id);}answers.set(active,letter);active=null;refresh();});right.append(choice);});cols.append(left,right);els.sections.append(cols);}
function refresh(){els.sections.querySelectorAll('.word').forEach(row=>{const id=Number(row.dataset.id);row.querySelector('.ans').textContent=answers.get(id)||'　';row.classList.toggle('active',active===id);});els.sections.querySelectorAll('.choice').forEach((row,i)=>row.classList.toggle('selected',[...answers.values()].includes(letters[i])));}
$('clear').addEventListener('click',()=>{if(graded)return;answers.clear();active=null;refresh();els.message.textContent='';});
$('check').addEventListener('click',()=>{if(graded)return;const rows=[...els.sections.querySelectorAll('.word')];if(answers.size!==rows.length){els.message.className='message error';els.message.textContent=`尚有 ${rows.length-answers.size} 題未完成。`;return;}graded=true;active=null;let correct=0;const byId=new Map(groups[index].words.map((w,id)=>[id,w]));rows.forEach(row=>{const id=Number(row.dataset.id),ok=answers.get(id)===row.dataset.correct;if(ok){correct++;row.classList.add('mark-good');row.append(mk('span','feedback','✓'));row.lastChild.style.color='#16815b';}else{row.classList.add('mark-bad');row.append(mk('span','feedback',`→ ${byId.get(id).chinese}`));}});results.push({title:groups[index].title,correct,total:rows.length});els.message.className='message success';els.message.textContent=`本組答對 ${correct} / ${rows.length} 題。`;$('check').classList.add('hidden');$('clear').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===groups.length-1?'查看總成績 →':'下一組 →';$('fill').style.width=`${(index+1)/groups.length*100}%`;});
$('next').addEventListener('click',()=>{if(!graded)return;if(index+1<groups.length){index++;render();window.scrollTo(0,0);}else complete();});
function complete(){els.play.classList.add('hidden');els.finish.classList.remove('hidden');const right=results.reduce((n,r)=>n+r.correct,0),total=results.reduce((n,r)=>n+r.total,0);const finalLesson=$('finalLesson');finalLesson.replaceChildren();const highlight=mk('span','lesson-highlight');highlight.append(document.createTextNode(`${label(els.book.value,books[els.book.value])} · `),mk('span','lesson-code',els.lesson.value));finalLesson.append(highlight);$('scoreText').textContent=`${right} / ${total}`;$('pctText').textContent=`${total?Math.round(right/total*100):0}%`;const grid=$('scoreGrid');grid.replaceChildren();grid.style.setProperty('--cols',results.length);results.forEach(r=>{const cell=mk('div','score-cell');cell.append(mk('span','sg',r.title),mk('strong','sv',`${r.correct} / ${r.total}`));grid.append(cell);});$('finishedAt').textContent=`完成時間：${new Date().toLocaleString('zh-TW',{hour12:false})}`;window.scrollTo(0,0);}
function restart(){if(results.length||answers.size){if(!confirm('重新挑戰會清除本次作答及成績，確定嗎？'))return;}begin();window.scrollTo(0,0);}
$('restartTop').addEventListener('click',restart);$('again').addEventListener('click',begin);els.book.addEventListener('change',()=>{if(results.length||answers.size){if(!confirm('更換冊別會清除本次作答，確定嗎？')){els.book.value=previousBook;return;}}previousBook=els.book.value;lessons();});let previousBook=els.book.value;let previousLesson='';els.lesson.addEventListener('change',()=>{if(results.length||answers.size){if(!confirm('更換課次會清除本次作答，確定嗎？')){els.lesson.value=previousLesson;return;}}previousLesson=els.lesson.value;begin();});lessons();previousLesson=els.lesson.value;
})();
</script></body></html>
