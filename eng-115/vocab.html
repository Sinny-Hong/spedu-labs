<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>單字學習講義</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#1e293b;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app-toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #cbd5e1;box-shadow:0 2px 8px #0f172a18}.toolbar-inner{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:end;gap:10px;flex-wrap:wrap}.control{display:flex;flex-direction:column;gap:3px}.control label{font-size:12px;font-weight:700;color:#475569}.control select{height:36px;min-width:210px;padding:0 32px 0 10px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font-weight:600}.control.lesson select{min-width:95px}.mode-buttons{display:flex;gap:5px}.mode-button,.print-button,.print-choice{height:36px;border:1px solid #94a3b8;border-radius:6px;background:#f8fafc;color:#334155;font-weight:700;padding:0 14px;cursor:pointer}.mode-button.active{background:#2563eb;border-color:#2563eb;color:#fff}.print-wrap{position:relative;margin-left:auto}.print-button{background:#0f766e;border-color:#0f766e;color:#fff}.print-menu{position:absolute;right:0;top:42px;width:245px;padding:6px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px #0f172a2b;display:none}.print-menu.open{display:grid;gap:4px}.print-choice{height:auto;min-height:36px;text-align:left;background:#fff}.print-choice:hover{background:#f1f5f9}.stage{padding:18px 12px 40px}.frame-shell{width:min(210mm,100%);margin:auto;overflow:auto;background:#fff;box-shadow:0 8px 24px #0f172a20}.template-frame{display:block;width:210mm;height:297mm;border:0;background:#fff}.print-area{position:fixed;left:-12000px;top:0;width:210mm}.print-frame{display:block;width:210mm;height:297mm;border:0;background:#fff}.print-status{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#0f172a66}.print-status.show{display:grid}.print-status span{background:#fff;border-radius:8px;padding:15px 20px;font-weight:700}
    @media(max-width:720px){.toolbar-inner{align-items:stretch}.control{flex:1}.control select,.control.lesson select{width:100%;min-width:0}.mode-buttons{order:3;width:100%}.mode-button{flex:1;padding:0 7px}.print-wrap{margin-left:0}.print-menu{left:0;right:auto}.stage{padding:10px 0 24px}.frame-shell{width:100%;box-shadow:none}}
    @page{size:A4;margin:0}
    @media print{html,body{width:210mm;margin:0;padding:0;background:#fff}.app-toolbar,.stage,.print-status{display:none!important}.print-area{position:static;left:auto;top:auto;width:210mm}.print-frame{width:210mm;height:297mm;display:block;overflow:hidden;page-break-after:always;break-after:page}.print-frame:last-child{page-break-after:auto;break-after:auto}}
  </style>
</head>
<body>
  <header class="app-toolbar">
    <div class="toolbar-inner">
      <div class="control"><label for="bookSelect">冊別／年級</label><select id="bookSelect"></select></div>
      <div class="control lesson"><label for="lessonSelect">課次</label><select id="lessonSelect"></select></div>
      <nav class="mode-buttons" aria-label="題型切換">
        <button class="mode-button" data-mode="hear">單字聽力</button>
        <button class="mode-button" data-mode="match">配對</button>
        <button class="mode-button" data-mode="write">聽寫</button>
      </nav>
      <div class="print-wrap">
        <button id="printButton" class="print-button" aria-expanded="false">列印</button>
        <div id="printMenu" class="print-menu">
          <button class="print-choice" data-scope="lesson" data-teacher="0">本課學生版（3頁）</button>
          <button class="print-choice" data-scope="lesson" data-teacher="1">本課教師版（2頁）</button>
          <button class="print-choice" data-scope="book" data-teacher="0">本冊學生版（18頁）</button>
          <button class="print-choice" data-scope="book" data-teacher="1">本冊教師版（12頁）</button>
        </div>
      </div>
    </div>
  </header>
  <main class="stage"><div class="frame-shell"><iframe id="templateFrame" class="template-frame" title="單字教材" scrolling="no"></iframe></div></main>
  <div id="printArea" class="print-area" aria-hidden="true"></div>
  <div id="printStatus" class="print-status"><span>正在準備列印頁面…</span></div>
  <script src="vocab-data.js"></script>
  <script>
  (()=>{
    'use strict';
    const books=window.VOCAB_DATA&&window.VOCAB_DATA.books;if(!books){document.body.textContent='無法載入 vocab-data.js';return}
    const bookSelect=document.getElementById('bookSelect'),lessonSelect=document.getElementById('lessonSelect'),frame=document.getElementById('templateFrame'),printMenu=document.getElementById('printMenu'),printArea=document.getElementById('printArea'),printStatus=document.getElementById('printStatus');
    const modes=['hear','match','write'];let bookKey=localStorage.getItem('vocab-shell-book'),lessonKey=localStorage.getItem('vocab-shell-lesson'),mode=localStorage.getItem('vocab-shell-mode');
    if(!books[bookKey])bookKey=Object.keys(books)[0];if(!modes.includes(mode))mode='hear';
    function lessonKeys(){return Object.keys(books[bookKey].lessons)}
    function templateUrl(which,lesson,teacher=false){const q=new URLSearchParams({embedded:'1',book:bookKey,lesson});if(teacher)q.set('teacher','1');return `${which}.html?${q}`}
    function fillLessons(){const keys=lessonKeys();if(!keys.includes(lessonKey))lessonKey=keys[0];lessonSelect.innerHTML=keys.map(k=>`<option value="${k}">${k}</option>`).join('');lessonSelect.value=lessonKey}
    function render(){frame.src=templateUrl(mode,lessonKey);document.querySelectorAll('.mode-button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));localStorage.setItem('vocab-shell-book',bookKey);localStorage.setItem('vocab-shell-lesson',lessonKey);localStorage.setItem('vocab-shell-mode',mode)}
    Object.entries(books).forEach(([key,book])=>bookSelect.add(new Option(book.label,key)));bookSelect.value=bookKey;fillLessons();render();
    bookSelect.addEventListener('change',()=>{bookKey=bookSelect.value;fillLessons();render()});lessonSelect.addEventListener('change',()=>{lessonKey=lessonSelect.value;render()});document.querySelector('.mode-buttons').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;render()});
    document.getElementById('printButton').addEventListener('click',e=>{e.stopPropagation();const open=printMenu.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.print-wrap')){printMenu.classList.remove('open');document.getElementById('printButton').setAttribute('aria-expanded','false')}});
    function loadPrintFrame(src){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.className='print-frame';f.title='列印教材';f.scrolling='no';f.onload=()=>resolve(f);f.onerror=reject;f.src=src;printArea.appendChild(f)})}
    async function preparePrint(scope,teacher){printMenu.classList.remove('open');printStatus.classList.add('show');printArea.innerHTML='';const lessons=scope==='lesson'?[lessonKey]:lessonKeys();const printModes=teacher?['hear','match']:modes;const jobs=[];for(const lesson of lessons)for(const which of printModes)jobs.push(loadPrintFrame(templateUrl(which,lesson,teacher)));try{await Promise.all(jobs);await new Promise(r=>setTimeout(r,350));window.print()}finally{printStatus.classList.remove('show')}}
    printMenu.addEventListener('click',e=>{const b=e.target.closest('.print-choice');if(b)preparePrint(b.dataset.scope,b.dataset.teacher==='1')});
  })();
  </script>
</body>
</html>
