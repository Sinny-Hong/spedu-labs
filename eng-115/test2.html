<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>異想命運館｜Fortune Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* 卡背神秘星空漸層與星塵動畫 */
    .bg-tarot-pattern {
      background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f172a 70%, #020617 100%);
    }
    /* 發光微弱脈動 */
    @keyframes card-glow {
      0%, 100% { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.35); }
      50% { box-shadow: 0 0 35px 2px rgba(245, 158, 11, 0.6); }
    }
    .animate-glow {
      animation: card-glow 3s infinite ease-in-out;
    }
  </style>
</head>

      { id: 39, category: "搞笑幸運系", icon: "🐶", nameEN: "The Puppy", nameZH: "小狗", quoteEN: "Wag your tail today!", quoteZH: "今天像小狗一樣開心搖尾巴！", fortuneZH: "遇到喜歡的人就大力打個招呼，把快樂像尾巴一樣晃出來！", luckyItem: "雙手揮揮", keyWordEN: "tail", keyWordZH: "尾巴" },
      { id: 40, category: "搞笑幸運系", icon: "💤", nameEN: "The Pillow", nameZH: "枕頭", quoteEN: "Hold on until your bed.", quoteZH: "堅持住，床在等你回家！", fortuneZH: "眼皮如果快要打架，想想放學後柔軟的枕頭正在呼喚你。", luckyItem: "下課鐘聲", keyWordEN: "hold", keyWordZH: "堅持" }
    ];

    // 洗牌與牌堆狀態管理
    let currentDeck = [];
    let isFlipped = false;
    let isAnimating = false;
    let activeCard = null;

    // Fisher-Yates 洗牌算法
    function shuffleDeck(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 更新剩餘牌數顯示
    function updateCounter() {
      const counterEl = document.getElementById('deckCounter');
      counterEl.textContent = `剩餘卡牌: ${currentDeck.length} / ${rawCardsData.length}`;
    }

    // 取得下一張牌（40張抽完無縫自動重新洗牌）
    function getNextCard() {
      if (currentDeck.length === 0) {
        currentDeck = shuffleDeck(rawCardsData);
      }
      const card = currentDeck.pop();
      updateCounter();
      return card;
    }

    // 渲染卡面資料
    function renderCard(card) {
      activeCard = card;
      document.getElementById('cardIcon').textContent = card.icon;
      document.getElementById('cardNameEN').textContent = card.nameEN.toUpperCase();
      document.getElementById('cardNameZH').textContent = card.nameZH;
      document.getElementById('cardCategory').textContent = card.category;
      document.getElementById('cardQuoteEN').textContent = `"${card.quoteEN}"`;
      document.getElementById('cardQuoteZH').textContent = card.quoteZH;
      document.getElementById('cardFortuneZH').textContent = card.fortuneZH;
      document.getElementById('cardLuckyItem').textContent = card.luckyItem;
      document.getElementById('cardKeyWordEN').textContent = card.keyWordEN;
      document.getElementById('cardKeyWordZH').textContent = `（${card.keyWordZH}）`;
    }

    // 翻牌到正面
    function flipToFront() {
      if (isFlipped || isAnimating) return;
      isAnimating = true;
      const cardInner = document.getElementById('cardInner');
      cardInner.classList.add('rotate-y-180');
      isFlipped = true;
      setTimeout(() => { isAnimating = false; }, 700);
    }

    // 抽下一張牌並翻轉重置
    function handleDrawNext() {
      if (isAnimating) return;
      const cardInner = document.getElementById('cardInner');

      if (!isFlipped) {
        // 如果目前是背面，直接翻開
        flipToFront();
      } else {
        // 如果目前已經是正面，先翻回背面，中途更換卡片資料
        isAnimating = true;
        cardInner.classList.remove('rotate-y-180');
        isFlipped = false;

        setTimeout(() => {
          const nextCard = getNextCard();
          renderCard(nextCard);
          // 停留半秒增加儀式感，隨後自動翻開新牌
          setTimeout(() => {
            cardInner.classList.add('rotate-y-180');
            isFlipped = true;
            isAnimating = false;
          }, 350);
        }, 500);
      }
    }

    // Web Speech API 朗讀功能（適合特教的 0.85 慢速發音）
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止先前的朗讀
      const cleanText = text.replace(/["'“”]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // 稍慢、清晰
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 初始化綁定
    window.addEventListener('DOMContentLoaded', () => {
      currentDeck = shuffleDeck(rawCardsData);
      const initialCard = getNextCard();
      renderCard(initialCard);

      const cardInner = document.getElementById('cardInner');
      const drawBtn = document.getElementById('drawBtn');
      const quoteBox = document.getElementById('quoteBox');
      const wordBox = document.getElementById('wordBox');

      // 點擊卡背翻牌
      cardInner.addEventListener('click', (e) => {
        // 若點擊的是金句或單字區塊，僅觸發發音，不觸發翻轉干擾
        if (quoteBox.contains(e.target) || wordBox.contains(e.target)) return;
        if (!isFlipped) {
          flipToFront();
        }
      });

      // 抽卡按鈕
      drawBtn.addEventListener('click', handleDrawNext);

      // 點擊金句朗讀
      quoteBox.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activeCard) speakText(activeCard.quoteEN);
      });

      // 點擊單字朗讀
      wordBox.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activeCard) speakText(activeCard.keyWordEN);
      });
    });
  </script>
