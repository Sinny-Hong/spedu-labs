<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115-1 國三英文科聽力測驗 - 特教慢速報讀系統</title>
  <style>
    :root {
      --primary: #1e40af;
      --active-bg: #fef2f2;
      --active-border: #dc2626;
      --text: #0f172a;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 頂部控制面板 */
    .control-panel {
      position: sticky;
      top: 10px;
      z-index: 50;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 14px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .btn-group { display: flex; gap: 8px; }
    button {
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      transition: all 0.2s;
    }
    .btn-play-all { background: var(--primary); color: #fff; }
    .btn-play-all:hover { background: #1d4ed8; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    
    .rate-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .rate-box input { cursor: pointer; width: 110px; }

    /* 題目卡片 */
    .q-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s;
    }
    .q-card.playing {
      border: 3px solid var(--active-border);
      background: var(--active-bg);
      box-shadow: 0 4px 8px rgba(220, 38, 38, 0.1);
    }
    .btn-single {
      background: #e2e8f0;
      color: #1e293b;
      border: 1px solid #94a3b8;
      padding: 8px 12px;
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .btn-single:hover { background: #cbd5e1; }
    
    .q-content { flex: 1; }
    .q-header {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #1e40af;
    }
    .target-ans {
      background: #fee2e2;
      color: #dc2626;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-left: 8px;
    }
    .q-opts {
      font-size: 1.05rem;
      color: #334155;
      margin: 4px 0 8px 0;
      font-weight: 500;
    }
    .script-text {
      font-size: 0.95rem;
      color: #475569;
      background: #f8fafc;
      padding: 8px 12px;
      border-left: 4px solid #3b82f6;
      border-radius: 0 4px 4px 0;
    }
    .role-m { color: #0369a1; font-weight: bold; }
    .role-w { color: #be185d; font-weight: bold; }
    .role-q { color: #b45309; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 頂部控制列 -->
  <div class="control-panel">
    <div>
      <div style="font-size:1.15rem; font-weight:bold; color:var(--primary);">
        🎙️ 國三英文聽力測驗 (超慢速特教輔助報讀)
      </div>
      <div id="status-indicator" style="font-size:0.9rem; color:#64748b; font-weight:600;">狀態：待命就緒</div>
    </div>

    <!-- 獨立英文語速滑桿 -->
    <div class="rate-box">
      <label for="enRateSlider">英文超慢速：</label>
      <input type="range" id="enRateSlider" min="0.35" max="0.9" step="0.05" value="0.5">
      <span id="enRateValue" style="color:var(--primary);">0.50x</span>
    </div>

    <div class="btn-group">
      <button class="btn-play-all" onclick="playAll()">▶️ 全卷連續朗讀</button>
      <button class="btn-stop" onclick="stopAll()">⏹️ 停止</button>
    </div>
  </div>

  <!-- 題目列表 -->
  <div id="questions-list"></div>

</div>

<script>
  // 1-15 題 A, B, C 平均各 5 題[span_0](start_span)[span_0](end_span)
  const examData = [
    { id: 1, target: "A", word: "potato", opts: "(A) potato  (B) page  (C) history" },
    { id: 2, target: "C", word: "chocolate", opts: "(A) candy  (B) soldier  (C) chocolate" },
    { id: 3, target: "B", word: "tired", opts: "(A) bake  (B) tired  (C) language" },
    { id: 4, target: "A", word: "century", opts: "(A) century  (B) chart  (C) king" },
    { id: 5, target: "C", word: "national", opts: "(A) topic  (B) fry  (C) national" },
    { id: 6, target: "B", word: "pumpkin", opts: "(A) excited  (B) pumpkin  (C) soldier" },
    { id: 7, target: "A", word: "tired", opts: "(A) tired  (B) interested  (C) century" },
    { id: 8, target: "C", word: "boring", opts: "(A) delivery  (B) history  (C) boring" },
    { id: 9, target: "B", word: "button", opts: "(A) page  (B) button  (C) language" },
    { id: 10, target: "A", word: "chart", opts: "(A) chart  (B) celebrate  (C) bored" },
    { id: 11, target: "C", word: "thick", opts: "(A) discount  (B) location  (C) thick" },
    { id: 12, target: "B", word: "offer", opts: "(A) helpful  (B) offer  (C) bunny" },
    { id: 13, target: "A", word: "driver", opts: "(A) driver  (B) reason  (C) interested" },
    { id: 14, target: "C", word: "surprising", opts: "(A) uniform  (B) candy  (C) surprising" },
    { id: 15, target: "B", word: "subject", opts: "(A) chance  (B) subject  (C) soldier" },
    {
      id: 16, target: "C",
      sentence: "The boy has eaten half of the pizza.",
      opts: "(A) 完好8片披薩  (B) 盒子全空摸肚子  (C) 剩下半個披薩"
    },
    {
      id: 17, target: "C",
      sentence: "The man is using a hairdryer to dry the woman’s hair.",
      opts: "(A) 沖水洗頭  (B) 剪刀理髮  (C) 吹風機吹乾頭髮"
    },
    {
      id: 18, target: "A",
      sentence: "Taking pictures of flowers is one of the woman’s interests.",
      opts: "(A) 拿相機拍花  (B) 趴草地看花  (C) 摔破花瓶生氣"
    },
    {
      id: 19, target: "A",
      sentence: "Do you mind if I use your computer?",
      opts: "(A) Of course not.  (B) Yes, that would be great.  (C) Sure. What are you waiting for?"
    },
    {
      id: 20, target: "B",
      isDialogue: true,
      opts: "(A) Leave the city.  (B) Try some dishes.  (C) Open a restaurant.",
      lines: [
        { role: "W", text: "Where in the city are we?" },
        { role: "M", text: "We’re on the south side of the city." },
        { role: "W", text: "I’ve never been to this area. What are we doing here?" },
        { role: "M", text: "I’m taking you to a famous restaurant. It has the best burgers and fries in the world." },
        { role: "W", text: "Oh, I love a good burger." },
        { role: "Q", text: "What are the man and the woman going to do?" }
      ]
    }
  ];

  // 畫面渲染
  const listContainer = document.getElementById("questions-list");
  examData.forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = `q-card-${q.id}`;

    let scriptHtml = "";
    if (q.id <= 15) {
      scriptHtml = `【念讀腳本】：第 ${q.id} 題 → <strong>${q.word}</strong> (念兩遍)`;
    } else if (q.id <= 19) {
      scriptHtml = `【念讀腳本】：第 ${q.id} 題 → <strong>${q.sentence}</strong> (念兩遍)`;
    } else {
      scriptHtml = q.lines.map(l => {
        let tag = l.role === 'M' ? '<span class="role-m">[男生 Man]</span>' : (l.role === 'W' ? '<span class="role-w">[女生 Woman]</span>' : '<span class="role-q">[題目 Question]</span>');
        return `<div>${tag} ${l.text}</div>`;
      }).join("");
    }

    card.innerHTML = `
      <button class="btn-single" onclick="playSingle(${q.id})">🔊 念第 ${q.id} 題</button>
      <div class="q-content">
        <div class="q-header">
          第 ${q.id} 題
          <span class="target-ans">答案：(${q.target})</span>
        </div>
        <div class="q-opts">${q.opts}</div>
        <div class="script-text">${scriptHtml}</div>
      </div>
    `;
    listContainer.appendChild(card);
  });

  // TTS 與語音設定
  const synth = window.speechSynthesis;
  let isPlayingAll = false;
  let voices = [];

  function loadVoices() {
    voices = synth.getVoices();
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 語速連動
  const enRateSlider = document.getElementById("enRateSlider");
  const enRateValue = document.getElementById("enRateValue");
  enRateSlider.addEventListener("input", () => {
    enRateValue.textContent = parseFloat(enRateSlider.value).toFixed(2) + "x";
  });

  function getEnRate() {
    return parseFloat(enRateSlider.value) || 0.5;
  }

  // 單句播放函數
  function speak(text, lang = "zh-TW", role = "N") {
    return new Promise((resolve) => {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;

      if (lang === "zh-TW") {
        utter.rate = 1.0; // 中文固定自然語速
        utter.pitch = 1.0;
      } else {
        utter.rate = getEnRate(); // 英文採用指定超慢速 (預設 0.5x)
        
        const enVoices = voices.filter(v => v.lang.startsWith("en"));
        if (role === "M") {
          // 優先找真正的系統原生男聲 (如 David, Mark, George, Guy)
          const maleVoice = enVoices.find(v => /male|david|mark|george|guy/i.test(v.name));
          if (maleVoice) utter.voice = maleVoice;
          utter.pitch = 0.75; // 即使沒男聲，也以 0.75 低頻模擬成年男聲
        } else if (role === "W") {
          // 優先找女聲 (如 Zira, Samantha, Susan, Jenny)
          const femaleVoice = enVoices.find(v => /female|zira|samantha|susan|jenny|karen/i.test(v.name));
          if (femaleVoice) utter.voice = femaleVoice;
          utter.pitch = 1.15;
        } else {
          utter.pitch = 1.0;
        }
      }

      utter.onend = () => resolve();
      utter.onerror = () => resolve();
      synth.speak(utter);
    });
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function highlight(id) {
    document.querySelectorAll(".q-card").forEach(c => c.classList.remove("playing"));
    if (id) {
      const target = document.getElementById(`q-card-${id}`);
      if (target) {
        target.classList.add("playing");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  }

  // 播放單題完整邏輯
  async function runQuestion(q) {
    highlight(q.id);
    document.getElementById("status-indicator").textContent = `正在播放：第 ${q.id} 題`;

    // 1. 中文念題號 (自然語速 1.0x)
    await speak(`第${q.id}題。`, "zh-TW");
    await sleep(600); // 題號念完稍微停頓

    if (q.id <= 15) {
      // 1-15 題單字 (超慢速 0.5x 念兩遍，中間留白 1.5 秒)
      await speak(q.word, "en-US", "W");
      await sleep(1500);
      await speak(q.word, "en-US", "W");
    } else if (q.id <= 19) {
      // 16-19 題句子 (超慢速 0.5x 念兩遍，中間留白 2 秒)
      await speak(q.sentence, "en-US", "W");
      await sleep(2000);
      await speak(q.sentence, "en-US", "W");
    } else if (q.id === 20) {
      // 第 20 題男女對話 (念兩遍)
      for (let run = 1; run <= 2; run++) {
        if (!synth.speaking && !isPlayingAll && run > 1) return;
        for (const line of q.lines) {
          if (line.role === "Q") {
            await sleep(800);
            await speak(line.text, "en-US", "W");
          } else {
            await speak(line.text, "en-US", line.role);
            await sleep(700); // 對話行與行之間的自然停頓
          }
        }
        if (run === 1) await sleep(2500); // 第一遍與第二遍對話之間的長停頓
      }
    }

    // 題目念完給學生劃記時間 (2.5 秒)
    await sleep(2500);
  }

  // 單題點擊播放
  async function playSingle(id) {
    stopAll();
    const q = examData.find(item => item.id === id);
    if (!q) return;
    await runQuestion(q);
    highlight(null);
    document.getElementById("status-indicator").textContent = `第 ${id} 題播放完畢`;
  }

  // 全部連續朗讀
  async function playAll() {
    stopAll();
    isPlayingAll = true;

    // 開場宣告 (中文自然語速)
    document.getElementById("status-indicator").textContent = "正在宣告測驗開場...";
    await speak("115學年度上學期國三英文科聽力測驗，開始。", "zh-TW");
    await sleep(2000);

    for (let i = 0; i < examData.length; i++) {
      if (!isPlayingAll) break;
      await runQuestion(examData[i]);
    }

    if (isPlayingAll) {
      await speak("聽力測驗播放結束，請繼續作答其餘題目。", "zh-TW");
      document.getElementById("status-indicator").textContent = "全卷播放完畢";
    }
    highlight(null);
    isPlayingAll = false;
  }

  // 停止播放
  function stopAll() {
    isPlayingAll = false;
    synth.cancel();
    highlight(null);
    document.getElementById("status-indicator").textContent = "已停止";
  }
</script>

</body>
</html>
