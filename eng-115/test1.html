<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115-1 國三英文科聽力測驗 語音報讀工具</title>
  <style>
    :root {
      --primary: #1e40af;
      --active: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: #1e293b;
      padding: 16px;
      line-height: 1.4;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    /* 頂部固定控制列 */
    .control-panel {
      position: sticky;
      top: 10px;
      z-index: 50;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 12px 18px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-group { display: flex; gap: 8px; }
    button {
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.95rem;
      border: none;
      transition: all 0.2s;
    }
    .btn-play-all { background: var(--primary); color: #fff; }
    .btn-play-all:hover { background: #1d4ed8; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .rate-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .rate-box input { cursor: pointer; }
    
    /* 題目卡片 */
    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border 0.2s, background 0.2s;
    }
    .q-card.playing {
      border: 2px solid var(--active);
      background: #fef2f2;
    }
    .btn-single {
      background: #e2e8f0;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 6px 10px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-single:hover {
      background: #cbd5e1;
    }
    .q-content { flex: 1; }
    .q-title { font-weight: bold; margin-bottom: 4px; }
    .q-opts { color: #475569; font-size: 0.92rem; }
    .script-text { font-size: 0.85rem; color: #2563eb; margin-top: 4px; }
    .role-m { color: #0284c7; font-weight: bold; }
    .role-w { color: #d946ef; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 控制面板 -->
  <div class="control-panel">
    <div>
      <div style="font-size:1.1rem; font-weight:bold; color:var(--primary);">
        🎙️ 115-1 國三英文科聽力測驗 (TTS 語音播放系統)
      </div>
      <div id="status-indicator" style="font-size:0.85rem; color:#64748b;">待命就緒</div>
    </div>

    <div class="rate-box">
      <label for="rateSlider">語速調整：</label>
      <input type="range" id="rateSlider" min="0.5" max="1.3" step="0.05" value="0.85">
      <span id="rateValue">0.85x</span>
    </div>

    <div class="btn-group">
      <button class="btn-play-all" onclick="playAll()">▶️ 全部一口氣連續朗讀</button>
      <button class="btn-stop" onclick="stopAll()">⏹️ 停止朗讀</button>
    </div>
  </div>

  <!-- 題目列表 -->
  <div id="questions-list"></div>

</div>

<script>
  // 題庫資料 (第1-15題選項A/B/C平均分配各5次，單字念兩次；第16-20題忠實朗讀)
  const examData = [
    {
      id: 1, target: "A", word: "potato",
      options: "(A) potato  (B) page  (C) history",
      script: "Question 1. potato. potato."
    },
    {
      id: 2, target: "C", word: "chocolate",
      options: "(A) candy  (B) soldier  (C) chocolate",
      script: "Question 2. chocolate. chocolate."
    },
    {
      id: 3, target: "B", word: "tired",
      options: "(A) bake  (B) tired  (C) language",
      script: "Question 3. tired. tired."
    },
    {
      id: 4, target: "A", word: "century",
      options: "(A) century  (B) chart  (C) king",
      script: "Question 4. century. century."
    },
    {
      id: 5, target: "C", word: "national",
      options: "(A) topic  (B) fry  (C) national",
      script: "Question 5. national. national."
    },
    {
      id: 6, target: "B", word: "pumpkin",
      options: "(A) excited  (B) pumpkin  (C) soldier",
      script: "Question 6. pumpkin. pumpkin."
    },
    {
      id: 7, target: "A", word: "tired",
      options: "(A) tired  (B) interested  (C) century",
      script: "Question 7. tired. tired."
    },
    {
      id: 8, target: "C", word: "boring",
      options: "(A) delivery  (B) history  (C) boring",
      script: "Question 8. boring. boring."
    },
    {
      id: 9, target: "B", word: "button",
      options: "(A) page  (B) button  (C) language",
      script: "Question 9. button. button."
    },
    {
      id: 10, target: "A", word: "chart",
      options: "(A) chart  (B) celebrate  (C) bored",
      script: "Question 10. chart. chart."
    },
    {
      id: 11, target: "C", word: "thick",
      options: "(A) discount  (B) location  (C) thick",
      script: "Question 11. thick. thick."
    },
    {
      id: 12, target: "B", word: "offer",
      options: "(A) helpful  (B) offer  (C) bunny",
      script: "Question 12. offer. offer."
    },
    {
      id: 13, target: "A", word: "driver",
      options: "(A) driver  (B) reason  (C) interested",
      script: "Question 13. driver. driver."
    },
    {
      id: 14, target: "C", word: "surprising",
      options: "(A) uniform  (B) candy  (C) surprising",
      script: "Question 14. surprising. surprising."
    },
    {
      id: 15, target: "B", word: "subject",
      options: "(A) chance  (B) subject  (C) soldier",
      script: "Question 15. subject. subject."
    },
    {
      id: 16,
      options: "(A) 完好8片披薩  (B) 盒子全空摸肚子  (C) 剩下半個披薩",
      script: "Question 16. The boy has eaten half of the pizza. The boy has eaten half of the pizza."
    },
    {
      id: 17,
      options: "(A) 沖水洗頭  (B) 剪刀理髮  (C) 吹風機吹乾頭髮",
      script: "Question 17. The man is using a hairdryer to dry the woman’s hair. The man is using a hairdryer to dry the woman’s hair."
    },
    {
      id: 18,
      options: "(A) 蹲著拍花  (B) 趴草地看花  (C) 打碎花瓶生氣",
      script: "Question 18. Taking pictures of flowers is one of the woman’s interests. Taking pictures of flowers is one of the woman’s interests."
    },
    {
      id: 19,
      options: "(A) Of course not.  (B) Yes, that would be great.  (C) Sure. What are you waiting for?",
      script: "Question 19. Do you mind if I use your computer? Do you mind if I use your computer?"
    },
    {
      id: 20,
      options: "(A) Leave the city.  (B) Try some dishes.  (C) Open a restaurant.",
      isDialogue: true,
      dialogue: [
        { role: "W", text: "Where in the city are we?" },
        { role: "M", text: "We’re on the south side of the city." },
        { role: "W", text: "I’ve never been to this area. What are we doing here?" },
        { role: "M", text: "I’m taking you to a famous restaurant. It has the best burgers and fries in the world." },
        { role: "W", text: "Oh, I love a good burger." },
        { role: "N", text: "Question 20. What are the man and the woman going to do?" }
      ]
    }
  ];

  // 渲染畫面
  const listContainer = document.getElementById("questions-list");
  examData.forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = `q-card-${q.id}`;
    
    let previewText = "";
    if (q.isDialogue) {
      previewText = q.dialogue.map(d => `<span class="${d.role === 'M' ? 'role-m' : (d.role === 'W' ? 'role-w' : '')}">${d.role}: ${d.text}</span>`).join("<br>");
    } else {
      previewText = q.script;
    }

    card.innerHTML = `
      <button class="btn-single" onclick="playSingle(${q.id})">🔊 念第 ${q.id} 題</button>
      <div class="q-content">
        <div class="q-title">第 ${q.id} 題 ${q.target ? `<small style="color:#059669;">[設定選項: ${q.target}]</small>` : ''}</div>
        <div class="q-opts">${q.options}</div>
        <div class="script-text">${previewText}</div>
      </div>
    `;
    listContainer.appendChild(card);
  });

  // TTS 與男女聲音調控
  const synth = window.speechSynthesis;
  let isPlayingAll = false;
  let currentIndex = 0;
  let voices = [];

  function loadVoices() {
    voices = synth.getVoices();
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 語速連動
  const rateSlider = document.getElementById("rateSlider");
  const rateValue = document.getElementById("rateValue");
  rateSlider.addEventListener("input", () => {
    rateValue.textContent = rateSlider.value + "x";
  });

  function getRate() {
    return parseFloat(rateSlider.value) || 0.85;
  }

  // 朗讀字句通用函數（支援角色性別分流）
  function speakSentence(text, lang = "en-US", role = "N") {
    return new Promise((resolve) => {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = getRate();

      // 選擇語音與 Pitch 調音來區分男女
      const enVoices = voices.filter(v => v.lang.startsWith("en"));
      if (role === "M") {
        // 男聲：尋找名稱含 male/david/mark/george 者，音調調低
        const maleVoice = enVoices.find(v => /male|david|mark|george/i.test(v.name));
        if (maleVoice) utter.voice = maleVoice;
        utter.pitch = 0.8; 
      } else if (role === "W") {
        // 女聲：尋找名稱含 female/zira/samantha/susan 者，音調調高
        const femaleVoice = enVoices.find(v => /female|zira|samantha|susan|karen/i.test(v.name));
        if (femaleVoice) utter.voice = femaleVoice;
        utter.pitch = 1.25; 
      } else {
        utter.pitch = 1.0;
      }

      utter.onend = () => resolve();
      utter.onerror = () => resolve();
      synth.speak(utter);
    });
  }

  function pause(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function highlightCard(id) {
    document.querySelectorAll(".q-card").forEach(c => c.classList.remove("playing"));
    if (id) {
      const target = document.getElementById(`q-card-${id}`);
      if (target) {
        target.classList.add("playing");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  }

  // 單題播放
  async function playQuestion(q) {
    highlightCard(q.id);
    document.getElementById("status-indicator").textContent = `正在播放：第 ${q.id} 題`;

    if (q.isDialogue) {
      // 念對話（兩次）
      for (let run = 1; run <= 2; run++) {
        for (const line of q.dialogue) {
          if (!synth.speaking && !isPlayingAll && run > 1) return;
          await speakSentence(line.text, "en-US", line.role);
          await pause(400);
        }
        if (run === 1) await pause(1500); // 兩次對話之間的停頓
      }
    } else {
      // 朗讀一般題
      await speakSentence(q.script, "en-US", "N");
    }
    await pause(1000);
  }

  // 單題播放入口
  async function playSingle(id) {
    stopAll();
    const q = examData.find(item => item.id === id);
    if (!q) return;
    await playQuestion(q);
    highlightCard(null);
    document.getElementById("status-indicator").textContent = "播放完畢";
  }

  // 全部連續朗讀入口
  async function playAll() {
    stopAll();
    isPlayingAll = true;
    document.getElementById("status-indicator").textContent = "正在朗讀：開場宣告";

    // 1. 開場宣告
    await speakSentence("115學年度上學期國三英文科聽力測驗", "zh-TW");
    await pause(1500);

    // 2. 依序播放 1 至 20 題
    for (let i = 0; i < examData.length; i++) {
      if (!isPlayingAll) break;
      await playQuestion(examData[i]);
    }

    if (isPlayingAll) {
      document.getElementById("status-indicator").textContent = "全卷聽力測驗朗讀完畢";
      await speakSentence("聽力測驗結束，請繼續作答其他題目。", "zh-TW");
    }
    highlightCard(null);
    isPlayingAll = false;
  }

  // 停止全部
  function stopAll() {
    isPlayingAll = false;
    synth.cancel();
    highlightCard(null);
    document.getElementById("status-indicator").textContent = "已停止播放";
  }
</script>

</body>
</html>
