name: Update Library manifests

on:
  push:
    branches:
      - main
    paths:
      - "eng-grammar/reading/*.html"
      - "eng-grammar/reading/generate-reading-manifest.ps1"
      - "eng-grammar/topic/*.html"
      - "eng-grammar/topic/generate-topic-manifest.ps1"
      - "eng-115/text/*.html"
      - "eng-115/text/generate-text-manifest.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Reading, Topic and Text manifests
        shell: pwsh
        run: |
          ./eng-grammar/reading/generate-reading-manifest.ps1
          ./eng-grammar/topic/generate-topic-manifest.ps1
          ./eng-115/text/generate-text-manifest.ps1

      - name: Commit updated manifests
        shell: bash
        run: |
          if git diff --quiet -- eng-grammar/reading/reading-manifest.js eng-grammar/topic/topic-manifest.js eng-115/text/text-manifest.js; then
            echo "Library manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eng-grammar/reading/reading-manifest.js eng-grammar/topic/topic-manifest.js eng-115/text/text-manifest.js
          git commit -m "chore: update Library manifests"
          git push
