<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spedu Labs | Grammar Workspace</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 太空幾何星空格線背景 (NASA 藍圖風格) */
    .labs-grid-bg {
      background-color: #F4F7FB;
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
        radial-gradient(circle, rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        radial-gradient(circle, rgba(59, 130, 246, 0.04) 2px, transparent 2px);
      background-size: 40px 40px, 40px 40px, 80px 80px, 120px 120px;
      background-position: 0 0, 0 0, 20px 20px, 40px 40px;
    }
    /* 隱藏滾動條但保持滾動功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-900 bg-slate-50">

  <!-- 頂部 Header -->
  <header class="h-16 border-t-[4px] border-[#F59E0B] bg-[#FFFDF8] border-b border-slate-200 flex items-center justify-between px-4 z-40 shrink-0">
    <div class="flex items-center space-x-3">
      <!-- 漢堡選單 (手機與桌機版開關) -->
      <button id="menu-toggle" class="p-2 rounded-lg hover:bg-slate-100 focus:outline-none">
        <i class="fa-solid fa-bars text-xl text-slate-600"></i>
      </button>
      <!-- Logo 放大至 46px 飽滿尺寸 -->
      <img src="line-qrcode.png" alt="Spedu Labs Logo" class="h-[46px] object-contain scale-110 origin-left" onerror="this.src='https://placehold.co/180x46/FFFDF8/F59E0B?text=SINNY+SPEDU+LABS'">
      <span class="text-slate-400 font-light">/</span>
      <span class="text-sm font-semibold tracking-wider text-slate-500 uppercase">Grammar Workspace</span>
    </div>
    <div class="text-xs text-slate-400 font-mono tracking-widest hidden sm:block">WORKSPACE V1.1</div>
  </header>

  <!-- 主區塊 -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- 手機版懸浮抽屜黑色半透明遮罩 (Overlay) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-20 hidden lg:hidden transition-opacity duration-300 opacity-0"></div>

    <!-- 左側 Sidebar (手機與桌機分離滑動，已修復手機排版擠壓 Bug) -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-[240px] bg-[#F7F8FA] border-r border-slate-200 z-30 flex flex-col transition-all duration-300 -translate-x-full lg:translate-x-0">
      
      <!-- 搜尋欄 -->
      <div class="p-4 border-b border-slate-200">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
          <input type="text" id="search-input" placeholder="搜尋教材或檔名..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-[#F59E0B] transition-colors">
        </div>
      </div>

      <!-- 選單按鈕區 -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-1">
        <button onclick="filterCategory('all')" id="btn-all" class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg bg-slate-200/80 text-slate-900 transition-colors">
          <div class="flex items-center space-x-2.5">
            <i class="fa-solid fa-folder-open text-amber-500 text-base"></i>
            <span>全部文法教材</span>
          </div>
          <span id="count-all" class="text-xs px-2 py-0.5 rounded-full bg-slate-300 text-slate-700 font-mono">29</span>
        </button>

        <button onclick="filterCategory('fav')" id="btn-fav" class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors">
          <div class="flex items-center space-x-2.5">
            <i class="fa-solid fa-star text-amber-500 text-base"></i>
            <span>我的收藏</span>
          </div>
          <span id="count-fav" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 font-mono">0</span>
        </button>

        <div class="pt-4 pb-1 px-3 text-[11px] font-bold tracking-wider text-slate-400 uppercase">快捷文法大類</div>

        <!-- 動態文法分類按鈕區 -->
        <div id="category-list" class="space-y-1">
          <!-- JS 會自動產生 -->
        </div>
      </div>
    </aside>

    <!-- 右側主內容 canvas -->
    <main id="main-content" class="flex-1 overflow-y-auto labs-grid-bg p-4 md:p-6 relative no-scrollbar">
      
      <!-- 卡片渲染區 -->
      <div id="cards-container" class="space-y-8 max-w-7xl mx-auto pb-24">
        <!-- JS 動態產生 -->
      </div>

      <!-- 右下角 Spedu Labs 太空人燈泡 w-72 巨型浮水印 -->
      <div class="fixed bottom-4 right-4 w-64 h-64 pointer-events-none opacity-[0.045] select-none z-0">
        <img src="spe-icon2.png" alt="Watermark" class="w-full h-full object-contain" onerror="this.style.display='none'">
      </div>
    </main>

  </div>

  <!-- JavaScript 資料庫與互動邏輯 -->
  <script>
    // 文法完整 29 題資料庫 (JSON 數據驅動)
    const grammarData = [
      { id: "g1", category: "基礎代名詞與常用語", title: "我、你、他 (主格)", desc: "我是...，自我介紹與主詞用法", filename: "grammer_I.html", themeColor: "#3B82F6" },
      { id: "g2", category: "基礎代名詞與常用語", title: "我、你、他 (受格)", desc: "動作的接受者 (love me, love him)", filename: "grammer_me.html", themeColor: "#3B82F6" },
      { id: "g3", category: "基礎代名詞與常用語", title: "我的、你的、他的 (所有格)", desc: "物品的主人 (my book, your dog)", filename: "grammer_my.html", themeColor: "#3B82F6" },
      { id: "g4", category: "基礎代名詞與常用語", title: "請給我... (禮貌句型)", desc: "Please give me... 的日常應用", filename: "grammer_please.html", themeColor: "#3B82F6" },
      { id: "g5", category: "基礎代名詞與常用語", title: "我會... (can/can't)", desc: "能力表達與日常簡答", filename: "grammer_can_cant.html", themeColor: "#3B82F6" },
      { id: "g6", category: "基礎代名詞與常用語", title: "你想要...嗎? (Would you like)", desc: "客氣的詢問與主動提議", filename: "grammer_would_you.html", themeColor: "#3B82F6" },
      
      { id: "g7", category: "名詞與單複數", title: "蘋果與複數名詞", desc: "名詞複數加 s 與計數 (two apples)", filename: "grammer_apples.html", themeColor: "#10B981" },
      { id: "g8", category: "名詞與單複數", title: "三明治與 es 結尾", desc: "字尾 ch, sh, s 加 es 的規則", filename: "grammer_sandwiches.html", themeColor: "#10B981" },
      { id: "g9", category: "名詞與單複數", title: "可數與不可數名詞", desc: "水、麵包與蘋果的本質區別", filename: "grammer_countable.html", themeColor: "#10B981" },
      
      { id: "g10", category: "基礎數字與應用", title: "數字 1-10 與小動物", desc: "基數 1-10 與量詞的結合", filename: "grammer_1_10.html", themeColor: "#8B5CF6" },
      { id: "g11", category: "基礎數字與應用", title: "數字 11-19 與年齡", desc: "十幾的數字與青少年年齡表達", filename: "grammer_11_19.html", themeColor: "#8B5CF6" },
      { id: "g12", category: "基礎數字與應用", title: "整十數字 (20, 30, 40...90)", desc: "幾十的數字與百位數基本念法", filename: "grammer_20_90.html", themeColor: "#8B5CF6" },
      { id: "g13", category: "基礎數字與應用", title: "第1、第2、第3 (序號)", desc: "序數用法與日期表達基礎", filename: "grammer_ordinal.html", themeColor: "#8B5CF6" },
      { id: "g14", category: "基礎數字與應用", title: "現在幾點鐘? (時間)", desc: "整點與幾點幾分的日常表達", filename: "grammer_time.html", themeColor: "#8B5CF6" },
      
      { id: "g15", category: "Be 動詞與現在簡單式", title: "我是、你是、他是 (am, are, is)", desc: "Be動詞的主詞搭配規律", filename: "grammar_be.html", themeColor: "#F59E0B" },
      { id: "g16", category: "Be 動詞與現在簡單式", title: "我不是、你不是 (否定句)", desc: "am not, aren't, isn't 縮寫", filename: "grammar_be_not.html", themeColor: "#F59E0B" },
      { id: "g17", category: "Be 動詞與現在簡單式", title: "你是嗎? (Be動詞問句)", desc: "Be動詞疑問句與簡答 (Are you...?)", filename: "grammar_be_ask.html", themeColor: "#F59E0B" },
      { id: "g18", category: "Be 動詞與現在簡單式", title: "我每天做... (現在簡單式)", desc: "日常習慣與第三人稱單數加 s/es", filename: "grammar_present.html", themeColor: "#F59E0B" },
      
      { id: "g19", category: "空間、時間與存在句", title: "東西在哪裡? (in, on, at)", desc: "基礎空間介系詞的具體感知", filename: "grammer_in_on_at_space.html", themeColor: "#6366F1" },
      { id: "g20", category: "空間、時間與存在句", title: "時間與日子 (in, on, at)", desc: "時間、特定日子與幾點鐘搭配", filename: "grammer_in_on_at_time.html", themeColor: "#6366F1" },
      { id: "g21", category: "空間、時間與存在句", title: "這裡有、那裡有 (There is/are)", desc: "某處存在某事物的存在句型", filename: "grammer_there_is_there_are.html", themeColor: "#6366F1" },
      
      { id: "g22", category: "過去式表達", title: "過去的狀態 (was, were)", desc: "過去狀態與位置 (I was busy yesterday.)", filename: "grammar_was_were.html", themeColor: "#F43F5E" },
      { id: "g23", category: "過去式表達", title: "過去做過嗎? (did, didn't)", desc: "過去問句與否定 (I didn't play soccer.)", filename: "grammar_did_didn_t.html", themeColor: "#F43F5E" },
      { id: "g24", category: "過去式表達", title: "規則動作過去式", desc: "動詞過去式加 ed 規則與字尾變化", filename: "grammar_Ved.html", themeColor: "#F43F5E" },
      { id: "g25", category: "過去式表達", title: "去過與看過 (不規則過去式)", desc: "常見不規則動詞 (went, saw, ate)", filename: "grammer_went_saw.html", themeColor: "#F43F5E" },
      
      { id: "g26", category: "形容詞比較與生活進階", title: "比一比 (比較級)", desc: "A比B更... (taller, bigger, more expensive)", filename: "grammar_comparative.html", themeColor: "#0EA5E9" },
      { id: "g27", category: "形容詞比較與生活進階", title: "最... (最高級)", desc: "班上最高、世界最大 (the tallest, the most)", filename: "grammar_superlative.html", themeColor: "#0EA5E9" },
      { id: "g28", category: "形容詞比較與生活進階", title: "花錢與花時間 (cost, spend, take)", desc: "主詞是人還是物？花費動詞三大解析", filename: "grammar_cost_spend_take.html", themeColor: "#0EA5E9" },
      { id: "g29", category: "形容詞比較與生活進階", title: "如果... (If 條件句)", desc: "如果明天下雨，我就... 的日常假設", filename: "grammar_if_conditional.html", themeColor: "#0EA5E9" }
    ];

    // 初始化收藏夾
    let favorites = JSON.parse(localStorage.getItem('grammar_favs')) || [];
    let currentFilter = 'all';

    // 取得所有不重複大類
    const categories = [...new Set(grammarData.map(item => item.category))];

    // 初始化側邊欄按鈕
    function initSidebar() {
      const container = document.getElementById('category-list');
      container.innerHTML = '';
      categories.forEach(cat => {
        const count = grammarData.filter(i => i.category === cat).length;
        const color = cat.includes('代名詞') ? '#3B82F6' : cat.includes('名詞') ? '#10B981' : cat.includes('數字') ? '#8B5CF6' : cat.includes('Be') ? '#F59E0B' : cat.includes('空間') ? '#6366F1' : cat.includes('過去') ? '#F43F5E' : '#0EA5E9';
        
        container.innerHTML += `
          <button onclick="filterCategory('${cat}')" id="btn-${cat}" class="w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100 transition-all">
            <div class="flex items-center space-x-2.5 min-w-0">
              <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span>
              <span class="truncate font-medium">${cat}</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 font-mono">${count}</span>
          </button>
        `;
      });
      updateCountBadges();
    }

    // 更新計數
    function updateCountBadges() {
      document.getElementById('count-all').innerText = grammarData.length;
      document.getElementById('count-fav').innerText = favorites.length;
    }

    // 手機懸浮選單開關控制
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
      setTimeout(() => overlay.classList.toggle('opacity-0'), 50);
    }

    menuToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    // 篩選與滾動機制
    function filterCategory(cat) {
      currentFilter = cat;
      
      // 更新側邊選單樣式狀態
      const buttons = sidebar.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.remove('bg-slate-200/80', 'text-slate-900', 'border-l-4', 'border-[#F59E0B]');
        btn.classList.add('text-slate-600');
      });

      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-slate-200/80', 'text-slate-900');
        if (cat !== 'all' && cat !== 'fav') {
          activeBtn.classList.add('border-l-4', 'border-[#F59E0B]');
        }
      }

      renderCards();

      // 手機端選完後自動把抽屜收摺
      if (window.innerWidth < 1024) {
        toggleSidebar();
      }

      // 平滑滾動
      if (cat !== 'all' && cat !== 'fav') {
        const targetElement = document.getElementById(`section-${cat}`);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        document.getElementById('main-content').scrollTop = 0;
      }
    }

    // 收藏星標開關
    function toggleFav(id, event) {
      event.stopPropagation();
      const index = favorites.indexOf(id);
      if (index === -1) {
        favorites.push(id);
      } else {
        favorites.splice(index, 1);
      }
      localStorage.setItem('grammar_favs', JSON.stringify(favorites));
      updateCountBadges();
      renderCards();
    }

    // 渲染卡片
    function renderCards() {
      const container = document.getElementById('cards-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      let filteredData = grammarData;
      if (currentFilter === 'fav') {
        filteredData = grammarData.filter(item => favorites.includes(item.id));
      } else if (currentFilter !== 'all') {
        filteredData = grammarData.filter(item => item.category === currentFilter);
      }

      if (searchQuery) {
        filteredData = filteredData.filter(item => 
          item.title.toLowerCase().includes(searchQuery) || 
          item.desc.toLowerCase().includes(searchQuery) ||
          item.filename.toLowerCase().includes(searchQuery)
        );
      }

      // 決定大類群組
      const activeCats = currentFilter === 'all' || currentFilter === 'fav'
        ? [...new Set(filteredData.map(item => item.category))]
        : [currentFilter];

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <i class="fa-regular fa-folder-open text-5xl mb-4"></i>
            <p class="text-sm">沒有找到任何對應的文法教材</p>
          </div>
        `;
        return;
      }

      activeCats.forEach(cat => {
        const catData = filteredData.filter(item => item.category === cat);
        if (catData.length === 0) return;

        const isPronoun = cat.includes('代名詞');
        const isNoun = cat.includes('名詞');
        const isNumber = cat.includes('數字');
        const isBe = cat.includes('Be');
        const isSpace = cat.includes('空間');
        const isPast = cat.includes('過去');
        
        const sectionBg = isPronoun ? 'bg-blue-500/5' : isNoun ? 'bg-emerald-500/5' : isNumber ? 'bg-purple-500/5' : isBe ? 'bg-amber-500/5' : isSpace ? 'bg-indigo-500/5' : isPast ? 'bg-rose-500/5' : 'bg-sky-500/5';
        const titleColor = isPronoun ? 'text-blue-700' : isNoun ? 'text-emerald-700' : isNumber ? 'text-purple-700' : isBe ? 'text-amber-700' : isSpace ? 'text-indigo-700' : isPast ? 'text-rose-700' : 'text-sky-700';

        let sectionHtml = `
          <div id="section-${cat}" class="${sectionBg} border border-slate-200/60 p-6 rounded-2xl transition-all">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
              <h2 class="text-lg font-bold flex items-center space-x-2 ${titleColor}">
                <i class="fa-solid fa-brain"></i>
                <span>${cat}</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200/80 text-slate-600 font-mono">${catData.length}</span>
              </h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        `;

        catData.forEach(item => {
          const isStarred = favorites.includes(item.id);
          const starClass = isStarred ? 'fa-solid text-amber-500' : 'fa-regular text-slate-300 hover:text-amber-500';

          sectionHtml += `
            <div onclick="window.open('${item.filename}', '_blank')" class="group relative bg-white border border-slate-200 hover:border-slate-300 rounded-xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-all cursor-pointer h-[112px]">
              <div class="flex items-start justify-between">
                <span class="text-base font-black text-slate-800 line-clamp-1 group-hover:text-slate-900 transition-colors">
                  ${item.title}
                </span>
                <button onclick="toggleFav('${item.id}', event)" class="focus:outline-none p-1 rounded hover:bg-slate-100">
                  <i class="${starClass} fa-star text-sm"></i>
                </button>
              </div>
              <p class="text-slate-400 text-xs line-clamp-1 mt-1 flex-1">
                ${item.desc}
              </p>
              <div class="text-[11px] text-slate-400 font-mono tracking-wide mt-2">
                ${item.filename}
              </div>
              <div class="absolute left-0 top-3 bottom-3 w-1 rounded-r-full" style="background-color: ${item.themeColor}"></div>
            </div>
          `;
        });

        sectionHtml += `</div></div>`;
        container.innerHTML += sectionHtml;
      });
    }

    // 監聽搜尋
    document.getElementById('search-input').addEventListener('input', renderCards);

    // 啟動載入
    window.onload = () => {
      initSidebar();
      filterCategory('all');
    };
  </script>
</body>
</html>
