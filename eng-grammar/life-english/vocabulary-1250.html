ns":["飯廳","陽臺","客廳","浴室"],"answer":2},{"id":1225,"word":"dining room","options":["客廳","花園","飯廳","庭院"],"answer":2},{"id":1226,"word":"department store","options":["郵局","便利商店","百貨商店","銀行"],"answer":2},{"id":1227,"word":"pumpkin","options":["萵苣","甘藍菜","南瓜","番茄"],"answer":2},{"id":1228,"word":"Halloween","options":["萬聖節","端午節","教師節","感恩節"],"answer":0},{"id":1229,"word":"French fries","options":["炸薯條","三明治","巧克力","比薩餅"],"answer":0},{"id":1230,"word":"inline skates","options":["滑雪用品","直排輪鞋","足球球門","羽球球拍"],"answer":1},{"id":1231,"word":"hard-working","options":["愚笨的","勤勉的","粗魯的","溫和的"],"answer":1},{"id":1232,"word":"roller-skate","options":["列出來","聞起來","溜滑輪","站起來"],"answer":2},{"id":1233,"word":"thirtieth","options":["第四十的","第五十的","第三十的","第二十的"],"answer":2},{"id":1234,"word":"dumpling","options":["熱狗","乳酪","雞肉","餃子"],"answer":3},{"id":1235,"word":"refrigerator","options":["照相機","收音機","烘乾機","電冰箱"],"answer":3},{"id":1236,"word":"businessman","options":["商人","工人","船員","作家"],"answer":0},{"id":1237,"word":"mathematics","options":["體育","地理","中文","數學"],"answer":3},{"id":1238,"word":"spaghetti","options":["三明治","義大利麵","小圓麵包","炸薯條"],"answer":1},{"id":1239,"word":"centimeter","options":["公克","公斤","公分","公升"],"answer":2},{"id":1240,"word":"Teachers’ Day","options":["端午節","教師節","感恩節","萬聖節"],"answer":1},{"id":1241,"word":"New Year's Eve","options":["跨年夜","情人節","聖誕節","教師節"],"answer":0},{"id":1242,"word":"New Year's Day","options":["除夕","國慶","春節","元旦"],"answer":3},{"id":1243,"word":"physical education","options":["中文","科學","地理","體育"],"answer":3},{"id":1244,"word":"elementary school","options":["高中","小學","大學","國中"],"answer":1},{"id":1245,"word":"junior high school","options":["高中","小學","大學","國中"],"answer":3},{"id":1246,"word":"senior high school","options":["大學","高中","國中","小學"],"answer":1},{"id":1247,"word":"helmet","options":["安全帽","棒球帽","毛線帽","遮陽帽"],"answer":0},{"id":1248,"word":"password","options":["帳號","密碼","網址","信箱"],"answer":1},{"id":1249,"word":"yogurt","options":["果汁","汽水","優格","豆漿"],"answer":2},{"id":1250,"word":"recycle","options":["丟棄","分配","修理","回收"],"answer":3}]</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("question-data").textContent);
  const LAST_SLIDE = Math.ceil(DATA.length / 15);
  const PAPER_COUNT = Math.ceil(DATA.length / 30) + 1;
  const STORE = "sinny-vocabulary1250-v1";
  const $ = id => document.getElementById(id);
  const esc = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l5-4v16l-5-4H3V8zm12-1.5a7 7 0 0 1 0 11l-1.3-1.6a5 5 0 0 0 0-7.8L15 6.5zm3-3a11 11 0 0 1 0 17l-1.3-1.6a9 9 0 0 0 0-13.8L18 3.5z"/></svg>';
  let slide = 0, answers = {}, graded = {}, eliminated = {}, reveals = {};
  let speechToken = 0, activeSpeech = null, activeWord = null, speechTimer = null;
  let printMode = "student", noticeTimer;
  function inform(message){clearTimeout(noticeTimer);$("status").textContent=message||"";$("status").hidden=!message;if(message)noticeTimer=setTimeout(()=>$("status").hidden=true,4200);}
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved?.version === 1) {
      slide = Number.isInteger(saved.slide) ? Math.max(0, Math.min(LAST_SLIDE, saved.slide)) : 0;
      for (const q of DATA) {
        const a = saved.answers?.[q.id];
        if (Number.isInteger(a) && a >= 0 && a <= 3) answers[q.id] = a;
        if (saved.graded?.[q.id] && a === q.answer) graded[q.id] = true;
        const removed = saved.eliminated?.[q.id];
        if (Array.isArray(removed)) eliminated[q.id] = removed.filter(i => Number.isInteger(i) && i >= 0 && i < 4 && i !== q.answer && i !== a);
      }
    }
  } catch {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify({version:1,slide,answers,graded,eliminated})); } catch {} }
  function visible() { return slide ? DATA.slice((slide - 1) * 15, slide * 15) : []; }
  function paperNumber() { return slide ? Math.floor((slide - 1) / 2) + 2 : 1; }
  function paperRange(page) { const start=(page-2)*30+1; return [start, Math.min(start+29,DATA.length)]; }
  function paperLabel(page) { if (page === 1) return "第 1 頁｜封面"; const [a,b]=paperRange(page); return `第 ${page} 頁｜第 ${a}～${b} 題`; }
  function cover() {
    const tables = Array.from({length:3},(_,col)=>'<table><thead><tr><th scope="col">頁</th><th scope="col">得分</th><th scope="col">訂正</th></tr></thead><tbody>'+Array.from({length:14},(_,row)=>`<tr><th scope="row">${2+col*14+row}</th><td></td><td></td></tr>`).join("")+"</tbody></table>").join("");
    return `<div class="cover-content"><h2>1250 單字小考題本</h2><p class="identity">班級：________　姓名：_______________</p><div class="instructions"><p>使用方法：1. 背誦後用藍筆自行默寫</p><p>　　　　　2. 用黑筆翻書查找答案</p><p>　　　　　3. 批改後用紅筆訂正中英文各一次</p></div><div class="score-tables">${tables}</div><div class="cover-total"><span>總分：____________</span><span>加章：____________</span></div><button class="cover-start" type="button" data-start>開始第 2 頁｜第 1～15 題 →</button></div>`;
  }
  function footer(page) { return `<footer class="paper-footer"><span class="folio">${page}</span><span>日期__________</span><span>得分__________</span></footer>`; }
  function question(q, first) {
    const opts = q.options.map((label,i)=>{
      const selected=answers[q.id]===i, correct=selected && graded[q.id], answer=reveals[slide] && i===q.answer, gone=false;
      const cls=["option",selected?"selected":"",correct?"correct":"",answer?"answer":"",gone?"eliminated":""].filter(Boolean).join(" ");
      return `<button class="${cls}" type="button" data-question="${q.id}" data-option="${i}" aria-pressed="${selected}" aria-label="第 ${q.id} 題，${String.fromCharCode(65+i)}，${esc(label)}${answer?'，正確答案':correct?'，答對':''}" ${gone?'disabled aria-hidden="true"':''}><span class="letter">(${String.fromCharCode(65+i)})</span><span class="option-label">${esc(label)}</span></button>`;
    }).join("");
    const responseIndex=reveals[slide]?q.answer:answers[q.id];
    const responseClass=reveals[slide]?"answer":graded[q.id]?"correct":answers[q.id]!==undefined?"selected":"";
    const response=`<span class="response ${responseClass}" aria-label="第 ${q.id} 題答案 ${responseIndex===undefined?'未作答':String.fromCharCode(65+responseIndex)}">(<span class="chosen">${responseIndex===undefined?'　':String.fromCharCode(65+responseIndex)}</span>)</span>`;
    return `<div class="question" data-id="${q.id}">${first?`<button class="group-speak" type="button" data-speak-group="${q.id}" aria-label="依序朗讀第 ${q.id}～${Math.min(q.id+4,DATA.length)} 題五個單字" title="連續朗讀這五個單字">${SPEAKER}</button>`:'<span aria-hidden="true"></span>'}<span class="number">${q.id}.</span>${response}<button class="word" type="button" data-speak-word="${q.id}" title="點讀單字" aria-label="朗讀 ${esc(q.word)}">${esc(q.word)}</button><div class="options" role="group" aria-label="第 ${q.id} 題選項">${opts}</div></div>`;
  }
  function render(message) {
    const list=visible(), page=paperNumber();
    $("page-title").textContent=slide?`第 ${page} 頁・${slide%2?'上':'下'}半｜第 ${list[0].id}～${list.at(-1).id} 題`:"第 1 頁｜封面";
    $("screen").innerHTML=slide?Array.from({length:Math.ceil(list.length/5)},(_,i)=>`<section class="screen-group" aria-label="第 ${list[i*5].id}～${list[Math.min(i*5+4,list.length-1)].id} 題">${list.slice(i*5,i*5+5).map((q,j)=>question(q,j===0)).join("")}</section>`).join(""):cover();
    for(const id of ["grade","clear","reveal"]) $(id).disabled=!slide;
    $("reveal").setAttribute("aria-pressed",String(!!reveals[slide]));
    $("reveal").textContent=reveals[slide]?"隱藏解答":"解答";
    $("previous").disabled=slide===0;$("next").disabled=slide===LAST_SLIDE;
    $("page-info").textContent=slide?`${paperLabel(page)} · 共 ${PAPER_COUNT} 頁`:`共 ${PAPER_COUNT} 個紙本頁面 · 點「下一頁」開始`;
    inform(message);
    updateSpeechMarks();
  }
  function go(next) { stopSpeech();slide=Math.max(0,Math.min(LAST_SLIDE,next));save();render();window.scrollTo({top:0,behavior:"instant"}); }
  $("screen").addEventListener("click",event=>{
    const option=event.target.closest("[data-option]");
    if(option && !option.disabled){const id=Number(option.dataset.question);answers[id]=Number(option.dataset.option);delete graded[id];save();render();document.querySelector(`[data-question="${id}"][data-option="${answers[id]}"]`)?.focus({preventScroll:true});return;}
    const word=event.target.closest("[data-speak-word]");if(word){const id=Number(word.dataset.speakWord);speak([DATA[id-1]],`word-${id}`);return;}
    const group=event.target.closest("[data-speak-group]");if(group){const id=Number(group.dataset.speakGroup);speak(DATA.slice(id-1,id+4),`group-${id}`);return;}
    if(event.target.closest("[data-start]"))go(1);
  });
  $("grade").addEventListener("click",()=>{
    let right=0,wrong=0,blank=0;
    for(const q of visible()) {const a=answers[q.id];if(a===undefined){blank++;continue;}if(a===q.answer){graded[q.id]=true;right++;}else{delete answers[q.id];delete graded[q.id];wrong++;}}
    save();render(`本次批改：答對 ${right} 題，需再試 ${wrong} 題，未作答 ${blank} 題。${wrong?'錯誤作答已清空，可重新選答。':''}`);
  });
  $("clear").addEventListener("click",()=>{for(const q of visible()){delete answers[q.id];delete graded[q.id];delete eliminated[q.id];}delete reveals[slide];save();render("已清空目前畫面的作答、批改與解答。");});
  $("reveal").addEventListener("click",()=>{reveals[slide]=!reveals[slide];render(reveals[slide]?"已顯示目前畫面的正確答案；不會改動你的作答。":"已隱藏解答。");});
  $("previous").addEventListener("click",()=>go(slide-1));$("next").addEventListener("click",()=>go(slide+1));
  $("toc-button").addEventListener("click",()=>{
    $("toc-list").innerHTML=Array.from({length:PAPER_COUNT},(_,i)=>`<button class="toc-entry" type="button" data-page="${i+1}" ${i+1===paperNumber()?'aria-current="page"':''}>${paperLabel(i+1)}</button>`).join("");
    $("toc-dialog").showModal();$("toc-list").querySelector('[aria-current="page"]')?.scrollIntoView({block:"nearest"});
  });
  $("toc-list").addEventListener("click",event=>{const button=event.target.closest("[data-page]");if(!button)return;const page=Number(button.dataset.page);$("toc-dialog").close();go(page===1?0:(page-2)*2+1);});
  document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",()=>$(button.dataset.close).close()));
  function updateSpeechMarks() {
    document.querySelectorAll("[data-speak-word]").forEach(button=>{const active=Number(button.dataset.speakWord)===activeWord;button.classList.toggle("speaking",active);button.setAttribute("aria-pressed",String(active));});
    document.querySelectorAll("[data-speak-group]").forEach(button=>{const active=activeSpeech===`group-${button.dataset.speakGroup}`;button.classList.toggle("speaking",active);button.setAttribute("aria-pressed",String(active));});
    $("stop-speech").hidden=!activeSpeech;
  }
  function stopSpeech(){speechToken++;clearTimeout(speechTimer);if("speechSynthesis" in window)window.speechSynthesis.cancel();activeSpeech=null;activeWord=null;updateSpeechMarks();}
  function speak(words,source){
    if(activeSpeech===source){stopSpeech();return;}
    stopSpeech();
    if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)){inform("此瀏覽器不支援語音朗讀，請改用支援語音的瀏覽器。");return;}
    const synth=window.speechSynthesis, token=speechToken;
    activeSpeech=source;activeWord=words[0].id;updateSpeechMarks();
    let text="";const offsets=[];
    for(const q of words){offsets.push({start:text.length,id:q.id});text+=q.word+". ";}
    const utterance=new SpeechSynthesisUtterance(text.trim());utterance.lang="en-US";utterance.rate=.9;
    const voices=synth.getVoices();const english=voices.filter(v=>/^en/i.test(v.lang));
    const voice=english.find(v=>v.localService&&/^en[-_]US$/i.test(v.lang))||english.find(v=>v.localService)||english.find(v=>/^en[-_]US$/i.test(v.lang))||english[0];
    if(voice)utterance.voice=voice;
    // Retain the utterance while speaking; one request reads all five words.
    window.__vocabularyUtterance=utterance;
    utterance.onboundary=event=>{if(token!==speechToken)return;const match=offsets.filter(item=>item.start<=event.charIndex).at(-1);if(match){activeWord=match.id;updateSpeechMarks();}};
    utterance.onend=()=>{if(token!==speechToken)return;activeSpeech=null;activeWord=null;window.__vocabularyUtterance=null;updateSpeechMarks();};
    utterance.onerror=event=>{if(token!==speechToken)return;stopSpeech();if(!["canceled","interrupted"].includes(event.error))inform("朗讀未成功，請確認裝置的英文語音，或重新點讀。");};
    if(synth.paused)synth.resume();
    synth.speak(utterance);
  }
  $("stop-speech").addEventListener("click",stopSpeech);
  window.addEventListener("pagehide",stopSpeech);
  function printRow(q) {return `<div class="print-row" data-print-id="${q.id}"><span class="print-number">${q.id}.</span><span class="print-blank">(${printMode==="teacher"?String.fromCharCode(65+q.answer):"　"})</span><span class="print-word">${esc(q.word)}</span><div class="print-options">${q.options.map((label,i)=>`<span class="print-option"><b>(${String.fromCharCode(65+i)})</b><span>${esc(label)}</span></span>`).join("")}</div></div>`;}
  function buildPrint(){
    const pages=Array.from({length:PAPER_COUNT},(_,i)=>i+1);
    $("print-root").className=printMode==="teacher"?"print-teacher":"print-student";
    $("print-root").innerHTML=pages.map(page=>{
      if(page===1)return `<section class="paper cover-paper" data-paper="1">${cover()}${footer(1)}</section>`;
      const [start,end]=paperRange(page);const list=DATA.slice(start-1,end);
      const groups=Array.from({length:Math.ceil(list.length/5)},(_,i)=>`<div class="print-group">${list.slice(i*5,i*5+5).map(printRow).join("")}</div>`).join("");
      return `<section class="paper" data-paper="${page}"><div class="print-questions">${groups}</div>${footer(page)}</section>`;
    }).join("");
  }
  function closePrintMenu(){$("print-menu").hidden=true;$("print-button").setAttribute("aria-expanded","false");}
  $("print-button").addEventListener("click",()=>{const open=$("print-menu").hidden;$("print-menu").hidden=!open;$("print-button").setAttribute("aria-expanded",String(open));});
  document.querySelectorAll("[data-print]").forEach(button=>button.addEventListener("click",()=>{printMode=button.dataset.print;closePrintMenu();stopSpeech();buildPrint();window.print();}));
  document.addEventListener("click",event=>{if(!event.target.closest(".print-wrap"))closePrintMenu();});
  document.addEventListener("keydown",event=>{if(event.key==="Escape")closePrintMenu();});
  window.addEventListener("beforeprint",()=>{stopSpeech();buildPrint();});
  window.addEventListener("afterprint",()=>{printMode="student";});
  render();
})();
</script>
