<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文法主題互動式電子講義｜Topic 測試統整區</title>
  <style>
    :root{--navy:#17324d;--blue:#214d70;--line:#cbd8e1;--paper:#f4f7f9;--text:#20374d;--bar-height:54px}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;grid-template-rows:var(--bar-height) minmax(0,1fr);background:var(--paper);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    .shell-bar{display:grid;grid-template-columns:minmax(230px,360px) minmax(130px,1fr) auto;align-items:center;gap:12px;min-width:0;padding:6px 12px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
    .picker-wrap{position:relative;min-width:0}
    .picker-label{position:absolute;top:-7px;left:11px;padding:0 5px;background:var(--navy);color:#c9d9e6;font-size:11px;font-weight:800}
    #topic-picker{width:100%;height:38px;min-width:0;padding:0 36px 0 12px;border:1px solid #8fb1c8;border-radius:9px;background:#fff;color:var(--navy);font:800 15px/1.2 inherit;cursor:pointer}
    .current-title{min-width:0;overflow:hidden;font-size:clamp(14px,1.45vw,20px);font-weight:900;text-overflow:ellipsis;white-space:nowrap}
    .current-title small{display:block;color:#c2d3df;font-size:10px;letter-spacing:.08em}
    .shell-actions{display:flex;align-items:center;gap:7px}
    .shell-action{height:36px;padding:0 10px;border:1px solid #ffffff60;border-radius:9px;background:#ffffff1c;color:#fff;font:800 13px/1 inherit;white-space:nowrap;cursor:pointer}
    .shell-action:hover{background:#ffffff33}
    #topic-picker:focus-visible,.shell-action:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
    .viewer{position:relative;min-width:0;min-height:0;margin:4px;overflow:hidden;border:1px solid var(--line);background:#fff}
    #topic-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .notice{position:absolute;inset:50% auto auto 50%;width:min(510px,calc(100% - 32px));transform:translate(-50%,-50%);padding:22px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#607386;text-align:center;font-weight:800;box-shadow:0 12px 32px #1f374b20}
    .notice[hidden]{display:none}
    @media(max-width:820px){:root{--bar-height:88px}.shell-bar{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:38px 30px;gap:5px 8px;padding:6px 8px}.picker-wrap{grid-column:1;grid-row:1}.current-title{grid-column:1/-1;grid-row:2;font-size:14px;padding-right:148px}.current-title small{display:none}.shell-actions{grid-column:2;grid-row:1/3;align-self:end;gap:4px}.shell-action{width:36px;padding:0;font-size:0}.shell-action::before{font-size:19px}.shell-action[data-action="home"]::before{content:"⌂"}.shell-action[data-action="reload"]::before{content:"↻"}.shell-action[data-action="open"]::before{content:"↗"}}
    @media(max-width:480px){.current-title{padding-right:0}.viewer{margin:2px}}
    @media print{.shell-bar,.notice{display:none!important}body{display:block;height:auto;overflow:visible}.viewer{margin:0;border:0;overflow:visible}#topic-frame{height:100vh}}
  </style>
</head>
<body>
  <header class="shell-bar" aria-label="Topic 教材工具列">
    <div class="picker-wrap"><label class="picker-label" for="topic-picker">切換文法主題</label><select id="topic-picker" aria-label="切換文法主題"></select></div>
    <div class="current-title" id="current-title" aria-live="polite"><small>文法主題互動式電子講義｜Topic 測試統整區</small><span>正在建立目錄</span></div>
    <nav class="shell-actions" aria-label="頁面操作">
      <button class="shell-action" type="button" data-action="home" title="返回生活英文與文法首頁" aria-label="返回生活英文與文法首頁">返回首頁</button>
      <button class="shell-action" type="button" data-action="reload" title="重新載入目前教材" aria-label="重新載入目前教材">重新載入</button>
      <button class="shell-action" type="button" data-action="open" title="在新視窗開啟原始教材" aria-label="在新視窗開啟原始教材">另開原頁</button>
    </nav>
  </header>
  <main class="viewer">
    <div class="notice" id="notice">正在建立 Topic 教材目錄……</div>
    <iframe id="topic-frame" title="文法主題教材內容"></iframe>
  </main>
  <script src="topic/topic-manifest.js"></script>
  <script>
    (()=>{
      "use strict";
      const API="https://api.github.com/repos/Sinny-Hong/spedu-labs/contents/eng-grammar/topic?ref=main";
      const KEY="spedu-topic-last-file";
      const BASE="topic/";
      const fallback=Array.isArray(window.TOPIC_MANIFEST)?window.TOPIC_MANIFEST:[];
      const picker=document.getElementById("topic-picker");
      const frame=document.getElementById("topic-frame");
      const title=document.querySelector("#current-title span");
      const notice=document.getElementById("notice");
      let items=[];
      const eligible=name=>/\.html$/i.test(name)&&!/^(index|library)/i.test(name)&&!/^[._~]/.test(name)&&!/(backup|bak|copy|temp|tmp|備份)/i.test(name);
      const sort=(a,b)=>a.file.localeCompare(b.file,undefined,{numeric:true,sensitivity:"base"});
      const itemByFile=file=>items.find(item=>item.file===file)||null;
      function lastFile(){try{return localStorage.getItem(KEY)}catch{return null}}
      function remember(file){try{localStorage.setItem(KEY,file)}catch{}}
      async function readTitle(file){
        try{const response=await fetch(BASE+encodeURIComponent(file),{cache:"no-store"});if(!response.ok)throw Error(response.status);const html=await response.text();return new DOMParser().parseFromString(html,"text/html").title.trim()||file.replace(/\.html$/i,"")}
        catch{return fallback.find(item=>item.file===file)?.title||file.replace(/\.html$/i,"")}
      }
      async function discover(){
        if(!/^https?:$/.test(location.protocol))return fallback.slice().sort(sort);
        try{const response=await fetch(API,{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});if(!response.ok)throw Error(response.status);const entries=await response.json();const files=entries.filter(entry=>entry.type==="file"&&eligible(entry.name)).map(entry=>entry.name);return(await Promise.all(files.map(async file=>({file,title:await readTitle(file)})))).sort(sort)}
        catch(error){console.warn("Topic 即時目錄無法載入，改用備援清單。",error);return fallback.slice().sort(sort)}
      }
      function load(item){
        if(!item){notice.textContent="Topic 資料夾目前沒有可顯示的 HTML 教材。";notice.hidden=false;title.textContent="尚無教材";return}
        notice.textContent="正在載入教材……";notice.hidden=false;picker.value=item.file;title.textContent=item.title;frame.title=item.title;remember(item.file);frame.src=BASE+encodeURIComponent(item.file);
      }
      picker.addEventListener("change",()=>load(itemByFile(picker.value)));
      frame.addEventListener("load",()=>{notice.hidden=true});
      document.querySelector('[data-action="home"]').addEventListener("click",()=>{location.href="index.html"});
      document.querySelector('[data-action="reload"]').addEventListener("click",()=>{const item=itemByFile(picker.value);if(item)load(item)});
      document.querySelector('[data-action="open"]').addEventListener("click",()=>{const item=itemByFile(picker.value);if(item)window.open(BASE+encodeURIComponent(item.file),"_blank","noopener")});
      (async()=>{items=await discover();for(const item of items){const option=document.createElement("option");option.value=item.file;option.textContent=item.title;picker.append(option)}load(itemByFile(lastFile())||items[0]||null)})();
    })();
  </script>
</body>
</html>
