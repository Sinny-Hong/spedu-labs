<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-City｜異想電影院 (16單元母版 - 漢堡店對開規格)</title>

<style>
:root{
  --navy:#1C2833;
  --gold:#D4AF37;
  --page-bg:#E8EDF1;
  --soft:#F2F4F4;
  --line:#D6E2EC;
  --text:#173552;
  --blue:#2879BA;
  --blue-soft:#EAF4FC;
  --green:#218653;
  --green-soft:#E7F5ED;
  --red:#C62828;
  --hint:#FFF0A6;
  --hint-line:#F1C44A;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg);color:var(--text);
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  padding:18px 0 40px;
}
button{font:inherit}

/* =========================================================
   FLOATING NAV & PRINT WIDGET (右上角浮動收折導覽與列印選單)
========================================================= */
.floating-widget{
  position:fixed;right:16px;top:16px;z-index:1000;
  background:white;border:1px solid #C8D5E0;border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
.widget-header{
  background:var(--navy);color:white;padding:10px 14px;font-weight:900;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  font-size:14px;user-select:none;gap:10px;
}
.widget-body{
  padding:12px;display:flex;flex-direction:column;gap:10px;background:white;
  max-height:80vh;overflow-y:auto;
}
.widget-body.collapsed{display:none;}
.nav-section-title{
  font-size:12px;font-weight:900;color:#647789;margin-bottom:4px;border-bottom:1px solid var(--line);padding-bottom:2px;
}
.nav-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:4px;}
.nav-grid button{
  padding:6px 4px;border:1px solid #C8D5E0;border-radius:6px;background:white;
  color:var(--navy);font-size:12px;font-weight:900;cursor:pointer;text-align:center;
}
.nav-grid button:hover{background:var(--blue-soft);border-color:var(--blue);}
.print-select-wrap{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.print-select-wrap select{
  padding:8px;border:1px solid #C8D5E0;border-radius:8px;font-weight:900;color:var(--navy);background:white;cursor:pointer;
}
.print-action-btn{
  background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:9px;font-weight:900;cursor:pointer;text-align:center;
}
.print-action-btn:hover{background:#b89528;}

/* =========================================================
   A4 PORTRAIT (雙欄半頁 A4)
========================================================= */
.sheet{
  width:210mm;height:297mm;margin:0 auto 18px;padding:7mm 8mm;
  background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.12);
  overflow:hidden;display:grid;grid-template-rows:1fr 1fr;gap:5mm;
  page-break-after:always;
}
.sheet:last-child{page-break-after:auto;}

.level-block{
  min-height:0;display:flex;flex-direction:column;overflow:hidden;
}
.level-block:first-child{
  padding-bottom:2.5mm;border-bottom:1.5px dashed #D5E0E9;
}

/* =========================================================
   HEADER
========================================================= */
.level-header{
  min-height:12mm;display:flex;align-items:center;justify-content:space-between;
  gap:5mm;margin-bottom:2mm;
}
.level-title{margin:0;color:var(--navy);font-size:16.5pt;line-height:1;font-weight:900;white-space:nowrap;}
.student-info{display:flex;align-items:center;gap:3mm;color:#273E52;font-size:14pt;font-weight:700;white-space:nowrap;}
.info-line{display:inline-block;min-width:25mm;height:5mm;border-bottom:1.4px solid #647789;}
.name-line{min-width:36mm;}

/* =========================================================
   CONTENT (50:50 嚴格對開比照漢堡店)
========================================================= */
.level-content{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4mm;
}
.left-side,.right-side{min-width:0;min-height:0;}
.left-side{display:grid;grid-template-rows:52mm 1fr;gap:2.5mm;}

/* =========================================================
   SCHEDULE TABLE (比照選單盒子)
========================================================= */
.schedule-box{
  min-height:0;overflow:hidden;border:1.5px solid var(--navy);border-radius:3mm;background:white;
}
.schedule-title{
  height:7mm;display:flex;align-items:center;justify-content:center;
  background:var(--navy);color:white;font-size:10.5pt;font-weight:900;letter-spacing:0.5px;
}
.schedule-table{
  width:100%;height:calc(100% - 7mm);border-collapse:collapse;table-layout:fixed;
}
.schedule-table th, .schedule-table td{
  padding:1.5px 4px;border-bottom:1px solid var(--line);font-size:9.5pt;font-weight:bold;text-align:center;vertical-align:middle;
}
.schedule-table th{
  background:var(--soft);color:var(--navy);font-size:9pt;border-right:1px solid var(--line);
}
.schedule-table td{
  border-right:1px dashed var(--line);
}
.schedule-table tr:last-child td{border-bottom:none;}
.schedule-table th:first-child, .schedule-table td:first-child{
  width:40%;text-align:left;padding-left:6px;border-right:1px solid var(--line);
}
.schedule-table th:last-child, .schedule-table td:last-child{border-right:none;}
.m-icon{font-size:11pt;margin-right:2px;vertical-align:middle;}
.m-name{vertical-align:middle;font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;font-size:9.5pt;font-weight:bold;}

/* =========================================================
   DIALOGUE
========================================================= */
.dialogue-section{min-height:0;display:flex;flex-direction:column;}
.dialogue-title{
  margin:0 0 1.5mm;padding:1.4mm 2.2mm;color:var(--navy);background:var(--soft);
  border:1px solid var(--line);border-radius:2.5mm;font-size:12pt;line-height:1;font-weight:900;
}
.dialogue-content{flex:1;min-height:0;overflow:hidden;padding:.6mm 1.5mm 0;}
.dialogue-line{
  display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:2mm;
  margin-bottom:1.35mm;font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;
  font-size:12.5pt;line-height:1.28;
}
.dialogue-line:last-child{margin-bottom:0;}
.speaker{font-weight:900;white-space:nowrap;}
.speech{min-width:0;overflow-wrap:anywhere;}
.long-dialogue .dialogue-line{font-size:11.2pt;line-height:1.22;margin-bottom:0.9mm;}

/* =========================================================
   QUESTIONS (一律 5 題，比照漢堡店)
========================================================= */
.right-side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
.question-head{
  min-height:9mm;display:flex;align-items:center;justify-content:space-between;
  gap:2mm;padding:1.2mm 2mm;margin-bottom:1.5mm;background:var(--soft);
  border:1px solid var(--line);border-radius:2.5mm;width:100%;
}
.question-title-wrap{display:flex;align-items:center;gap:2mm;min-width:0;}
.question-title{margin:0;color:var(--navy);font-size:12pt;font-weight:900;}
.score{min-width:11mm;color:var(--green);font-size:10.5pt;font-weight:900;text-align:center;}

.tools{display:flex;align-items:center;gap:.8mm;flex-shrink:0;}
.tools button{
  padding:1mm 1.6mm;border:1px solid #BFCFDE;border-radius:6px;
  background:white;color:var(--navy);font-size:8pt;font-weight:900;cursor:pointer;
}
.tools button.active{color:#875100;background:#FFF2D7;border-color:var(--gold);}

.questions{
  flex:1;min-width:0;min-height:0;overflow:hidden;padding:0 .5mm;
  font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;
}
.question{min-width:0;margin-bottom:1.4mm;}
.question:last-child{margin-bottom:0;}

.q-row{
  display:grid;grid-template-columns:11mm minmax(0,1fr);column-gap:1mm;
  align-items:start;min-width:0;font-size:11.5pt;line-height:1.22;font-weight:800;
}
.answer-slot{white-space:nowrap;text-align:right;}
.answer-letter{display:inline-block;min-width:3.5mm;color:var(--blue);font-weight:900;}
.answer-letter.correct{color:var(--green);}
.answer-letter.solution{color:var(--red);}
.q-text{min-width:0;overflow-wrap:anywhere;}

/* =========================================================
   OPTIONS (比照漢堡店雙欄整齊佈局)
========================================================= */
.options{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:.6mm 2mm;min-width:0;margin-top:.6mm;margin-left:13mm;
}
.option{
  min-width:0;padding:.4mm 1mm;border:1px solid transparent;border-radius:5px;
  font-size:9.8pt;line-height:1.18;cursor:pointer;overflow-wrap:anywhere;
}
.option-inner{display:block;min-width:0;padding-left:5.5mm;text-indent:-5.5mm;}
.option:hover{background:var(--blue-soft);}
.option.selected{color:var(--navy);background:var(--blue-soft);border-color:#6CA6D3;}
.option.correct{color:var(--green);background:var(--green-soft);border-color:#8BC4A3;font-weight:900;}
.option.solution{color:var(--red);background:#FDEDEC;border-color:var(--red);font-weight:900;}

/* =========================================================
   提示效果 (HINT STYLES)
========================================================= */
.hint-word{
  border-radius:3px;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}
.hint-on .hint-word{
  background: var(--hint) !important;
  box-shadow: inset 0 -2px 0 var(--hint-line) !important;
  color: #875100;
}

/* =========================================================
   FOOTER
========================================================= */
.footer{
  display:flex;justify-content:space-between;align-items:center;
  font-size:8pt;color:#788896;padding-top:1.5mm;margin-top:auto;
}
.footer .credit{
  margin-left:auto;text-align:right;font-size:7.5pt;letter-spacing:.2px;
}

/* =========================================================
   TEACHER ANSWER MODE
========================================================= */
body.teacher-mode .answer-letter{
  color: var(--red) !important;
  font-weight: 900 !important;
}
body.teacher-mode .answer-letter::after{
  content: attr(data-ans);
}

/* =========================================================
   PRINT
========================================================= */
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{width:210mm;margin:0;padding:0;background:white;}
  .floating-widget{display:none !important;}
  .sheet{width:210mm;height:297mm;margin:0;box-shadow:none;}
  .tools,.score{display:none !important;}
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   原始 4 等級基礎原型 (含 L3 遲到情境與 L4 半價優惠/片長推算)

const baseLevels = [

    {stem:"What time does Mary choose to watch the movie?", options:["12:30 PM", "09:15 AM", "03:45 PM", "10:00 AM"], answer:0},
    {stem:"How many tickets does Mary buy?", options:["Two", "One", "Three", "Four"], answer:0},
    {stem:"What is Time 3 for Space King?", options:["03:45 PM", "12:30 PM", "09:15 AM", "02:30 PM"], answer:0},
    {stem:"Does Mary buy tickets for 09:15 AM?", options:["No, she doesn't.", "Yes, she does.", "Maybe.", "I don't know."], answer:0}
  ]
},
{
  lvl: "L3",
  schedule:[
    ["🤖","Robot War",   ["09:00 AM", "01:30 PM", "04:30 PM"]],
    ["🦖","Dino Movie",  ["10:00 AM", "01:00 PM", "05:00 PM"]],
    ["🪄","Magic School",["11:00 AM", "02:00 PM", "05:30 PM"]],
    ["🐶","Super Puppy", ["11:30 AM", "02:30 PM", "06:00 PM"]]
  ],
  dialogue:[
    ["Kevin", "Stan and I are here to watch Robot War, but it is 01:40 PM now."],
    ["Stan", "Oh no, there was heavy traffic! We missed the 01:30 PM show!"],
    ["Kevin", "Don't worry. What time is the next showtime?"],
    ["Stan", "Look! Time 3 is at 04:30 PM. Let's get tickets for that one!"]
  ],
  questions:[
    {stem:"Who goes to the cinema with Stan?", options:["Kevin", "Mary", "Tom", "Clerk"], answer:0},
    {stem:"What time is it right now?", options:["01:40 PM", "01:30 PM", "04:30 PM", "09:00 AM"], answer:0},
    {stem:"Why are Kevin and Stan late?", options:["Heavy traffic", "They woke up late", "They ate dinner", "Bad weather"], answer:0},
    {stem:"Can they watch the 01:30 PM show of Robot War?", options:["No, they missed it.", "Yes, they can.", "It was canceled.", "No, it is full."], answer:0},

},
{

    ["😂","Funny Movie", ["11:00 AM", "02:00 PM", "05:30 PM"]],

  ],
  dialogue:[
    ["Amy", "Ben, today is Wednesday! Cinema tickets are half-price for students."],
    ["Ben", "Great! The regular price is NT$300, so it is NT$150 per ticket today."],
    ["Amy", "Let's watch Magic School at 01:30 PM. It is a 2-hour long movie."],
    ["Ben", "Awesome! So it will end at 03:30 PM. Let's buy two tickets!"]
  ],
  questions:[
    {stem:"What special discount is available today?", options:["Half-price for students", "Free popcorn", "Buy 1 get 1 free", "Free drinks"], answer:0},
    {stem:"How much is one ticket for Amy today?", options:["NT$150", "NT$300", "NT$200", "NT$100"], answer:0},
    {stem:"How much do Amy and Ben pay in total for two tickets?", options:["NT$300", "NT$600", "NT$150", "NT$450"], answer:0},
    {stem:"How long is the movie Magic School?", options:["2 hours", "1 hour", "3 hours", "30 minutes"], answer:0},
    {stem:"What time will their 01:30 PM movie end?", options:["03:30 PM", "02:30 PM", "04:30 PM", "01:30 PM"], answer:0}
  ]
}
];

/* =========================================================
   種子隨機引擎 (確保 ABCD 卷 16 單元可重現)
========================================================= */
function seededRandom(seed) {
  let x = Math.sin(seed++) * 10000;
  return x - Math.floor(x);
}

function shuffleWithSeed(array, seed) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom(seed + i) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const escapeRegExp = text => text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function highlightText(text, words) {
  if (!words || !words.length) return text;
  let result = String(text);
  const sorted = [...words].sort((a,b) => b.length - a.length);
  sorted.forEach(word => {
    const regex = new RegExp(`\\b(${escapeRegExp(word)})\\b`, "gi");
    result = result.replace(regex, `<span class="hint-word">$1</span>`);
  });
  return result;
}

/* =========================================================
   產生 16 個單元大禮包 (ABCD 卷)
========================================================= */
function generateAll16Levels() {
  const versions = [
    { prefix: 'A', seedOffset: 100 },
    { prefix: 'B', seedOffset: 200 },
    { prefix: 'C', seedOffset: 300 },
    { prefix: 'D', seedOffset: 400 }
  ];

  let allLevels = [];

  versions.forEach(ver => {
    baseLevels.forEach((lvlData, lIdx) => {
      const actualCode = `${ver.prefix}${lIdx + 1}`;
      const baseSeed = ver.seedOffset + lIdx * 50;

      // 隨機重排選項，並保留正確解答指標
      const newQuestions = lvlData.questions.map((q, qIdx) => {
        const qSeed = baseSeed + qIdx;
        const correctAnsText = q.options[q.answer];
        const shuffledOptions = shuffleWithSeed(q.options, qSeed);
        const newAnswerIdx = shuffledOptions.indexOf(correctAnsText);

        return {
          ...q,
          options: shuffledOptions,
          answer: newAnswerIdx
        };
      });

      // 精準提示關鍵字收集：僅收集題幹中實際出現的詞彙
      let allStemText = newQuestions.map(q => q.stem).join(" ");
      let hints = [];

      lvlData.schedule.forEach(row => {
        if (new RegExp(`\\b${escapeRegExp(row[1])}\\b`, 'i').test(allStemText)) hints.push(row[1]);
        row[2].forEach(t => {
          if (allStemText.includes(t)) hints.push(t);
        });
      });

      ["Tom", "Mary", "Kevin", "Stan", "Amy", "Ben", "half-price", "NT$150", "NT$300", "2 hours", "traffic", "late", "missed", "end"].forEach(w => {
        if (new RegExp(`\\b${escapeRegExp(w)}\\b`, 'i').test(allStemText)) hints.push(w);
      });

      allLevels.push({
        code: actualCode,
        schedule: lvlData.schedule,
        dialogue: lvlData.dialogue,
        questions: newQuestions,
        hints: hints
      });
    });
  });

  return allLevels;
}

const all16Levels = generateAll16Levels();
let selections = all16Levels.map(level => Array(level.questions.length).fill(null));
let hintStates = all16Levels.map(() => false);

/* 勵志短句 */
const motivationalQuotes = [
  "Believe in yourself, every step you take makes you stronger and wiser!",
  "Going to the movies is fun, and reading English brings wonderful adventures!",
  "Keep trying your best today, success belongs to those who never give up!",
  "Great job! Small progress every day leads to big achievements."
];

/* =========================================================
   UI 渲染
========================================================= */
function createLevel(data, levelIndex){
  let tableHTML = `
    <tr>
      <th>Movie (電影)</th>
      <th>Time 1</th>
      <th>Time 2</th>
      <th>Time 3</th>
    </tr>
  `;
  data.schedule.forEach(row => {
    tableHTML += `
      <tr>
        <td><span class="m-icon">${row[0]}</span><span class="m-name">${highlightText(row[1], data.hints)}</span></td>
        <td>${highlightText(row[2][0], data.hints)}</td>
        <td>${highlightText(row[2][1], data.hints)}</td>
        <td>${highlightText(row[2][2], data.hints)}</td>
      </tr>
    `;
  });

  const dialogueHTML = data.dialogue.map(line => `
    <div class="dialogue-line">
      <div class="speaker">${highlightText(line[0], data.hints)}:</div>
      <div class="speech">${highlightText(line[1], data.hints)}</div>
    </div>
  `).join('');

  const questionsHTML = data.questions.map((q, qIndex) => {
    const ansLetter = String.fromCharCode(65 + q.answer);
    return `
      <div class="question">
        <div class="q-row">
          <div class="answer-slot">
            （<span class="answer-letter" id="answer-${levelIndex}-${qIndex}" data-ans="${ansLetter}"></span>）
          </div>
          <div class="q-text">
            ${qIndex+1}. ${highlightText(q.stem, data.hints)}
          </div>
        </div>
        <div class="options">
          ${q.options.map((option, optIndex) => `
            <div class="option" data-level="${levelIndex}" data-q="${qIndex}" data-opt="${optIndex}"
                 onclick="chooseAnswer(${levelIndex}, ${qIndex},${optIndex}, this)">
              <span class="option-inner">
                (${String.fromCharCode(65+optIndex)})${highlightText(option, data.hints)}
              </span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  const quote = motivationalQuotes[levelIndex % motivationalQuotes.length];

  return `
    <section class="level-block" id="level-${levelIndex}">
      <div class="level-header">
        <h1 class="level-title">🍿 E-City｜異想電影院 ${data.code}</h1>
        <div class="student-info">
          <span>班級：</span><span class="info-line"></span>
          <span>姓名：</span><span class="info-line name-line"></span>
        </div>
      </div>

      <div class="level-content">
        <!-- 左側：時刻表 + 對話 (50%) -->
        <div class="left-side">
          <section class="schedule-box">
            <div class="schedule-title">NOW SHOWING (今日放映)</div>
            <table class="schedule-table">
              ${tableHTML}
            </table>
          </section>

          <section class="dialogue-section">
            <div class="dialogue-title">Dialogue</div>
            <div class="dialogue-content ${data.dialogue.length >= 4 ? 'long-dialogue' : ''}">
              ${dialogueHTML}
            </div>
          </section>
        </div>

        <!-- 右側：測驗區 5 題 (50%) -->
        <section class="right-side">
          <div class="question-head">
            <div class="question-title-wrap">
              <h2 class="question-title">Questions</h2>
              <div class="score" id="score-${levelIndex}"></div>
            </div>
            <div class="tools">
              <button onclick="toggleHint(${levelIndex}, this)">提示</button>
              <button onclick="gradeLevel(${levelIndex})">批改</button>
              <button onclick="clearLevel(${levelIndex})">清除</button>
              <button onclick="showAnswers(${levelIndex})">解答</button>
            </div>
          </div>
          <div class="questions">${questionsHTML}</div>
        </section>
      </div>

      <div class="footer">
        <span>⭐ ${quote}</span>
        <span class="credit">© SINNY SPEDU LABS &nbsp;&nbsp; ${data.code}</span>
      </div>
    </section>
  `;
}

function renderAll(){
  const pageRoot = document.getElementById("pages");
  pageRoot.innerHTML = "";

  for(let i=0; i<all16Levels.length; i+=2){
    const first = createLevel(all16Levels[i], i);
    const second = createLevel(all16Levels[i+1], i+1);
    pageRoot.insertAdjacentHTML("beforeend", `
      <section class="sheet">
        ${first}
        ${second}
      </section>
    `);
  }
}

/* =========================================================
   導覽與列印控制
========================================================= */
function toggleWidget(){
  const body = document.getElementById('widgetBody');
  const icon = document.getElementById('widgetToggleIcon');
  body.classList.toggle('collapsed');
  icon.textContent = body.classList.contains('collapsed') ? '▲' : '▼';
}

function scrollToId(elementId){
  const el = document.getElementById(elementId);
  if(el){
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function executePrint(){
  const mode = document.getElementById('printModeSelect').value;
  if(mode === 'teacher'){
    document.body.classList.add('teacher-mode');
  } else {
    document.body.classList.remove('teacher-mode');
  }
  window.print();
}

/* =========================================================
   互動答題邏輯 (比照漢堡店完整功能)
========================================================= */
function getOptions(levelIndex, qIndex){
  return document.querySelectorAll(`.option[data-level="${levelIndex}"][data-q="${qIndex}"]`);
}
function getAnswerSlot(levelIndex, qIndex){
  return document.getElementById(`answer-${levelIndex}-${qIndex}`);
}

function chooseAnswer(levelIndex, qIndex, optIndex, element){
  const options = getOptions(levelIndex, qIndex);
  options.forEach(el => el.classList.remove("selected", "correct", "solution"));

  selections[levelIndex][qIndex] = optIndex;
  element.classList.add("selected");

  const slot = getAnswerSlot(levelIndex, qIndex);
  slot.textContent = String.fromCharCode(65 + optIndex);
  slot.className = "answer-letter";
  document.getElementById(`score-${levelIndex}`).textContent = "";
}

function gradeLevel(levelIndex){
  let correctCount = 0;
  all16Levels[levelIndex].questions.forEach((q, qIndex) => {
    const chosen = selections[levelIndex][qIndex];
    const options = getOptions(levelIndex, qIndex);
    const slot = getAnswerSlot(levelIndex, qIndex);

    options.forEach(el => el.classList.remove("correct", "solution"));
    if(chosen === null) return;

    if(chosen === q.answer){
      correctCount++;
      options[chosen].classList.remove("selected");
      options[chosen].classList.add("correct");
      slot.textContent = String.fromCharCode(65 + chosen);
      slot.className = "answer-letter correct";
    } else {
      options[chosen].classList.remove("selected", "correct");
      selections[levelIndex][qIndex] = null;
      slot.textContent = "";
      slot.className = "answer-letter";
    }
  });
  document.getElementById(`score-${levelIndex}`).textContent = `${correctCount} / 5`;
}

function clearLevel(levelIndex){
  selections[levelIndex].fill(null);
  all16Levels[levelIndex].questions.forEach((_, qIndex) => {
    const options = getOptions(levelIndex, qIndex);
    options.forEach(el => el.classList.remove("selected", "correct", "solution"));
    const slot = getAnswerSlot(levelIndex, qIndex);
    slot.textContent = "";
    slot.className = "answer-letter";
  });
  document.getElementById(`score-${levelIndex}`).textContent = "";
}

function showAnswers(levelIndex){
  all16Levels[levelIndex].questions.forEach((q, qIndex) => {
    const options = getOptions(levelIndex, qIndex);
    options.forEach(el => el.classList.remove("selected", "correct"));
    const slot = getAnswerSlot(levelIndex, qIndex);
    slot.textContent = String.fromCharCode(65 + q.answer);
    slot.className = "answer-letter solution";
    if(options[q.answer]){
      options[q.answer].classList.add("solution");
    }
  });
  document.getElementById(`score-${levelIndex}`).textContent = "解答";
}

function toggleHint(levelIndex, button){
  hintStates[levelIndex] = !hintStates[levelIndex];
  const block = document.getElementById(`level-${levelIndex}`);
  block.classList.toggle("hint-on", hintStates[levelIndex]);
  button.classList.toggle("active", hintStates[levelIndex]);
}

renderAll();
</script>
</body>
</html>
