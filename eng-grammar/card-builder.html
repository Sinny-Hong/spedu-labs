<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Card Builder V2</title>
<style>
:root{--navy:#0b2f5f;--blue:#123f77;--orange:#f59e0b;--orange-dark:#a75200;--ink:#14213d;--muted:#667085;--line:#dfe6ef;--bg:#f5f8fc;--pale-orange:#fff7e8;--pale-blue:#f4f8fc;--shadow:0 12px 30px rgba(18,63,119,.09)}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(18,63,119,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(18,63,119,.03) 1px,transparent 1px);background-size:28px 28px}button{font:inherit}
.stage{padding:clamp(20px,4vh,46px) clamp(16px,3vw,38px)}.card{width:min(1280px,100%);margin:auto;position:relative;overflow:hidden;padding:clamp(24px,3vw,42px);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.brand-watermark{position:absolute;right:-42px;bottom:-52px;width:clamp(230px,26vw,380px);height:auto;opacity:.06;pointer-events:none;user-select:none;z-index:0}
header{position:relative;z-index:1;padding-bottom:clamp(20px,3vh,30px);text-align:center}h1{margin:0;color:var(--navy);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;font-size:clamp(34px,4.2vw,56px);font-weight:800;line-height:1.1;letter-spacing:-.025em}.tagline{margin-top:9px;color:var(--orange-dark);font-size:clamp(13px,1.3vw,17px);font-weight:900;letter-spacing:.14em}
.builder{position:relative;z-index:1;display:grid;grid-template-columns:minmax(250px,30%) minmax(0,1fr);gap:clamp(18px,2.5vw,30px);align-items:start}.steps{display:grid;gap:12px}
.step-card{width:100%;min-width:0;padding:17px 18px;position:relative;overflow:hidden;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 16px rgba(18,63,119,.055);text-align:left;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}.step-card:hover{transform:translateY(-1px);border-color:#bccbdd}.step-card:focus-visible,.tab-button:focus-visible,.choice:focus-visible{outline:3px solid rgba(245,158,11,.32);outline-offset:2px}.step-card.active{background:var(--pale-orange);border-color:rgba(245,158,11,.72);box-shadow:0 8px 22px rgba(245,158,11,.11)}.step-card.active:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--orange)}
.step-heading{display:flex;align-items:center;gap:11px}.step-number{flex:0 0 auto;display:grid;place-items:center;width:31px;height:31px;color:var(--navy);background:#edf3f9;border-radius:50%;font-weight:900}.step-card.active .step-number{color:#fff;background:var(--orange)}.step-title{min-width:0}.step-title strong{display:block;font-size:16px;line-height:1.3}.step-title small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em}.step-value{display:block;margin:11px 0 0 42px;overflow-wrap:anywhere;color:var(--muted);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;font-size:15px;line-height:1.45}.step-card.chosen .step-value{color:var(--navy);font-weight:800}
.content-panel{min-width:0;position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 22px rgba(18,63,119,.065)}.panel-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line)}.panel-kicker{margin:0 0 4px;color:var(--orange-dark);font-size:12px;font-weight:900;letter-spacing:.1em}.panel-title{margin:0;color:var(--navy);font-size:clamp(22px,2.5vw,30px);line-height:1.25}
.view-tabs{flex:0 0 auto;display:flex;padding:4px;background:#eef3f8;border:1px solid #e2e9f1;border-radius:11px}.tab-button{min-height:40px;padding:8px 15px;color:var(--muted);background:transparent;border:0;border-radius:8px;font-weight:900;cursor:pointer}.tab-button.active{color:var(--navy);background:#fff;box-shadow:0 3px 10px rgba(18,63,119,.1)}.panel-body{padding:18px 22px 22px}.choice-list{display:grid;gap:10px}.choice{display:block;width:100%;min-height:72px;padding:13px 16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 11px rgba(18,63,119,.035);text-align:left;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}.choice:hover{transform:translateY(-1px);border-color:var(--orange);background:#fffaf1}.choice.selected{border-color:var(--orange);background:var(--pale-orange)}.choice.reset{min-height:58px;background:var(--pale-blue)}.en{color:var(--navy);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;font-size:clamp(19px,2vw,25px);font-weight:800;line-height:1.35}.choice.reset .en{font-size:17px}.zh{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.45}
.tip-panel{min-height:250px;padding:clamp(18px,3vw,28px);color:var(--ink);background:var(--pale-blue);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:14px}.tip-panel h2{margin:0 0 18px;color:var(--navy);font-size:clamp(21px,2.4vw,28px)}.tip{font-size:clamp(17px,1.7vw,20px);line-height:1.75}.tip b{color:var(--blue)}.note{position:relative;z-index:1;margin:20px 0 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:760px){.stage{width:100%;padding:0}.card{width:100%;min-width:0;padding:22px 14px 28px;border:0;border-radius:0}header{min-width:0;padding-bottom:20px}h1{max-width:100%;font-size:clamp(28px,9vw,42px);overflow-wrap:anywhere}.builder,.content-panel,.panel-top,.panel-body{min-width:0;max-width:100%}.builder{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.step-card{padding:13px 12px}.step-heading{gap:8px}.step-number{width:28px;height:28px}.step-title strong{font-size:14px}.step-title small{font-size:10px;letter-spacing:.03em}.step-value{margin:8px 0 0;font-size:13px}.panel-top{align-items:flex-start;flex-direction:column;padding:17px}.view-tabs{width:100%;min-width:0}.tab-button{min-width:0;flex:1}.panel-body{padding:13px}.choice{min-width:0;min-height:68px}.en,.zh,.note{overflow-wrap:anywhere}.brand-watermark{width:210px;right:-30px;bottom:-30px}}@media(max-width:430px){.steps{grid-template-columns:1fr}.step-value{margin-left:36px}}@media(prefers-reduced-motion:reduce){.step-card,.choice{transition:none}}
</style>
</head>
<body><main class="stage"><section class="card"><img class="brand-watermark" src="../assets/watermark-icon.png" alt="" aria-hidden="true"><header><h1>English Card Builder</h1><div class="tagline">WRITE A LITTLE · MEAN A LOT</div></header><div class="builder"><nav class="steps" id="b" aria-label="賀卡撰寫步驟"></nav><section class="content-panel" aria-live="polite"><div class="panel-top"><div><p class="panel-kicker" id="panelKicker"></p><h2 class="panel-title" id="panelTitle"></h2></div><div class="view-tabs" role="tablist" aria-label="內容顯示方式"><button class="tab-button active" id="choicesTab" type="button" role="tab" aria-selected="true" onclick="showView('choices')">選句</button><button class="tab-button" id="tipTab" type="button" role="tab" aria-selected="false" onclick="showView('tip')">ⓘ 提示</button></div></div><div class="panel-body" id="mb"></div></section></div><p class="note">先選擇左側步驟，再從右側挑選句子；需要協助時可切換至「提示」。</p></section></main>
<script>
const D=[
["收件人","RECIPIENT","收件人 Recipient",[["Dear Teacher,","親愛的老師"],["Dear Ms. ______,","親愛的 ______ 老師（女）"],["Dear Mr. ______,","親愛的 ______ 老師（男）"],["Dear Mom,","親愛的媽媽"],["Dear Dad,","親愛的爸爸"],["Dear ______,","親愛的 ______"]],`<h2>① 收件人怎麼寫？</h2><div class=tip>英文賀卡常用 <b>Dear + 稱呼／名字 + ,</b><br><br><b>Dear Ms. Hong,</b><br><b>Dear Mr. Wang,</b><br><b>Dear Mom,</b><br><br><b>Mr.</b> 用於男性；<b>Ms.</b> 不特別指出女性的婚姻狀況。賀卡或親友書信的稱呼後面通常使用<b>逗號（,）</b>。</div>`],
["節慶祝賀","GREETING","節慶祝賀 Greeting",[["Happy Teachers’ Day!","教師節快樂！"],["Happy Mother’s Day!","母親節快樂！"],["Happy Father’s Day!","父親節快樂！"],["Happy Birthday!","生日快樂！"],["Merry Christmas!","聖誕快樂！"],["Happy New Year!","新年快樂！"]],`<h2>② 節慶祝賀</h2><div class=tip>節慶祝賀可以獨立成一句，例如：<br><br><b>Happy Teachers’ Day!</b><br><br>祝賀時常使用驚嘆號 <b>!</b>；Christmas 最常說 <b>Merry Christmas!</b></div>`],
["想說的話","MESSAGE","祝福語 Message",[["Thank you.","謝謝你。"],["Thank you for helping me.","謝謝你幫助我。"],["Thank you for teaching me.","謝謝你教導我。"],["Thank you for taking care of me.","謝謝你照顧我。"],["I love you.","我愛你。"],["I love you very much.","我非常愛你。"],["I miss you.","我想你。"],["You are important to me.","你對我很重要。"],["You are very kind.","你很親切。"],["You are very patient.","你很有耐心。"],["You are great!","你很棒！"],["You are a great teacher.","你是一位很棒的老師。"],["Have a great day!","祝你今天愉快！"],["Be happy every day!","祝你每天開心！"],["Take care!","保重！"],["I wish you all the best.","祝你一切順利。"]],`<h2>③ 想說的話</h2><div class=tip>英文卡片不需要寫得很長。選一句<b>真的符合你的心意</b>的話就很好。<br><br>可以寫感謝、愛與關心、稱讚或祝福。</div>`],
["寄件人","FROM","寄件人 From",[["Your student,<br>________","你的學生＋自己的名字"],["Your friend,<br>________","你的朋友＋自己的名字"],["Your daughter,<br>________","你的女兒＋自己的名字"],["Your son,<br>________","你的兒子＋自己的名字"],["Love,<br>________","愛你的……＋自己的名字"],["From,<br>________","來自……＋自己的名字"]],`<h2>④ 寄件人怎麼寫？</h2><div class=tip>先寫你和收件人的<b>關係／結尾語</b>，下一行再寫自己的名字：<br><br><b>Your student,</b><br>Amy<br><br><b>Love,</b><br>Amy<br><br><b>Love,</b> 比較適合家人或親近的人；寫給老師可以使用 <b>Your student,</b>。</div>`]
];
const b=document.getElementById("b"),mb=document.getElementById("mb"),panelKicker=document.getElementById("panelKicker"),panelTitle=document.getElementById("panelTitle"),choicesTab=document.getElementById("choicesTab"),tipTab=document.getElementById("tipTab");let activeStep=0,activeView="choices";const selected=Array(D.length).fill(null);
D.forEach((d,i)=>{const x=document.createElement("button");x.type="button";x.className="step-card";x.setAttribute("aria-current",i===0?"step":"false");x.innerHTML=`<span class="step-heading"><span class="step-number">${i+1}</span><span class="step-title"><strong>${d[0]}</strong><small>${d[1]}</small></span></span><span class="step-value" id="v${i}">${d[2]}</span>`;x.onclick=()=>choices(i);b.appendChild(x)});
function updateStepState(){Array.from(b.children).forEach((step,i)=>{step.classList.toggle("active",i===activeStep);step.classList.toggle("chosen",selected[i]!==null);step.setAttribute("aria-current",i===activeStep?"step":"false")})}
function renderChoices(){const i=activeStep,reset=`<button type="button" class="choice reset" onclick="resetChoice(${i})"><div class="en">↶ ${D[i][2]}</div><div class="zh">回到初始選項</div></button>`;mb.innerHTML=`<div class="choice-list">${reset}${D[i][3].map((x,j)=>`<button type="button" class="choice${selected[i]===j?" selected":""}" onclick="choose(${i},${j})"><div class="en">${x[0]}</div><div class="zh">${x[1]}</div></button>`).join("")}</div>`}
function render(){panelKicker.textContent=`STEP ${activeStep+1} · ${D[activeStep][1]}`;panelTitle.textContent=D[activeStep][0];choicesTab.classList.toggle("active",activeView==="choices");tipTab.classList.toggle("active",activeView==="tip");choicesTab.setAttribute("aria-selected",activeView==="choices"?"true":"false");tipTab.setAttribute("aria-selected",activeView==="tip"?"true":"false");if(activeView==="choices")renderChoices();else mb.innerHTML=`<div class="tip-panel">${D[activeStep][4]}</div>`;updateStepState()}
function choices(i){activeStep=i;activeView="choices";render()}function choose(i,j){selected[i]=j;document.getElementById("v"+i).innerHTML=D[i][3][j][0];render()}function resetChoice(i){selected[i]=null;document.getElementById("v"+i).textContent=D[i][2];render()}function tip(i=activeStep){activeStep=i;activeView="tip";render()}function showView(view){activeView=view;render()}render();
</script></body></html>
