<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀測驗｜異想行事曆</title>
<style>
:root{
  --paper: #FDFDFD;
  --wood: #C5A880;
  --ink: #2C3E50;
  --blue: #3498DB;
  --green: #2A5944;
  --red: #E74C3C;
  --line-blue: #A9CCE3;
  
  --navy: #1A252F;
  --soft: #F4F6F7;
  --blue-soft: #EBF5FB;
  --green-soft: #E8F8F5;
  --hint: #FFF0A6;
  --hint-line: #F1C44A;
  --gray-blue: #BDC3C7;
}
*{box-sizing:border-box}

html,body{margin:0;padding:0;}
body{
  background: #E8EDF1; color:var(--ink);
  font-family: "Comic Sans MS", "Comic Sans", "Comic Neue", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding:18px 0 40px;
}
button,select{font:inherit;cursor:pointer;user-select:none;}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* =========================================================
   FLOATING NAV & PRINT WIDGET (右上角浮動收折導覽與列印選單)
========================================================= */
.floating-widget{
  position:fixed;right:16px;top:16px;z-index:1000;
  background:white;border:1px solid #C8D5E0;border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
.widget-header{
  background:var(--green);color:white;padding:10px 14px;font-weight:900;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  font-size:14px;user-select:none;gap:10px;
}
.widget-body{
  padding:12px;display:flex;flex-direction:column;gap:10px;background:white;
  max-height:80vh;overflow-y:auto;
}
.widget-body.collapsed{display:none;}
.nav-section-title{
  font-size:12px;font-weight:900;color:#647789;margin-bottom:4px;border-bottom:1px solid var(--line-blue);padding-bottom:2px;
}
.nav-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:4px;}
.nav-grid button{
  padding:6px 4px;border:1px solid #C8D5E0;border-radius:6px;background:white;
  color:var(--green);font-size:12px;font-weight:900;cursor:pointer;text-align:center;
}
.nav-grid button:hover{background:var(--green-soft);border-color:var(--green);}
.print-select-wrap{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.print-select-wrap select{
  padding:8px;border:1px solid #C8D5E0;border-radius:8px;font-weight:900;color:var(--navy);background:white;cursor:pointer;
}
.print-action-btn{
  background:var(--green);color:white;border:0;border-radius:8px;padding:9px;font-weight:900;cursor:pointer;text-align:center;
}
.print-action-btn:hover{background:#1E4030;}

/* =========================================================
   A4 PORTRAIT SHEETS
========================================================= */
.sheet{
  width:210mm;height:297mm;margin:0 auto 18px;padding:7mm 8mm;
  background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.12);
  overflow:hidden;display:grid;grid-template-rows:1fr 1fr;gap:5mm;
  page-break-after:always;
}
.sheet:last-child{page-break-after:auto;}

.level-block{
  min-height:0;display:flex;flex-direction:column;overflow:hidden;
}
.level-block:first-child{
  padding-bottom:2.5mm;border-bottom:1.5px dashed #D5E0E9;
}

/* =========================================================
   HEADER
========================================================= */
.level-header{
  min-height:11mm;display:flex;align-items:center;justify-content:space-between;
  gap:5mm;margin-bottom:1.5mm;
}
.level-title{margin:0;color:var(--green);font-size:16pt;line-height:1;font-weight:900;white-space:nowrap;}
.student-info{display:flex;align-items:center;gap:3mm;color:#273E52;font-size:13pt;font-weight:700;white-space:nowrap;}
.info-line{display:inline-block;min-width:24mm;height:4.5mm;border-bottom:1.4px solid #647789;}
.name-line{min-width:34mm;}

/* =========================================================
   CONTENT LAYOUT (50:50)
========================================================= */
.level-content{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4mm;
}
.left-side,.right-side{min-width:0;min-height:0;}
.left-side{display:flex;flex-direction:column; height:100%; min-height:0;}

/* 左側：行事曆表格高度 100% 均分 */
.schedule-box{
  border:1px solid var(--line-blue); border-radius:3mm; background:var(--paper); 
  display:flex; flex-direction:column; height:100%; overflow:hidden; position: relative;
}
.schedule-title{
  height:6.8mm;display:flex;align-items:center;justify-content:center;
  background:var(--green);color:white;font-size:10pt;font-weight:900;flex-shrink:0; letter-spacing: 0.5px;
}
.schedule-table-wrap{
  flex:1; height:100%; display:flex; flex-direction:column; overflow:hidden;
}
.schedule-table{
  width:100%; height:100%; border-collapse:collapse; text-align:left; table-layout: fixed;
}
.schedule-table th, .schedule-table td {
  padding:3px 6px; border-bottom:1px solid var(--line-blue); font-size:9.5pt; font-weight:bold; vertical-align: middle;
}
.schedule-table th {
  background:var(--green); color:white; border-right: 1px solid #1E4030; height: 11%;
}
.schedule-table td {
  border-right: 1px dashed var(--line-blue); background: #FFFFFF; height: 12.7%;
}
.schedule-table tr:last-child td { border-bottom: none; }
.schedule-table td:last-child { border-right: none; }

.day-col { width: 26%; color: var(--navy); white-space: nowrap; }
.time-col { width: 28%; color: #555; white-space: nowrap; font-size: 9pt; }
.event-col { width: 46%; }
.e-icon { font-size:11pt; margin-right:3px; vertical-align:middle; }
.e-name { vertical-align:middle; }

/* 右側：測驗區 */
.right-side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
.question-head{
  min-height:8.5mm;display:flex;align-items:center;justify-content:space-between;
  gap:2mm;padding:1mm 2mm;margin-bottom:1.5mm;background:var(--soft);
  border:1px solid var(--line-blue);border-radius:2.5mm;width:100%;flex-shrink:0;
}
.question-title-wrap{display:flex;align-items:center;gap:2mm;min-width:0;}
.question-title{margin:0;color:var(--green);font-size:11.5pt;font-weight:900;}
.score{min-width:11mm;color:var(--green);font-size:10pt;font-weight:900;text-align:center;}

.tools{display:flex;align-items:center;gap:.8mm;flex-shrink:0;}
.tools button{
  padding:1mm 1.6mm;border:1px solid #BFCFDE;border-radius:6px;
  background:white;color:var(--green);font-size:8pt;font-weight:900;cursor:pointer;
}
.tools button.active{color:#875100;background:#FFF2D7;border-color:var(--hint-line);}

.questions{
  flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0 2px; min-height:0; overflow:hidden;
}

.question{
  border-bottom:1px dashed var(--gray-blue);padding:2px 0 3px;display:flex;flex-direction:column;justify-content:center;
}
.question:last-child{border-bottom:none;}

.q-row{
  display:grid;grid-template-columns:11mm minmax(0,1fr);column-gap:1mm;
  align-items:start;min-width:0;font-size:11.5pt;line-height:1.25;font-weight:800;
}
.answer-slot{white-space:nowrap;text-align:right;}
.answer-letter{display:inline-block;min-width:3.5mm;color:var(--blue);font-weight:900;}
.answer-letter.correct{color:var(--green);}
.answer-letter.solution{color:var(--red);}
.q-text{min-width:0;overflow-wrap:anywhere;}

/* 選項：復原為舊講義自然流式排列 (優先同一排，超長才換行) */
.options{
  margin-left: 11mm; 
  display: flex; 
  flex-wrap: wrap; 
  font-size: 10pt; 
  margin-top: 1.5px;
  row-gap: 2px;     
  column-gap: 12px; 
}
.choice{
  border: 1px solid transparent; border-radius: 5px; background: transparent; 
  color: #4F595D; padding: 1px 4px; font-weight: bold; cursor: pointer;
}
.choice:hover{background:var(--blue-soft);}
.choice.selected{color:var(--navy);background:var(--blue-soft);border-color:#6CA6D3;}
.choice.correct{color:var(--green);background:var(--green-soft);border-color:#8BC4A3;}
.choice.solution{color:var(--red);background:#F9EBEA;border-color:var(--red);}

/* =========================================================
   提示效果 (HINT STYLES)
========================================================= */
.hint-word{
  border-radius:3px;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}
.hint-on .hint-word{
  background: var(--hint) !important;
  box-shadow: inset 0 -2px 0 var(--hint-line) !important;
  color: #875100;
}

/* =========================================================
   FOOTER
========================================================= */
.footer{
  display:flex;justify-content:space-between;align-items:center;
  font-size:7.8pt;color:#788896;padding-top:1mm;margin-top:auto;
}
.footer .credit{
  margin-left:auto;text-align:right;font-size:7.5pt;letter-spacing:.2px;
}

/* =========================================================
   TEACHER ANSWER MODE
========================================================= */
body.teacher-mode .answer-letter{
  color: var(--red) !important;
  font-weight: 900 !important;
}
body.teacher-mode .answer-letter::after{
  content: attr(data-ans);
}

/* =========================================================
   PRINT
========================================================= */
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{width:210mm;margin:0;padding:0;background:white;}
  .floating-widget{display:none !important;}
  .sheet{width:210mm;height:297mm;margin:0;box-shadow:none;}
  .tools,.score{display:none !important;}
}
</style>
</head>

<body>

<!-- 右上角浮動收折導覽與列印面板 -->
<div class="floating-widget" id="floatingWidget">
  <div class="widget-header" onclick="toggleWidget()">
    <span>📍 快速導覽與列印選單</span>
    <span id="widgetToggleIcon">▼</span>
  </div>
  <div class="widget-body" id="widgetBody">
    <div class="nav-section-title">A 卷 (A1 - A4)</div>
    <div class="nav-grid">
      <button onclick="scrollToId('level-0')">A1</button>
      <button onclick="scrollToId('level-1')">A2</button>
      <button onclick="scrollToId('level-2')">A3</button>

    </div>
    
    <div class="nav-section-title">B 卷 (B1 - B4)</div>
    <div class="nav-grid">
      <button onclick="scrollToId('level-4')">B1</button>
      <button onclick="scrollToId('level-5')">B2</button>
      <button onclick="scrollToId('level-6')">B3</button>
      <button onclick="scrollToId('level-7')">B4</button>
    </div>

    <div class="nav-section-title">C 卷 (C1 - C4)</div>
    <div class="nav-grid">
      <button onclick="scrollToId('level-8')">C1</button>
      <button onclick="scrollToId('level-9')">C2</button>
      <button onclick="scrollToId('level-10')">C3</button>
      <button onclick="scrollToId('level-11')">C4</button>
    </div>

    <div class="nav-section-title">D 卷 (D1 - D4)</div>
    <div class="nav-grid">
      <button onclick="scrollToId('level-12')">D1</button>
      <button onclick="scrollToId('level-13')">D2</button>
      <button onclick="scrollToId('level-14')">D3</button>
      <button onclick="scrollToId('level-15')">D4</button>

      <select id="printModeSelect">

    </div>
  </div>
</div>

<div id="pages"></div>

<script>
'use strict';

const BASIC_ACTIVITIES = [
  {name:'have an English class', zh:'上英文課', emoji:'📖'},
  {name:'have a math test', zh:'考數學', emoji:'📐'},
  {name:'do homework', zh:'寫作業', emoji:'✍️'},
  {name:'clean the room', zh:'打掃房間', emoji:'🧹'},
  {name:'go shopping', zh:'去購物', emoji:'🛒'},
  {name:'play basketball', zh:'打籃球', emoji:'🏀'},
  {name:'watch TV', zh:'看電視', emoji:'📺'},
  {name:'have dinner', zh:'吃晚餐', emoji:'🍽️'}
];

const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const TIMES = ["09:00 AM", "10:30 AM", "02:00 PM", "04:00 PM", "06:30 PM", "08:00 PM"];

const motivationalQuotes = [
  "Believe in yourself, every step you take makes you stronger and wiser!",
  "Reading English schedules opens up a wonderful new world of daily planning.",
  "Keep trying your best today, success belongs to those who never give up!",
  "Great job! Small progress every day leads to big achievements."
];

function seededRandom(seed) {
  let x = Math.sin(seed++) * 10000;
  return x - Math.floor(x);
}

function shuffleWithSeed(array, seed) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom(seed + i) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const Cap = str => str.charAt(0).toUpperCase() + str.slice(1);
const escapeRegExp = text => text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// 文本高亮工具：僅精準匹配傳入的關鍵字
function highlightText(text, words) {
  if (!words || !words.length) return text;
  let result = String(text);
  const sorted = [...words].sort((a,b) => b.length - a.length);
  sorted.forEach(word => {
    const regex = new RegExp(`\\b(${escapeRegExp(word)})\\b`, "gi");
    result = result.replace(regex, `<span class="hint-word">$1</span>`);
  });
  return result;
}

function fillOptions(ans, w1, w2, fallback, seed) {
  let opts = [...new Set([ans, w1, w2])];
  let i = 0;
  while(opts.length < 3) {
    if(!opts.includes(fallback[i])) opts.push(fallback[i]);
    i++;
  }
  return shuffleWithSeed(opts, seed);
}

// ================= 生成單元資料 (每單元固定 4 題) =================
function generateLevelData(lvlType, seed) {
  let basicPool = shuffleWithSeed(BASIC_ACTIVITIES, seed);
  let acts = basicPool.slice(0, 7);
  let timePool = shuffleWithSeed(TIMES, seed + 20);
  
  const schedule = DAYS.map((d, i) => ({
    day: d,
    time: timePool[i % timePool.length],
    act: acts[i]
  }));

  let questions = [];

  if (lvlType === 'L1') {
    let qData = [
      { stem: `What does David do on ${schedule[0].day} at ${schedule[0].time}?`, ans: Cap(schedule[0].act.name), w1: Cap(schedule[1].act.name), w2: Cap(schedule[2].act.name) },
      { stem: `What does David do on ${schedule[3].day} at ${schedule[3].time}?`, ans: Cap(schedule[3].act.name), w1: Cap(schedule[4].act.name), w2: Cap(schedule[5].act.name) },
      { stem: `What time does David ${schedule[2].act.name}?`, ans: `On ${schedule[2].day} at ${schedule[2].time}`, w1: `On ${schedule[0].day} at ${schedule[0].time}`, w2: `On ${schedule[1].day} at ${schedule[1].time}` },
      { stem: `What time does David ${schedule[4].act.name}?`, ans: `On ${schedule[4].day} at ${schedule[4].time}`, w1: `On ${schedule[5].day} at ${schedule[5].time}`, w2: `On ${schedule[6].day} at ${schedule[6].time}` }
    ];
    let fakes = schedule.map(s => Cap(s.act.name));
    questions = qData.map((q, idx) => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Yes, he does.", "No, he doesn't.", ...fakes], seed + idx);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans) };
    });
  }
  else if (lvlType === 'L2') {
    let t1 = 1, t2 = 4, t3 = 6;
    let yesterdayIdx = (t3 - 1 >= 0) ? t3 - 1 : 6;
    let qData = [
      { stem: `Today is ${schedule[t1].day}. What does David do at ${schedule[t1].time}?`, ans: Cap(schedule[t1].act.name), w1: Cap(schedule[t1+1].act.name), w2: Cap(schedule[t1+2].act.name) },
      { stem: `Tomorrow is ${schedule[t2].day}. What will David do at ${schedule[t2].time}?`, ans: Cap(schedule[t2].act.name), w1: Cap(schedule[t2-1].act.name), w2: Cap(schedule[t2+1].act.name) },
      { stem: `Today is ${schedule[t3].day}. Where is David at ${schedule[t3].time}?`, ans: `He ${schedule[t3].act.name}`, w1: `He ${schedule[t3-1].act.name}`, w2: `He ${schedule[t3-2].act.name}` },
      { stem: `Yesterday was ${schedule[yesterdayIdx].day}. Did he ${schedule[yesterdayIdx].act.name}?`, ans: "Yes, he did.", w1: "No, he didn't.", w2: "I don't know." }
    ];
    let fakes = schedule.map(s => Cap(s.act.name));
    questions = qData.map((q, idx) => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Yes.", "No.", ...fakes], seed + idx);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans) };
    });
  }
  else if (lvlType === 'L3') {
    let qData = [
      { 
        stem: `Leo wants to play games with David on ${schedule[2].day} at ${schedule[2].time}. Can David join?`, 
        ans: `No, he ${schedule[2].act.name}.`, 
        w1: `Yes, he is free.`, 
        w2: `No, he ${schedule[1].act.name}.` 
      },
      { 
        stem: `Mary wants to meet David on ${schedule[4].day}. Look at the schedule. What time is David busy?`, 
        ans: `At ${schedule[4].time}.`, 
        w1: `At ${schedule[3].time}.`, 
        w2: `At ${schedule[5].time}.` 
      },
      { 
        stem: `David's mom asks: "When do you ${schedule[6].act.name}?" What does David say?`, 
        ans: `On ${schedule[6].day} at ${schedule[6].time}.`, 
        w1: `On ${schedule[5].day} at ${schedule[5].time}.`, 
        w2: `On ${schedule[0].day} at ${schedule[0].time}.` 
      },
      { 
        stem: `Is David free on ${schedule[1].day} at ${schedule[1].time}?`, 
        ans: `No, he has to ${schedule[1].act.name}.`, 
        w1: `Yes, he is free all day.`, 
        w2: `Yes, he has no plans.` 
      }
    ];
    questions = qData.map((q, idx) => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Yes, he is free.", `At 08:00 PM.`], seed + idx);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans) };
    });
  }
  else if (lvlType === 'L4') {
    let yDayIdx = 2, tDayIdx = 3, testIdx = 5, studyIdx = 4;
    let qData = [
      { 
        stem: `David ${schedule[yDayIdx].act.name} <b>yesterday</b>. What will he do <b>today</b> at ${schedule[tDayIdx].time}?`, 
        ans: `He will ${schedule[tDayIdx].act.name}.`, 
        w1: `He will ${schedule[tDayIdx+1].act.name}.`, 
        w2: `He will ${schedule[yDayIdx].act.name}.` 
      },
      { 
        stem: `David has to ${schedule[testIdx].act.name} on ${schedule[testIdx].day}. What is scheduled the day before?`, 
        ans: `He will ${schedule[studyIdx].act.name}.`, 
        w1: `He will ${schedule[testIdx].act.name}.`, 
        w2: `He will do nothing.` 
      },
      { 
        stem: `David ${schedule[0].act.name} on Monday. Does he ${schedule[1].act.name} on Tuesday?`, 
        ans: `Yes, he does.`, 
        w1: `No, he doesn't.`, 
        w2: `We don't know.` 
      },
      { 
        stem: `How many activities does David have from Monday to Thursday?`, 
        ans: `4 activities`, 
        w1: `3 activities`, 
        w2: `5 activities` 
      }
    ];
    questions = qData.map((q, idx) => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Friday.", "Saturday.", "Sunday."], seed + idx);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans) };
    });
  }

  // ★【精準提示萃取】：只收集題目題幹（Stem）中實際出現過的單字！
  let allStemText = questions.map(q => q.stem).join(" ");
  let hints = [];

  DAYS.forEach(d => {
    if (new RegExp(`\\b${d}\\b`, 'i').test(allStemText)) hints.push(d);
  });
  TIMES.forEach(t => {
    if (allStemText.includes(t)) hints.push(t);
  });
  acts.forEach(act => {
    if (allStemText.includes(act.name)) hints.push(act.name);
  });
  ["today", "tomorrow", "yesterday"].forEach(w => {
    if (new RegExp(`\\b${w}\\b`, 'i').test(allStemText)) hints.push(w);
  });

  return { schedule, questions, hints };
}

// ================= 產生 16 個單元大禮包 =================
function generateAll16Levels() {
  const versions = [
    { prefix: 'A', seedOffset: 100 },
    { prefix: 'B', seedOffset: 200 },
    { prefix: 'C', seedOffset: 300 },
    { prefix: 'D', seedOffset: 400 }
  ];

  const types = ['L1', 'L2', 'L3', 'L4'];
  let allLevels = [];

  versions.forEach(ver => {
    types.forEach((t, idx) => {
      const actualCode = `${ver.prefix}${idx + 1}`;
      const seed = ver.seedOffset + idx * 50;
      const data = generateLevelData(t, seed);

      allLevels.push({
        code: actualCode,
        schedule: data.schedule,
        questions: data.questions,
        hints: data.hints
      });
    });
  });

  return allLevels;
}

const all16Levels = generateAll16Levels();
let selections = all16Levels.map(level => Array(level.questions.length).fill(null));
let hintStates = all16Levels.map(() => false);

// ================= UI 渲染 =================
function createLevel(data, levelIndex){
  let tableHTML = `
    <tr>
      <th class="day-col">Day (星期)</th>
      <th class="time-col">Time (時間)</th>
      <th class="event-col">Activity (活動)</th>
    </tr>
  `;
  data.schedule.forEach(item => {
    tableHTML += `
      <tr>
        <td class="day-col">${highlightText(item.day, data.hints)}</td>
        <td class="time-col">${highlightText(item.time, data.hints)}</td>
        <td class="event-col"><span class="e-icon">${item.act.emoji}</span><span class="e-name">${highlightText(item.act.name, data.hints)}</span></td>
      </tr>
    `;
  });

  const questionsHTML = data.questions.map((q, qIndex) => {
    const ansLetter = String.fromCharCode(65 + q.answer);
    return `
      <div class="question">
        <div class="q-row">
          <div class="answer-slot">
            （<span class="answer-letter" id="answer-${levelIndex}-${qIndex}" data-ans="${ansLetter}"></span>）
          </div>
          <div class="q-text">
            ${qIndex+1}. ${highlightText(q.stem, data.hints)}
          </div>
        </div>
        <!-- 自然流式排列：同一行優先，放不下才換行 -->
        <div class="options">
          ${q.options.map((choice, j) => `
            <button class="choice" data-level="${levelIndex}" data-q="${qIndex}" data-opt="${j}"
                    onclick="chooseAnswer(${levelIndex}, ${qIndex},${j}, this)">
              (${String.fromCharCode(65+j)})${choice}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  const quote = motivationalQuotes[levelIndex % motivationalQuotes.length];

  return `
    <section class="level-block" id="level-${levelIndex}">
      <div class="level-header">
        <h1 class="level-title">📓 閱讀測驗｜異想行事曆 ${data.code}</h1>
        <div class="student-info">
          <span>班級：</span><span class="info-line"></span>
          <span>姓名：</span><span class="info-line name-line"></span>
        </div>
      </div>

      <div class="level-content">
        <!-- 左側行事曆：100% 均分填滿，僅精準提示右邊出現過的單字 -->
        <div class="left-side">
          <section class="schedule-box">
            <div class="schedule-title">David's Schedule (本週行程表)</div>
            <div class="schedule-table-wrap">
              <table class="schedule-table">
                ${tableHTML}
              </table>
            </div>
          </section>
        </div>

        <!-- 右側測驗區：4 題自然流式配置 -->
        <div class="right-side">
          <div class="question-head">
            <div class="question-title-wrap">
              <h2 class="question-title">Questions</h2>
              <div class="score" id="score-${levelIndex}"></div>
            </div>
            <div class="tools">
              <button onclick="toggleHint(${levelIndex}, this)">提示</button>
              <button onclick="gradeLevel(${levelIndex})">批改</button>
              <button onclick="clearLevel(${levelIndex})">清除</button>
              <button onclick="showAnswers(${levelIndex})">解答</button>
            </div>
          </div>
          <div class="questions">${questionsHTML}</div>
        </div>
      </div>

      <div class="footer">
        <span>⭐ ${quote}</span>
        <span class="credit">© SINNY SPEDU LABS &nbsp;&nbsp; ${data.code}</span>
      </div>
    </section>
  `;
}

function renderAll(){
  const pageRoot = document.getElementById("pages");
  pageRoot.innerHTML = "";

  for(let i=0; i<all16Levels.length; i+=2){
    const first = createLevel(all16Levels[i], i);
    const second = createLevel(all16Levels[i+1], i+1);
    pageRoot.insertAdjacentHTML("beforeend", `
      <section class="sheet">
        ${first}
        ${second}
      </section>
    `);
  }
}

// 導覽與列印控制
function toggleWidget(){
  const body = document.getElementById('widgetBody');
  const icon = document.getElementById('widgetToggleIcon');
  body.classList.toggle('collapsed');
  icon.textContent = body.classList.contains('collapsed') ? '▲' : '▼';
}

function scrollToId(elementId){
  const el = document.getElementById(elementId);
  if(el){
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function executePrint(){
  const mode = document.getElementById('printModeSelect').value;
  if(mode === 'teacher'){
    document.body.classList.add('teacher-mode');
  } else {
    document.body.classList.remove('teacher-mode');
  }
  window.print();
}

// 互動邏輯 (選擇、批改、清除、解答、提示)
function getOptions(levelIndex, qIndex){
  return document.querySelectorAll(`.choice[data-level="${levelIndex}"][data-q="${qIndex}"]`);
}
function getAnswerSlot(levelIndex, qIndex){
  return document.getElementById(`answer-${levelIndex}-${qIndex}`);
}

function chooseAnswer(levelIndex, qIndex, optIndex, element){
  const options = getOptions(levelIndex, qIndex);
  options.forEach(el => el.classList.remove("selected", "correct", "solution"));

  selections[levelIndex][qIndex] = optIndex;
  element.classList.add("selected");

  const slot = getAnswerSlot(levelIndex, qIndex);
  slot.textContent = String.fromCharCode(65 + optIndex);
  slot.className = "answer-letter";
  document.getElementById(`score-${levelIndex}`).textContent = "";
}

function gradeLevel(levelIndex){
  let correctCount = 0;
  const totalQ = all16Levels[levelIndex].questions.length;
  all16Levels[levelIndex].questions.forEach((q, qIndex) => {
    const chosen = selections[levelIndex][qIndex];
    const options = getOptions(levelIndex, qIndex);
    const slot = getAnswerSlot(levelIndex, qIndex);

    options.forEach(el => el.classList.remove("correct", "solution"));
    if(chosen === null) return;

    if(chosen === q.answer){
      correctCount++;
      options[chosen].classList.remove("selected");
      options[chosen].classList.add("correct");
      slot.textContent = String.fromCharCode(65 + chosen);
      slot.className = "answer-letter correct";
    }else{
      options[chosen].classList.remove("selected", "correct");
      selections[levelIndex][qIndex] = null;
      slot.textContent = "";
      slot.className = "answer-letter";
    }
  });
  document.getElementById(`score-${levelIndex}`).textContent = `${correctCount} / ${totalQ}`;
}

function clearLevel(levelIndex){
  selections[levelIndex].fill(null);
  all16Levels[levelIndex].questions.forEach((_, qIndex) => {
    const options = getOptions(levelIndex, qIndex);
    options.forEach(el => el.classList.remove("selected", "correct", "solution"));
    const slot = getAnswerSlot(levelIndex, qIndex);
    slot.textContent = "";
    slot.className = "answer-letter";
  });
  document.getElementById(`score-${levelIndex}`).textContent = "";
}

function showAnswers(levelIndex){
  all16Levels[levelIndex].questions.forEach((q, qIndex) => {
    const options = getOptions(levelIndex, qIndex);
    options.forEach(el => el.classList.remove("selected", "correct"));
    const slot = getAnswerSlot(levelIndex, qIndex);
    slot.textContent = String.fromCharCode(65 + q.answer);
    slot.className = "answer-letter solution";
    if (options[q.answer]) {
      options[q.answer].classList.add("solution");
    }
  });
  document.getElementById(`score-${levelIndex}`).textContent = "解答";
}

function toggleHint(levelIndex, button){
  hintStates[levelIndex] = !hintStates[levelIndex];
  const block = document.getElementById(`level-${levelIndex}`);
  block.classList.toggle("hint-on", hintStates[levelIndex]);
  button.classList.toggle("active", hintStates[levelIndex]);
}

renderAll();
</script>
</body>
</html>
