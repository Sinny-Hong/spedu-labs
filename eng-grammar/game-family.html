<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新市國中 英文科講義 - 家庭樹互動教學系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', 'Lexend', sans-serif;
      background-color: #f1f5f9;
    }
    
    /* 核心 A4 紙本最優先：硬鎖定 A4 尺寸，不響應 */
    .page-a4 {
      width: 210mm;
      height: 297mm;
      background-color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      margin: 20px auto;
      padding: 8mm 10mm; 
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      page-break-after: always;
    }

    /* 點擊大電視作答時選取中題目的黃色高亮底色 */
    .active-row {
      background-color: #fef08a !important;
      border-radius: 4px;
    }

    /* 填空配對的句尾不中斷完美實線 */
    .blank-underline {
      border-bottom: 2px solid #000000;
      display: inline-block;
      min-width: 100px;
      text-align: center;
      height: 24px;
      vertical-align: bottom;
    }

    /* 單字池：列印時直接隱藏 */
    @media print {
      @page { size: A4; margin: 0; }
      body { background-color: #ffffff; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .print-hide-wordbank { display: none !important; }
      .page-a4 {
        box-shadow: none;
        border: none;
        margin: 0;
        padding: 8mm 10mm;
      }
      /* 列印時將是非題互動鈕轉成前置括號 (   ) */
      .print-parenthesis::before {
        content: "(     ) ";
        font-weight: bold;
        color: #000;
      }
      .print-btn-hide { display: none !important; }
    }
  </style>
</head>
<body class="p-0 m-0 min-h-screen flex flex-col items-center justify-start">

  <!-- 頂部功能列：保留講義一致性與按鈕替換 -->
  <div class="no-print w-[210mm] bg-white mt-4 p-4 rounded-xl shadow-md border border-slate-200 flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="inline-block w-3.5 h-3.5 bg-sky-600 rounded-full animate-pulse"></span>
        <span class="text-slate-700 font-bold text-sm">📺 大電視教學模式：請選擇模式（支援先點答案再點題目飛入）</span>
      </div>
      <div class="flex gap-2">
        <button onclick="globalClear()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs transition border border-slate-300">🧹 重設清除</button>
        <button onclick="window.print()" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg text-xs transition shadow-sm">🖨️ 一鍵雙面列印 (共6頁)</button>
      </div>
    </div>
    
    <!-- 核心三大模式切換 -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <button id="btn-tf" onclick="switchMode('tf')" class="py-2 rounded-lg text-sm font-bold border transition bg-sky-600 text-white border-sky-600 shadow">⭕❌ 是非題模式</button>
      <button id="btn-mc" onclick="switchMode('mc')" class="py-2 rounded-lg text-sm font-bold border transition bg-white text-slate-700 border-slate-300 hover:bg-slate-50">🔤 選擇題模式</button>
      <button id="btn-match" onclick="switchMode('match')" class="py-2 rounded-lg text-sm font-bold border transition bg-white text-slate-700 border-slate-300 hover:bg-slate-50">✍️ 填空配對題模式</button>
    </div>
  </div>

  <!-- A4 考卷動態生成區 -->
  <div id="quiz-pages-container" class="w-full">
    <!-- 這裡將由 JS 自動生成 6 頁、12 個關卡之內容 -->
  </div>

  <script>
    // 1. 核心 12 關卡數據與設定
    const stagesConfig = [
      { id: "A-1", level: "A", name: "核心家庭篇 (一)" },
      { id: "A-2", level: "A", name: "核心家庭篇 (二)" },
      { id: "A-3", level: "A", name: "核心家庭篇 (三)" },
      { id: "A-4", level: "A", name: "核心家庭篇 (四)" },
      { id: "B-1", level: "B", name: "直系三代篇 (一)" },
      { id: "B-2", level: "B", name: "直系三代篇 (二)" },
      { id: "B-3", level: "B", name: "直系三代篇 (三)" },
      { id: "B-4", level: "B", name: "直系三代篇 (四)" },
      { id: "C-1", level: "C", name: "大家族篇 (一)" },
      { id: "C-2", level: "C", name: "大家族篇 (二)" },
      { id: "C-3", level: "C", name: "大家族篇 (三)" },
      { id: "C-4", level: "C", name: "大家族篇 (四)" }
    ];

    // 備用隨機英文名字池（防止學生死背）
    const maleNames = ["Sam", "Tom", "Jack", "Kevin", "Leo", "John", "Harry", "David", "Tony", "Cody"];
    const femaleNames = ["Mary", "Lily", "Lucy", "Mia", "Sarah", "Amy", "Betty", "Emily", "Eva", "Tina"];

    // 2. 當前模式
    let currentMode = "tf"; // tf=是非, mc=選擇, match=填空配對
    let selectedAnswer = null; // 當前被點選的準備填入值

    // 語音朗讀
    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
      }
    }

    // 隨機獲取不重複的名字組合
    function getRandomNames(count, gender) {
      let pool = gender === 'M' ? [...maleNames] : [...femaleNames];
      let result = [];
      for(let i=0; i<count; i++) {
        let idx = Math.floor(Math.random() * pool.length);
        result.push(pool.splice(idx, 1)[0]);
      }
      return result;
    }

    // 產生關卡資料（每次重新整理或重設時名字會隨機大洗牌）
    function generateStageData(stage) {
      // 隨機分配名字
      const mNames = getRandomNames(4, 'M');
      const fNames = getRandomNames(4, 'F');

      const names = {
        grandfather: mNames[0],
        grandmother: fNames[0],
        father: mNames[1],
        mother: fNames[1],
        son: mNames[2],
        daughter: fNames[2],
        uncle: mNames[3],
        aunt: fNames[3]
      };

      // 根據階層 A, B, C 的不同，提供不同的題目與答案設定
      let questions = [];
      if (stage.level === "A") {
        questions = [
          { q: `${names.father} is ${names.mother}'s husband.`, ans: "O", options: ["husband", "father", "son"], correctOpt: "A", translation: `${names.father} 是 ${names.mother} 的丈夫。` },
          { q: `${names.mother} is ${names.son}'s mother.`, ans: "O", options: ["mother", "daughter", "aunt"], correctOpt: "A", translation: `${names.mother} 是 ${names.son} 的母親。` },
          { q: `${names.son} is ${names.daughter}'s brother.`, ans: "O", options: ["brother", "father", "husband"], correctOpt: "A", translation: `${names.son} 是 ${names.daughter} 的兄弟。` },
          { q: `${names.father} is ${names.son}'s daughter.`, ans: "X", options: ["father", "daughter", "mother"], correctOpt: "A", translation: `${names.father} 是 ${names.son} 的父親（原題敘述錯誤）。` },
          { q: `${names.daughter} is ${names.mother}'s son.`, ans: "X", options: ["daughter", "son", "husband"], correctOpt: "A", translation: `${names.daughter} 是 ${names.mother} 的女兒（原題敘述錯誤）。` }
        ];
      } else if (stage.level === "B") {
        questions = [
          { q: `${names.grandfather} is ${names.son}'s grandfather.`, ans: "O", options: ["grandfather", "father", "uncle"], correctOpt: "A", translation: `${names.grandfather} 是 ${names.son} 的祖父。` },
          { q: `${names.grandmother} is ${names.daughter}'s grandmother.`, ans: "O", options: ["grandmother", "mother", "aunt"], correctOpt: "A", translation: `${names.grandmother} 是 ${names.daughter} 的祖母。` },
          { q: `${names.son} is ${names.grandfather}'s grandson.`, ans: "O", options: ["grandson", "son", "brother"], correctOpt: "A", translation: `${names.son} 是 ${names.grandfather} 的孫子。` },
          { q: `${names.daughter} is ${names.grandfather}'s grandson.`, ans: "X", options: ["granddaughter", "grandson", "daughter"], correctOpt: "A", translation: `${names.daughter} 是 ${names.grandfather} 的孫女兒（原題敘述錯誤）。` },
          { q: `${names.father} is ${names.grandmother}'s father.`, ans: "X", options: ["son", "father", "husband"], correctOpt: "A", translation: `${names.father} 是 ${names.grandmother} 的兒子（原題敘述錯誤）。` }
        ];
      } else {
        questions = [
          { q: `${names.uncle} is ${names.father}'s brother.`, ans: "O", options: ["brother", "uncle", "husband"], correctOpt: "A", translation: `${names.uncle} 是 ${names.father} 的兄弟。` },
          { q: `${names.aunt} is ${names.son}'s aunt.`, ans: "O", options: ["aunt", "mother", "daughter"], correctOpt: "A", translation: `${names.aunt} 是 ${names.son} 的阿姨/嬸嬸。` },
          { q: `${names.son} is ${names.uncle}'s nephew.`, ans: "O", options: ["nephew", "son", "brother"], correctOpt: "A", translation: `${names.son} 是 ${names.uncle} 的姪子/外甥。` },
          { q: `${names.uncle} is ${names.mother}'s sister.`, ans: "X", options: ["brother", "sister", "aunt"], correctOpt: "B", translation: `${names.uncle} 是 ${names.mother} 的兄弟（原題敘述錯誤）。` },
          { q: `${names.daughter} is ${names.aunt}'s son.`, ans: "X", options: ["niece", "son", "brother"], correctOpt: "A", translation: `${names.daughter} 是 ${names.aunt} 的姪女/外甥女（原題敘述錯誤）。` }
        ];
      }

      return {
        id: stage.id,
        level: stage.level,
        title: `${stage.id} ${stage.name}`,
        names: names,
        questions: questions
      };
    }

    // 全域狀態庫
    let appData = [];

    function initData() {
      appData = stagesConfig.map(stage => generateStageData(stage));
    }

    // 3. 渲染主介面（每頁兩組，強制換頁）
    function renderApp() {
      const container = document.getElementById("quiz-pages-container");
      container.innerHTML = "";

      // 每 2 個關卡一頁 A4 (共 6 頁)
      for (let p = 0; p < 6; p++) {
        const stage1 = appData[p * 2];
        const stage2 = appData[p * 2 + 1];

        const pageDiv = document.createElement("div");
        pageDiv.className = "page-a4";
        pageDiv.innerHTML = `
          <!-- 一致性表頭（不預設隱藏） -->
          <div class="border-b-4 border-double border-slate-800 pb-2 mb-3 shrink-0">
            <div class="flex justify-between items-end">
              <h1 class="text-2xl font-black text-slate-800 tracking-wider">新市國中 英文科講義 (家庭樹互動篇)</h1>
              <div class="flex gap-4 text-sm text-slate-800 font-bold mb-1">
                <div class="flex items-end">
                  <span class="border-b-2 border-slate-800 w-16 text-center h-6 inline-block"></span>
                  <span class="ml-1">班</span>
                </div>
                <div class="flex items-end">
                  <span>姓名：</span>
                  <span class="border-b-2 border-slate-800 w-24 text-center h-6 inline-block"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- 上下兩組題組結構 -->
          <div class="flex flex-col gap-4 flex-grow overflow-hidden">
            ${renderStageHtml(stage1)}
            ${renderStageHtml(stage2)}
          </div>
        `;
        container.appendChild(pageDiv);
      }
    }

    // 渲染單個關卡組別 HTML
    function renderStageHtml(stage) {
      return `
        <div id="stage-${stage.id}" class="flex flex-col h-[490px] border border-slate-300 rounded-lg p-2 bg-white">
          <!-- 頂部組別條 -->
          <div class="flex justify-between items-center bg-slate-100 border border-slate-300 rounded px-2 py-1 shrink-0">
            <div class="flex items-center gap-2">
              <span class="font-black text-sm text-slate-800">${stage.title}</span>
              <span id="score-${stage.id}" class="no-print hidden px-2 py-0.5 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded text-xs font-bold"></span>
            </div>
            <div class="no-print flex gap-1 print-btn-hide">
              <button onclick="checkStage('${stage.id}')" class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-bold transition">✅ 批改</button>
              <button onclick="clearStage('${stage.id}')" class="px-2 py-0.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-xs font-bold transition">🧼 清空</button>
              <button onclick="revealStage('${stage.id}')" class="px-2 py-0.5 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold transition">💡 解答</button>
            </div>
          </div>

          <!-- 黃金雙欄區（左 35% 固定圖框 / 右 65% 題目區） -->
          <div class="grid grid-cols-12 gap-3 flex-grow mt-2 overflow-hidden">
            
            <!-- 左欄 35%：固定家庭樹與隨機姓名卡片 -->
            <div class="col-span-4 border-r-2 border-slate-200 pr-2 flex flex-col justify-start gap-2">
              <span class="text-xs font-bold text-slate-500 border-b border-slate-200 pb-0.5">🌳 本關家族卡 (隨機名)</span>
              
              <div class="grid grid-cols-2 gap-1.5 overflow-hidden">
                ${renderFamilyCards(stage)}
              </div>
            </div>

            <!-- 右欄 65%：題目區（高度精算） -->
            <div class="col-span-8 flex flex-col justify-between">
              <div class="flex flex-col justify-start">
                ${stage.questions.map((q, idx) => renderQuestionRow(stage.id, q, idx)).join('')}
              </div>

              <!-- 配對題專用的「單字池」，大電視時顯示，列印時自動隱藏 -->
              ${currentMode === 'match' ? `
                <div class="print-hide-wordbank mt-1 p-1 bg-sky-50 border border-sky-200 rounded flex flex-wrap gap-1.5 justify-center">
                  <span class="text-xs font-bold text-sky-800 self-center">單字池：</span>
                  ${getWordBankHtml(stage)}
                </div>
              ` : ''}
            </div>

          </div>
        </div>
      `;
    }

    // 渲染家族卡片
    function renderFamilyCards(stage) {
      let list = [];
      if (stage.level === "A") {
        list = [
          { role: "father", emoji: "👨", label: "father" },
          { role: "mother", emoji: "👩", label: "mother" },
          { role: "son", emoji: "👦", label: "son" },
          { role: "daughter", emoji: "👧", label: "daughter" }
        ];
      } else if (stage.level === "B") {
        list = [
          { role: "grandfather", emoji: "👴", label: "grandpa" },
          { role: "grandmother", emoji: "👵", label: "grandma" },
          { role: "father", emoji: "👨", label: "father" },
          { role: "mother", emoji: "👩", label: "mother" },
          { role: "son", emoji: "👦", label: "son" }
        ];
      } else {
        list = [
          { role: "father", emoji: "👨", label: "father" },
          { role: "mother", emoji: "👩", label: "mother" },
          { role: "uncle", emoji: "👨‍🦰", label: "uncle" },
          { role: "aunt", emoji: "👩‍🦱", label: "aunt" },
          { role: "son", emoji: "nephew", label: "nephew" },
          { role: "daughter", emoji: "👧", label: "niece" }
        ];
      }

      return list.map(item => `
        <div class="border border-slate-800 rounded p-1 text-center bg-white shadow-sm flex flex-col items-center justify-center">
          <span class="text-2xl">${item.emoji}</span>
          <span class="text-[10px] font-black bg-white border border-black px-1 rounded block mt-0.5 leading-tight truncate max-w-full">
            ${stage.names[item.role]} (${item.label})
          </span>
        </div>
      `).join('');
    }

    // 根據不同模式，渲染單題的題目列 (精算行高)
    function renderQuestionRow(stageId, q, idx) {
      if (currentMode === "tf") {
        // 是非題模式：列印時前方顯示括號，大電視時點擊 O/X
        return `
          <div class="h-[76px] border-b border-slate-100 py-1 flex items-center justify-between quiz-row-item">
            <div class="flex items-center gap-2 cursor-pointer" onclick="speakWord('${q.q.replace(/'/g, "\\'")}')">
              <span class="no-print hidden"></span>
              <span class="print-parenthesis text-slate-800 font-bold text-sm tracking-tight">${idx + 1}. ${q.q}</span>
            </div>
            <!-- 右側互動 O / X -->
            <div class="flex gap-1 shrink-0 no-print">
              <button onclick="setTFAnswer('${stageId}', ${idx}, 'O')" id="tf-${stageId}-${idx}-O" class="w-8 h-8 rounded-full border-2 border-slate-800 font-black text-sm hover:bg-slate-100 transition">O</button>
              <button onclick="setTFAnswer('${stageId}', ${idx}, 'X')" id="tf-${stageId}-${idx}-X" class="w-8 h-8 rounded-full border-2 border-slate-800 font-black text-sm hover:bg-slate-100 transition">X</button>
            </div>
          </div>
        `;
      } else if (currentMode === "mc") {
        // 選擇題模式：題目一行、選項橫向並排置於正下方
        return `
          <div class="h-[76px] border-b border-slate-100 py-1 flex flex-col justify-center quiz-row-item">
            <div class="flex items-center gap-2 cursor-pointer" onclick="speakWord('${q.q.replace(/'/g, "\\'")}')">
              <span class="text-slate-800 font-bold text-sm tracking-tight">${idx + 1}. ( &nbsp;&nbsp;&nbsp; ) ${q.q}</span>
            </div>
            <!-- 下置橫向選項 -->
            <div class="flex gap-2 mt-1 no-print">
              ${q.options.map((opt, oIdx) => {
                const label = String.fromCharCode(65 + oIdx); // A, B, C
                return `
                  <button onclick="setMCAnswer('${stageId}', ${idx}, '${label}')" id="mc-${stageId}-${idx}-${label}" class="px-2.5 py-0.5 rounded border border-slate-800 font-bold text-xs bg-white hover:bg-slate-50 transition">
                    (${label}) ${opt}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else {
        // 填空配對題模式：句尾有完美底線
        return `
          <div class="h-[76px] border-b border-slate-100 py-1 flex flex-col justify-center quiz-row-item" onclick="activateMatchRow(this, '${stageId}', ${idx}, '${q.q.replace(/'/g, "\\'")}')">
            <div class="flex items-center gap-2 cursor-pointer flex-wrap">
              <span class="text-slate-800 font-bold text-sm tracking-tight">${idx + 1}.</span>
              <span class="text-slate-800 font-bold text-sm tracking-tight">${q.q.replace(q.options[0], '______')}</span>
              <span id="match-val-${stageId}-${idx}" class="text-sm font-black text-red-600 bg-red-50 px-2 border-b-2 border-slate-800 min-w-[70px] text-center"></span>
            </div>
          </div>
        `;
      }
    }

    // 配對題單字池內容
    function getWordBankHtml(stage) {
      // 提取該關卡答案的英文單字，打散作單字池
      const words = ["husband", "wife", "father", "mother", "son", "daughter", "brother", "grandfather", "grandmother", "uncle", "aunt"];
      return words.filter(w => {
        // 僅篩選與該階層相關的字
        if (stage.level === "A") return ["husband", "mother", "brother", "father", "son", "daughter"].includes(w);
        return true;
      }).map(w => `
        <button onclick="selectWord('${w}')" class="px-2 py-0.5 bg-white border-2 border-slate-800 rounded font-bold text-xs hover:bg-amber-100 transition shadow-sm">
          ${w}
        </button>
      `).join('');
    }

    // 4. 教學互動控制邏輯

    // 是非題點擊
    function setTFAnswer(stageId, qIdx, val) {
      // 清除同題的其他高亮
      document.getElementById(`tf-${stageId}-${qIdx}-O`).className = "w-8 h-8 rounded-full border-2 border-slate-800 font-black text-sm hover:bg-slate-100 transition";
      document.getElementById(`tf-${stageId}-${qIdx}-X`).className = "w-8 h-8 rounded-full border-2 border-slate-800 font-black text-sm hover:bg-slate-100 transition";
      
      // 高亮選取的按鈕
      const btn = document.getElementById(`tf-${stageId}-${qIdx}-${val}`);
      btn.className = "w-8 h-8 rounded-full border-2 border-sky-600 bg-sky-100 text-sky-700 font-black text-sm transition";
      
      // 儲存答案
      const stage = appData.find(s => s.id === stageId);
      stage.questions[qIdx].userAns = val;
    }

    // 選擇題點擊
    function setMCAnswer(stageId, qIdx, val) {
      const q = appData.find(s => s.id === stageId).questions[qIdx];
      // 清除高亮
      q.options.forEach((opt, oIdx) => {
        const label = String.fromCharCode(65 + oIdx);
        document.getElementById(`mc-${stageId}-${qIdx}-${label}`).className = "px-2.5 py-0.5 rounded border border-slate-800 font-bold text-xs bg-white hover:bg-slate-50 transition";
      });

      // 高亮選取
      document.getElementById(`mc-${stageId}-${qIdx}-${val}`).className = "px-2.5 py-0.5 rounded border-2 border-sky-600 bg-sky-100 text-sky-700 font-bold text-xs transition";
      q.userAns = val;
    }

    // 配對題：先點選單字池單字
    function selectWord(word) {
      selectedAnswer = word;
      speakWord(word);
    }

    // 配對題：再點選題目框填入
    function activateMatchRow(rowElem, stageId, qIdx, rawText) {
      speakWord(rawText);
      if (selectedAnswer) {
        // 填入答案
        const targetSpan = document.getElementById(`match-val-${stageId}-${qIdx}`);
        targetSpan.innerText = selectedAnswer;
        
        const q = appData.find(s => s.id === stageId).questions[qIdx];
        q.userAns = selectedAnswer;

        // 解除選取狀態
        selectedAnswer = null;
      }
    }

    // 5. 獨立組別控制（批改、解答、清空）

    // 單獨組別批改
    function checkStage(stageId) {
      const stage = appData.find(s => s.id === stageId);
      let correctCount = 0;

      stage.questions.forEach((q, idx) => {
        let isCorrect = false;
        if (currentMode === "tf") {
          isCorrect = q.userAns === q.ans;
        } else if (currentMode === "mc") {
          isCorrect = q.userAns === q.correctOpt;
        } else {
          isCorrect = q.userAns === q.options[0]; // 預設正確單字放 options 第一個
        }

        if (isCorrect) correctCount++;
      });

      const scoreBadge = document.getElementById(`score-${stageId}`);
      scoreBadge.innerText = `答對 ${correctCount} / 5 題`;
      scoreBadge.classList.remove("hidden");
    }

    // 單獨組別清除
    function clearStage(stageId) {
      const stage = appData.find(s => s.id === stageId);
      stage.questions.forEach(q => q.userAns = undefined);
      
      const scoreBadge = document.getElementById(`score-${stageId}`);
      scoreBadge.classList.add("hidden");

      // 重新渲染該組別
      renderApp();
    }

    // 單獨組別顯示解答與中文解析
    function revealStage(stageId) {
      const stage = appData.find(s => s.id === stageId);
      stage.questions.forEach((q, idx) => {
        if (currentMode === "tf") {
          setTFAnswer(stageId, idx, q.ans);
        } else if (currentMode === "mc") {
          setMCAnswer(stageId, idx, q.correctOpt);
        } else {
          const targetSpan = document.getElementById(`match-val-${stageId}-${idx}`);
          if (targetSpan) targetSpan.innerText = q.options[0];
          q.userAns = q.options[0];
        }
      });
    }

    // 全域切換題型模式
    function switchMode(mode) {
      currentMode = mode;
      
      // 更新按鈕樣式
      const modes = ['tf', 'mc', 'match'];
      modes.forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (m === mode) {
          btn.className = "py-2 rounded-lg text-sm font-bold border transition bg-sky-600 text-white border-sky-600 shadow";
        } else {
          btn.className = "py-2 rounded-lg text-sm font-bold border transition bg-white text-slate-700 border-slate-300 hover:bg-slate-50";
        }
      });

      renderApp();
    }

    // 全域重設（名字重新洗牌洗掉，徹底防死背）
    function globalClear() {
      initData();
      renderApp();
    }

    // 初始化
    window.onload = function() {
      initData();
      renderApp();
    };
  </script>
</body>
</html>
