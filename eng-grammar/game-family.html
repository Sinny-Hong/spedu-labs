<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meet My Family!｜異想家庭</title>
<style>
:root{--cream:#fff9ec;--gold:#f5b942;--coral:#e7655d;--ink:#385f81;--blue:#2477cd;--green:#168a57;--red:#d83f43;--line:#dce7ef}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{background:var(--cream);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS","Microsoft JhengHei",sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.topbar{min-height:80px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 17px}h1{margin:0;font-size:clamp(24px,2.35vw,38px)}.toolbar,.quiztools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tool,select{background:#fff;color:var(--ink);border:2px solid var(--gold);border-radius:11px;padding:7px 11px;font-weight:700}.tool:hover,select:hover{background:#fff5d9}#check{background:var(--green);border-color:var(--green);color:white}#reveal{border-color:#efadb3;color:var(--red)}#score{font-size:18px;color:var(--green);font-weight:bold;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 12px 12px;height:calc(100dvh - 80px);min-height:550px}.panel{min-width:0;min-height:0;background:white;border:2px solid var(--gold);border-radius:23px;padding:12px;display:flex;flex-direction:column}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;min-height:52px}h2{margin:0;font-size:clamp(21px,1.75vw,29px)}.tree-area{flex:1;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center}.family-svg{width:100%;height:100%;max-width:100%;max-height:100%;display:block}.person{cursor:pointer;outline:none}.person-card{fill:white;stroke:var(--gold);stroke-width:7}.person.active .person-card,.person:focus-visible .person-card{fill:#e7f2ff;stroke:var(--blue);stroke-width:12}.person-label{fill:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:bold}
.questions{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;overflow-y:auto}.question{border-bottom:1px solid var(--line);padding:8px 1px;min-width:0}.question-line{display:flex;align-items:baseline;gap:5px;font-size:clamp(19px,1.6vw,28px);font-weight:bold;line-height:1.35;cursor:pointer;border-radius:7px}.question-line:hover,.question-line:focus-visible{background:#f0f7ff;outline:none}.question-line:focus-visible{box-shadow:0 0 0 2px var(--blue)}.answer-blank{flex:none;color:var(--blue);white-space:nowrap;min-width:3em}.answer-blank.good{color:var(--green)}.answer-blank.reveal{color:var(--red)}.question-text{min-width:0}.options{margin-left:3.3em;display:flex;gap:clamp(7px,1vw,20px);align-items:baseline;flex-wrap:wrap;font-size:clamp(17px,1.35vw,24px)}.choice{border:0;border-radius:5px;background:transparent;color:var(--ink);padding:3px 5px;text-align:left}.choice.selected{color:var(--blue);background:#e4f0ff}.choice.correct{color:var(--green);background:#e3f5e9}.choice.reveal{color:var(--red);background:#ffe8e8}.choice:disabled{cursor:default}.intro{font-size:13px;color:#67829a;margin-left:auto}
.overlay{position:fixed;inset:0;z-index:100;background:#183040a8;display:flex;align-items:center;justify-content:center;padding:12px}.overlay[hidden]{display:none}.modal{background:#fffdf7;color:var(--ink);border:3px solid var(--gold);border-radius:19px;width:min(1100px,96vw);max-height:90dvh;display:flex;flex-direction:column;overflow:hidden}.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;background:var(--cream);border-bottom:2px solid var(--gold)}.modal-head h2{font-size:clamp(20px,2vw,28px)}.modal-body{overflow:auto;min-height:0;padding:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:8px 13px;border:2px solid #9eb7ce;border-radius:10px;background:white;color:var(--ink);font-weight:bold}.tab.active{color:white;background:#168bd0;border-color:#168bd0}.word-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.word-card{background:white;border:2px solid #c9d9e8;border-radius:12px;overflow:hidden}.word-card h3{margin:0;padding:8px 10px;background:#e4edf7;font-size:19px}.word-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #cedbe7;min-height:45px}.word-zh,.word-en{padding:7px 9px;display:flex;align-items:center;font-size:19px}.word-zh{border-right:1px solid #cedbe7;font-weight:bold}.word-en{font-weight:bold;color:#285a84}.word-en button{border:0;background:transparent;color:inherit;font-size:inherit;font-weight:inherit;padding:4px;text-align:left;cursor:pointer;border-radius:6px}.word-en button:hover,.word-en button:focus-visible{background:#e7f2ff;color:var(--blue);outline:2px solid var(--blue)}.example.speakable{cursor:pointer;border-radius:7px;padding:4px}.example.speakable:hover,.example.speakable:focus-visible{background:#e7f2ff;outline:2px solid var(--blue)}.poster-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.poster-card{background:white;border:2px solid #c9d9e8;border-radius:14px;padding:13px}.poster-card h3{margin:0 0 8px;font-size:21px}.example{font-size:clamp(20px,1.7vw,25px);font-weight:bold;margin:8px 0}.translation{font-size:19px;margin:6px 0}.explain{background:#fff1cd;border-radius:9px;padding:10px;font-size:18px;margin-top:10px}.emphasis{color:var(--blue)}.modal-note{margin:0 0 13px;font-size:17px}
@media(max-width:980px){.layout{height:calc(100dvh - 115px)}.word-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:730px){.layout{grid-template-columns:1fr;height:auto;min-height:0}.tree-area{height:380px;flex:none}.questions{overflow:visible}.word-grid,.poster-grid{grid-template-columns:1fr}.question-line{font-size:21px}.options{font-size:19px}.topbar{padding:10px}}
@media print{@page{size:A4 landscape;margin:9mm}body{background:white}.toolbar,.quiztools,.overlay,.intro{display:none!important}.topbar{min-height:0;padding:4px}.layout{height:auto;min-height:150mm;grid-template-columns:1fr 1fr}.tree-area{height:140mm}.panel{break-inside:avoid}.questions{overflow:visible}.question-line{font-size:14pt}.options{font-size:12pt}}
</style>
</head>
<body>
<header class="topbar"><h1>🌳 Meet My Family!</h1><nav class="toolbar" aria-label="遊戲功能">
<select id="familyChoice" aria-label="選擇家庭"><option value="small:0">兩代家庭 A</option><option value="small:1">兩代家庭 B</option><option value="three:0">三代家庭 A</option><option value="three:1">三代家庭 B</option><option value="large:0">大家庭 A</option><option value="large:1">大家庭 B</option></select>
<button class="tool" id="next">↻ 換題</button><button class="tool" id="hint">💡 提示板</button><button class="tool" id="poster">📋 教學海報</button>
<span class="family-brand-slot"></span>
</nav></header>
<main class="layout"><section class="panel"><div class="panel-head"><h2>🌳 Family Tree</h2></div><div class="tree-area"><svg id="tree" class="family-svg" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Family tree"></svg></div></section>
<section class="panel"><div class="panel-head"><h2>✏️ Family Quiz</h2><div class="quiztools"><span id="score" aria-live="polite">— / 5</span><button id="check" class="tool">批改</button><button id="clear" class="tool">清除</button><button id="reveal" class="tool">解答</button></div></div><div id="questions" class="questions"></div></section></main>
<div id="hintOverlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="hintTitle"><div class="modal-head"><h2 id="hintTitle">💡 家人稱謂與親友提示總表</h2><button class="tool close-modal">✕ 關閉</button></div><div class="modal-body"><div id="wordTabs" class="tabs"><button class="tab active" data-tab="basic">🏠 家庭親屬</button><button class="tab" data-tab="other">🚻 人物與問句</button><button class="tab" data-tab="advanced">⚡ 進階親屬</button></div><p class="modal-note">點擊英文單字即可朗讀，也可以使用手上的紙本提示卡。</p><div id="wordContent" class="word-grid"></div></div></section></div>
<div id="posterOverlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="posterTitle"><div class="modal-head"><h2 id="posterTitle">📋 Family Sentence Guide</h2><button class="tool close-modal">✕ 關閉</button></div><div class="modal-body"><p class="modal-note">點擊英文句子即可朗讀。</p><div id="posterContent" class="poster-grid"></div></div></section></div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';const $=s=>document.querySelector(s);const tree=$('#tree'),quiz=$('#questions');
const families={
small:[{father:'Tom',mother:'Mary',me:'Alex',brother:'Jack',sister:'Lucy'},{father:'David',mother:'Anna',me:'Ben',brother:'Eric',sister:'Emma'}],
three:[{grandpa:'John',grandma:'Helen',father:'Tom',mother:'Mary',me:'Alex',brother:'Jack',sister:'Lucy'},{grandpa:'Peter',grandma:'Susan',father:'David',mother:'Anna',me:'Ben',brother:'Eric',sister:'Emma'}],
large:[{grandpa:'John',grandma:'Helen',uncle:'Peter',aunt:'Linda',father:'Tom',mother:'Mary',cousin1:'Jenny',cousin2:'Eric',me:'Alex',brother:'Jack'},{grandpa:'George',grandma:'Susan',uncle:'David',aunt:'Kate',father:'Ben',mother:'Lisa',cousin1:'Amy',cousin2:'Sam',me:'Kevin',brother:'Ryan'}]
};
const roles={grandpa:'👴',grandma:'👵',father:'👨',mother:'👩',uncle:'👨',aunt:'👩',me:'👦',brother:'👦',sister:'👧',cousin1:'👧',cousin2:'👦'};
const positions={
small:{father:[300,150],mother:[520,150],me:[80,585],sister:[410,585],brother:[740,585]},
three:{grandpa:[300,20],grandma:[520,20],father:[300,320],mother:[520,320],me:[80,650],sister:[410,650],brother:[740,650]},
large:{grandpa:[300,25],grandma:[520,25],uncle:[60,345],aunt:[300,345],father:[540,345],mother:[780,345],cousin1:[60,665],cousin2:[300,665],me:[540,665],brother:[780,665]}
};
// Drawing connected family units: spouses via midpoint, vertical branches from parents to children.
const paths={
small:['M480 255 H520','M500 255 V495','M170 495 H830','M170 495 V585','M500 495 V585','M830 495 V585'],
three:['M480 125 H520','M500 125 V265','M390 265 V320','M390 265 H390','M480 425 H520','M500 425 V570','M170 570 H830','M170 570 V650','M500 570 V650','M830 570 V650'],
large:['M480 130 H520','M500 130 V285','M150 285 H630','M150 285 V345','M630 285 V345','M240 450 H300','M270 450 V615','M150 615 H390','M150 615 V665','M390 615 V665','M720 450 H780','M750 450 V615','M630 615 H870','M630 615 V665','M870 615 V665']
};
// In three generations, grandparents connect to father (not to his spouse).
paths.three.splice(2,2,'M390 265 H500','M390 265 V320');
let level='small',family=families.small[0],questions=[],answers={},mode='answer',highlighted=[],lastBatch='';
function svgNode(tag,attrs={},parent=tree){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));parent.append(el);return el}
function svgText(parent,x,y,value,size){const el=svgNode('text',{x,y,'text-anchor':'middle','font-size':size,class:'person-label'},parent);el.textContent=value;return el}
function toggleHighlight(role){const index=highlighted.indexOf(role);if(index>=0)highlighted.splice(index,1);else{if(highlighted.length>=2)highlighted.shift();highlighted.push(role)}drawFamily()}
function drawFamily(){tree.replaceChildren();const lines=svgNode('g',{fill:'none',stroke:'#e7655d','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'});paths[level].forEach(d=>svgNode('path',{d},lines));Object.entries(positions[level]).forEach(([role,[x,y]])=>{const name=family[role];const g=svgNode('g',{transform:`translate(${x},${y})`,class:'person',role:'button',tabindex:'0','aria-label':`高亮 ${name}`});if(highlighted.includes(role))g.classList.add('active');svgNode('rect',{x:0,y:0,width:180,height:210,rx:23,class:'person-card'},g);svgNode('line',{x1:0,y1:145,x2:180,y2:145,stroke:'#f5b942','stroke-width':5},g);svgText(g,90,109,roles[role],87);svgText(g,90,189,name,name.length>7?30:39);g.addEventListener('click',()=>toggleHighlight(role));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleHighlight(role)}})})}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function who(text,role){const correct=family[role];const other=shuffle(Object.values(family).filter(n=>n!==correct)).slice(0,2);return{text,correct,options:shuffle([correct,...other])}}
function word(text,correct,a,b){return{text,correct,options:shuffle([correct,a,b])}}
function buildBank(){const f=family;const q=[who(`Who is ${f.me}'s father?`,'father'),who(`Who is ${f.me}'s mother?`,'mother'),who(`Who is ${f.mother}'s husband?`,'father'),who(`Who is ${f.father}'s wife?`,'mother'),who(`Who is ${f.me}'s brother?`,'brother'),word(`${f.father} is ${f.me}'s ____.`,'father','brother','uncle'),word(`${f.mother} is ${f.me}'s ____.`,'mother','aunt','sister'),word(`${f.brother} is ${f.me}'s ____.`,'brother','father','cousin'),word(`${f.me} is ${f.father}'s ____.`,'son','brother','uncle'),word(`${f.father} is ${f.mother}'s ____.`,'husband','son','brother'),word(`${f.mother} is ${f.father}'s ____.`,'wife','mother','sister')];if(level!=='large')q.push(who(`Who is ${f.me}'s sister?`,'sister'),who(`Who is ${f.father}'s daughter?`,'sister'),word(`${f.sister} is ${f.me}'s ____.`,'sister','mother','aunt'),word(`${f.me} is ${f.sister}'s ____.`,'brother','father','uncle'));if(level!=='small')q.push(who(`Who is ${f.father}'s father?`,'grandpa'),who(`Who is ${f.father}'s mother?`,'grandma'),word(`${f.grandpa} is ${f.me}'s ____.`,'grandfather','father','uncle'),word(`${f.grandma} is ${f.me}'s ____.`,'grandmother','mother','aunt'),word(`${f.me} is ${f.grandpa}'s ____.`,'grandson','son','brother'));if(level==='large')q.push(who(`Who is ${f.father}'s brother?`,'uncle'),who(`Who is ${f.cousin1}'s father?`,'uncle'),who(`Who is ${f.cousin2}'s mother?`,'aunt'),word(`${f.uncle} is ${f.me}'s ____.`,'uncle','father','brother'),word(`${f.aunt} is ${f.me}'s ____.`,'aunt','mother','sister'),word(`${f.cousin1} is ${f.me}'s ____.`,'cousin','sister','mother'),word(`${f.cousin2} is ${f.me}'s ____.`,'cousin','brother','uncle'),word(`${f.uncle} is ${f.father}'s ____.`,'brother','father','son'));return q}
function newQuestions(){const bank=buildBank();let selected=[],key='';for(let attempt=0;attempt<20;attempt++){selected=shuffle(bank).slice(0,5);key=selected.map(q=>q.text).sort().join('|');if(key!==lastBatch)break}lastBatch=key;questions=selected;answers={};mode='answer';highlighted=[];$('#score').textContent='— / 5';drawFamily();renderQuestions()}
// Locate the family member before the possessive ('s). Never highlight the answer automatically.
function focusQuestionPerson(text){const found=Object.entries(family).find(([role,name])=>text.includes(name+"'s")||text.includes(name+'’s'));if(!found)return;highlighted=[found[0]];drawFamily()}
function renderQuestions(){quiz.replaceChildren();questions.forEach((q,i)=>{const section=document.createElement('div');section.className='question';const line=document.createElement('div');line.className='question-line';line.tabIndex=0;line.setAttribute('role','button');line.setAttribute('aria-label',`第${i+1}題：點擊以定位題目人物`);line.title='點擊題目，左側自動高亮起點人物';const blank=document.createElement('span');blank.className='answer-blank';const selected=answers[i],correctIndex=q.options.indexOf(q.correct),correct=q.options[selected]===q.correct;let letter='　';if(mode==='reveal'){letter='ABC'[correctIndex];blank.classList.add('reveal')}else if(mode==='checked'){if(correct){letter='ABC'[selected];blank.classList.add('good')}}else if(selected!==undefined)letter='ABC'[selected];blank.textContent=`（${letter}）`;const title=document.createElement('span');title.className='question-text';title.textContent=`${i+1}. ${q.text}`;line.append(blank,title);line.addEventListener('click',()=>focusQuestionPerson(q.text));line.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusQuestionPerson(q.text)}});section.append(line);const options=document.createElement('div');options.className='options';q.options.forEach((choice,j)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.textContent=`(${String.fromCharCode(65+j)}) ${choice}`;if(mode==='answer'&&selected===j)button.classList.add('selected');if(mode==='checked'&&correct&&selected===j)button.classList.add('correct');if(mode==='reveal'&&j===correctIndex)button.classList.add('reveal');button.disabled=mode!=='answer';button.setAttribute('aria-pressed',String(mode==='answer'&&selected===j));button.addEventListener('click',()=>{if(mode!=='answer')return;answers[i]=j;renderQuestions()});options.append(button)});section.append(options);quiz.append(section)})}
function checkAnswers(){const n=questions.filter((q,i)=>q.options[answers[i]]===q.correct).length;mode='checked';$('#score').textContent=`${n} / 5`;renderQuestions()}
function clearAnswers(){answers={};mode='answer';$('#score').textContent='— / 5';renderQuestions()}
function revealAnswers(){mode='reveal';$('#score').textContent='解答';renderQuestions()}
function changeFamily(){const [l,i]=$('#familyChoice').value.split(':');level=l;family=families[level][Number(i)];lastBatch='';newQuestions()}
const wordGroups={
basic:[{title:'1. 基礎家庭',words:[['爸爸／父親','father'],['媽媽／母親','mother'],['哥哥／弟弟','brother'],['姊姊／妹妹','sister'],['爺爺／外公','grandfather'],['奶奶／外婆','grandmother']]},{title:'2. 夫妻與子女',words:[['丈夫','husband'],['妻子','wife'],['兒子','son'],['女兒','daughter'],['孩子','child'],['父母雙親','parents']]},{title:'3. 親戚與孫輩',words:[['叔伯／舅舅／姨丈','uncle'],['姑姑／阿姨／嬸嬸','aunt'],['堂／表兄弟姊妹','cousin'],['祖父母','grandparents'],['孫子／外孫','grandson'],['孫女／外孫女','granddaughter']]}],
other:[{title:'4. 性別與人物',words:[['男人','man'],['女人','woman'],['男孩','boy'],['女孩','girl'],['家庭','family'],['朋友','friend']]},{title:'5. 讀題常見字',words:[['誰','who'],['什麼','what'],['哪一個','which'],['我的','my'],['他的','his'],['她的','her']]}],
advanced:[{title:'6. 進階親屬',words:[['姪子／外甥','nephew'],['姪女／外甥女','niece'],['兄弟姊妹','siblings'],['親戚','relative'],['岳父／公公','father-in-law'],['岳母／婆婆','mother-in-law']]},{title:'7. 描述詞',words:[['年長的','older'],['年幼的','younger'],['相同的','same'],['不同的','different'],['單身的','single'],['已婚的','married']]}]
};
function renderWords(tab='basic'){const root=$('#wordContent');root.replaceChildren();document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));wordGroups[tab].forEach(group=>{const card=document.createElement('section');card.className='word-card';const heading=document.createElement('h3');heading.textContent=group.title;card.append(heading);group.words.forEach(([zh,en])=>{const row=document.createElement('div');row.className='word-row';const cn=document.createElement('div');cn.className='word-zh';cn.textContent=zh;const eng=document.createElement('div');eng.className='word-en';const play=document.createElement('button');play.type='button';play.textContent=en;play.title='點擊朗讀 '+en;play.setAttribute('aria-label','朗讀 '+en);play.addEventListener('click',()=>speak(en));eng.append(play);row.append(cn,eng);card.append(row)});root.append(card)})}
const posterEntries=[
{title:'① 介紹家人',english:'This is my mother.',chinese:'這是我的媽媽。',note:'This is my + 家庭稱謂。'},
{title:'② 判斷關係',english:"Mary is Alex's mother.",chinese:'Mary 是 Alex 的媽媽。',note:"Alex's = Alex 的。先找 Alex，再找 mother。"},
{title:'③ 詢問人物',english:"Who is Mary's husband?",chinese:'誰是 Mary 的丈夫？',note:"Who = 誰。Mary's husband = Mary 的丈夫。"},
{title:'④ 選擇題填空',english:"Tom is Mary's husband.",chinese:'Tom 是 Mary 的丈夫。',note:'先找 Mary，再判斷 Tom 與她的關係。'},
{title:"⑤ 所有格 's",english:"Ben's father is David.",chinese:'Ben 的爸爸是 David。',note:"A's B = A 的 B。先看 's 前的人名。"},
{title:'⑥ 問句與回答',english:"Who is Alex's sister? Lucy is Alex's sister.",chinese:'誰是 Alex 的姊妹？Lucy 是 Alex 的姊妹。',note:'找出 Alex 後，再從兄弟姊妹分支判斷。'}
];
function speak(sentence){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀。');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(sentence);utterance.lang='en-US';utterance.rate=.82;speechSynthesis.speak(utterance)}
function renderPoster(){const root=$('#posterContent');root.replaceChildren();posterEntries.forEach(entry=>{const card=document.createElement('article');card.className='poster-card';const h=document.createElement('h3');h.textContent=entry.title;const en=document.createElement('p');en.className='example speakable';en.textContent=entry.english;en.tabIndex=0;en.setAttribute('role','button');en.title='點擊朗讀英文句子';en.setAttribute('aria-label','朗讀 '+entry.english);en.addEventListener('click',()=>speak(entry.english));en.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak(entry.english)}});const cn=document.createElement('p');cn.className='translation';cn.textContent=entry.chinese;const note=document.createElement('div');note.className='explain';note.textContent=entry.note;card.append(h,en,cn,note);root.append(card)})}
const hintOverlay=$('#hintOverlay'),posterOverlay=$('#posterOverlay');let previousFocus=null;
function openOverlay(overlay){previousFocus=document.activeElement;overlay.hidden=false;document.body.style.overflow='hidden';overlay.querySelector('.close-modal').focus()}
function closeOverlays(){hintOverlay.hidden=true;posterOverlay.hidden=true;document.body.style.overflow='';if('speechSynthesis' in window)speechSynthesis.cancel();if(previousFocus?.isConnected)previousFocus.focus()}
$('#hint').addEventListener('click',()=>{renderWords('basic');openOverlay(hintOverlay)});$('#poster').addEventListener('click',()=>{renderPoster();openOverlay(posterOverlay)});
document.querySelectorAll('.close-modal').forEach(b=>b.addEventListener('click',closeOverlays));[hintOverlay,posterOverlay].forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlays()}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>renderWords(b.dataset.tab)));
document.addEventListener('keydown',e=>{const active=!hintOverlay.hidden?hintOverlay:!posterOverlay.hidden?posterOverlay:null;if(!active)return;if(e.key==='Escape'){closeOverlays();return}if(e.key==='Tab'){const items=[...active.querySelectorAll('button:not(:disabled)')].filter(el=>el.getClientRects().length);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#familyChoice').addEventListener('change',changeFamily);$('#next').addEventListener('click',newQuestions);$('#check').addEventListener('click',checkAnswers);$('#clear').addEventListener('click',clearAnswers);$('#reveal').addEventListener('click',revealAnswers);changeFamily();
</script><script src="../shared/js/public-footer.js" data-footer-target=".family-brand-slot" data-footer-short="true"></script></body></html>
