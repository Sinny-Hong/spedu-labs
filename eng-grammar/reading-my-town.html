<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Town 異想小鎮｜雙面列印學習單</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf1;color:#20374d;font-family:'Trebuchet MS',Arial,'Noto Sans TC',sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 10px #0002}.toolbar button{font:700 16px Arial;background:#f59e0b;color:white;border:0;border-radius:9px;padding:10px 20px;cursor:pointer}.toolbar span{font-weight:bold}.pages{padding:18px;display:flex;flex-direction:column;align-items:center;gap:18px}.sheet{width:210mm;height:297mm;background:white;padding:11mm 12mm 9mm;box-shadow:0 2px 16px #0002;display:flex;flex-direction:column;overflow:hidden}.heading{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid #e2a43b;padding-bottom:5px;gap:12px}.heading h1{font-size:22px;margin:0;line-height:1.3;white-space:nowrap}.student{font-size:14px;white-space:nowrap;font-weight:600}.instruction{font-size:14px;font-weight:bold;margin:8px 0 7px}.map{position:relative;width:100%;height:98mm;flex-shrink:0;border:2px solid #dbe7d8;background:#ecf3e8;border-radius:9px;overflow:hidden}.road{position:absolute;background:#d6dfe2}.road.vertical{left:45.5%;width:9%;top:0;height:100%}.road.horizontal{left:0;width:100%;height:12%}.road.main{top:30%}.road.park{top:65%}.street{position:absolute;z-index:3;font-size:11px;font-weight:800;color:#455968;background:#ffffffd9;padding:1px 5px;border-radius:4px;white-space:nowrap}.street.main{left:5%;top:34%}.street.park{left:5%;top:69%}.street.sun{left:50%;top:16%;transform:translate(-50%,-50%) rotate(-90deg)}.block{position:absolute;display:flex;justify-content:space-around;align-items:stretch;gap:1px;padding:1px}.place{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}.emoji{font-size:24px;line-height:1.1}.word{font-size:11px;line-height:1.1;font-weight:800;overflow-wrap:anywhere}.questions{display:grid;grid-template-columns:1fr;gap:20px;margin-top:12px}.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#edf4f9;border:1px solid #cbdbe9;border-radius:6px;padding:7px 10px;margin-top:12px;font-weight:800;font-size:17px}.quiz-actions{display:flex;gap:7px;align-items:center}.quiz-actions button{border:1px solid #a9c2d9;background:white;border-radius:5px;padding:4px 11px;font-size:13px;font-weight:700;color:#214c72;cursor:pointer}.grade-result{font-size:14px;color:#a56b0a}.answer-slot{display:inline-flex;align-items:center;justify-content:center;width:45px;height:28px;margin-right:8px;vertical-align:middle;font-size:19px;font-weight:800;color:#205989;background:transparent}.answer-slot::before{content:"（"}.answer-slot::after{content:"）"}.answer-slot.correct{background:#e4f6e8;border-color:#269451;color:#177342}.answer-slot.wrong{background:#fff0ee;border-color:#c75a4e;color:#ac3c31}.answer-slot.reveal{background:#fff5d6;border-color:#d69d30;color:#895b0d}.q{display:flex;align-items:baseline;gap:8px;break-inside:avoid}.qnumber{width:23px;flex:none;font-size:17px;font-weight:800}.qbody{flex:1;min-width:0}.qtext{font-size:19px;font-weight:700;line-height:1.35}.options{display:flex;flex-direction:row;flex-wrap:wrap;column-gap:26px;row-gap:5px;margin-top:7px;font-size:18px;line-height:1.4}.option{display:block;width:fit-content;min-width:0;padding:1px 5px;border-radius:4px;cursor:pointer;white-space:normal}.option:hover,.option:focus-visible{background:#e7f1fc;outline:1px solid #a5c7e6}.option.selected{background:#dcecff;color:#164a78;font-weight:800}.option.correct-choice{color:#17804d;font-weight:800}.option.wrong-choice{color:#ba443b}.option .mark{display:none}.footer{margin-top:auto;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;color:#8996a1;font-size:10px;padding-top:5px;border-top:1px solid #eef1f4}.footer .credit{letter-spacing:.35px}.pageid{font-size:10px;color:#8996a1}.small-note{font-size:12px;color:#526a77;margin:0}.print-help{font-size:12px;color:#536b7e}@page{size:A4 portrait;margin:0}@media print{.quiz-actions,.grade-result{display:none!important}.answer-slot{color:transparent!important;background:transparent!important;border:0!important}.option.selected,.option.correct-choice,.option.wrong-choice{background:transparent!important;color:inherit!important;font-weight:normal!important}.option .mark{color:transparent!important}}@media print{.questions{gap:19px}.options{column-gap:24px}.footer{min-height:9mm}html,body{width:210mm;background:#fff!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.toolbar{display:none!important}.pages{display:block;padding:0;gap:0}.sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}}@media screen and (max-width:850px){.pages{align-items:flex-start;overflow-x:auto}.toolbar{position:static}.sheet{flex:none}}

.toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar button{background:#fff;color:#1b4c73;border:1px solid #aac3d8;padding:9px 16px}.toolbar button.active{background:#f59e0b;color:#fff;border-color:#f59e0b}.toolbar #print{background:#1f5d8c;color:#fff;border-color:#1f5d8c}
.map .emoji{font-size:30px}.map .word{font-size:13px;line-height:1.15}.map .street{font-size:12px}
.questions{gap:32px;margin-top:19px}.q{align-items:baseline;gap:5px}.answer-blank{flex:none;font-size:18px;font-weight:700;white-space:pre;letter-spacing:0}.qnumber{width:26px;font-size:18px}.qtext{font-size:19px;line-height:1.45}.options{margin-top:10px;font-size:18px;column-gap:35px;row-gap:6px}.option{padding:0;cursor:default}.quiz-head{margin-top:14px}.footer{font-size:9px}.footer .credit{letter-spacing:0}
@media print{.questions{gap:32px}.options{column-gap:35px}.answer-blank{display:inline!important;visibility:visible!important;color:#20374d!important}.sheet{overflow:hidden}}
</style></head><body><div class="toolbar"><span>🏙️ My Town｜異想小鎮學習單</span><div class="toolbar-actions"><button id="original" data-mode="original">原始版</button><button id="random" data-mode="random">隨機版</button><button id="print">列印</button></div></div><main class="pages" id="pages"></main><script>
'use strict';
const PLACES=[['🏫','school'],['🏥','hospital'],['🌳','park'],['🏦','bank'],['📮','post office'],['📚','bookstore'],['💐','flower shop'],['🛒','supermarket'],['🏪','convenience store'],['🍽️','restaurant'],['🏨','hotel'],['👮','police station'],['🚒','fire station'],['🎬','movie theater'],['🍞','bakery'],['📖','library'],['☕','coffee shop'],['🏬','department store'],['🏛️','museum'],['🚌','bus stop'],['🚉','train station'],['🏋️','gym'],['🏠','home']];
const GROUPS=[{x:1,y:1,w:43,h:28,count:3},{x:56,y:1,w:43,h:28,count:2},{x:1,y:43,w:43,h:21,count:3},{x:56,y:43,w:43,h:21,count:2},{x:1,y:78,w:43,h:21,count:3},{x:56,y:78,w:43,h:21,count:2}];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LETTERS='ABC';
function buildRandomPage(){
 const places=shuffle(PLACES.map(p=>p[1])).slice(0,15),slots=[];let k=0;
 GROUPS.forEach((g,group)=>{for(let pos=0;pos<g.count;pos++)slots.push({name:places[k++],group,pos})});
 const pools={between:[],next:[],across:[],near:[],left:[],right:[],corner:[],street:[]};
 const by=(g,pos)=>slots.find(s=>s.group===g&&s.pos===pos);
 const same=a=>slots.filter(b=>b.group===a.group&&b.name!==a.name);
 function add(kind,q,valid,wrongPool){if(valid.length)pools[kind].push({q,valid:[...new Set(valid)],wrongPool})}
 for(const a of slots){
  const peers=same(a);
  const adjacent=peers.filter(b=>Math.abs(b.pos-a.pos)===1);
  add('next',`What is next to the ${a.name}?`,adjacent.map(b=>b.name),peers.filter(b=>Math.abs(b.pos-a.pos)>1).map(b=>b.name));
  add('near',`What is near the ${a.name}?`,adjacent.map(b=>b.name),slots.filter(b=>b.group!==a.group).map(b=>b.name));
  add('left',`What is to the left of the ${a.name}?`,peers.filter(b=>b.pos<a.pos).map(b=>b.name),peers.filter(b=>b.pos>a.pos).map(b=>b.name));
  add('right',`What is to the right of the ${a.name}?`,peers.filter(b=>b.pos>a.pos).map(b=>b.name),peers.filter(b=>b.pos<a.pos).map(b=>b.name));
 }
 for(const g of [0,2,4]){
  const a=by(g,0),b=by(g,1),c=by(g,2);
  add('between',`What is between the ${a.name} and the ${c.name}?`,[b.name],slots.filter(s=>s.group!==g).map(s=>s.name));
 }
 for(let row=0;row<3;row++){
  const left=by(row*2,2),right=by(row*2+1,0);
  add('across',`What is across from the ${left.name}?`,[right.name],slots.filter(s=>s.group!==right.group).map(s=>s.name));
  add('across',`What is across from the ${right.name}?`,[left.name],slots.filter(s=>s.group!==left.group).map(s=>s.name));
 }
 for(const [road,groups] of [['Main Street',[0,1,2,3]],['Park Street',[2,3,4,5]]]){
  const corners=groups.map(g=>by(g,g%2===0?2:0).name);
  add('corner',`What is on the corner of ${road} and Sun Road?`,corners,slots.filter(s=>!corners.includes(s.name)).map(s=>s.name));
 }
 for(const [road,groups] of [['Main Street',[0,1,2,3]],['Park Street',[2,3,4,5]]]){
  const valid=slots.filter(s=>groups.includes(s.group)).map(s=>s.name);
  add('street',`What is on ${road}?`,valid,slots.filter(s=>!groups.includes(s.group)).map(s=>s.name));
 }
 const kinds=shuffle(Object.keys(pools)).slice(0,5);
 const questions=kinds.map(kind=>{
  const candidates=shuffle(pools[kind]);
  for(const q of candidates){
   const answer=shuffle(q.valid)[0];
   const preferred=(q.wrongPool||[]).filter(n=>!q.valid.includes(n)&&n!==answer);
   const fallback=slots.map(s=>s.name).filter(n=>!q.valid.includes(n)&&n!==answer&&!preferred.includes(n));
   const wrong=[...shuffle(preferred),...shuffle(fallback)];
   if(wrong.length>=2){const options=shuffle([answer,...wrong.slice(0,2)]);return {q:q.q,options,answer}}
  }
  throw Error('Cannot create unique options for '+kind);
 });
 return {places,questions:shuffle(questions)};
}
// 固定兩頁資料：明確寫死地圖、題目、選項與正解；每次開啟完全相同。
const PAGES=[
{places:['school','hospital','park','bank','post office','coffee shop','library','bookstore','bakery','home','fire station','restaurant','hotel','gym','movie theater'],questions:[
{q:'What is between the school and the park?',options:['bank','library','hospital'],answer:'hospital'},
{q:'What is next to the library?',options:['hotel','bookstore','post office'],answer:'bookstore'},
{q:'What is across from the park?',options:['bakery','gym','bank'],answer:'bank'},
{q:'What is on Park Street?',options:['school','restaurant','bank'],answer:'restaurant'},
{q:'What is on the corner of Main Street and Sun Road?',options:['hotel','library','park'],answer:'park'}]},
{places:['flower shop','museum','train station','supermarket','police station','department store','convenience store','restaurant','gym','bus stop','bank','hotel','school','library','home'],questions:[
{q:'What is between the flower shop and the train station?',options:['bank','museum','restaurant'],answer:'museum'},
{q:'What is next to the convenience store?',options:['school','bus stop','department store'],answer:'department store'},
{q:'What is across from the restaurant?',options:['gym','convenience store','train station'],answer:'gym'},
{q:'What is on Main Street?',options:['home','supermarket','hotel'],answer:'supermarket'},
{q:'What is to the right of the bank?',options:['museum','flower shop','hotel'],answer:'hotel'}]}
];
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function createMap(page){const map=el('div','map');[['road vertical',''],['road horizontal main',''],['road horizontal park',''],['street main','Main Street'],['street park','Park Street'],['street sun','Sun Road']].forEach(([c,t])=>map.append(el('div',c,t)));
let i=0;GROUPS.forEach(g=>{const block=el('div','block');Object.assign(block.style,{left:g.x+'%',top:g.y+'%',width:g.w+'%',height:g.h+'%'});for(let j=0;j<g.count;j++){const name=page.places[i++];const item=PLACES.find(p=>p[1]===name);if(!item)throw Error('Unknown place '+name);const place=el('div','place');place.append(el('div','emoji',item[0]),el('div','word',name));block.append(place)}map.append(block)});return map}
function createPage(page,n){
 const sheet=el('article','sheet');const heading=el('div','heading');heading.append(el('h1','', 'My Town｜異想小鎮'),el('div','student','班級：________　姓名：____________'));
 sheet.append(heading,el('div','instruction','Look at the map and choose the correct answer. 看地圖，選出正確答案。'),createMap(page));
 sheet.append(el('div','quiz-head','選擇題｜看地圖選出正確答案（每題 1 分）'));
 const questions=el('div','questions');
 page.questions.forEach((q,i)=>{
  if(!q.options.includes(q.answer)||new Set(q.options).size!==3)throw Error('Invalid options on page '+n+' question '+i);
  const line=el('div','q');const body=el('div','qbody');body.append(el('div','qtext',q.q));
  const options=el('div','options');q.options.forEach((opt,j)=>options.append(el('span','option',`(${LETTERS[j]}) ${opt}`)));
  body.append(options);line.append(el('span','answer-blank','（　）'),el('span','qnumber',String(i+1)+'.'),body);questions.append(line);
 });
 sheet.append(questions);
 const key=page.questions.map(q=>LETTERS[q.options.indexOf(q.answer)]).join('');
 const footer=el('div','footer');footer.append(el('span','','⭐ Great job!'),el('span','credit',`© SINNY ${key} SPEDU LABS`),el('span','pageid',`${n} / 2`));sheet.append(footer);return sheet;
}
const pagesNode=document.getElementById('pages');
function renderPages(pages){pagesNode.replaceChildren(...pages.map((p,i)=>createPage(p,i+1)))}
function activate(which){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===which))}
document.getElementById('original').addEventListener('click',()=>{renderPages(PAGES);activate('original')});
document.getElementById('random').addEventListener('click',()=>{try{const next=[buildRandomPage(),buildRandomPage()];renderPages(next);activate('random')}catch(err){console.error(err);alert('隨機題目產生失敗，請重試：'+err.message)}});
document.getElementById('print').addEventListener('click',()=>window.print());
renderPages(PAGES);activate('original');
</script><script src="../shared/js/public-footer.js"></script></body></html>
