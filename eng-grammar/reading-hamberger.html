<title>生活英文｜速食店點餐 A卷</title>

<style>

:root{
  --navy:#0B3768;
  --navy2:#174E82;
  --orange:#F59E0B;

  --page-bg:#EAF1F7;
  --white:#FFFFFF;
  --soft:#F3F7FB;
  --line:#D5E2EC;

  --text:#173552;

  --blue:#2879BA;
  --blue-soft:#EAF4FC;

  --green:#218653;
  --green-soft:#E7F5ED;

  --red:#C62828;

  --hint:#FFF0A6;
  --hint-line:#F1C44A;
}


/* =========================================================
   BASIC
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--page-bg);
  color:var(--text);

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  padding:18px 0 40px;
}

button{
  font:inherit;
}


/* =========================================================
   A4 LANDSCAPE
========================================================= */

.sheet{
  width:297mm;
  height:210mm;

  margin:0 auto 18px;
  padding:7mm 8mm;

  overflow:hidden;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);

  page-break-after:always;
}

.sheet:last-child{
  page-break-after:auto;
}


/* =========================================================
   HEADER
========================================================= */

.page-header{
  height:14mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8mm;

  margin-bottom:4mm;
}

.title-line{
  display:flex;
  align-items:baseline;

  gap:5mm;

  min-width:0;
}

.title-line h1{
  margin:0;

  color:var(--navy);

  font-size:20pt;
  line-height:1;

  font-weight:900;

  white-space:nowrap;
}

.subtitle{
  color:var(--orange);

  font-size:11pt;
  line-height:1;

  font-weight:900;

  white-space:nowrap;
}

.student-info{
  color:#33485C;

  font-size:10pt;

  white-space:nowrap;
}


/* =========================================================
   MAIN BODY
========================================================= */

.page-body{
  height:calc(100% - 18mm);

  display:grid;

  grid-template-columns:55% 45%;

  gap:5mm;
}

.left-panel,
.right-panel{
  min-width:0;
  min-height:0;
}


/* =========================================================
   LEFT
========================================================= */

.left-panel{
  display:grid;

  grid-template-rows:86mm 1fr;

  gap:4mm;
}


/* =========================================================
   MENU
========================================================= */

.menu-box{
  height:86mm;

  overflow:hidden;

  border:1.8px solid var(--navy);
  border-radius:4mm;

  background:#fff;
}

.menu-title{
  height:10mm;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--navy);

  color:#fff;

  font-size:13pt;
  font-weight:900;

  letter-spacing:.02em;
}

.menu-grid{
  height:calc(100% - 10mm);

  display:grid;

  background:#fff;
}


/* ---------- 10格 ---------- */

.menu-grid.count-10{
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
}


/* ---------- 8格 ---------- */

.menu-grid.count-8{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
}


/* ---------- 6格 ---------- */

.menu-grid.count-6{
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
}


/* ---------- 4格 ---------- */

.menu-grid.count-4{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:1fr;
}


/* ---------- 每個品項 ---------- */

.menu-item{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:1.5mm 1mm;

  text-align:center;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}


/* 圖片 */

.menu-icon{
  height:14mm;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27pt;
  line-height:1;
}


/* 英文品名 */

.menu-name{
  margin-top:1mm;

  color:var(--navy);

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:12.5pt;
  line-height:1.08;

  font-weight:700;

  letter-spacing:0;
  word-spacing:0;

  font-kerning:normal;
}


/* 價格 */

.menu-price{
  margin-top:1.2mm;

  color:#111;

  font-size:14pt;
  line-height:1;

  font-weight:900;
}


/* 促銷格 */

.promo-item{
  background:#FFF9EC;
}

.promo-item .menu-icon{
  font-size:24pt;
}

.promo-item .menu-name{
  color:#975D00;

  font-size:11.5pt;

  font-weight:900;
}

.promo-item .menu-price{
  color:var(--orange);

  font-size:12pt;
}


/* =========================================================
   DIALOGUE
========================================================= */

.dialogue-section{
  min-height:0;

  display:flex;
  flex-direction:column;
}


/* 只框標題 */

.dialogue-title{
  margin:0 0 2.5mm;

  padding:2.2mm 3mm;

  color:var(--navy);

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:3mm;

  font-size:14.5pt;
  line-height:1;

  font-weight:900;
}


/* 內容不包大框 */

.dialogue-content{
  flex:1;

  min-height:0;

  overflow:hidden;

  padding:1mm 3mm 0;
}


/* 人名凸排 */

.dialogue-line{
  display:grid;

  grid-template-columns:max-content 1fr;

  column-gap:2.5mm;

  margin-bottom:2.3mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:13.5pt;
  line-height:1.4;

  letter-spacing:0;
  word-spacing:0;
}

.dialogue-line:last-child{
  margin-bottom:0;
}

.speaker{
  font-weight:900;

  white-space:nowrap;
}

.speech{
  min-width:0;
}


/* Level 5 文字較長 */

.long-dialogue .dialogue-line{
  margin-bottom:1.5mm;

  font-size:12.5pt;
  line-height:1.32;
}


/* =========================================================
   RIGHT QUESTIONS
========================================================= */

.right-panel{
  height:100%;

  display:flex;
  flex-direction:column;

  min-height:0;
}


/* =========================================================
   QUESTION HEADER
========================================================= */

.question-head{
  min-height:13mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:3mm;

  padding:1.5mm 2.5mm;

  margin-bottom:2.5mm;

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:3mm;
}

.question-title-wrap{
  display:flex;
  align-items:center;

  gap:3mm;
}

.question-title{
  margin:0;

  color:var(--navy);

  font-size:14.5pt;

  font-weight:900;
}

.score{
  min-width:14mm;

  color:var(--green);

  font-size:12pt;

  font-weight:900;

  text-align:center;
}


/* =========================================================
   TOOL BUTTONS
========================================================= */

.tools{
  display:flex;
  align-items:center;

  gap:1.5mm;
}

.tools button{
  padding:1.5mm 2.7mm;

  border:1px solid #BFCFDE;
  border-radius:8px;

  background:#fff;

  color:var(--navy);

  font-size:9pt;
  font-weight:900;

  cursor:pointer;
}

.tools button:hover{
  border-color:var(--orange);
}

.tools button.active{
  color:#875100;

  background:#FFF2D7;

  border-color:var(--orange);
}


/* =========================================================
   QUESTIONS BODY
========================================================= */

.questions{
  flex:1;

  min-height:0;

  overflow:hidden;

  padding:0 1mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;
}

.question{
  margin-bottom:3mm;
}

.question:last-child{
  margin-bottom:0;
}


/* 題幹 */

.q-row{
  display:grid;

  grid-template-columns:13mm 1fr;

  column-gap:1.5mm;

  align-items:start;

  font-size:12.5pt;
  line-height:1.3;

  font-weight:800;
}


/* （ A ） */

.answer-slot{
  white-space:nowrap;

  text-align:right;
}

.answer-letter{
  display:inline-block;

  min-width:4mm;

  color:var(--blue);

  font-weight:900;
}

.answer-letter.correct{
  color:var(--green);
}

.answer-letter.solution{
  color:var(--red);
}


/* 題目文字 */

.q-text{
  min-width:0;
}


/* =========================================================
   OPTIONS
========================================================= */

.options{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:1mm 3.5mm;

  margin-top:1.2mm;

  /* 整組選項往右 */
  margin-left:17mm;
}

.option{
  padding:1mm 1.5mm;

  border:1px solid transparent;
  border-radius:6px;

  font-size:11.5pt;
  line-height:1.23;

  cursor:pointer;

  letter-spacing:0;
  word-spacing:0;
}

.option:hover{
  background:var(--blue-soft);
}


/* 已選答案 */

.option.selected{
  color:var(--navy);

  background:var(--blue-soft);

  border-color:#6CA6D3;
}


/* 答對 */

.option.correct{
  color:var(--green);

  background:var(--green-soft);

  border-color:#8BC4A3;

  font-weight:900;
}


/* =========================================================
   HINT
========================================================= */

.hint-word{
  padding:0 .5mm;

  border-radius:4px;

  transition:
    background .15s,
    box-shadow .15s;
}

.sheet.hint-on .hint-word{
  background:var(--hint);

  box-shadow:
    inset 0 -1.2px 0 var(--hint-line);
}


/* =========================================================
   PRINT
========================================================= */

@page{
  size:A4 landscape;
  margin:0;
}

@media print{

  html,
  body{
    width:297mm;

    margin:0;
    padding:0;

    background:#fff;
  }

  body{
    padding:0;
  }

  .sheet{
    width:297mm;
    height:210mm;

    margin:0;

    box-shadow:none;
  }

  .tools,
  .score{
    display:none !important;
  }
}


/* =========================================================
   MOBILE PREVIEW
========================================================= */

@media screen and (max-width:900px){

  body{
    overflow-x:auto;
  }

  .sheet{
    margin-left:0;
  }
}

</style>
</head>

      const regex =
        new RegExp(
          `(${escapeRegExp(word)})`,
          "gi"
        );

      result =
        result.replace(
          regex,
          `<span class="hint-word">$1</span>`
        );

    }
  );

  return result;
}


/* =========================================================
   RENDER
========================================================= */

const pages =
  document.getElementById(
    "pages"
  );


levels.forEach(
  (data,pageIndex)=>{


    /* ---------- MENU ---------- */

    const menuClass =
      `count-${data.menu.length}`;


    const menuHTML =
      data.menu.map(
        item=>{

          const isPromo =
            item[3] === "promo";


          return `

          <div class="

            ${isPromo ? "promo-item" : ""}
          ">

            <div class="menu-icon">
              ${item[0]}
            </div>

            <div class="menu-name">
              ${
                highlightText(
                  item[1],
                  data.hints
                )
              }
            </div>

            <div class="menu-price">

              ${
                typeof item[2] === "number"
                ? "$" + item[2]
                : highlightText(
                    item[2],
                    data.hints
                  )
              }

            </div>

          </div>

          `;

        }
      ).join("");


    /* ---------- DIALOGUE ---------- */

    const dialogueHTML =
      data.dialogue.map(
        line=>`

        <div class="dialogue-line">

          <div class="speaker">
            ${line[0]}:
          </div>

          <div class="speech">

            ${
              highlightText(
                line[1],
                data.hints
              )
            }

          </div>

        </div>

        `
      ).join("");


    /* ---------- QUESTIONS ---------- */

    const questionsHTML =
      data.questions.map(
        (q,qIndex)=>`

        <div class="question">

          <div class="q-row">

            <div class="answer-slot">

              （<span
                class="answer-letter"
                id="
                  answer-${pageIndex}-${qIndex}
                "
              ></span>）

            </div>


            <div class="q-text">

              ${qIndex+1}.

              ${
                highlightText(
                  q.stem,
                  data.hints
                )
              }

            </div>

          </div>


          <div class="options">

            ${
              q.options.map(
                (option,optIndex)=>`

                <div
                  class="option"

                  data-page="${pageIndex}"
                  data-q="${qIndex}"
                  data-opt="${optIndex}"

                  onclick="
                    chooseAnswer(
                      ${pageIndex},
                      ${qIndex},
                      ${optIndex},
                      this
                    )
                  "
                >

                  (
                  ${
                    String.fromCharCode(
                      65+optIndex
                    )
                  }
                  )

                  ${
                    highlightText(
                      option,
                      data.hints
                    )
                  }

                </div>

              ).join("")
            }

          </div>

        </div>

      ).join("");


    /* ---------- PAGE ---------- */

    pages.insertAdjacentHTML(
      "beforeend",

      `

      <section
        class="sheet"
        id="sheet-${pageIndex}"
      >


        <!-- =====================
             HEADER
        ====================== -->

        <header class="page-header">

          <div class="title-line">

            <h1>
              生活英文｜速食店點餐
            </h1>

            <span class="subtitle">

              Fast Food Menu
              ・
              ${data.code}
              ・
              Level ${data.level}

            </span>

          </div>


          <div class="student-info">

            班級 ______
            　
            姓名 __________

          </div>

        </header>


        <!-- =====================
             MAIN
        ====================== -->

        <div class="page-body">


          <!-- =====================
               LEFT
          ====================== -->

          <div class="left-panel">


            <!-- MENU -->

            <section class="menu-box">

              <div class="menu-title">
                TODAY'S MENU
              </div>

              <div

                  menu-grid

              >

                ${menuHTML}

              </div>

            <!-- DIALOGUE -->

            <section class="dialogue-section">

              <div class="dialogue-title">

              <div

                    data.dialogue.length >= 8
                    ? "long-dialogue"

          </div>


          <!-- =====================
               RIGHT
          ====================== -->

          <section class="right-panel">

            <div class="question-head">

              <div class="question-title-wrap">

                <h2 class="question-title">

                <div

/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(
  page,
  question,
  option,
  element
){

  const options =
    document.querySelectorAll(
      `.option[
        data-page="${page}"
      ][
        data-q="${question}"
      ]`
    );


  options.forEach(
    el=>{

      el.classList.remove(
        "selected",
        "correct"
      );

    }
  );


  selections[page][question]
    = option;


  element.classList.add(
    "selected"
  );


  const letter =
    String.fromCharCode(
      65 + option
    );


  const slot =
    document.getElementById(
      `answer-${page}-${question}`
    );


  slot.textContent =
    letter;


  slot.className =
    "answer-letter";


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   GRADE
========================================================= */

function gradePage(page){

  let correctCount = 0;


  levels[page].questions.forEach(
    (question,qIndex)=>{


      const chosen =
        selections[page][qIndex];


      const options =
        document.querySelectorAll(
          `.option[
            data-page="${page}"
          ][
            data-q="${qIndex}"
          ]`
        );


      const slot =
        document.getElementById(
          `answer-${page}-${qIndex}`
        );


      options.forEach(
        el=>{

          el.classList.remove(
            "correct"
          );

        }
      );


      if(chosen === null){
        return;
      }


      /* ---------- 正確 ---------- */

      if(
        chosen === question.answer
      ){

        correctCount++;


        options[chosen]
          .classList
          .remove(
            "selected"
          );


        options[chosen]
          .classList
          .add(
            "correct"
          );


        slot.className =
          "answer-letter correct";

      }


      /* ---------- 錯誤 ---------- */

      else{

        options[chosen]
          .classList
          .remove(
            "selected"
          );


        selections[page][qIndex]
          = null;


        slot.textContent =
          "";


        slot.className =
          "answer-letter";

      }

    }
  );


  document.getElementById(
    `score-${page}`
  ).textContent =
    `${correctCount} / ${levels[page].questions.length}`;

}


/* =========================================================
   CLEAR
========================================================= */

function clearPage(page){

  selections[page].fill(null);


  document
    .querySelectorAll(
      `.option[data-page="${page}"]`
    )
    .forEach(
      el=>{

        el.classList.remove(
          "selected",
          "correct"
        );

      }
    );


  levels[page]
    .questions
    .forEach(
      (_,qIndex)=>{

        const slot =
          document.getElementById(
            `answer-${page}-${qIndex}`
          );

        slot.textContent =
          "";

        slot.className =
          "answer-letter";

      }
    );


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   SHOW ANSWERS
========================================================= */

function showAnswers(page){

  levels[page]
    .questions
    .forEach(
      (question,qIndex)=>{


        const options =
          document.querySelectorAll(
            `.option[
              data-page="${page}"
            ][
              data-q="${qIndex}"
            ]`
          );


        options.forEach(
          el=>{

            el.classList.remove(
              "selected",
              "correct"
            );

          }
        );


        const letter =
          String.fromCharCode(
            65 + question.answer
          );


        const slot =
          document.getElementById(
            `answer-${page}-${qIndex}`
          );


        slot.textContent =
          letter;


        slot.className =
          "answer-letter solution";

      }
    );


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   HINT
========================================================= */

function toggleHint(
  page,
  button
){

  hintStates[page] =
    !hintStates[page];


  const sheet =
    document.getElementById(
      `sheet-${page}`
    );


  sheet.classList.toggle(
    "hint-on",
    hintStates[page]
  );


  button.classList.toggle(
    "active",
    hintStates[page]
  );

}

</script>
