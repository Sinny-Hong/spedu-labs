<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>生活英文｜速食店點餐 A卷</title>

<style>
:root{
  --navy:#0B3768;
  --orange:#F59E0B;

  --page-bg:#EAF1F7;
  --soft:#F3F7FB;
  --line:#D5E2EC;
  --text:#173552;

  --blue:#2879BA;
  --blue-soft:#EAF4FC;

  --green:#218653;
  --green-soft:#E7F5ED;

  --red:#C62828;

  --hint:#FFF0A6;
  --hint-line:#F1C44A;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--page-bg);
  color:var(--text);

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  padding:18px 0 40px;
}

button{
  font:inherit;
}

/* =========================================================
   A4 LANDSCAPE
========================================================= */

.sheet{
  width:297mm;
  height:210mm;

  margin:0 auto 18px;
  padding:7mm 8mm;

  overflow:hidden;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);

  page-break-after:always;
}

.sheet:last-child{
  page-break-after:auto;
}

/* =========================================================
   HEADER
========================================================= */

.page-header{
  height:14mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8mm;

  margin-bottom:4mm;
}

.title-line{
  display:flex;
  align-items:baseline;

  gap:5mm;

  min-width:0;
}

.title-line h1{
  margin:0;

  color:var(--navy);

  font-size:20pt;
  line-height:1;

  font-weight:900;

  white-space:nowrap;
}

.subtitle{
  color:var(--orange);

  font-size:11pt;
  line-height:1;

  font-weight:900;

  white-space:nowrap;
}

.student-info{
  color:#33485C;

  font-size:10pt;

  white-space:nowrap;
}

/* =========================================================
   MAIN
========================================================= */

.page-body{
  height:calc(100% - 18mm);

  display:grid;

  grid-template-columns:55% 45%;

  gap:5mm;
}

.left-panel,
.right-panel{
  min-width:0;
  min-height:0;
}

/* =========================================================
   LEFT
========================================================= */

.left-panel{
  display:grid;

  grid-template-rows:86mm 1fr;

  gap:4mm;
}

/* =========================================================
   MENU
========================================================= */

.menu-box{
  height:86mm;

  overflow:hidden;

  border:1.8px solid var(--navy);
  border-radius:4mm;

  background:#fff;
}

.menu-title{
  height:10mm;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--navy);

  color:#fff;

  font-size:13pt;
  font-weight:900;
}

.menu-grid{
  height:calc(100% - 10mm);

  display:grid;
}

.menu-grid.count-10{
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-8{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-6{
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-4{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:1fr;
}

.menu-item{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:1.5mm 1mm;

  text-align:center;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.menu-icon{
  height:14mm;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27pt;
  line-height:1;
}

.menu-name{
  margin-top:1mm;

  color:var(--navy);

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:12.5pt;
  line-height:1.08;

  font-weight:700;

  letter-spacing:0;
  word-spacing:0;
  font-kerning:normal;
}

.menu-price{
  margin-top:1.2mm;

  color:#111;

  font-size:14pt;
  line-height:1;

  font-weight:900;
}

.promo-item{
  background:#FFF9EC;
}

.promo-item .menu-icon{
  font-size:24pt;
}

.promo-item .menu-name{
  color:#975D00;

  font-size:11.5pt;
  font-weight:900;
}

.promo-item .menu-price{
  color:var(--orange);

  font-size:12pt;
}

/* =========================================================
   DIALOGUE
========================================================= */

.dialogue-section{
  min-height:0;

  display:flex;
  flex-direction:column;
}

.dialogue-title{
  margin:0 0 2.5mm;

  padding:2.2mm 3mm;

  color:var(--navy);

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:3mm;

  font-size:14.5pt;
  line-height:1;

  font-weight:900;
}

.dialogue-content{
  flex:1;

  min-height:0;
  overflow:hidden;

  padding:1mm 3mm 0;
}

.dialogue-line{
  display:grid;

  grid-template-columns:max-content 1fr;

  column-gap:2.5mm;

  margin-bottom:2.3mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:13.5pt;
  line-height:1.4;

  letter-spacing:0;
  word-spacing:0;
}

.dialogue-line:last-child{
  margin-bottom:0;
}

.speaker{
  font-weight:900;
  white-space:nowrap;
}

.speech{
  min-width:0;
}

.long-dialogue .dialogue-line{
  margin-bottom:1.5mm;

  font-size:12.5pt;
  line-height:1.32;
}

/* =========================================================
   QUESTIONS
========================================================= */

.right-panel{
  height:100%;

  display:flex;
  flex-direction:column;

  min-height:0;
}

.question-head{
  min-height:13mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:3mm;

  padding:1.5mm 2.5mm;

  margin-bottom:2.5mm;

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:3mm;
}

.question-title-wrap{
  display:flex;
  align-items:center;

  gap:3mm;
}

.question-title{
  margin:0;

  color:var(--navy);

  font-size:14.5pt;

  font-weight:900;
}

.score{
  min-width:14mm;

  color:var(--green);

  font-size:12pt;
  font-weight:900;

  text-align:center;
}

/* =========================================================
   BUTTONS
========================================================= */

.tools{
  display:flex;
  align-items:center;

  gap:1.5mm;
}

.tools button{
  padding:1.5mm 2.7mm;

  border:1px solid #BFCFDE;
  border-radius:8px;

  background:#fff;

  color:var(--navy);

  font-size:9pt;
  font-weight:900;

  cursor:pointer;
}

.tools button:hover{
  border-color:var(--orange);
}

.tools button.active{
  color:#875100;

  background:#FFF2D7;

  border-color:var(--orange);
}

/* =========================================================
   QUESTIONS BODY
========================================================= */

.questions{
  flex:1;

  min-height:0;

  overflow:hidden;

  padding:0 1mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;
}

.question{
  margin-bottom:3mm;
}

.question:last-child{
  margin-bottom:0;
}

.q-row{
  display:grid;

  grid-template-columns:13mm 1fr;

  column-gap:1.5mm;

  align-items:start;

  font-size:12.5pt;
  line-height:1.3;

  font-weight:800;
}

/* （A） */

.answer-slot{
  white-space:nowrap;
  text-align:right;
}

.answer-letter{
  display:inline-block;

  min-width:4mm;

  color:var(--blue);

  font-weight:900;
}

.answer-letter.correct{
  color:var(--green);
}

.answer-letter.solution{
  color:var(--red);
}

.q-text{
  min-width:0;
}

/* =========================================================
   OPTIONS
========================================================= */

.options{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:1mm 3.5mm;

  margin-top:1.2mm;
  margin-left:17mm;
}

.option{
  padding:1mm 1.5mm;

  border:1px solid transparent;
  border-radius:6px;

  font-size:11.5pt;
  line-height:1.23;

  cursor:pointer;
}

.option:hover{
  background:var(--blue-soft);
}

.option.selected{
  color:var(--navy);

  background:var(--blue-soft);

  border-color:#6CA6D3;
}

.option.correct{
  color:var(--green);

  background:var(--green-soft);

  border-color:#8BC4A3;

  font-weight:900;
}

/* =========================================================
   HINT
========================================================= */

.hint-word{
  padding:0 .5mm;

  border-radius:4px;

  transition:
    background .15s,
    box-shadow .15s;
}

.sheet.hint-on .hint-word{
  background:var(--hint);

  box-shadow:
    inset 0 -1.2px 0 var(--hint-line);
}

/* =========================================================
   PRINT
========================================================= */

@page{
  size:A4 landscape;
  margin:0;
}

@media print{

  html,
  body{
    width:297mm;

    margin:0;
    padding:0;

    background:#fff;
  }

  body{
    padding:0;
  }

  .sheet{
    width:297mm;
    height:210mm;

    margin:0;

    box-shadow:none;
  }

  .tools,
  .score{
    display:none !important;
  }
}

/* =========================================================
   MOBILE PREVIEW
========================================================= */

@media screen and (max-width:900px){

  body{
    overflow-x:auto;
  }

  .sheet{
    margin-left:0;
  }
}

</style>
</head>

/* =========================================================
   STATE
========================================================= */

const selections =
  levels.map(level =>
    Array(level.questions.length).fill(null)
  );

const hintStates =
  levels.map(() => false);


/* =========================================================
   HELPERS
========================================================= */

function getOptions(page, question){

  return document.querySelectorAll(
    `.option[data-page="${page}"][data-q="${question}"]`
  );

}


function getAnswerSlot(page, question){

  return document.getElementById(
    `answer-${page}-${question}`
  );

}


function getScore(page){

  return document.getElementById(
    `score-${page}`
  );

}


function escapeRegExp(text){

  return text.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}


function highlightText(text, words){

  let result =
    String(text);

  const sorted =
    [...words].sort(
      (a,b) =>
        b.length - a.length
    );

  sorted.forEach(word => {

    const regex =
      new RegExp(
        `(${escapeRegExp(word)})`,
        "gi"
      );

    result =
      result.replace(
        regex,
        `<span class="hint-word">$1</span>`
      );

  });

  return result;
}

========================================================= */

          ${line[0]}:

              data.hints

  const questionsHTML =
    data.questions.map(
      (q, qIndex) => `

            ${
              highlightText(
                q.stem,
                data.hints

            }

          </div>

        </div>


        <div class="options">

          ${
            q.options.map(
              (option, optIndex) => `

              <div
                class="option"

                data-page="${pageIndex}"
                data-q="${qIndex}"

                onclick="

                    ${pageIndex},
                    ${qIndex},

                "
              >

                    option,
                    data.hints
                  )
                }

      class="sheet"
      id="sheet-${pageIndex}"
    >

            生活英文｜速食店點餐

/* =========================================================
   CHOOSE ANSWER
========================================================= */

function chooseAnswer(
  page,
  question,
  option,
  element
){

  const options =
    getOptions(
      page,
      question
    );


  options.forEach(el => {

    el.classList.remove(
      "selected",
      "correct"
    );

  });


  selections[page][question] =
    option;


  element.classList.add(
    "selected"
  );


  const letter =
    String.fromCharCode(
      65 + option
    );


  const slot =
    getAnswerSlot(
      page,
      question
    );


  slot.textContent =
    letter;


  slot.className =
    "answer-letter";


  getScore(page).textContent =
    "";

}


/* =========================================================
   GRADE
========================================================= */

function gradePage(page){

  let correctCount = 0;


  levels[page].questions.forEach(
    (question, qIndex) => {


      const chosen =
        selections[page][qIndex];


      const options =
        getOptions(
          page,
          qIndex
        );


      const slot =
        getAnswerSlot(
          page,
          qIndex
        );


      options.forEach(el => {

        el.classList.remove(
          "correct"
        );

      });


      if(chosen === null){

        slot.className =
          "answer-letter";

        return;

      }


      /* 正確 */

      if(
        chosen === question.answer
      ){

        correctCount++;


        options[chosen]
          .classList
          .remove("selected");


        options[chosen]
          .classList
          .add("correct");


        slot.textContent =
          String.fromCharCode(
            65 + chosen
          );


        slot.className =
          "answer-letter correct";

      }


      /* 錯誤 */

      else{

        options[chosen]
          .classList
          .remove(
            "selected",
            "correct"
          );


        selections[page][qIndex] =
          null;


        slot.textContent =
          "";


        slot.className =
          "answer-letter";

      }

    }
  );


  getScore(page).textContent =
    `${correctCount} / ${levels[page].questions.length}`;

}


/* =========================================================
   CLEAR
========================================================= */

function clearPage(page){

  selections[page].fill(null);


  levels[page].questions.forEach(
    (_, qIndex) => {


      const options =
        getOptions(
          page,
          qIndex
        );


      options.forEach(el => {

        el.classList.remove(
          "selected",
          "correct"
        );

      });


      const slot =
        getAnswerSlot(
          page,
          qIndex
        );


      slot.textContent =
        "";


      slot.className =
        "answer-letter";

    }
  );


  /* 分數一定清除 */

  getScore(page).textContent =
    "";

}


/* =========================================================
   SHOW ANSWERS
========================================================= */

function showAnswers(page){

  levels[page].questions.forEach(
    (question, qIndex) => {


      const options =
        getOptions(
          page,
          qIndex
        );


      options.forEach(el => {

        el.classList.remove(
          "selected",
          "correct"
        );

      });


      const slot =
        getAnswerSlot(
          page,
          qIndex
        );


      const answerLetter =
        String.fromCharCode(
          65 + question.answer
        );


      slot.textContent =
        answerLetter;


      slot.className =
        "answer-letter solution";

    }
  );


  /* 解答模式不顯示作答分數 */

  getScore(page).textContent =
    "";

}


/* =========================================================
   HINT
========================================================= */

function toggleHint(
  page,
  button
){

  hintStates[page] =
    !hintStates[page];


  const sheet =
    document.getElementById(
      `sheet-${page}`
    );


  sheet.classList.toggle(
    "hint-on",
    hintStates[page]
  );


  button.classList.toggle(
    "active",
    hintStates[page]
  );

}

</script>
