<title>生活英文｜速食店點餐 A卷</title>

<style>
:root{
  --navy:#0B3768;
  --navy2:#164D83;
  --orange:#F59E0B;
  --bg:#EAF1F7;
  --panel:#FFFFFF;
  --soft:#F3F7FB;
  --line:#D6E2EC;

  --blue-soft:#E9F3FC;
  --blue:#2879BA;

  --green:#218653;
  --green-soft:#E8F6EE;

  --pink:#FFE5EA;
  --red:#C62828;

  --hint:#FFF1A8;
  --hint-line:#F5C84C;

  --text:#173552;
}

/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  padding:18px 0 42px;
}

button{
  font:inherit;
}

/* =========================
   A4 LANDSCAPE
========================= */

.sheet{
  width:297mm;
  height:210mm;

  margin:0 auto 18px;
  padding:7mm 8mm;

  overflow:hidden;

  background:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.12);

  page-break-after:always;
}

.sheet:last-child{
  page-break-after:auto;
}

/* =========================
   HEADER
========================= */

.page-header{
  height:15mm;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8mm;

  margin-bottom:4mm;
}

.title-line{
  display:flex;
  align-items:baseline;
  gap:5mm;

  min-width:0;
}

.title-line h1{
  margin:0;

  color:var(--navy);

  font-size:20pt;
  line-height:1;

  font-weight:900;
  white-space:nowrap;
}

.subtitle{
  color:var(--orange);

  font-size:10.5pt;
  line-height:1;

  font-weight:900;
  white-space:nowrap;
}

.student-info{
  font-size:9.5pt;
  white-space:nowrap;
}

/* =========================
   BODY
========================= */

.page-body{
  height:calc(100% - 19mm);

  display:grid;
  grid-template-columns:55% 45%;
  gap:5mm;
}

.left-panel,
.right-panel{
  min-width:0;
  min-height:0;
}

/* 左側固定分成：
   Menu + Dialogue
*/
.left-panel{
  display:grid;
  grid-template-rows:86mm 1fr;
  gap:4mm;
}

/* =========================
   MENU 固定框
========================= */

.menu-box{
  height:86mm;

  overflow:hidden;

  border:1.8px solid var(--navy);
  border-radius:4mm;

  background:#fff;
}

.menu-title{
  height:10mm;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--navy);
  color:#fff;

  font-size:12pt;
  font-weight:900;
}

.menu-grid{
  height:calc(100% - 10mm);

  display:grid;
  background:#fff;
}

/* 依數量換格數，
   但外框本身永遠不變
*/
.menu-grid.count-10{
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-8{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-6{
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-5{
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:1fr;
}

/* 每格平均填滿 */
.menu-item{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:1.5mm 1mm;

  text-align:center;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

/* 最後一列／欄多一點沒關係，
   外框會蓋住 */
.menu-icon{
  height:13mm;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25pt;
  line-height:1;
}

.menu-name{
  margin-top:1mm;

  color:var(--navy);

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:10pt;
  line-height:1.05;

  font-weight:700;
}

.menu-price{
  margin-top:1mm;

  color:#111;

  font-size:12pt;
  font-weight:900;
}

/* 品項少時稍微放大 */
.count-5 .menu-icon{
  font-size:29pt;
  height:17mm;
}

.count-5 .menu-name{
  font-size:11pt;
}

.count-5 .menu-price{
  font-size:13pt;
}

/* =========================
   DIALOGUE 固定框
========================= */

.dialogue-section{
  min-height:0;

  display:flex;
  flex-direction:column;
}

.section-label{
  margin:0 0 1.5mm;

  color:var(--navy);

  font-size:13pt;
  font-weight:900;
}

.dialogue-box{
  flex:1;
  min-height:0;

  overflow:hidden;

  padding:3.4mm 4mm;

  border:1.3px solid var(--line);
  border-radius:3.5mm;

  background:#FBFDFF;

  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

/* 人名凸排：
   名字一欄，正文一欄
*/
.dialogue-line{
  display:grid;
  grid-template-columns:max-content 1fr;
  column-gap:2mm;

  margin-bottom:1.8mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:10.8pt;
  line-height:1.4;
}

.dialogue-line:last-child{
  margin-bottom:0;
}

.speaker{
  font-weight:900;
  white-space:nowrap;
}

.speech{
  min-width:0;
}

/* 長文本自動稍微縮小 */
.long-dialogue .dialogue-line{
  margin-bottom:1.25mm;
  font-size:9.9pt;
  line-height:1.3;
}

/* =========================
   QUESTIONS
========================= */

.right-panel{
  height:100%;

  display:flex;
  flex-direction:column;

  min-height:0;
}

/* 原本深橫線拿掉
   改成淡色標題框
*/
.question-head{
  min-height:13mm;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:3mm;

  padding:1.5mm 2.5mm;

  margin-bottom:2.5mm;

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:3mm;
}

.question-title-wrap{
  display:flex;
  align-items:center;
  gap:3mm;
}

.question-title{
  margin:0;

  color:var(--navy);

  font-size:13.5pt;
  font-weight:900;
}

.score{
  min-width:12mm;

  color:var(--green);

  font-size:10.5pt;
  font-weight:900;

  text-align:center;
}

.tools{
  display:flex;
  align-items:center;
  gap:1.5mm;
}

.tools button{
  padding:1.4mm 2.6mm;

  border:1px solid #BFD0DF;
  border-radius:8px;

  background:#fff;
  color:var(--navy);

  font-size:8.5pt;
  font-weight:900;

  cursor:pointer;
}

.tools button:hover{
  border-color:var(--orange);
}

.tools button.active{
  color:#8A5400;
  background:#FFF3D8;
  border-color:var(--orange);
}

/* =========================
   QUESTIONS CONTENT
========================= */

.questions{
  flex:1;
  min-height:0;

  overflow:hidden;

  padding:0 1mm 0 .5mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;
}

.question{
  margin-bottom:2.5mm;
}

.question:last-child{
  margin-bottom:0;
}

/* 題幹 */
.q-row{
  display:grid;
  grid-template-columns:12mm 1fr;
  column-gap:1mm;

  align-items:start;

  font-size:10.2pt;
  line-height:1.28;

  font-weight:800;
}

/* （ A ） */
.answer-slot{
  white-space:nowrap;
  text-align:right;
}

.answer-letter{
  display:inline-block;
  min-width:4mm;

  color:var(--blue);
  font-weight:900;
}

.answer-letter.correct{
  color:var(--green);
}

.answer-letter.solution{
  color:var(--red);
}

/* 題目 */
.q-text{
  min-width:0;
}

/* 選項往右多縮排，
   避免靠題號括號太近 */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:.8mm 3mm;

  margin-top:1mm;
  margin-left:15mm;
}

.option{
  padding:.8mm 1.4mm;

  border:1px solid transparent;
  border-radius:6px;

  font-size:9.4pt;
  line-height:1.2;

  cursor:pointer;
}

.option:hover{
  background:var(--blue-soft);
}

/* 點選 */
.option.selected{
  color:var(--navy);
  background:var(--blue-soft);
  border-color:#6EA6D4;
}

/* 批改答對 */
.option.correct{
  color:var(--green);
  background:var(--green-soft);
  border-color:#8CC6A5;
  font-weight:900;
}

/* 解答模式不需要把答案框染紅，
   主要答案放題號括號
*/
.option.solution{
  color:inherit;
  background:transparent;
  border-color:transparent;
}

/* =========================
   HINT 提示
========================= */

/* 平常 span 不顯色 */
.hint-word{
  border-radius:4px;
  padding:0 .6mm;

  transition:
    background .16s,
    box-shadow .16s;
}

/* 開啟提示才亮 */
.sheet.hint-on .hint-word{
  background:var(--hint);

  box-shadow:
    inset 0 -1.2px 0 var(--hint-line);
}

/* =========================
   PRINT
========================= */

@page{
  size:A4 landscape;
  margin:0;
}

@media print{

  html,
  body{
    width:297mm;

    margin:0;
    padding:0;

    background:#fff;
  }

  .sheet{
    width:297mm;
    height:210mm;

    margin:0;

    box-shadow:none;
  }

  .tools{
    display:none !important;
  }

  .score{
    display:none !important;
  }
}

/* 手機只當預覽 */
@media screen and (max-width:900px){

  body{
    overflow-x:auto;
  }

  .sheet{
    margin-left:0;
  }
}
</style>

/* =========================================================
   ESCAPE / HIGHLIGHT
========================================================= */

function escapeRegExp(str){
  return str.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );
}


function highlightText(text,words){

  let result = text;

  const sorted =
    [...words].sort(
      (a,b)=>b.length-a.length
    );

  sorted.forEach(word=>{

    const regex =
      new RegExp(
        `(${escapeRegExp(word)})`,
        "gi"
      );

    result =
      result.replace(
        regex,
        `<span class="hint-word">$1</span>`
      );

  });

  return result;
}

              q.stem,
              data.hintWords
            )}
          </div>

        </div>


        <div class="options">

          ${q.options.map(
            (opt,optIndex)=>`

            <div
              class="option"
              data-page="${pageIndex}"
              data-q="${qIndex}"
              data-opt="${optIndex}"
              onclick="
                chooseAnswer(
                  ${pageIndex},
                  ${qIndex},
                  ${optIndex},
                  this
                )
              "
            >
              (${String.fromCharCode(65+optIndex)})
              ${highlightText(
                opt,
                data.hintWords
              )}
            </div>

          `).join("")}

        </div>

      </div>

    `).join("");


  pageRoot.insertAdjacentHTML(
    "beforeend",
    `

    <section
      class="sheet"
      id="sheet-${pageIndex}"
    >

      <!-- HEADER -->

      <header class="page-header">

        <div class="title-line">

          <h1>
            生活英文｜速食店點餐
          </h1>

          <div class="subtitle">
            Fast Food Menu ・
            ${data.code} ・
            Level ${data.level}
          </div>

        </div>

        <div class="student-info">
          班級 ______　
          姓名 __________
        </div>

      </header>


      <div class="page-body">

        <!-- LEFT -->

        <div class="left-panel">

          <!-- MENU -->

          <section class="menu-box">

            <div class="menu-title">
              TODAY'S MENU
            </div>

            <div
              class="menu-grid ${countClass}"
            >
              ${menuHTML}
            </div>

          </section>


          <!-- DIALOGUE -->

          <section class="dialogue-section">

            <h2 class="section-label">
              Dialogue
            </h2>

            <div
              class="
                dialogue-box
                ${
                  data.dialogue.length >= 8
                  ? "long-dialogue"
                  : ""
                }
              "
            >
              ${dialogueHTML}
            </div>

          </section>

        </div>


        <!-- RIGHT -->

        <section class="right-panel">

          <div class="question-head">

            <div class="question-title-wrap">

              <h2 class="question-title">
                Questions
              </h2>

              <div
                class="score"
                id="score-${pageIndex}"
              ></div>

            </div>


            <div class="tools">

              <button
                onclick="
                  toggleHint(${pageIndex},this)
                "
              >
                提示
              </button>

              <button
                onclick="
                  gradePage(${pageIndex})
                "
              >
                批改
              </button>

              <button
                onclick="
                  clearPage(${pageIndex})
                "
              >
                清除
              </button>

              <button
                onclick="
                  showAnswers(${pageIndex})
                "
              >
                解答
              </button>

            </div>

          </div>


          <div class="questions">
            ${questionsHTML}
          </div>

        </section>

      </div>

    </section>

    `
  );

});


/* =========================================================
   CHOOSE
========================================================= */

function chooseAnswer(
  page,
  q,
  opt,
  element
){

  const options =
    document.querySelectorAll(
      `.option[
        data-page="${page}"
      ][
        data-q="${q}"
      ]`
    );


  options.forEach(el=>{

    el.classList.remove(
      "selected",
      "correct",
      "solution"
    );

  });


  selections[page][q] = opt;


  element.classList.add(
    "selected"
  );


  const letter =
    String.fromCharCode(
      65 + opt
    );


  const slot =
    document.getElementById(
      `answer-${page}-${q}`
    );


  slot.textContent =
    letter;

  slot.className =
    "answer-letter";


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   GRADE
========================================================= */

function gradePage(page){

  let correctCount = 0;


  levels[page].questions.forEach(
    (q,qIndex)=>{

      const chosen =
        selections[page][qIndex];


      const options =
        document.querySelectorAll(
          `.option[
            data-page="${page}"
          ][
            data-q="${qIndex}"
          ]`
        );


      const slot =
        document.getElementById(
          `answer-${page}-${qIndex}`
        );


      options.forEach(el=>{
        el.classList.remove(
          "correct",
          "solution"
        );
      });


      if(chosen === null){
        return;
      }


      if(chosen === q.answer){

        correctCount++;

        options[chosen]
          .classList
          .remove("selected");

        options[chosen]
          .classList
          .add("correct");

        slot.className =
          "answer-letter correct";

      }else{

        /* 錯誤清掉，
           讓學生重新作答 */

        options[chosen]
          .classList
          .remove("selected");

        selections[page][qIndex]
          = null;

        slot.textContent = "";

        slot.className =
          "answer-letter";
      }

    }
  );


  document.getElementById(
    `score-${page}`
  ).textContent =
    `${correctCount} / ${levels[page].questions.length}`;

}


/* =========================================================
   CLEAR
========================================================= */

function clearPage(page){

  selections[page].fill(null);


  document
    .querySelectorAll(
      `.option[data-page="${page}"]`
    )
    .forEach(el=>{

      el.classList.remove(
        "selected",
        "correct",
        "solution"
      );

    });


  levels[page].questions.forEach(
    (_,qIndex)=>{

      const slot =
        document.getElementById(
          `answer-${page}-${qIndex}`
        );

      slot.textContent = "";

      slot.className =
        "answer-letter";

    }
  );


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   SHOW ANSWERS
========================================================= */

function showAnswers(page){

  levels[page].questions.forEach(
    (q,qIndex)=>{

      const options =
        document.querySelectorAll(
          `.option[
            data-page="${page}"
          ][
            data-q="${qIndex}"
          ]`
        );


      options.forEach(el=>{
        el.classList.remove(
          "selected",
          "correct",
          "solution"
        );
      });


      const letter =
        String.fromCharCode(
          65 + q.answer
        );


      const slot =
        document.getElementById(
          `answer-${page}-${qIndex}`
        );


      slot.textContent =
        letter;

      slot.className =
        "answer-letter solution";

    }
  );


  document.getElementById(
    `score-${page}`
  ).textContent = "";

}


/* =========================================================
   HINT
========================================================= */

function toggleHint(page,button){

  hintStates[page] =
    !hintStates[page];


  const sheet =
    document.getElementById(
      `sheet-${page}`
    );


  sheet.classList.toggle(
    "hint-on",
    hintStates[page]
  );


  button.classList.toggle(
    "active",
    hintStates[page]
  );

}

</script>
