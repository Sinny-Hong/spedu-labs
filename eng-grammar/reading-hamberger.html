<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>生活英文｜速食店閱讀測驗</title>

<style>
:root{
  --navy:#0B3768;
  --orange:#F59E0B;

  --page-bg:#EAF1F7;
  --soft:#F3F7FB;
  --line:#D6E2EC;
  --text:#173552;

  --blue:#2879BA;
  --blue-soft:#EAF4FC;

  --green:#218653;
  --green-soft:#E7F5ED;

  --red:#C62828;

  --hint:#FFF0A6;
  --hint-line:#F1C44A;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--page-bg);
  color:var(--text);

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  padding:18px 0 40px;
}

button{
  font:inherit;
}

/* =========================================================
   PRINT
========================================================= */

.global-tools{
  position:fixed;
  right:16px;
  top:16px;
  z-index:1000;
}

.global-tools button{
  padding:10px 16px;

  border:1px solid #C8D5E0;
  border-radius:12px;

  background:white;
  color:var(--navy);

  font-weight:900;

  box-shadow:
    0 3px 12px rgba(0,0,0,.14);

  cursor:pointer;
}

/* =========================================================
   A4 PORTRAIT
========================================================= */

.sheet{
  width:210mm;
  height:297mm;

  margin:0 auto 18px;
  padding:7mm 8mm;

  background:#fff;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);

  overflow:hidden;

  display:grid;
  grid-template-rows:1fr 1fr;
  gap:5mm;

  page-break-after:always;
}

.sheet:last-child{
  page-break-after:auto;
}

/* =========================================================
   HALF PAGE
========================================================= */

.level-block{
  min-height:0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.level-block:first-child{
  padding-bottom:2.5mm;

  border-bottom:
    1.5px dashed #D5E0E9;
}

/* =========================================================
   HEADER
========================================================= */

.level-header{
  min-height:12mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:5mm;

  margin-bottom:2.5mm;
}

.level-title{
  margin:0;

  color:var(--navy);

  font-size:16.5pt;
  line-height:1;

  font-weight:900;

  white-space:nowrap;
}

.student-info{
  display:flex;
  align-items:center;

  gap:3mm;

  color:#273E52;

  font-size:14pt;
  font-weight:700;

  white-space:nowrap;
}

.info-line{
  display:inline-block;

  min-width:25mm;
  height:5mm;

  border-bottom:1.4px solid #647789;
}

.name-line{
  min-width:36mm;
}

/* =========================================================
   CONTENT：50 / 50
========================================================= */

.level-content{
  flex:1;

  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:4mm;
}

.left-side,
.right-side{
  min-width:0;
  min-height:0;
}

/* =========================================================
   LEFT
========================================================= */

.left-side{
  display:grid;

  grid-template-rows:52mm 1fr;

  gap:2.5mm;
}

/* =========================================================
   MENU
========================================================= */

.menu-box{
  min-height:0;

  overflow:hidden;

  border:1.5px solid var(--navy);
  border-radius:3mm;

  background:white;
}

.menu-title{
  height:7mm;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--navy);
  color:white;

  font-size:10.5pt;
  font-weight:900;
}

.menu-grid{
  height:calc(100% - 7mm);

  display:grid;
}

.menu-grid.count-10{
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-8{
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-6{
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-grid.count-4{
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
}

.menu-item{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:1.5mm .5mm .8mm;

  text-align:center;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.menu-grid.count-10 .menu-item:nth-child(5n),
.menu-grid.count-8 .menu-item:nth-child(4n),
.menu-grid.count-6 .menu-item:nth-child(3n),
.menu-grid.count-4 .menu-item:nth-child(2n){
  border-right:none;
}

.menu-icon{
  height:8.5mm;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19pt;
  line-height:1;
}

.menu-name{
  margin-top:.5mm;

  color:var(--navy);

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:11pt;
  line-height:1.03;

  font-weight:800;

  letter-spacing:0;
  word-spacing:0;
}

.menu-price{
  margin-top:.4mm;

  color:#111;

  font-size:11.5pt;
  line-height:1;

  font-weight:900;
}

/* =========================================================
   DIALOGUE
========================================================= */

.dialogue-section{
  min-height:0;

  display:flex;
  flex-direction:column;
}

.dialogue-title{
  margin:0 0 1.5mm;

  padding:1.4mm 2.2mm;

  color:var(--navy);

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:2.5mm;

  font-size:12pt;
  line-height:1;

  font-weight:900;
}

.dialogue-content{
  flex:1;

  min-height:0;
  overflow:hidden;

  padding:.6mm 1.5mm 0;
}

.dialogue-line{
  display:grid;

  grid-template-columns:max-content minmax(0,1fr);

  column-gap:2mm;

  margin-bottom:1.35mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;

  font-size:12.5pt;
  line-height:1.28;
}

.dialogue-line:last-child{
  margin-bottom:0;
}

.speaker{
  font-weight:900;
  white-space:nowrap;
}

.speech{
  min-width:0;
  overflow-wrap:anywhere;
}

.long-dialogue .dialogue-line{
  font-size:11.5pt;
  line-height:1.22;

  margin-bottom:1mm;
}

/* =========================================================
   QUESTIONS
========================================================= */

.right-side{
  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;

  overflow:hidden;
}

.question-head{
  min-height:9mm;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:2mm;

  padding:1.2mm 2mm;
  margin-bottom:1.5mm;

  background:var(--soft);

  border:1px solid var(--line);
  border-radius:2.5mm;

  width:100%;
  max-width:100%;

  min-width:0;
}

.question-title-wrap{
  display:flex;
  align-items:center;

  gap:2mm;

  min-width:0;
}

.question-title{
  margin:0;

  color:var(--navy);

  font-size:12pt;
  font-weight:900;
}

.score{
  min-width:11mm;

  color:var(--green);

  font-size:10.5pt;
  font-weight:900;

  text-align:center;
}

.tools{
  display:flex;
  align-items:center;

  gap:.8mm;

  flex-shrink:0;
}

.tools button{
  padding:1mm 1.6mm;

  border:1px solid #BFCFDE;
  border-radius:6px;

  background:white;

  color:var(--navy);

  font-size:8pt;
  font-weight:900;

  cursor:pointer;
}

.tools button.active{
  color:#875100;

  background:#FFF2D7;

  border-color:var(--orange);
}

.questions{
  flex:1;

  min-width:0;
  min-height:0;

  overflow:hidden;

  padding:0 .5mm;

  font-family:
    "Comic Sans MS",
    "Comic Sans",
    "Comic Neue",
    cursive;
}

.question{
  min-width:0;

  margin-bottom:1.7mm;
}

.question:last-child{
  margin-bottom:0;
}

.q-row{
  display:grid;

  grid-template-columns:11mm minmax(0,1fr);

  column-gap:1mm;

  align-items:start;

  min-width:0;

  font-size:11.5pt;
  line-height:1.22;

  font-weight:800;
}

.answer-slot{
  white-space:nowrap;
  text-align:right;
}

.answer-letter{
  display:inline-block;

  min-width:3.5mm;

  color:var(--blue);

  font-weight:900;
}

.answer-letter.correct{
  color:var(--green);
}

.answer-letter.solution{
  color:var(--red);
}

.q-text{
  min-width:0;

  overflow-wrap:anywhere;
  word-break:normal;
}

/* =========================================================
   OPTIONS：懸掛縮排
========================================================= */

.options{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:.6mm 2mm;

  min-width:0;

  margin-top:.6mm;
  margin-left:13mm;
}

.option{
  min-width:0;

  padding:.5mm 1mm;

  border:1px solid transparent;
  border-radius:5px;

  font-size:9.8pt;
  line-height:1.18;

  cursor:pointer;

  overflow-wrap:anywhere;
}

.option-inner{
  display:block;

  min-width:0;

  padding-left:5.5mm;
  text-indent:-5.5mm;
}

.option:hover{
  background:var(--blue-soft);
}

.option.selected{
  color:var(--navy);

  background:var(--blue-soft);

  border-color:#6CA6D3;
}

.option.correct{
  color:var(--green);

  background:var(--green-soft);

  border-color:#8BC4A3;

  font-weight:900;
}

/* =========================================================
   HINT
========================================================= */

.hint-word{
  padding:0 .4mm;

  border-radius:3px;
}

.level-block.hint-on .hint-word{
  background:var(--hint);

  box-shadow:
    inset 0 -1px 0 var(--hint-line);
}

/* =========================================================
   PRINT
========================================================= */

@page{
  size:A4 portrait;
  margin:0;
}

@media print{

  html,
  body{
    width:210mm;

    margin:0;
    padding:0;

    background:white;
  }

  body{
    padding:0;
  }

  .global-tools{
    display:none !important;
  }

  .sheet{
    width:210mm;
    height:297mm;

    margin:0;

    box-shadow:none;
  }

  .tools,
  .score{
    display:none !important;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media screen and (max-width:900px){

  body{
    overflow-x:auto;
  }

  .sheet{
    margin-left:0;
  }
}

</style>
</head>

/* =========================================================
   STATE
========================================================= */

const selections =
  levels.map(level =>
    Array(level.questions.length).fill(null)
  );

const hintStates =
  levels.map(() => false);

/* =========================================================
   HELPERS
========================================================= */

function getOptions(levelIndex, questionIndex){

  return document.querySelectorAll(
    `.option[data-level="${levelIndex}"][data-q="${questionIndex}"]`
  );

}

function getAnswerSlot(levelIndex, questionIndex){

  return document.getElementById(
    `answer-${levelIndex}-${questionIndex}`
  );

}

function getScore(levelIndex){

  return document.getElementById(
    `score-${levelIndex}`
  );

}

function escapeRegExp(text){

  return text.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}

function highlightText(text, words){

  let result =
    String(text);

  const sorted =
    [...words].sort(
      (a,b) =>
        b.length-a.length
    );

  sorted.forEach(word => {

    const regex =
      new RegExp(
        `(${escapeRegExp(word)})`,
        "gi"
      );

    result =
      result.replace(
        regex,
        `<span class="hint-word">$1</span>`
      );

  });

  return result;
}

/* =========================================================
   CREATE LEVEL
========================================================= */

function createLevel(data, levelIndex){

  const menuClass =
    `count-${data.menu.length}`;

  const menuHTML =
    data.menu.map(item => `

      <div class="menu-item">

        <div class="menu-icon">
          ${item[0]}
        </div>

        <div class="menu-name">
          ${item[1]}
        </div>

        <div class="menu-price">
          $${item[2]}
        </div>

      </div>

    `).join("");

  const dialogueHTML =
    data.dialogue.map(line => `

      <div class="dialogue-line">

        <div class="speaker">
          ${line[0]}:
        </div>

        <div class="speech">

          ${
            highlightText(
              line[1],
              data.hints
            )
          }

        </div>

      </div>

    `).join("");

  const questionsHTML =
    data.questions.map(
      (q,qIndex) => `

      <div class="question">

        <div class="q-row">

          <div class="answer-slot">

            （<span
              class="answer-letter"
              id="answer-${levelIndex}-${qIndex}"
            ></span>）

          </div>

          <div class="q-text">

            ${qIndex+1}.

            ${
              highlightText(
                q.stem,
                data.hints
              )
            }

          </div>

        </div>

        <div class="options">

          ${
            q.options.map(
              (option,optIndex) => `

              <div
                class="option"

                data-level="${levelIndex}"
                data-q="${qIndex}"
                data-opt="${optIndex}"

                onclick="
                  chooseAnswer(
                    ${levelIndex},
                    ${qIndex},
                    ${optIndex},
                    this
                  )
                "
              >

                <span class="option-inner">

                  (${String.fromCharCode(65+optIndex)})
                  ${
                    highlightText(
                      option,
                      data.hints
                    )
                  }

                </span>

              </div>

            `).join("")
          }

        </div>

      </div>

    `).join("");

  return `

    <section
      class="level-block"
      id="level-${levelIndex}"
    >

      <div class="level-header">

        <h1 class="level-title">
          生活英文｜速食店閱讀測驗 ${data.code}
        </h1>

        <div class="student-info">

          <span>
            班級：
          </span>

          <span class="info-line"></span>

          <span>
            姓名：
          </span>

/* =========================================================
   RENDER
========================================================= */

const pageRoot =
  document.getElementById("pages");

for(
  let i=0;
  i<levels.length;
  i+=2
){

  const first =
    createLevel(
      levels[i],
      i
    );

  const second =
    createLevel(
      levels[i+1],
      i+1
    );

  pageRoot.insertAdjacentHTML(
    "beforeend",

    `
      <section class="sheet">
        ${first}
        ${second}
      </section>
    `
  );

}

/* =========================================================
   CHOOSE
========================================================= */

function chooseAnswer(
  levelIndex,
  questionIndex,
  optionIndex,
  element
){

  const options =
    getOptions(
      levelIndex,
      questionIndex
    );

  options.forEach(el => {

    el.classList.remove(
      "selected",
      "correct"
    );

  });

  selections[levelIndex][questionIndex] =
    optionIndex;

  element.classList.add(
    "selected"
  );

  const slot =
    getAnswerSlot(
      levelIndex,
      questionIndex
    );

  slot.textContent =
    String.fromCharCode(
      65+optionIndex
    );

  slot.className =
    "answer-letter";

  getScore(levelIndex).textContent =
    "";
}

/* =========================================================
   GRADE
========================================================= */

function gradeLevel(levelIndex){

  let correctCount = 0;

  levels[levelIndex]
    .questions
    .forEach(
      (question,qIndex) => {

        const chosen =
          selections[levelIndex][qIndex];

        const options =
          getOptions(
            levelIndex,
            qIndex
          );

        const slot =
          getAnswerSlot(
            levelIndex,
            qIndex
          );

        options.forEach(el => {
          el.classList.remove("correct");
        });

        if(chosen === null){
          return;
        }

        if(chosen === question.answer){

          correctCount++;

          options[chosen]
            .classList
            .remove("selected");

          options[chosen]
            .classList
            .add("correct");

          slot.textContent =
            String.fromCharCode(
              65+chosen
            );

          slot.className =
            "answer-letter correct";

        }else{

          options[chosen]
            .classList
            .remove(
              "selected",
              "correct"
            );

          selections[levelIndex][qIndex] =
            null;

          slot.textContent =
            "";

          slot.className =
            "answer-letter";

        }

      }
    );

  getScore(levelIndex).textContent =
    `${correctCount} / 5`;
}

/* =========================================================
   CLEAR
========================================================= */

function clearLevel(levelIndex){

  selections[levelIndex].fill(null);

  levels[levelIndex]
    .questions
    .forEach(
      (_,qIndex) => {

        const options =
          getOptions(
            levelIndex,
            qIndex
          );

        options.forEach(el => {

          el.classList.remove(
            "selected",
            "correct"
          );

        });

        const slot =
          getAnswerSlot(
            levelIndex,
            qIndex
          );

        slot.textContent =
          "";

        slot.className =
          "answer-letter";

      }
    );

  getScore(levelIndex).textContent =
    "";
}

/* =========================================================
   ANSWERS
========================================================= */

function showAnswers(levelIndex){

  levels[levelIndex]
    .questions
    .forEach(
      (question,qIndex) => {

        const options =
          getOptions(
            levelIndex,
            qIndex
          );

        options.forEach(el => {

          el.classList.remove(
            "selected",
            "correct"
          );

        });

        const slot =
          getAnswerSlot(
            levelIndex,
            qIndex
          );

        slot.textContent =
          String.fromCharCode(
            65+question.answer
          );

        slot.className =
          "answer-letter solution";

      }
    );

  getScore(levelIndex).textContent =
    "";
}

/* =========================================================
   HINT
========================================================= */

function toggleHint(
  levelIndex,
  button
){

  hintStates[levelIndex] =
    !hintStates[levelIndex];

  const block =
    document.getElementById(
      `level-${levelIndex}`
    );

  block.classList.toggle(
    "hint-on",
    hintStates[levelIndex]
  );

  button.classList.toggle(
    "active",
    hintStates[levelIndex]
  );
}
