      { id: "e2", category: "能力挑戰評估", title: "📝 評估｜生活常識 (V1)", desc: "社會適應能力評估：自我保護、公共規章與基本生活常識", filename: "exam-lifesocial-v1.html", themeColor: "#14B8A6" },
      { id: "e3", category: "能力挑戰評估", title: "📝 評估｜生活英文 (V2)", desc: "進階生活常用口語與情境英語綜合評估 (第二版挑戰卷)", filename: "exam-lifeenglish-v2.html", themeColor: "#14B8A6" },
      { id: "e4", category: "能力挑戰評估", title: "📝 評估｜生活英文 (V3)", desc: "多元情境、基礎生活指標英語口說與寫作評量 (第三版挑戰卷)", filename: "exam-lifeenglish-v3.html", themeColor: "#14B8A6" },
      { id: "e5", category: "能力挑戰評估", title: "📝 評估｜生活數學 (V1)", desc: "特教功能性數學：找零、算錢、公車票價與日常加減計算挑戰", filename: "exam-lifemath-v1.html", themeColor: "#14B8A6" },
      { id: "e6", category: "能力挑戰評估", title: "📝 評估｜生活語文 (V1)", desc: "特教功能性語文：公共標誌、重要指示語與口語表達溝通檢測", filename: "exam-lifechinese-v1.html", themeColor: "#14B8A6" }
    ];

    let favorites = JSON.parse(localStorage.getItem('grammar_favs')) || [];
    let currentFilter = 'all';

    // 完整的九大分類 (按照教案大類、閱讀、遊戲、評估順序)
    const categories = ["代名詞", "日常句型及片語", "時態表達", "名詞與數量", "形容詞、副詞、其他", "數字與時間", "圖表閱讀測驗", "互動遊戲區", "能力挑戰評估"];

    function initSidebar() {
      const container = document.getElementById('category-list');
      container.innerHTML = '';
      categories.forEach(cat => {
        const count = grammarData.filter(i => i.category === cat).length;
        const color = cat.includes('代名詞') ? '#3B82F6' : 
                      cat.includes('日常') ? '#2563EB' : 
                      cat.includes('時態') ? '#F59E0B' : 
                      cat.includes('名詞') ? '#10B981' : 
                      cat.includes('形容詞') ? '#0EA5E9' : 
                      cat.includes('數字') ? '#8B5CF6' :
                      cat.includes('閱讀') ? '#EC4899' :
                      cat.includes('遊戲') ? '#F43F5E' : '#14B8A6';
        
        container.innerHTML += `
          <button onclick="filterCategory('${cat}')" id="btn-${cat}" class="w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100 transition-all">
            <div class="flex items-center space-x-2.5 min-w-0">
              <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span>
              <span class="truncate font-medium">${cat}</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 font-mono">${count}</span>
          </button>
        `;
      });
      updateCountBadges();
    }

    function updateCountBadges() {
      document.getElementById('count-all').innerText = grammarData.length;
      document.getElementById('count-fav').innerText = favorites.length;
    }

    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
      setTimeout(() => overlay.classList.toggle('opacity-0'), 50);
    }

    menuToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    function filterCategory(cat) {
      currentFilter = cat;
      const buttons = sidebar.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.remove('bg-slate-200/80', 'text-slate-900', 'border-l-4', 'border-[#F59E0B]');
        btn.classList.add('text-slate-600');
      });

      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-slate-200/80', 'text-slate-900');
        if (cat !== 'all' && cat !== 'fav') {
          activeBtn.classList.add('border-l-4', 'border-[#F59E0B]');
        }
      }

      renderCards();

      if (window.innerWidth < 1024) {
        toggleSidebar();
      }

      if (cat !== 'all' && cat !== 'fav') {
        const targetElement = document.getElementById(`section-${cat}`);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        document.getElementById('main-content').scrollTop = 0;
      }
    }

    function toggleFav(id, event) {
      event.stopPropagation();
      const index = favorites.indexOf(id);
      if (index === -1) {
        favorites.push(id);
      } else {
        favorites.splice(index, 1);
      }
      localStorage.setItem('grammar_favs', JSON.stringify(favorites));
      updateCountBadges();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      let filteredData = grammarData;
      if (currentFilter === 'fav') {
        filteredData = grammarData.filter(item => favorites.includes(item.id));
      } else if (currentFilter !== 'all') {
        filteredData = grammarData.filter(item => item.category === currentFilter);
      }

      if (searchQuery) {
        filteredData = filteredData.filter(item => 
          item.title.toLowerCase().includes(searchQuery) || 
          item.desc.toLowerCase().includes(searchQuery) ||
          item.filename.toLowerCase().includes(searchQuery)
        );
      }

      const activeCats = currentFilter === 'all' || currentFilter === 'fav'
        ? [...new Set(filteredData.map(item => item.category))]
        : [currentFilter];

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <i class="fa-regular fa-folder-open text-5xl mb-4"></i>
            <p class="text-sm">沒有找到任何對應的教材或測驗</p>
          </div>
        `;
        return;
      }

      activeCats.forEach(cat => {
        const catData = filteredData.filter(item => item.category === cat);
        if (catData.length === 0) return;

        const isPronoun = cat.includes('代名詞');
        const isLife = cat.includes('日常');
        const isTense = cat.includes('時態');
        const isNoun = cat.includes('名詞');
        const isAdj = cat.includes('形容詞');
        const isReading = cat.includes('圖表');
        const isGame = cat.includes('遊戲');
        
        const sectionBg = isPronoun ? 'bg-blue-500/5' : 
                          isLife ? 'bg-blue-600/5' : 
                          isTense ? 'bg-amber-500/5' : 
                          isNoun ? 'bg-emerald-500/5' : 
                          isAdj ? 'bg-sky-500/5' : 
                          isReading ? 'bg-pink-500/5' :
                          isGame ? 'bg-rose-500/5' :
                          cat.includes('數字') ? 'bg-purple-500/5' : 'bg-teal-500/5';

        const titleColor = isPronoun ? 'text-blue-700' : 
                           isLife ? 'text-blue-800' : 
                           isTense ? 'text-amber-700' : 
                           isNoun ? 'text-emerald-700' : 
                           isAdj ? 'text-sky-700' : 
                           isReading ? 'text-pink-700' :
                           isGame ? 'text-rose-700' :
                           cat.includes('數字') ? 'text-purple-700' : 'text-teal-700';

        let sectionHtml = `
          <div id="section-${cat}" class="${sectionBg} border border-slate-200/60 p-6 rounded-2xl transition-all">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
              <h2 class="text-lg font-bold flex items-center space-x-2 ${titleColor}">
                <i class="fa-solid fa-brain"></i>
                <span>${cat}</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200/80 text-slate-600 font-mono">${catData.length}</span>
              </h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        `;

        catData.forEach(item => {
          const isStarred = favorites.includes(item.id);
          const starClass = isStarred ? 'fa-solid text-amber-500' : 'fa-regular text-slate-300 hover:text-amber-500';

          sectionHtml += `
            <div onclick="window.open('${item.filename}', '_blank')" class="group relative bg-white border border-slate-200 hover:border-slate-300 rounded-xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-all cursor-pointer h-[112px]">
              <div class="flex items-start justify-between">
                <span class="text-base font-black text-slate-800 line-clamp-1 group-hover:text-slate-900 transition-colors flex items-center">
                  ${item.title}
                </span>
                <button onclick="toggleFav('${item.id}', event)" class="focus:outline-none p-1 rounded hover:bg-slate-100">
                  <i class="${starClass} fa-star text-sm"></i>
                </button>
              </div>
              <p class="text-slate-400 text-xs line-clamp-1 mt-1 flex-1">
                ${item.desc}
              </p>
              <div class="text-[11px] text-slate-400 font-mono tracking-wide mt-2 flex justify-between items-center">
                <span>${item.filename}</span>
                <i class="fa-solid fa-circle-arrow-right text-slate-300 group-hover:text-[#F59E0B] transition-colors text-xs"></i>
              </div>
              <div class="absolute left-0 top-3 bottom-3 w-1 rounded-r-full" style="background-color: ${item.themeColor}"></div>
            </div>
          `;
        });

        sectionHtml += `</div></div>`;
        container.innerHTML += sectionHtml;
      });
    }

    document.getElementById('search-input').addEventListener('input', renderCards);

    window.onload = () => {
      initSidebar();
      filterCategory('all');
    };
  </script>
</body>
</html>
