<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spedu Labs | Grammar Workspace</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 太空幾何星空格線背景 (NASA 藍圖風格) */
    .labs-grid-bg {
      background-color: #F4F7FB;
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
        radial-gradient(circle, rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        radial-gradient(circle, rgba(59, 130, 246, 0.04) 2px, transparent 2px);
      background-size: 40px 40px, 40px 40px, 80px 80px, 120px 120px;
      background-position: 0 0, 0 0, 20px 20px, 40px 40px;
    }
    /* 隱藏滾動條但保持滾動功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-900 bg-slate-50">

  <!-- 頂部 Header -->
  <header class="h-16 border-t-[4px] border-[#F59E0B] bg-[#FFFDF8] border-b border-slate-200 flex items-center justify-between px-4 z-40 shrink-0">
    <div class="flex items-center space-x-3">
      <!-- 漢堡選單 (手機與桌機版開關) -->
      <button id="menu-toggle" class="p-2 rounded-lg hover:bg-slate-100 focus:outline-none">
        <i class="fa-solid fa-bars text-xl text-slate-600"></i>
      </button>
      <!-- Logo 區域設定溢出與放大 -->
      <div class="w-[180px] h-12 overflow-visible relative flex items-center">
        <img src="line-qrcode.png" alt="Spedu Labs Logo" class="absolute h-[54px] max-w-none object-contain -left-1 top-1/2 -translate-y-1/2 drop-shadow-sm" onerror="this.src='https://placehold.co/180x54/FFFDF8/F59E0B?text=SINNY+SPEDU+LABS'">
      </div>
      <span class="text-slate-400 font-light">/</span>
      <span class="text-sm font-semibold tracking-wider text-slate-500 uppercase">Grammar Workspace</span>
    </div>
    <div class="text-xs text-slate-400 font-mono tracking-widest hidden sm:block">WORKSPACE V1.2</div>
  </header>

  <!-- 主區塊 -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- 手機版懸浮抽屜黑色半透明遮罩 (Overlay) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-20 hidden lg:hidden transition-opacity duration-300 opacity-0"></div>

    <!-- 左側 Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-[240px] bg-[#F7F8FA] border-r border-slate-200 z-30 flex flex-col transition-all duration-300 -translate-x-full lg:translate-x-0">
      
      <!-- 搜尋欄 -->
      <div class="p-4 border-b border-slate-200">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
          <input type="text" id="search-input" placeholder="搜尋教材或檔名..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-[#F59E0B] transition-colors">
        </div>
      </div>

      <!-- 選單按鈕區 -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-1">
        <button onclick="filterCategory('all')" id="btn-all" class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg bg-slate-200/80 text-slate-900 transition-colors">
          <div class="flex items-center space-x-2.5">
            <i class="fa-solid fa-folder-open text-amber-500 text-base"></i>
            <span>全部文法教材</span>
          </div>
          <span id="count-all" class="text-xs px-2 py-0.5 rounded-full bg-slate-300 text-slate-700 font-mono">0</span>
        </button>

        <button onclick="filterCategory('fav')" id="btn-fav" class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors">
          <div class="flex items-center space-x-2.5">
            <i class="fa-solid fa-star text-amber-500 text-base"></i>
            <span>我的收藏</span>
          </div>
          <span id="count-fav" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 font-mono">0</span>
        </button>

        <div class="pt-4 pb-1 px-3 text-[11px] font-bold tracking-wider text-slate-400 uppercase">快捷文法大類</div>

        <!-- 動態文法分類按鈕區 -->
        <div id="category-list" class="space-y-1">
          <!-- JS 會自動產生 -->
        </div>
      </div>
    </aside>

    <!-- 右側主內容 canvas -->
    <main id="main-content" class="flex-1 overflow-y-auto labs-grid-bg p-4 md:p-6 relative no-scrollbar">
      
      <!-- 卡片渲染區 -->
      <div id="cards-container" class="space-y-8 max-w-7xl mx-auto pb-24">
        <!-- JS 動態產生 -->
      </div>

      <!-- 右下角 Spedu Labs 太空人燈泡巨型浮水印 -->
      <div class="fixed bottom-4 right-4 w-64 h-64 pointer-events-none opacity-[0.045] select-none z-0">
        <img src="spe-icon2.png" alt="Watermark" class="w-full h-full object-contain" onerror="this.style.display='none'">
      </div>
    </main>

  </div>

  <!-- JavaScript 資料庫與互動邏輯 -->
  <script>
    // 總計 49 題資料庫 (30個現有檔案 + 19個待處理舊講義)
    const grammarData = [
      // ==== 代名詞 ====
      { id: "a1", category: "代名詞", title: "我、你、他 (主格)", desc: "我是...，自我介紹與主詞用法", filename: "grammar_I.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a2", category: "代名詞", title: "我、你、他 (受格)", desc: "動作的接受者 (love me, love him)", filename: "grammar_me.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a3", category: "代名詞", title: "我的、你的、他的 (所有格)", desc: "物品的主人 (my book, your dog)", filename: "grammar_my.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a4", category: "代名詞", title: "所有格與複數所有格", desc: "男孩們的...，名詞單複數所有格變化規則", filename: "grammar_boys_.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a5", category: "代名詞", title: "這個、那個、這些、那些", desc: "指示代名詞單複數與遠近距離辨析", filename: "grammar_this_that_these_those.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a6", category: "代名詞", title: "Be動詞 (am, are, is)", desc: "Be動詞的主詞搭配與現在式基本用法", filename: "grammar_be_am_are_is.html", themeColor: "#3B82F6", status: "ready" },
      { id: "a7", category: "代名詞", title: "反身代名詞 (單數)", desc: "我自己、你自己、他自己 (myself, yourself, himself) 的用法", filename: "grammar_myself.html", themeColor: "#3B82F6", status: "pending" },
      { id: "a8", category: "代名詞", title: "反身代名詞 (複數)", desc: "我們自己、你們自己、他們自己 (ourselves, yourselves) 的用法", filename: "grammar_ourselves.html", themeColor: "#3B82F6", status: "pending" },
      { id: "a9", category: "代名詞", title: "所有格代名詞", desc: "區分「我的書 (my book)」與「我的東西 (mine)」的代名詞用法", filename: "grammar_mine.html", themeColor: "#3B82F6", status: "pending" },

      // ==== 生活日常句型及片語 ====
      { id: "b1", category: "生活日常句型及片語", title: "please祈使句", desc: "祈使句的禮貌表達與日常應用", filename: "grammar_please.html", themeColor: "#2563EB", status: "ready" },
      { id: "b2", category: "生活日常句型及片語", title: "花錢與花時間 (spend, cost, take)", desc: "主詞是人還是物？花費動詞三大解析", filename: "grammar_spend_cost_take.html", themeColor: "#2563EB", status: "ready" },
      { id: "b3", category: "生活日常句型及片語", title: "我會... (can/can't)", desc: "能力表達與日常助動詞簡答", filename: "grammar_can_can_t.html", themeColor: "#2563EB", status: "ready" },
      { id: "b4", category: "生活日常句型及片語", title: "男女稱謂 (Mr., Miss, Mrs.)", desc: "社交場合必備的先生、小姐、太太等禮貌稱謂與用法", filename: "grammar_mr_miss.html", themeColor: "#2563EB", status: "pending" },
      { id: "b5", category: "生活日常句型及片語", title: "家人稱謂與關係", desc: "爸爸、媽媽、兄弟姊妹等家庭成員的英文名稱與介紹", filename: "grammar_family.html", themeColor: "#2563EB", status: "pending" },
      { id: "b6", category: "生活日常句型及片語", title: "家人稱謂複數與所有格", desc: "結合家人稱謂與複數所有格的進階練習 (如 my sons)", filename: "grammar_my_sons.html", themeColor: "#2563EB", status: "pending" },
      { id: "b7", category: "生活日常句型及片語", title: "連接詞 (and, but, or)", desc: "語意轉折「但是」與選擇「或者」的日常句子連結", filename: "grammar_and_but_or.html", themeColor: "#2563EB", status: "pending" },
      { id: "b8", category: "生活日常句型及片語", title: "連接詞 (because, so)", desc: "表達因果關係「因為...所以...」的正確日常句型", filename: "grammar_because_so.html", themeColor: "#2563EB", status: "pending" },
      { id: "b9", category: "生活日常句型及片語", title: "時間連接詞 (before, after)", desc: "連接詞之前之後 before、after 的生活句型與前後順序判讀", filename: "grammar_before_after.html", themeColor: "#2563EB", status: "pending" },
      { id: "b10", category: "生活日常句型及片語", title: "If 條件句 (如果)", desc: "如果明天下雨，我就... 的日常生活假設與簡易句型", filename: "grammar_if.html", themeColor: "#2563EB", status: "pending" },

      // ==== 時態表達 ====
      { id: "c1", category: "時態表達", title: "現在簡單式的判讀(do, does)", desc: "現在簡單式問句與否定的靈魂助動詞用法", filename: "grammar_do_does.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c2", category: "時態表達", title: "第三人稱單數動詞變化", desc: "當主詞為第三人稱單數時，一般動詞加 s/es (goes, plays)", filename: "grammar_goes_plays.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c3", category: "時態表達", title: "頻率副詞 (always)", desc: "習慣與動作發生頻率的表達與句中位置", filename: "grammar_always.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c4", category: "時態表達", title: "過去式(was, were)", desc: "過去狀態與位置 (I was busy yesterday.)", filename: "grammar_was_were.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c5", category: "時態表達", title: "過去式(did, didn't)", desc: "過去問句與否定 (I didn't play soccer.)", filename: "grammar_did_didn_t.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c6", category: "時態表達", title: "過去式(動詞加ed)", desc: "規則動詞過去式變化與發音規律", filename: "grammar_Ved.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c7", category: "時態表達", title: "去過與看過 (不規則過去式)", desc: "常見不規則動詞 (went, saw, ate) 的過去式", filename: "grammar_went_saw.html", themeColor: "#F59E0B", status: "ready" },
      { id: "c8", category: "時態表達", title: "現在進行式", desc: "正在做某事 (am/is/are + V-ing) 的動作表達與現在式對比", filename: "grammar_Ving.html", themeColor: "#F59E0B", status: "pending" },
      { id: "c9", category: "時態表達", title: "過去時間副詞", desc: "過去式常搭配的時間副詞 (如 yesterday, last week 上週)", filename: "grammar_yesterday.html", themeColor: "#F59E0B", status: "pending" },

      // ==== 名詞與數量 ====
      { id: "d1", category: "名詞與數量", title: "名詞複數變化的基本規則", desc: "名詞單數變複數加 s 的規則與計數概念", filename: "grammar_apples.html", themeColor: "#10B981", status: "ready" },
      { id: "d2", category: "名詞與數量", title: "可數與不可數名詞", desc: "區分名詞可數與不可數的本質差異", filename: "grammar_n_countable.html", themeColor: "#10B981", status: "ready" },
      { id: "d3", category: "名詞與數量", title: "一些與許多 (some, many)", desc: "數量形容詞與可數、不可數名詞的搭配應用", filename: "grammar_some_many.html", themeColor: "#10B981", status: "ready" },
      { id: "d4", category: "名詞與數量", title: "東西在哪裡? (in, on, at)", desc: "基礎空間介系詞的具體感知", filename: "grammar_in_on_at_space.html", themeColor: "#10B981", status: "ready" },
      { id: "d5", category: "名詞與數量", title: "時間與日子 (in, on, at)", desc: "時間、特定日子與幾點鐘的介系詞搭配", filename: "grammar_in_on_at_time.html", themeColor: "#10B981", status: "ready" },
      { id: "d6", category: "名詞與數量", title: "這裡有、那裡有 (There is/are)", desc: "某處存在某事物的存在句型", filename: "grammar_there_is_there_are.html", themeColor: "#10B981", status: "ready" },
      { id: "d7", category: "名詞與數量", title: "方位介系詞 (under, next to...)", desc: "東西在「下面、旁邊、後面、前面」等具體空間位置感知", filename: "grammar_under_place.html", themeColor: "#10B981", status: "pending" },

      // ==== 形容詞、副詞、其他 ====
      { id: "e1", category: "形容詞、副詞、其他", title: "形容詞比較級", desc: "A比B更...，比較級字尾 -er 的變化", filename: "grammar_adj_er.html", themeColor: "#0EA5E9", status: "ready" },
      { id: "e2", category: "形容詞、副詞、其他", title: "形容詞最高級", desc: "班上最...、世界最...，最高級字尾 -est 的變化", filename: "grammar_adj_est.html", themeColor: "#0EA5E9", status: "ready" },
      { id: "e3", category: "形容詞、副詞、其他", title: "形容詞三級分辨", desc: "原級、比較級與最高級的區分與綜合應用", filename: "grammar_adj_er_est.html", themeColor: "#0EA5E9", status: "ready" },

      // ==== 數字與時間 ====
      { id: "f1", category: "數字與時間", title: "數字 1-10", desc: "基數 1-10 的拼寫與基本量詞結合", filename: "grammar_1_10.html", themeColor: "#8B5CF6", status: "ready" },
      { id: "f2", category: "數字與時間", title: "數字 11-19", desc: "十幾的數字與基本年齡表達", filename: "grammar_11_19.html", themeColor: "#8B5CF6", status: "ready" },
      { id: "f3", category: "數字與時間", title: "數字 21-99", desc: "兩位數的英文數字讀法與十位數規律", filename: "grammar_21_99.html", themeColor: "#8B5CF6", status: "ready" },
      { id: "f4", category: "數字與時間", title: "整十數字與百位數", desc: "10、20、100 等整十數字的規律與應用", filename: "grammar_10_20_100.html", themeColor: "#8B5CF6", status: "ready" },
      { id: "f5", category: "數字與時間", title: "大數字 (1 到 100 萬)", desc: "大數字（千、百萬）的讀法與進階數字表達", filename: "grammar_1_1000000.html", themeColor: "#8B5CF6", status: "ready" },
      { id: "f6", category: "數字與時間", title: "星期一到星期日", desc: "一週七天 (Sunday 到 Saturday) 的拼寫與日子表達", filename: "grammar_week.html", themeColor: "#8B5CF6", status: "pending" },
      { id: "f7", category: "數字與時間", title: "十二月份", desc: "一月到十二月的拼寫與月份基本概念", filename: "grammar_months.html", themeColor: "#8B5CF6", status: "pending" },
      { id: "f8", category: "數字與時間", title: "西元年份與日期順序", desc: "西元年份寫法、有效日期年月日標示順序及方法", filename: "grammar_year.html", themeColor: "#8B5CF6", status: "pending" },
      { id: "f9", category: "數字與時間", title: "時間與鐘點表達", desc: "時間整點、半點、15 分的日常時鐘報時說法", filename: "grammar_clock.html", themeColor: "#8B5CF6", status: "pending" },
      { id: "f10", category: "數字與時間", title: "日期的寫法 (序數)", desc: "日期的寫法與第1、第2、第3等序數 (first, second...) 的應用", filename: "grammar_first.html", themeColor: "#8B5CF6", status: "pending" },
      { id: "f11", category: "數字與時間", title: "日期與月份搭配", desc: "日期搭配月份的完整說法與書寫練習 (如 July third)", filename: "grammar_July_third.html", themeColor: "#8B5CF6", status: "pending" }
    ];

    let favorites = JSON.parse(localStorage.getItem('grammar_favs')) || [];
    let currentFilter = 'all';

    // 取得所有明確分類類別
    const categories = ["代名詞", "生活日常句型及片語", "時態表達", "名詞與數量", "形容詞、副詞、其他", "數字與時間"];

    function initSidebar() {
      const container = document.getElementById('category-list');
      container.innerHTML = '';
      categories.forEach(cat => {
        const count = grammarData.filter(i => i.category === cat).length;
        const color = cat.includes('代名詞') ? '#3B82F6' : cat.includes('生活') ? '#2563EB' : cat.includes('時態') ? '#F59E0B' : cat.includes('名詞') ? '#10B981' : cat.includes('形容詞') ? '#0EA5E9' : '#8B5CF6';
        
        container.innerHTML += `
          <button onclick="filterCategory('${cat}')" id="btn-${cat}" class="w-full flex items-center justify-between px-3 py-2 text-sm rounded-lg text-slate-600 hover:bg-slate-100 transition-all">
            <div class="flex items-center space-x-2.5 min-w-0">
              <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span>
              <span class="truncate font-medium">${cat}</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 font-mono">${count}</span>
          </button>
        `;
      });
      updateCountBadges();
    }

    function updateCountBadges() {
      document.getElementById('count-all').innerText = grammarData.length;
      document.getElementById('count-fav').innerText = favorites.length;
    }

    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
      setTimeout(() => overlay.classList.toggle('opacity-0'), 50);
    }

    menuToggle.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    function filterCategory(cat) {
      currentFilter = cat;
      const buttons = sidebar.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.remove('bg-slate-200/80', 'text-slate-900', 'border-l-4', 'border-[#F59E0B]');
        btn.classList.add('text-slate-600');
      });

      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-slate-200/80', 'text-slate-900');
        if (cat !== 'all' && cat !== 'fav') {
          activeBtn.classList.add('border-l-4', 'border-[#F59E0B]');
        }
      }

      renderCards();

      if (window.innerWidth < 1024) {
        toggleSidebar();
      }

      if (cat !== 'all' && cat !== 'fav') {
        const targetElement = document.getElementById(`section-${cat}`);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        document.getElementById('main-content').scrollTop = 0;
      }
    }

    function toggleFav(id, event) {
      event.stopPropagation();
      const index = favorites.indexOf(id);
      if (index === -1) {
        favorites.push(id);
      } else {
        favorites.splice(index, 1);
      }
      localStorage.setItem('grammar_favs', JSON.stringify(favorites));
      updateCountBadges();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      let filteredData = grammarData;
      if (currentFilter === 'fav') {
        filteredData = grammarData.filter(item => favorites.includes(item.id));
      } else if (currentFilter !== 'all') {
        filteredData = grammarData.filter(item => item.category === currentFilter);
      }

      if (searchQuery) {
        filteredData = filteredData.filter(item => 
          item.title.toLowerCase().includes(searchQuery) || 
          item.desc.toLowerCase().includes(searchQuery) ||
          item.filename.toLowerCase().includes(searchQuery)
        );
      }

      const activeCats = currentFilter === 'all' || currentFilter === 'fav'
        ? [...new Set(filteredData.map(item => item.category))]
        : [currentFilter];

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <i class="fa-regular fa-folder-open text-5xl mb-4"></i>
            <p class="text-sm">沒有找到任何對應的文法教材</p>
          </div>
        `;
        return;
      }

      activeCats.forEach(cat => {
        const catData = filteredData.filter(item => item.category === cat);
        if (catData.length === 0) return;

        const isPronoun = cat.includes('代名詞');
        const isLife = cat.includes('生活');
        const isTense = cat.includes('時態');
        const isNoun = cat.includes('名詞');
        const isAdj = cat.includes('形容詞');
        
        const sectionBg = isPronoun ? 'bg-blue-500/5' : isLife ? 'bg-blue-600/5' : isTense ? 'bg-amber-500/5' : isNoun ? 'bg-emerald-500/5' : isAdj ? 'bg-sky-500/5' : 'bg-purple-500/5';
        const titleColor = isPronoun ? 'text-blue-700' : isLife ? 'text-blue-800' : isTense ? 'text-amber-700' : isNoun ? 'text-emerald-700' : isAdj ? 'text-sky-700' : 'text-purple-700';

        let sectionHtml = `
          <div id="section-${cat}" class="${sectionBg} border border-slate-200/60 p-6 rounded-2xl transition-all">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
              <h2 class="text-lg font-bold flex items-center space-x-2 ${titleColor}">
                <i class="fa-solid fa-brain"></i>
                <span>${cat}</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200/80 text-slate-600 font-mono">${catData.length}</span>
              </h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        `;

        catData.forEach(item => {
          const isStarred = favorites.includes(item.id);
          const starClass = isStarred ? 'fa-solid text-amber-500' : 'fa-regular text-slate-300 hover:text-amber-500';
          
          // 區分現有檔案與待處理舊講義的標籤與點擊事件
          const isPending = item.status === "pending";
          const statusBadge = isPending ? `<span class="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-600 font-medium">待處理</span>` : '';
          const clickAction = isPending ? `alert('該舊講義單元尚在重製中，完成上傳後即可啟用！')` : `window.open('${item.filename}', '_blank')`;
          const borderStyle = isPending ? 'border-dashed border-slate-300 opacity-85 hover:opacity-100' : 'border-slate-200 hover:border-slate-300';

          sectionHtml += `
            <div onclick="${clickAction}" class="group relative bg-white ${borderStyle} rounded-xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-all cursor-pointer h-[112px]">
              <div class="flex items-start justify-between">
                <span class="text-base font-black text-slate-800 line-clamp-1 group-hover:text-slate-900 transition-colors flex items-center">
                  ${item.title}${statusBadge}
                </span>
                <button onclick="toggleFav('${item.id}', event)" class="focus:outline-none p-1 rounded hover:bg-slate-100">
                  <i class="${starClass} fa-star text-sm"></i>
                </button>
              </div>
              <p class="text-slate-400 text-xs line-clamp-1 mt-1 flex-1">
                ${item.desc}
              </p>
              <div class="text-[11px] text-slate-400 font-mono tracking-wide mt-2 flex justify-between items-center">
                <span>${item.filename}</span>
                ${isPending ? '<i class="fa-solid fa-clock-rotate-left text-rose-400 text-xs"></i>' : '<i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>'}
              </div>
              <div class="absolute left-0 top-3 bottom-3 w-1 rounded-r-full" style="background-color: ${item.themeColor}"></div>
            </div>
          `;
        });

        sectionHtml += `</div></div>`;
        container.innerHTML += sectionHtml;
      });
    }

    document.getElementById('search-input').addEventListener('input', renderCards);

    window.onload = () => {
      initSidebar();
      filterCategory('all');
    };
  </script>
</body>
</html>
