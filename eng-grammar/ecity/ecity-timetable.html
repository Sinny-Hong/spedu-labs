<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-City｜異想課表</title>
<style>
:root{
  --paper: #FDFDFD;
  --wood: #C5A880;
  --ink: #2C3E50;
  --blue: #3498DB;
  --green: #2A5944;
  --red: #E74C3C;
  --line-blue: #A9CCE3;
  
  --navy: #1A252F;
  --soft: #F4F6F7;
  --blue-soft: #EBF5FB;
  --green-soft: #E8F8F5;
  --hint: #FEF9E7;
  --hint-line: #F1C40F;
  --gray-blue: #BDC3C7;
}
*{box-sizing:border-box}

html,body{margin:0;height:100%;overflow:hidden;}
body{
  background:var(--paper); color:var(--ink);
  font-family: "Comic Sans MS", "Comic Sans", "Comic Neue", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  display: flex; flex-direction: column;
}
button,select{font:inherit;cursor:pointer;user-select:none;}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* 頂部工具列 */
.topbar{flex:none; min-height:55px;display:flex;justify-content:space-between;align-items:center;padding:5px 15px;}
h1{margin:0;font-size:clamp(20px,2vw,30px); color: var(--green);}
.toolbar{display:flex;align-items:center;gap:6px;}
.tool,select{background:#fff;color:var(--ink);border:1px solid var(--gray-blue);border-radius:9px;padding:6px 10px;font-weight:700;font-size:15px;}
.tool:hover,select:hover{background:#F4F6F7;}
.tool.active{background:var(--hint); border-color:var(--hint-line);}

/* 桌機整體佈局 */
.layout{flex:1; display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;padding:0 10px 10px; min-height:0;}
.panel{background:white;border:1px solid var(--wood);border-radius:18px;padding:10px;display:flex;flex-direction:column;min-height:0; box-shadow: 2px 2px 8px rgba(0,0,0,0.05);}

/* 左側：課表排版 */
.left-side{display:flex;flex-direction:column; height:100%; min-height:0;}
.schedule-box{
  border:1px solid var(--line-blue); border-radius:10px; background:var(--paper); 
  display:flex; flex-direction:column; flex:1; overflow:hidden; position: relative;
}

.schedule-title{height:35px;display:flex;align-items:center;justify-content:center;background:var(--green);color:white;font-size:17px;font-weight:900;flex-shrink:0; letter-spacing: 1px;}
.schedule-table-wrap{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.schedule-table{width:100%; height:100%; border-collapse:collapse; text-align:center; table-layout: fixed;}
.schedule-table th, .schedule-table td {
  padding:8px 4px; font-size:clamp(15px, 1.8vh, 19px); font-weight:bold; vertical-align: middle;
  word-break: break-word;
}
.schedule-table th {background:var(--green); color:white; border-right: 1px solid #1E4030;}
.schedule-table th:first-child { width: 15%; }
.schedule-table th:not(:first-child) { width: 17%; }
.schedule-table td {border-bottom: 1px dashed var(--line-blue); border-right: 1px dashed var(--line-blue); background: #FFFFFF;}
.schedule-table td:last-child {border-right: none;}
.schedule-table tr:hover td {background:var(--blue-soft);}

.time-header {font-size: 12px; color: #E8F8F5; display: block; font-weight: normal; margin-top: 2px;}

/* 右側：測驗區 */
.panel-head{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:4px;flex-shrink:0;}
h2{margin:0;font-size:22px; color:var(--green);}
.quiztools{display:flex;align-items:center;gap:6px;}
#score{font-size:17px;color:var(--green);font-weight:bold;margin-right:6px;}
#check{background:var(--green);border-color:var(--green);color:white}
#reveal{border-color:#efadb3;color:var(--red)}

/* 預設 5 題時靠上緊湊排列 */
.questions{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-start;padding:0 5px; gap: 6px;}
/* 當是 3 大題時，自動均分垂直空間，消除空曠感 */
.questions.three-items{justify-content:space-around;}

.question{border-bottom:1px dashed var(--gray-blue);padding:6px 0 8px;}
.question:last-child{border-bottom:none;}
.question-line{display:flex;align-items:baseline;gap:5px;font-size:clamp(17px, 2vh, 22px);font-weight:bold;cursor:pointer;border-radius:6px;line-height:1.3;}
.question-line:hover{background:var(--hint);}
.answer-blank{color:var(--blue);white-space:nowrap;min-width:3em;text-align:right;}
.answer-blank.good{color:var(--green)}
.answer-blank.reveal{color:var(--red)}

.options{
  margin-left: 3.2em; 
  display: flex; 
  flex-wrap: wrap; 
  font-size: clamp(15px, 1.8vh, 19px); 
  margin-top: 3px;
  row-gap: 2px;     
  column-gap: 14px; 
}
.choice{border:2px solid transparent;border-radius:8px;background:transparent;color:#4F595D;padding:2px 6px;font-weight:bold;}
.choice:hover:not(:disabled){background:var(--blue-soft);color:var(--navy);border-color:var(--blue);}
.choice.selected{color:var(--ink);background:var(--blue-soft);border-color:var(--blue);}
.choice.correct{color:var(--green);background:var(--green-soft);border-color:var(--green);}
.choice.reveal{color:var(--red);background:#F9EBEA;border-color:var(--red);}
.choice:disabled{cursor:default}

.hint-word{padding:0 2px;border-radius:4px;background:var(--hint);box-shadow:inset 0 -2px 0 var(--hint-line);}

/* 彈出視窗 (海報) */
.overlay{position:fixed;inset:0;z-index:100;background:#2C3E50CC;display:flex;align-items:center;justify-content:center;padding:12px}
.overlay[hidden]{display:none}
.modal{background:var(--paper);border:1px solid var(--wood);border-radius:15px;width:min(900px,96vw);max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:white;border-bottom:1px solid var(--wood);flex-shrink:0;}
.modal-head h2{font-size:22px;margin:0;color:var(--green);}
.modal-body{overflow:auto;padding:18px;}

/* 海報內容排版 */
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px;}
.poster-item{background:white;border:1px solid var(--line-blue);border-radius:10px;padding:10px;text-align:center;cursor:pointer; box-shadow: 1px 1px 4px rgba(0,0,0,0.05);}
.poster-item:hover{background:var(--blue-soft);border-color:var(--blue);}
.p-icon{font-size:32px;line-height:1.2;}
.p-en{font-size:16px;font-weight:bold;color:var(--ink);margin:6px 0 2px;}
.p-zh{font-size:14px;color:#7A7874;font-weight:bold;}

/* ====== 手機直向響應式布局 ====== */
@media (max-width: 768px) {
  html, body { height: auto; overflow: auto; overflow-x: hidden; }
  .topbar { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
  .topbar h1 { text-align: center; font-size: 24px; }
  .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .tool, select { width: 100%; text-align: center; padding: 8px; font-size: 16px; }
  .layout { display: flex; flex-direction: column; height: auto; overflow: visible; padding: 10px; gap: 16px; }
  .panel { overflow: visible; }
  .left-side { display: flex; flex-direction: column; height: auto; gap: 12px; }
  .schedule-table-wrap { overflow-x: auto; height: auto; }
  .schedule-table { height: 320px; }
  .schedule-table th, .schedule-table td { font-size: 14px; padding: 6px; }
  .questions { overflow: visible; height: auto; justify-content: flex-start; gap: 8px;}
  .options { margin-left: 1.5em; font-size: 17px; row-gap: 2px; column-gap: 10px; }
  .question-line { font-size: 19px; }
}
</style>
</head>
<body>

<header class="topbar">
  <h1>🏫 E-City｜異想課表</h1>
  <nav class="toolbar">
    <select id="levelChoice">
      <option value="L1">L1: 基本查表 (5題)</option>
      <option value="L2">L2: 課前課後 (5題)</option>
      <option value="L3">L3: 教室與準備 (3大題)</option>
      <option value="L4">L4: 補課與請假 (3大題)</option>
      <option value="L5">L5: 社團選擇 (3大題)</option>
    </select>
    <button class="tool" id="next">↻ 換題</button>
    <button class="tool" id="btn-phrases">💬 校園單字</button>
    <button class="tool" id="btn-menu">📝 科目海報</button>
  </nav>
</header>

<main class="layout">
  <!-- 左側課表 -->
  <section class="panel">
    <div class="left-side">
      <section class="schedule-box">
        <div class="schedule-title">School Timetable (學校課表)</div>
        <div class="schedule-table-wrap">
          <table class="schedule-table" id="scheduleTable">
            <!-- 內容由 JS 產生 -->
          </table>
        </div>
      </section>
    </div>
  </section>

  <!-- 右側 測驗區 -->
  <section class="panel">
    <div class="panel-head">
      <h2>✏️ Questions</h2>
      <div class="quiztools">
        <span id="score">— / 5</span>
        <button id="hint" class="tool">💡提示</button>
        <button id="check" class="tool">批改</button>
        <button id="clear" class="tool">清除</button>
        <button id="reveal" class="tool">解答</button>
      </div>
    </div>
    <div id="questions" class="questions"></div>
  </section>
</main>

<div id="posterOverlay" class="overlay" hidden>
  <section class="modal">
    <div class="modal-head">
      <h2 id="posterTitle">📋 海報</h2>
      <button class="tool close-modal">✕ 關閉</button>
    </div>
    <div class="modal-body" id="posterBody"></div>
  </section>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

// --- 資料庫 ---
const SUBJECTS = [
  {name:'Chinese', zh:'國文', emoji:'📖'},
  {name:'English', zh:'英文', emoji:'🔤'},
  {name:'Math', zh:'數學', emoji:'📐'},
  {name:'Science', zh:'自然', emoji:'🔬'},
  {name:'History', zh:'歷史', emoji:'📜'},
  {name:'PE', zh:'體育', emoji:'🏀'},
  {name:'Art', zh:'美術', emoji:'🎨'},
  {name:'Music', zh:'音樂', emoji:'🎵'},
  {name:'Computer', zh:'電腦', emoji:'💻'}
];

const CLUBS = [
  {name:'Guitar Club', zh:'吉他社', emoji:'🎸'},
  {name:'Movie Club', zh:'電影社', emoji:'🎬'},
  {name:'Cooking Club', zh:'烹飪社', emoji:'🍳'}
];

const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const TIMES = ["08:15", "09:15", "10:15", "11:15"];

const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
const escapeRegExp = text => text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

let currentData = null;
let answers = {};
let mode = 'answer';
let hintsActive = false;
let totalQuestions = 5;

function getPrevDay(dayStr) {
  let idx = DAYS.indexOf(dayStr);
  if (idx === 0) return "Sunday";
  return DAYS[idx - 1];
}

function fillOptions(ans, w1, w2, fallback) {
  let opts = [...new Set([ans, w1, w2])];
  let i = 0;
  while(opts.length < 3) {
    if(!opts.includes(fallback[i])) opts.push(fallback[i]);
    i++;
  }
  return shuffle(opts);
}

// ================= 課表生成與 L1~L5 邏輯 =================

function generateGrid(lvl) {
  let grid = Array(5).fill().map(() => Array(4).fill(""));
  
  let peDays = shuffle([0, 1, 2, 3, 4]).slice(0, 2).sort();
  grid[peDays[0]][Math.floor(Math.random()*3)] = "PE";
  grid[peDays[1]][Math.floor(Math.random()*3)] = "PE";
  
  let otherDays = shuffle([0, 1, 2, 3, 4]);
  grid[otherDays[0]][Math.floor(Math.random()*3)] = "Art";
  grid[otherDays[1]][Math.floor(Math.random()*3)] = "Computer";
  grid[otherDays[2]][Math.floor(Math.random()*3)] = "Music";

  let clubDays = shuffle([0, 1, 2, 3, 4]).slice(0, 2);
  let clubs = shuffle(CLUBS);
  if (lvl === 'L5') {
    grid[clubDays[0]][3] = clubs[0].name;
    grid[clubDays[1]][3] = clubs[1].name;
  }

  const mainSubjs = ["Chinese", "English", "Math", "Science", "History"];
  for(let d=0; d<5; d++){
    for(let p=0; p<4; p++){
      if(grid[d][p] === "") {
         grid[d][p] = shuffle(mainSubjs)[0];
      }
    }
  }
  
  return { grid, peDays, otherDays, clubDays, clubs };
}

function generateLevelData() {
  const lvl = $('#levelChoice').value;
  totalQuestions = (lvl === 'L1' || lvl === 'L2') ? 5 : 3;
  $('#score').textContent = `— / ${totalQuestions}`;

  let { grid, peDays, otherDays, clubDays, clubs } = generateGrid(lvl);
  
  let questions = [];
  const allSubjs = [...new Set(grid.flat())];
  const fakes = shuffle(allSubjs);

  // L1: 基本查表 (5題)
  if (lvl === 'L1') {
    let artDay = DAYS[otherDays[0]], artP = grid[otherDays[0]].indexOf("Art") + 1;
    let sciP = grid[1].indexOf("Science");
    if(sciP === -1) sciP = 2;
    
    questions = [
      { stem: `What class is on Monday for Class 1?`, ans: grid[0][0], w1: grid[0][1], w2: grid[1][0] },
      { stem: `When do we have Art?`, ans: `On ${artDay} for Class ${artP}`, w1: `On Monday for Class 2`, w2: `On Friday for Class 4` },
      { stem: `What class is on ${DAYS[2]} for Class 3?`, ans: grid[2][2], w1: grid[2][0], w2: grid[3][2] },
      { stem: `When do we have Computer?`, ans: `On ${DAYS[otherDays[1]]} for Class ${grid[otherDays[1]].indexOf("Computer") + 1}`, w1: `On Tuesday for Class 1`, w2: `On Thursday for Class 3` },
      { stem: `Do we have ${grid[4][1]} on Friday?`, ans: `Yes, we do.`, w1: `No, we don't.`, w2: `I don't know.` }
    ].map(q => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Yes, we do.", "No, we don't.", ...fakes, "On Wednesday for Class 1"]);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans), locked: false };
    });
  }
  
  // L2: 課前課後 (5題)
  else if (lvl === 'L2') {
    let dB = 2, pB = 2;
    let subjB = grid[dB][pB];
    let prevB = grid[dB][pB-1];
    
    let dA = 1, pA = 1;
    let subjA = grid[dA][pA];
    let nextA = grid[dA][pA+1];
    
    let mathCount = grid.flat().filter(x => x === "Math").length;
    let countWord = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven"][mathCount] || mathCount.toString();
    
    questions = [
      { stem: `What class is <b>before</b> (在...之前) ${subjB} on ${DAYS[dB]}?`, ans: prevB, w1: grid[dB][pB+1]||"PE", w2: grid[dB][0] },
      { stem: `What class is <b>after</b> (在...之後) ${subjA} on ${DAYS[dA]}?`, ans: nextA, w1: grid[dA][pA-1]||"Art", w2: grid[dA][3] },
      { stem: `How many Math classes do we have this week?`, ans: countWord, w1: "Two", w2: "Five" },
      { stem: `What class is before ${grid[3][1]} on Thursday?`, ans: grid[3][0], w1: grid[3][2], w2: grid[4][0] },
      { stem: `Do we have ${grid[4][3]} after ${grid[4][2]} on Friday?`, ans: `Yes, we do.`, w1: `No, we don't.`, w2: `I don't know.` }
    ].map(q => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["One", "Three", "Four", "Yes, we do.", "No, we don't.", ...fakes]);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans), locked: false };
    });
  }

  // L3: 教室與準備 (3題)
  else if (lvl === 'L3') {
    let artD = otherDays[0];
    let todayForArt = getPrevDay(DAYS[artD]);
    
    let compD = otherDays[1];
    let compP = grid[compD].indexOf("Computer") + 1;
    
    let musD = otherDays[2];
    let musP = grid[musD].indexOf("Music") + 1;

    questions = [
      { stem: `Today is ${todayForArt}. Tom needs to bring his paints (顏料) for Art class tomorrow. What day is Art class?`, ans: DAYS[artD], w1: DAYS[(artD+1)%5], w2: DAYS[(artD+2)%5] },
      { stem: `The teacher says we will go to the computer room (電腦教室) on ${DAYS[compD]}. What class is it?`, ans: `Class ${compP}`, w1: `Class ${(compP%4)+1}`, w2: `Class ${((compP+1)%4)+1}` },
      { stem: `Mary has Music today. She needs her flute (直笛). Look at ${DAYS[musD]}. What class is it?`, ans: `Class ${musP}`, w1: `Class ${(musP%4)+1}`, w2: `Class ${((musP+1)%4)+1}` }
    ].map(q => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Monday", "Friday", "Class 1", "Class 4"]);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans), locked: false };
    });
  }

  // L4: 補課與請假 (3題)
  else if (lvl === 'L4') {
    let peD1 = peDays[0];
    let peD2 = peDays[1];
    let peP2 = grid[peD2].indexOf("PE") + 1;
    
    let engDays = [];
    for(let d=0; d<5; d++) { if(grid[d].includes("English")) engDays.push(DAYS[d]); }
    let engAns = engDays.length >= 2 ? `${engDays[0]} and ${engDays[1]}` : "Every day";

    questions = [
      { stem: `Leo was sick on ${DAYS[peD1]}. He missed (錯過) the PE class. When is his <b>next</b> (下一次) PE class?`, ans: `On ${DAYS[peD2]} for Class ${peP2}`, w1: `On ${DAYS[peD1]} for Class 4`, w2: `On Friday for Class 1` },
      { stem: `Mary likes English very much. Which days does she have English?`, ans: engAns, w1: `${DAYS[2]} and ${DAYS[3]}`, w2: `${DAYS[1]} and Friday` },
      { stem: `Tom has to prepare for ${grid[0][1]} on Monday. What class is it?`, ans: `Class 2`, w1: `Class 1`, w2: `Class 3` }
    ].map(q => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["Class 4", "Monday and Tuesday", `On Thursday for Class 2`]);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans), locked: false };
    });
  }

  // L5: 社團選擇 (3題)
  else if (lvl === 'L5') {
    let cD1 = clubDays[0];
    let cD2 = clubDays[1];
    let club1Name = clubs[0].name;
    let club2Name = clubs[1].name;
    
    questions = [
      { stem: `Amy wants to join the ${club1Name}. What day is it?`, ans: `On ${DAYS[cD1]}`, w1: `On ${DAYS[cD2]}`, w2: `On Monday` },
      { stem: `Ben can't join the ${club1Name}. He will join the ${club2Name} on ${DAYS[cD2]}. What class is it?`, ans: `Class 4`, w1: `Class 1`, w2: `Class 3` },
      { stem: `Does Ben have any classes <b>after</b> the ${club2Name} on ${DAYS[cD2]}?`, ans: `No, it is the last class.`, w1: `Yes, he does.`, w2: `We don't know.` }
    ].map(q => {
      let opts = fillOptions(q.ans, q.w1, q.w2, ["On Friday", "Class 2", "Yes, he does."]);
      return { stem: q.stem, options: opts, answer: opts.indexOf(q.ans), locked: false };
    });
  }

  let hintWords = [...DAYS, "Class 1", "Class 2", "Class 3", "Class 4", "before", "after", "next", "tomorrow", "missing"];
  grid.flat().forEach(s => hintWords.push(s));

  return { grid, questions, hintWords };
}

// 高亮與語音
function highlightText(text, isOption = false) {
  if (!hintsActive || isOption) return text;
  let res = String(text);
  const sorted = [...currentData.hintWords].sort((a,b) => b.length - a.length);
  sorted.forEach(word => {
    const regex = new RegExp(`\\b(${escapeRegExp(word)})\\b`, "gi");
    res = res.replace(regex, `<span class="hint-word">$1</span>`);
  });
  return res;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, '').replace(/<b>/g, '').replace(/<\/b>/g, ''));
  utterance.lang = "en-US";
  utterance.rate = 0.85;
  window.speechSynthesis.speak(utterance);
}

// 渲染 UI
function renderUI() {
  let tableHTML = `
    <tr>
      <th></th>
      <th>Mon (一)</th><th>Tue (二)</th><th>Wed (三)</th><th>Thu (四)</th><th>Fri (五)</th>
    </tr>
  `;
  for(let p=0; p<4; p++) {
    tableHTML += `<tr>`;
    tableHTML += `<th>${p+1}<span class="time-header">${TIMES[p]}</span></th>`;
    for(let d=0; d<5; d++) {
       tableHTML += `<td tabindex="0" onclick="speak('${currentData.grid[d][p]}')">${currentData.grid[d][p]}</td>`;
    }
    tableHTML += `</tr>`;
  }
  $('#scheduleTable').innerHTML = tableHTML;

  const quiz = $('#questions');
  quiz.innerHTML = '';
  
  // 根據題目數量動態增減三題專屬的 class 屬性，自動調整間距
  if (totalQuestions === 3) {
    quiz.classList.add('three-items');
  } else {
    quiz.classList.remove('three-items');
  }

  currentData.questions.forEach((q, i) => {
    const sec = document.createElement('div');
    sec.className = 'question';
    
    const line = document.createElement('div');
    line.className = 'question-line';
    line.onclick = () => speak(q.stem);
    
    const blank = document.createElement('span');
    blank.className = 'answer-blank';
    let letter = ' ';
    if(mode === 'reveal') { letter = String.fromCharCode(65 + q.answer); blank.classList.add('reveal'); }
    else if(q.locked) { letter = String.fromCharCode(65 + answers[i]); blank.classList.add('good'); }
    else if(answers[i] !== undefined) { letter = String.fromCharCode(65 + answers[i]); }
    blank.innerHTML = `（ ${letter} ）`;
    
    const title = document.createElement('span');
    title.innerHTML = `${i+1}. ${highlightText(q.stem, false)}`;
    line.append(blank, title);
    sec.append(line);
    
    const opts = document.createElement('div');
    opts.className = 'options';
    q.options.forEach((choice, j) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.innerHTML = `(${String.fromCharCode(65+j)}) ${highlightText(choice, true)}`;
      if(mode === 'answer' && !q.locked && answers[i] === j) btn.classList.add('selected');
      if(q.locked && answers[i] === j) btn.classList.add('correct');
      if(mode === 'reveal' && j === q.answer) btn.classList.add('reveal');
      btn.disabled = mode !== 'answer' || q.locked;
      btn.onclick = () => { if(mode === 'answer' && !q.locked) { answers[i] = j; renderUI(); } };
      opts.append(btn);
    });
    sec.append(opts);
    quiz.append(sec);
  });
}

// 初始化與綁定
function loadRandomLevel() {
  currentData = generateLevelData();
  answers = {};
  mode = 'answer';
  hintsActive = false;
  $('#hint').classList.remove('active');
  renderUI();
}

$('#next').onclick = loadRandomLevel;
$('#levelChoice').onchange = loadRandomLevel;

$('#hint').onclick = (e) => {
  hintsActive = !hintsActive;
  e.target.classList.toggle('active', hintsActive);
  renderUI();
};

// 批改
$('#check').onclick = () => {
  let correct = 0;
  currentData.questions.forEach((q, i) => {
    if(answers[i] === q.answer) { correct++; q.locked = true; } 
    else { delete answers[i]; }
  });
  if(correct === totalQuestions) { mode = 'checked'; }
  $('#score').textContent = `${correct} / ${totalQuestions}`;
  renderUI();
};

$('#clear').onclick = () => { 
  answers = {}; mode = 'answer'; 
  currentData.questions.forEach(q => q.locked = false); 
  $('#score').textContent = `— / ${totalQuestions}`; 
  renderUI(); 
};
$('#reveal').onclick = () => { mode = 'reveal'; $('#score').textContent = '解答'; renderUI(); };

// 海報
const posterOverlay = $('#posterOverlay');
const posterBody = $('#posterBody');

function openPoster(type) {
  if(type === 'phrases') {
    $('#posterTitle').textContent = '💬 課表單字 (Timetable Words)';
    const phrases = [
      { en: "Before", zh: "在...之前", emoji: "⬅️" },
      { en: "After", zh: "在...之後", emoji: "➡️" },
      { en: "Next", zh: "下一個/下一次", emoji: "⏭️" },
      { en: "Class", zh: "節次/課堂", emoji: "🏫" },
      { en: "Bring", zh: "攜帶", emoji: "🎒" },
      { en: "Miss", zh: "錯過", emoji: "❌" }
    ];
    posterBody.innerHTML = `<div class="poster-grid">` + phrases.map(p => `
      <div class="poster-item" onclick="speak('${p.en}')">
        <div class="p-icon">${p.emoji}</div>
        <div class="p-en">${p.en}</div>
        <div class="p-zh">${p.zh}</div>
      </div>
    `).join('') + `</div>`;
  } else {
    $('#posterTitle').textContent = '📝 科目總覽 (Subjects)';
    const vocab = [...SUBJECTS, ...CLUBS];
    posterBody.innerHTML = `<div class="poster-grid">` + vocab.map(f => `
      <div class="poster-item" onclick="speak('${f.name}')">
        <div class="p-icon">${f.emoji}</div>
        <div class="p-en">${f.name}</div>
        <div class="p-zh">${f.zh}</div>
      </div>
    `).join('') + `</div>`;
  }
  posterOverlay.hidden = false;
}

$('#btn-phrases').onclick = () => openPoster('phrases');
$('#btn-menu').onclick = () => openPoster('menu');
posterOverlay.querySelector('.close-modal').onclick = () => posterOverlay.hidden = true;
posterOverlay.onclick = e => { if(e.target === posterOverlay) posterOverlay.hidden = true; };

loadRandomLevel();
</script>
