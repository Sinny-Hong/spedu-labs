<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>生活英文｜服飾店閱讀測驗</title>
<style>
  :root{
    --blue:#123f7a;
    --blue-2:#274f8c;
    --light-blue:#edf3fb;
    --line:#cfd9e8;
    --text:#1f2d3d;
    --orange:#f2a51a;
    --green:#dff1e4;
    --green-text:#1c6d3f;
    --red:#d94b4b;
    --yellow:#fff2a8;
    --paper:#ffffff;
    --bg:#eef3f8;
    --gray:#6b7280;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:"Arial","Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--text);
    background:var(--bg);
  }

  .screen-toolbar{
    position:sticky;
    top:0;
    z-index:999;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:12px 16px;
    background:rgba(238,243,248,.94);
    backdrop-filter: blur(6px);
    border-bottom:1px solid #dbe6f3;
  }

  .top-btn{
    border:1px solid #c9d5e6;
    background:#fff;
    color:var(--blue);
    border-radius:12px;
    padding:8px 14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }

  .pages{
    width:210mm;
    margin:18px auto 32px;
  }

  .a4-page{
    width:210mm;
    min-height:297mm;
    background:var(--paper);
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    padding:10mm 8mm 10mm;
    margin:0 auto 16px;
    page-break-after:always;
  }

  .a4-page:last-child{ page-break-after:auto; }

  .half-sheet{
    min-height:133mm;
    padding-bottom:8mm;
  }

  .half-sheet + .half-sheet{
    border-top:2px dashed #d7dee8;
    padding-top:8mm;
  }

  .section-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    margin-bottom:6px;
  }

  .section-title{
    font-size:16pt;
    font-weight:900;
    color:var(--blue);
    line-height:1.15;
    white-space:nowrap;
  }

  .title-sub{
    color:#d19018;
    font-size:11pt;
    font-weight:800;
    margin-left:8px;
    white-space:nowrap;
  }

  .student-line{
    flex-shrink:0;
    font-size:16pt;
    font-weight:800;
    color:#333;
    display:flex;
    gap:12px;
    align-items:flex-end;
    white-space:nowrap;
  }

  .line-slot{
    display:inline-block;
    min-width:88px;
    border-bottom:2px solid #9ca7b5;
    height:24px;
    vertical-align:bottom;
  }

  .content-grid{
    display:grid;
    grid-template-columns: 52% 48%;
    gap:12px;
    align-items:start;
  }

  /* LEFT */
  .menu-box{
    border:2px solid var(--blue);
    border-radius:14px;
    overflow:hidden;
    background:#fff;
  }

  .menu-title{
    background:var(--blue);
    color:#fff;
    text-align:center;
    font-size:13pt;
    font-weight:900;
    letter-spacing:.5px;
    padding:6px 8px;
  }

  .menu-grid{
    display:grid;
    background:#fff;
  }

  .menu-grid.cols-3{ grid-template-columns:repeat(3, 1fr); }
  .menu-grid.cols-2{ grid-template-columns:repeat(2, 1fr); }

  .item-card{
    min-height:96px;
    border-right:1px solid #d7dde6;
    border-top:1px solid #d7dde6;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:4px 6px 6px;
    background:#fff;
  }

  .menu-grid .item-card:nth-child(-n+3){ border-top:none; }
  .menu-grid.cols-2 .item-card:nth-child(-n+2){ border-top:none; }

  .menu-grid.cols-3 .item-card:nth-child(3n){ border-right:none; }
  .menu-grid.cols-2 .item-card:nth-child(2n){ border-right:none; }

  .tag-area{
    width:100%;
    min-height:26px;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    margin-bottom:2px;
  }

  .promo-tag{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:58px;
    max-width:84px;
    min-height:22px;
    padding:2px 6px;
    border-radius:8px;
    background:#ef5547;
    color:#fff;
    font-size:7.5pt;
    line-height:1.05;
    font-weight:900;
    text-align:center;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }

  .promo-tag.sale{
    background:#f06b52;
  }

  .promo-tag.bogo{
    background:#ef5547;
  }

  .item-icon{
    font-size:22px;
    line-height:1;
    margin:0 0 3px;
  }

  .item-name{
    font-size:15pt;
    font-weight:900;
    color:var(--blue);
    line-height:1.08;
    text-align:center;
    margin-bottom:1px;
  }

  .item-price{
    font-size:13pt;
    font-weight:900;
    color:#111;
    line-height:1.08;
  }

  .dialogue-block{
    margin-top:8px;
  }

  .block-title{
    background:#eef2f8;
    border:1px solid #d8e0ec;
    border-radius:10px;
    color:var(--blue);
    font-size:10.5pt;
    font-weight:900;
    padding:4px 8px;
    margin-bottom:6px;
    line-height:1;
  }

  .dialogue-lines{
    padding:0 4px;
  }

  .dialogue-line{
    display:flex;
    align-items:flex-start;
    gap:6px;
    margin:3px 0;
    font-size:14pt;
    line-height:1.35;
  }

  .speaker{
    min-width:48px;
    font-weight:900;
    color:#222;
  }

  .speech{
    flex:1;
  }

  .hint-mark{
    background:transparent;
    padding:0 1px;
    border-radius:3px;
  }

  .hint-on .hint-mark{
    background:#fff0a8;
  }

  /* RIGHT */
  .questions-panel{
    padding-top:0;
  }

  .q-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    background:#eef2f8;
    border:1px solid #d8e0ec;
    border-radius:10px;
    padding:4px 8px;
    margin-bottom:6px;
  }

  .q-head-left{
    display:flex;
    align-items:baseline;
    gap:8px;
  }

  .q-head-title{
    color:var(--blue);
    font-size:10.5pt;
    font-weight:900;
    line-height:1;
  }

  .score-text{
    font-size:10pt;
    font-weight:900;
    color:#2d8a52;
  }

  .q-controls{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .mini-btn{
    border:1px solid #c9d4e3;
    background:#fff;
    color:#475569;
    border-radius:8px;
    padding:3px 8px;
    font-size:8.5pt;
    font-weight:800;
    cursor:pointer;
    line-height:1.15;
  }

  .mini-btn:hover{ background:#f8fbff; }
  .mini-btn.hint-active{
    background:#fff7df;
    border-color:#f0cf7c;
    color:#8a5c00;
  }

  .question{
    margin-bottom:8px;
  }

  .q-stem{
    display:flex;
    align-items:flex-start;
    gap:6px;
    font-size:14pt;
    line-height:1.3;
    font-weight:800;
    margin-bottom:2px;
  }

  .q-slot{
    min-width:28px;
    text-align:center;
    font-weight:900;
    color:#333;
  }

  .q-slot.selected{
    color:var(--blue);
  }

  .q-slot.answer{
    color:var(--red);
  }

  .stem-text{
    flex:1;
  }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px 16px;
    padding-left:34px;
  }

  .choice{
    border:none;
    background:none;
    padding:0;
    margin:0;
    text-align:left;
    cursor:pointer;
    font-size:12.8pt;
    line-height:1.25;
    color:#222;
    border-radius:6px;
  }

  .choice-text{
    display:block;
    padding:1px 4px;
    padding-left:28px;
    text-indent:-28px;
    border-radius:6px;
  }

  .choice.selected .choice-text{
    background:#edf4ff;
  }

  .choice.correct .choice-text{
    background:var(--green);
    color:var(--green-text);
  }

  .choice.wrong .choice-text{
    background:#fde8e8;
    color:#9b1c1c;
  }

  .choice.reveal .choice-text{
    background:var(--green);
    color:var(--green-text);
  }

  .foot-note{
    margin-top:2px;
    font-size:10pt;
    color:#667085;
  }

  /* PRINT */
  @media print {
    @page{
      size:A4 portrait;
      margin:0;
    }

    body{
      background:#fff;
    }

    .screen-toolbar{
      display:none !important;
    }

    .pages{
      width:210mm;
      margin:0;
    }

    .a4-page{
      box-shadow:none;
      margin:0;
      min-height:297mm;
    }

    .mini-btn{
      display:none !important;
    }

    .top-btn{
      display:none !important;
    }

    .half-sheet{
      break-inside:avoid;
    }
  }

  /* small screens */
  @media (max-width: 900px){
    .pages{
      width:100%;
      padding:0 8px 24px;
    }
    .a4-page{
      width:100%;
      min-height:auto;
      padding:14px;
    }
    .content-grid{
      grid-template-columns:1fr;
    }
    .section-header{
      flex-direction:column;
      align-items:flex-start;
    }
    .student-line{
      font-size:14pt;
    }
    .choices{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>

          D:"NT$800"
        }
      },
      {
        stem: "Who gets two T-shirts?",

const state = {};
worksheets.forEach(ws => {
  state[ws.code] = {
    selected: {},
    grading: null,
    showAnswers: false,
    hintOn: false
  };
});

function escapeRegExp(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function markKeywords(text, keywords, enabled){
  if(!enabled || !keywords || !keywords.length) return text;
  let result = text;
  const sorted = [...keywords].sort((a,b)=>b.length-a.length);
  sorted.forEach(keyword => {
    const re = new RegExp(escapeRegExp(keyword), 'gi');
    result = result.replace(re, (m)=>`<mark class="hint-mark">${m}</mark>`);
  });
  return result;
}

function promoHTML(promo){
  if(!promo) return "";
  if(promo.type === "bogo"){
    return `
      <div class="promo-tag bogo">
        <span>Buy 1</span>
        <span>Get 1 Free</span>
      </div>
    `;
  }
  return `<div class="promo-tag sale">${promo.text}</div>`;
}

function renderItemCard(item){
  return `
    <div class="item-card">
      <div class="tag-area">${promoHTML(item.promo)}</div>
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-price">${item.price}</div>
    </div>
  `;
}

function renderDialogue(ws){
  const hintOn = state[ws.code].hintOn;
  return `
    <div class="dialogue-block ${hintOn ? 'hint-on':''}">
      <div class="block-title">Dialogue</div>
      <div class="dialogue-lines">
        ${ws.dialogue.map(line => `
          <div class="dialogue-line">
            <span class="speaker">${line[0]}:</span>
            <span class="speech">${markKeywords(line[1], ws.keywords, hintOn)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function getScore(ws){
  const selected = state[ws.code].selected;
  let score = 0;
  ws.questions.forEach((q, idx)=>{
    if(selected[idx] === q.answer) score++;
  });
  return score;
}

function renderQuestion(ws, q, idx){
  const secState = state[ws.code];
  const selected = secState.selected[idx];
  const showAnswers = secState.showAnswers;
  const graded = secState.grading !== null;
  const hintOn = secState.hintOn;

  let slotText = "( )";
  let slotClass = "";

  if(showAnswers){
    slotText = `(${q.answer})`;
    slotClass = "answer";
  }else if(selected){
    slotText = `(${selected})`;
    slotClass = "selected";
  }

  const letters = ["A","B","C","D"];

  return `
    <div class="question ${hintOn ? 'hint-on':''}">
      <div class="q-stem">
        <span class="q-slot ${slotClass}">${slotText}</span>
        <span class="stem-text">${idx+1}. ${markKeywords(q.stem, ws.keywords, hintOn)}</span>
      </div>
      <div class="choices">
        ${letters.map(letter => {
          const text = q.options[letter];
          let cls = "choice";
          if(!showAnswers && selected === letter) cls += " selected";
          if(showAnswers && q.answer === letter) cls += " reveal";
          if(graded){
            if(letter === q.answer) cls += " correct";
            if(selected === letter && selected !== q.answer) cls += " wrong";
          }
          return `
            <button type="button" class="${cls}" onclick="selectChoice('${ws.code}', ${idx}, '${letter}')">
              <span class="choice-text">(${letter}) ${markKeywords(text, ws.keywords, hintOn)}</span>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderQuestions(ws){
  const secState = state[ws.code];
  const scoreHTML = secState.grading !== null
    ? `<span class="score-text">${secState.grading} / ${ws.questions.length}</span>`
    : "";

  return `
    <div class="questions-panel">
      <div class="q-head">
        <div class="q-head-left">
          <span class="q-head-title">Questions</span>
          ${scoreHTML}
        </div>
        <div class="q-controls">
          <button type="button" class="mini-btn ${secState.hintOn ? 'hint-active' : ''}" onclick="toggleHint('${ws.code}')">提示</button>
          <button type="button" class="mini-btn" onclick="gradeSection('${ws.code}')">批改</button>
          <button type="button" class="mini-btn" onclick="clearSection('${ws.code}')">清除</button>
          <button type="button" class="mini-btn" onclick="showAnswers('${ws.code}')">解答</button>
        </div>
      </div>
      ${ws.questions.map((q, idx)=>renderQuestion(ws, q, idx)).join('')}
    </div>
  `;
}

function renderSection(ws){
  return `
    <section class="half-sheet">
      <div class="section-header">
        <div>
          <span class="section-title">生活英文｜服飾店閱讀測驗 ${ws.code}</span>
          <span class="title-sub">${ws.subtitle}</span>
        </div>
        <div class="student-line">
          <span>班級：</span><span class="line-slot"></span>
          <span>姓名：</span><span class="line-slot"></span>
        </div>
      </div>

      <div class="content-grid">
        <div>
          <div class="menu-box">
            <div class="menu-title">CLOTHES SHOP</div>
            <div class="menu-grid cols-${ws.menuCols}">
              ${ws.items.map(renderItemCard).join('')}
            </div>
          </div>
          ${renderDialogue(ws)}
        </div>

        <div>
          ${renderQuestions(ws)}
        </div>
      </div>
    </section>
  `;
}

function renderAll(){
  const pagesEl = document.getElementById("pages");
  let html = "";

  for(let i=0; i<worksheets.length; i+=2){
    html += `<div class="a4-page">`;
    html += renderSection(worksheets[i]);
    if(worksheets[i+1]) html += renderSection(worksheets[i+1]);
    html += `</div>`;
  }

  pagesEl.innerHTML = html;
}

function selectChoice(code, qIndex, letter){
  state[code].selected[qIndex] = letter;
  state[code].grading = null;
  state[code].showAnswers = false;
  renderAll();
}

function gradeSection(code){
  const ws = worksheets.find(w => w.code === code);
  state[code].showAnswers = false;
  state[code].grading = getScore(ws);
  renderAll();
}

function clearSection(code){
  state[code].selected = {};
  state[code].grading = null;
  state[code].showAnswers = false;
  renderAll();
}

function showAnswers(code){
  state[code].showAnswers = true;
  state[code].grading = null;
  renderAll();
}

function toggleHint(code){
  state[code].hintOn = !state[code].hintOn;
  renderAll();
}

renderAll();
</script>
</body>
</html>
