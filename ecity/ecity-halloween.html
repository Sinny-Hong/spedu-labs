d:radial-gradient(circle at 50% 35%,#765078,#3a264d 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;overflow:hidden}.card .inner:before,.card .inner:after{content:'✦';position:absolute;color:#ffd58c80;font-size:clamp(10px,1.5vw,22px);top:8%;left:11%}.card .inner:after{top:auto;left:auto;bottom:8%;right:11%}.card .symbol{font-size:clamp(30px,5.1vh,61px);filter:drop-shadow(0 4px 2px #26112d);line-height:1.1}.card .number{font-weight:900;letter-spacing:.15em;color:#ffdca4;font-size:clamp(13px,1.6vw,20px)}.card.opened{background:#6a586d;box-shadow:none;filter:saturate(.65)}.card.opened .inner{background:#2b2536;border-color:#655670}.card.opened .symbol{font-size:clamp(24px,4.5vh,49px);filter:none}.card.opened .number{color:#c7aabd}.card.opened:after{content:'✓';position:absolute;right:9px;top:5px;color:#b8eeae;font-weight:900}.footer{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#d3bcd4;font-size:12px}.footer .small{opacity:.8}.overlay{position:fixed;inset:0;z-index:30;background:#110b1bdc;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}.overlay.show{display:flex}.reveal{width:min(650px,96vw);max-height:95svh;overflow:auto;background:linear-gradient(150deg,#f8c570,#bb779c 37%,#553967 100%);border-radius:25px;padding:6px;box-shadow:0 18px 60px #000b;animation:pop .27s ease-out}.reveal-inner{background:radial-gradient(circle at 50% 0%,#594169,#251a35 75%);border:2px solid #e5b87b;border-radius:21px;padding:clamp(16px,3vh,30px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(9px,1.4vh,15px)}.tag{color:#ffd58d;font-weight:900;letter-spacing:.12em;font-size:clamp(12px,1.5vw,16px)}.reveal h2{color:#fff2d6;font-size:clamp(25px,4.5vw,40px);margin:0;line-height:1.15}.instruction{font-size:clamp(18px,2.4vw,25px);font-weight:800;margin:0}.note{font-size:clamp(12px,1.3vw,15px);color:#dec5df;margin:0}.art{height:clamp(110px,25vh,220px);width:min(100%,350px);display:flex;align-items:center;justify-content:center}.art svg{height:100%;max-width:100%;overflow:visible;filter:drop-shadow(0 7px 3px #120d1b)}.art .giant{font-size:clamp(70px,13vh,130px);line-height:1}.answer-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}.answer{border:2px solid #ac8ba9;background:#4d3a60;color:#fff5e7;border-radius:12px;min-height:50px;font-size:clamp(16px,2vw,22px);font-weight:800;padding:8px}.answer.correct{background:#276f51;border-color:#87efb2}.answer.wrong{background:#79394b;border-color:#ffa6a6}.feedback{min-height:1.4em;color:#ffdf8a;font-size:17px;font-weight:900}.reveal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}.reveal-actions button{font-size:18px;padding:11px 24px}.new-dialog{width:min(430px,94vw);border:2px solid #c38e69;border-radius:20px;padding:22px;background:#2f223d;color:#fff2dd;box-shadow:0 15px 45px #0008}.new-dialog::backdrop{background:#100919cc}.new-dialog h2{margin-top:0;color:var(--gold)}.new-dialog .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}@keyframes pop{from{transform:scale(.84) rotate(-2deg);opacity:.2}to{transform:scale(1);opacity:1}}@keyframes wobble{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg) scale(1.08)}96%{transform:rotate(10deg) scale(1.08)}}@media(max-width:700px){.header{flex-wrap:wrap}.tools{width:100%;justify-content:flex-start}.app{min-height:100svh}.player{padding:6px;flex-direction:column;gap:2px}.person small{display:none}.scorecontrols{gap:2px}.score{font-size:20px}.step{width:24px;height:26px;font-size:17px}.deck{gap:7px;min-height:430px;max-height:none;grid-template-rows:repeat(3,minmax(125px,1fr))}.card{padding:3px}.card .inner{border-width:1px}.card .symbol{font-size:clamp(25px,7vw,45px)}.card .number{font-size:12px}.footer .small{display:none}}@media(max-height:740px) and (min-width:701px){.app{gap:7px}.game{padding:9px}.deck{min-height:330px;max-height:62vh}.player{padding:5px 9px}.card .symbol{font-size:clamp(30px,6vh,52px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div class="app">
<header class="header"><div class="brand"><span class="pumpkin" aria-hidden="true">🎃</span><div><h1>萬聖節驚喜屋</h1><small>E-CITY · HALLOWEEN MYSTERY HOUSE</small></div></div><div class="tools"><label for="playerCount">玩家</label><select id="playerCount" aria-label="玩家人數"><option value="3">3 人／組</option><option value="4">4 人／組</option><option value="5" selected>5 人／組</option></select><button class="ui-button soft" id="scoreToggle" aria-pressed="true">⭐ 隱藏積分</button><button class="ui-button primary" id="newGame">↻ 洗新牌／開新局</button></div></header>
<section class="scorebar" id="scorebar" style="--players:5" aria-label="玩家與獨立計分區"></section>
<main class="game"><div class="status"><strong id="turnText">輪到 A 選牌！</strong><span class="hint" id="remaining">剩下 15 張神祕卡片</span></div><div class="deck" id="deck" aria-label="十五張神祕卡片"></div><div class="footer"><span>👻 翻牌後可直接換下一位；不必等任務完成。</span><span class="small">畫圖可在黑板或紙上進行 · 分數隨時補登</span></div></main>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="revealTitle"><article class="reveal"><div class="reveal-inner"><div class="tag" id="revealTag"></div><h2 id="revealTitle"></h2><div class="art" id="revealArt" aria-hidden="true"></div><p class="instruction" id="revealInstruction"></p><p class="note" id="revealNote"></p><div id="quizArea" class="answer-row" hidden></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="reveal-actions"><button class="ui-button primary" id="closeCard">收起卡片 · 繼續翻牌 →</button></div></div></article></div>
<dialog class="new-dialog" id="newDialog"><h2>🎃 開啟下一堂的新局？</h2><p>15 張卡將重新洗牌、全部蓋回，A～E 分數歸零。上一堂課的牌局不會保留。</p><div class="actions"><button class="ui-button" id="cancelNew">取消</button><button class="ui-button primary" id="confirmNew">確定，洗新牌！</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const simpleSVG={
 pumpkin:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><path d="M120 60Q110 39 127 21" stroke="#49865a" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cx="120" cy="111" rx="84" ry="59" fill="#f59a3c" stroke="#442c3f" stroke-width="5"/><ellipse cx="92" cy="111" rx="42" ry="59" fill="#ffb04c" stroke="#744044" stroke-width="3"/><ellipse cx="148" cy="111" rx="42" ry="59" fill="#ffb04c" stroke="#744044" stroke-width="3"/><path d="M70 100l13-16 12 16zm77 0 13-16 12 16zM93 126q26 29 55 0l-14 4-12-8-14 8z" fill="#39263d"/></svg>`,
 ghost:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><path d="M55 155V85C55 14 185 14 185 85v70l-26-16-21 17-20-16-22 16-19-17z" fill="#fff5ea" stroke="#47334d" stroke-width="5" stroke-linejoin="round"/><ellipse cx="96" cy="91" rx="8" ry="12" fill="#36283c"/><ellipse cx="145" cy="91" rx="8" ry="12" fill="#36283c"/><ellipse cx="120" cy="119" rx="10" ry="15" fill="#36283c"/><ellipse cx="75" cy="113" rx="12" ry="6" fill="#ffb1b4"/><ellipse cx="165" cy="113" rx="12" ry="6" fill="#ffb1b4"/></svg>`,

 spider:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><g stroke="#a98aa9" stroke-width="7" fill="none" stroke-linecap="round"><path d="M90 95L56 65 25 69M90 106L51 103 23 119M94 119L63 145 39 147M150 95l34-30 31 4M150 106l39-3 28 16M146 119l31 26 24 2"/></g><ellipse cx="120" cy="110" rx="42" ry="39" fill="#55436b" stroke="#eabb94" stroke-width="4"/><circle cx="108" cy="102" r="6" fill="#fff"/><circle cx="132" cy="102" r="6" fill="#fff"/><path d="M112 120q8 9 16 0" fill="none" stroke="#fff" stroke-width="3"/></svg>`,
 cat:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><path d="M62 83L56 31l48 27q16-6 32 0l48-27-6 52q20 58-58 65-78-7-58-65z" fill="#494057" stroke="#ecbd89" stroke-width="5" stroke-linejoin="round"/><ellipse cx="91" cy="99" rx="9" ry="13" fill="#f8cd64"/><ellipse cx="149" cy="99" rx="9" ry="13" fill="#f8cd64"/><path d="M114 121l6 7 6-7zM120 128l-8 8m8-8 8 8M76 127l-44-8m44 17-44 7m132-16 44-8m-44 17 44 7" stroke="#f8dcb8" stroke-width="3" fill="none"/></svg>`,
 hat:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><path d="M122 20L71 124q-45 9-32 22 81 24 163-1 10-14-32-21z" fill="#645078" stroke="#e6bd83" stroke-width="5"/><path d="M77 115l94 8-9 16-93-6z" fill="#f8a64b"/><rect x="114" y="117" width="20" height="19" rx="3" fill="#ffd776"/></svg>`,
 mummy:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><g fill="#eee5d5" stroke="#5b4a61" stroke-width="4" stroke-linejoin="round"><path d="M86 72q-14-34 3-49 31-22 60 1 13 13 5 48l17 15 17 47-27 9-16-34 2 55H93l2-55-16 34-27-9 17-47z"/><path d="M88 36l62 14M84 53l70-13M85 72l66-9M72 93l97 16M90 117l59 20M94 148l51-15" fill="none" stroke="#a69ba5" stroke-width="9"/><path d="M90 35l62 13M86 57l67-13M83 79l73-11M74 98l95 18M91 126l59 20" fill="none" stroke="#fff8ec" stroke-width="8"/></g><rect x="98" y="54" width="18" height="11" rx="5" fill="#34273c"/><rect x="125" y="54" width="18" height="11" rx="5" fill="#34273c"/><circle cx="108" cy="57" r="2" fill="#fff"/><circle cx="135" cy="57" r="2" fill="#fff"/></svg>`,
 word:`<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><rect x="19" y="43" width="202" height="100" rx="13" fill="#fff1d5" stroke="#dcaa6b" stroke-width="6"/><text x="120" y="107" text-anchor="middle" font-size="43" font-family="Trebuchet MS, sans-serif" font-weight="900" fill="#4c315a">BOO!</text></svg>`
};
const make=(type,title,zh,art,note='',extra={})=>({type,title,zh,art,note,...extra});
const events=[
make('DRAW · 黑板創作','Draw a Pumpkin!','畫一顆南瓜','pumpkin','參考圖示畫在黑板或紙上；讓同學猜得出來就成功。'),
make('DRAW · 黑板創作','Draw a Ghost!','畫一隻鬼魂','ghost','不求畫得完美，重點是同學看得懂！'),
make('DRAW · 黑板創作','Draw a Bat!','畫一隻蝙蝠','bat','可以畫在紙上，完成後舉起來給大家看。'),
make('DRAW · 黑板創作','Draw a Spider!','畫一隻蜘蛛','spider','看看同學認不認得出來。'),
make('DRAW · 黑板創作','Draw a Black Cat!','畫一隻黑貓','cat','參考圖示，留下你的萬聖節傑作。'),
make('TRICK · 搞怪任務','Zombie Walk!','模仿殭屍走路 5 秒','🧟','也可以請組內代表表演。'),
make('TRICK · 搞怪任務','Ghost Voice!','用鬼魂聲音說 Hello～～','👻','全組一起喊也可以！'),
make('TRICK · 搞怪任務','Witch Laugh!','模仿巫婆笑聲 3 秒','🧙','呵呵呵～哈哈哈～'),
make('TRICK · 搞怪任務','Mummy Freeze!','擺出木乃伊姿勢，定格 5 秒','mummy','坐著完成也可以。'),
make('QUIZ · 女巫考驗','Which one is a ghost?','哪一個是鬼魂？','quiz','只計第一次選擇；答錯不扣分。',{choices:['Pumpkin','Ghost','Bat'],correct:1}),
make('QUIZ · 女巫考驗','Which one is a bat?','哪一個是蝙蝠？','quiz','只計第一次選擇；答錯不扣分。',{choices:['Cat','Ghost','Bat'],correct:2}),
make('QUIZ · 女巫考驗','PUMPKIN','這個英文單字的中文是什麼？','quiz','只計第一次選擇；答錯不扣分。',{choices:['南瓜','蜘蛛','糖果'],correct:0}),
make('FATE · 命運南瓜','Candy Rain!','所有玩家都可以各加 1 分！','🎃','有開啟積分時，再由老師按各人的 +；也可以不計分。'),
make('FATE · 命運南瓜','Lucky Bat!','你可以額外翻一張牌！','🦇','收起這張後，下一張仍由你選；額外翻牌不是加分。',{extraTurn:true}),
make('TREAT · 糖果驚喜','Mystery Candy!','幸運獲得 +2 分！','🍬','由老師自行補登；若只想同樂，也可以不計分。')
];
let playerCount=5,active=0,scores=[0,0,0,0,0],deck=[],opened=new Set(),showScore=true,viewIndex=-1,viewIsNew=false,extraTurn=false,quizAnswered=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updatePlayers(){const el=$('scorebar');el.style.setProperty('--players',playerCount);el.classList.toggle('hidden-score',!showScore);el.innerHTML='';for(let i=0;i<playerCount;i++){const p=document.createElement('div');p.className='player'+(i===active?' active':'');p.innerHTML=`<div class="person">${'ABCDE'[i]}</div><div class="scorecontrols"><button class="step" data-person="${i}" data-delta="-1" aria-label="${'ABCDE'[i]} 減一分">−</button><span class="score">${scores[i]}</span><button class="step" data-person="${i}" data-delta="1" aria-label="${'ABCDE'[i]} 加一分">+</button></div>`;p.querySelector('.person').style.cursor='pointer';p.querySelector('.person').addEventListener('click',()=>{active=i;extraTurn=false;render()});el.append(p)}el.querySelectorAll('[data-delta]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.person;scores[i]=Math.max(0,Math.min(99,scores[i]+ +b.dataset.delta));updatePlayers()}))}
function renderDeck(){const el=$('deck');el.innerHTML='';deck.forEach((event,i)=>{const isOpen=opened.has(i),b=document.createElement('button');b.className='card'+(isOpen?' opened':'');b.setAttribute('aria-label',isOpen?`已翻開第 ${i+1} 張：${event.title}，點擊可重看`:`翻開第 ${i+1} 張神祕牌`);b.innerHTML=`<span class="inner"><span class="symbol">${isOpen?(typeof event.art==='string'&&event.art in simpleSVG?'✏️':typeof event.art==='string'?event.art:'🎃'):'🎃'}</span><span class="number">${String(i+1).padStart(2,'0')}</span></span>`;b.addEventListener('click',()=>reveal(i));el.append(b)})}
function render(){updatePlayers();renderDeck();$('remaining').textContent=`剩下 ${deck.length-opened.size} 張神祕卡片`;$('turnText').textContent=opened.size===15?'🎉 所有卡片都翻完了！':`✨ 輪到 ${'ABCDE'[active]} 選牌！`}
function reset(){playerCount=+$('playerCount').value;active=0;scores=[0,0,0,0,0];opened=new Set();deck=shuffle(events);extraTurn=false;render()}
function reveal(i){viewIndex=i;viewIsNew=!opened.has(i);const e=deck[i];if(viewIsNew)opened.add(i);quizAnswered=false;$('revealTag').textContent=e.type;$('revealTitle').textContent=e.title;$('revealInstruction').textContent=e.zh;$('revealNote').textContent=e.note;$('revealArt').innerHTML=e.art==='quiz'?'':e.art in simpleSVG?simpleSVG[e.art]:`<span class="giant">${e.art}</span>`;$('revealArt').style.display=e.art==='quiz'?'none':'flex';$('feedback').textContent='';const area=$('quizArea');area.innerHTML='';area.hidden=!e.choices;if(e.choices){e.choices.forEach((choice,k)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${'ABC'[k]}. ${choice}`;b.addEventListener('click',()=>{if(quizAnswered)return;quizAnswered=true;area.querySelectorAll('button').forEach((x,j)=>{x.disabled=true;if(j===e.correct)x.classList.add('correct');else if(j===k)x.classList.add('wrong')});$('feedback').textContent=k===e.correct?'Correct! 🎉 答對了！':'答案是 '+ 'ABC'[e.correct]+'，沒關係，下次再挑戰！'});area.append(b)})}$('closeCard').textContent=viewIsNew?'收起卡片 · 繼續翻牌 →':'返回牌面';$('overlay').classList.add('show');$('closeCard').focus()}
function closeReveal(){if(!$('overlay').classList.contains('show'))return;$('overlay').classList.remove('show');if(viewIsNew){if(deck[viewIndex].extraTurn){extraTurn=true}else if(extraTurn){extraTurn=false;active=(active+1)%playerCount}else{active=(active+1)%playerCount}}render();const b=$('deck').children[viewIndex];if(b)b.focus()}
$('closeCard').addEventListener('click',closeReveal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeReveal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeReveal()});$('playerCount').addEventListener('change',()=>$('newDialog').showModal());$('newGame').addEventListener('click',()=>$('newDialog').showModal());$('cancelNew').addEventListener('click',()=>$('newDialog').close());$('confirmNew').addEventListener('click',()=>{$('newDialog').close();reset()});$('scoreToggle').addEventListener('click',()=>{showScore=!showScore;$('scoreToggle').textContent=showScore?'⭐ 隱藏積分':'☆ 顯示積分';$('scoreToggle').setAttribute('aria-pressed',String(showScore));updatePlayers()});$('newDialog').addEventListener('close',()=>{$('playerCount').value=String(playerCount)});
reset();
</script>
</body></html>
